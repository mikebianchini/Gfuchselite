          { id: 'waiver', label: `Waiver Pending (${waiverPendingCount})` },
          ...(draftCount ? [{ id: 'drafts', label: `Drafts (${draftCount})` }] : [])
        ];
        const filteredCount = getFilteredRosterAthletes().length;

        return `
          <div class="space-y-4">
            <!-- Roster Header -->
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h1 class="text-2xl font-extrabold tracking-tight">Athlete Roster</h1>
                <p class="text-xs text-[var(--text-muted)]"><span id="roster-match-count">${filteredCount} of ${state.athletes.length}</span> active players • Tap any row for full profile &amp; notes</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button onclick="openCloudSyncModal()" class="px-3 py-2.5 rounded-full card-white text-xs font-extrabold cursor-pointer hover:border-[#010101] transition inline-flex items-center gap-1.5">
                  <span id="roster-sync-dot" class="w-2 h-2 rounded-full ${window._sbConnected ? 'bg-[#9ED11E]' : 'bg-amber-400'}"></span>
                  <span id="roster-sync-label">${window._sbConnected ? 'Synced' : 'Cloud Sync'}</span>
                </button>
                <button onclick="openAppleNotesImporterModal('folder')" class="px-3.5 py-2.5 rounded-full card-white text-xs font-extrabold cursor-pointer hover:border-[#010101] transition inline-flex items-center gap-1.5">
                  ${uiIcon('note')} Import Notes
                </button>
                <button onclick="openAddAthleteModal(null)" class="px-4 py-2.5 rounded-full bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer shadow-sm hover:brightness-95 transition">
                  + Add Athlete
                </button>
              </div>
            </div>

            <!-- Instant Search + Filter Pills -->
            <div class="card-mist rounded-[26px] p-3.5 space-y-3">
              <div class="relative">
                <svg class="w-4 h-4 text-[var(--text-muted)] absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/></svg>
                <input
                  type="search"
                  value="${(state.rosterSearch || '').replace(/"/g, '&quot;')}"
                  oninput="updateRosterSearch(this.value)"
                  placeholder="Search ${state.athletes.length} athletes by name, parent, position, or team…"
                  class="w-full pl-10 pr-4 py-2.5 rounded-2xl card-white text-[16px] sm:text-sm font-medium"
                />
              </div>
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                ${filters.map(f => {
                  const on = state.rosterFilter === f.id;
                  return `<button onclick="setRosterFilter('${f.id}')" class="px-3 py-1.5 rounded-full text-xs font-extrabold whitespace-nowrap shrink-0 cursor-pointer transition ${on ? 'bg-[#010101] text-[#D5FF5F] shadow-sm' : 'card-white text-[var(--text-muted)]'}">${f.label}</button>`;
                }).join('')}
              </div>
            </div>

            <!-- Sortable Roster Table -->
            <div id="roster-list-container">
              ${renderRosterRowsHtml()}
            </div>
          </div>
        `;
      }

      // PLAYER DETAIL MODE
      const recaps = state.sessionRecaps.filter(r => r.athleteId === sel.id);
      const athSessions = state.sessions.filter(s => s.athleteId === sel.id || (s.athletes && s.athletes.includes(sel.name)));
      return `
        <div class="flex flex-wrap items-center justify-between gap-2">
          <button onclick="state.rosterView='list'; render();" class="inline-flex items-center gap-1.5 px-3.5 py-2 min-h-[40px] rounded-full card-white text-xs font-extrabold cursor-pointer">
            ← All Athletes (${state.athletes.length})
          </button>
          <div class="flex items-center gap-2">
            <button onclick="openAddSessionForAthleteModal('${sel.id}')" class="px-3.5 py-2 rounded-full card-white text-xs font-extrabold cursor-pointer">+ Add Session</button>
            <button onclick="openSessionRecapModal('${sel.id}', null)" class="px-3.5 py-2 rounded-full bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer shadow-sm">${uiIcon('note')} New Notes</button>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <!-- Left: Athlete Card + Safety + Scheduled Sessions -->
          <div class="lg:col-span-5 space-y-4">
            <div class="card-mist rounded-[28px] p-6 space-y-4">
              <div class="flex items-center justify-between">
                <span class="px-3 py-1 rounded-full bg-white text-[#010101] text-xs font-extrabold">${sel.ageGroup} • Class of ${sel.gradYear}</span>
                <span class="text-xs font-extrabold">${sel.waiverSigned ? 'Waiver ✓' : 'Waiver Pending'}</span>
              </div>
              <div>
                <div class="text-2xl font-extrabold">${sel.name}</div>
                <div class="text-xs text-[var(--text-muted)]">${sel.position} • B/T: ${sel.batsThrows} • Parent: ${sel.parentName}</div>
              </div>
              <div class="grid grid-cols-2 gap-2.5">
                <div class="p-3.5 rounded-2xl bg-white dark:bg-[#15191E]">
                  <div class="text-[11px] text-[var(--text-muted)] font-bold">Training Streak</div>
                  <div class="text-xl font-extrabold tabular-nums mt-0.5">${sel.streakDays} Days</div>
                </div>
                <div class="p-3.5 rounded-2xl bg-white dark:bg-[#15191E]">
                  <div class="text-[11px] text-[var(--text-muted)] font-bold">Weekly Reps</div>
                  <div class="text-xl font-extrabold tabular-nums mt-0.5">${sel.weeklyReps}</div>
                </div>
              </div>
              <div class="text-xs space-y-1">
                <div><span class="text-[var(--text-muted)]">Emergency:</span> <strong>${sel.emergencyContact}</strong></div>
                <div><span class="text-[var(--text-muted)]">Medical:</span> <strong>${sel.medicalNotes}</strong></div>
              </div>
              <div class="pt-2 border-t border-[#010101]/10 flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-1.5">
                  <button onclick="openAddSessionForAthleteModal('${sel.id}')" class="px-3 py-1.5 rounded-xl bg-[#010101] text-[#D5FF5F] text-[11px] font-extrabold cursor-pointer transition">
                    + Add Session
                  </button>
                  <button onclick="state.activeSiblingId='${sel.id}'; state.role='parent'; state.parentTab='home'; render(); showToast('Viewing ${sel.name}’s Athlete Page');" class="px-3 py-1.5 rounded-xl bg-white/80 dark:bg-white/10 text-[11px] font-extrabold cursor-pointer hover:bg-white transition inline-flex items-center gap-1">
                    ${uiIcon('eye')} View Page
                  </button>
                </div>
                ${true ? `
                  <button onclick="openRemoveAthleteModal('${sel.id}')" class="px-3 py-1.5 rounded-xl text-[11px] font-extrabold text-red-600 dark:text-red-400 hover:bg-red-500/10 cursor-pointer transition">
                    Remove
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- Scheduled Sessions for Athlete -->
            <div class="card-white rounded-[28px] p-5 space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-extrabold">Scheduled Sessions (${athSessions.length})</h2>
                <button onclick="openAddSessionForAthleteModal('${sel.id}')" class="px-3 py-1.5 rounded-xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">+ Add Session</button>
              </div>
              <div class="space-y-2">
                ${athSessions.length ? athSessions.map(s => `
                  <div class="surface-soft rounded-2xl p-3 flex items-center justify-between gap-2">
                    <div class="min-w-0">
                      <div class="text-[11px] font-extrabold text-[#4E6075] dark:text-[#9AC0D6]">${s.day} • ${s.time} • ${s.duration}</div>
                      <div class="text-xs font-extrabold truncate">${s.focus}</div>
                      <div class="text-[11px] text-[var(--text-muted)]">${s.payment}</div>
                    </div>
                    <button onclick="openSessionRecapModal('${sel.id}', '${s.id}')" class="px-2.5 py-1.5 rounded-xl bg-[#010101] text-[#D5FF5F] text-[10px] font-extrabold shrink-0 cursor-pointer">Notes</button>
                  </div>
                `).join('') : `<div class="p-3 text-xs text-[var(--text-muted)] surface-soft rounded-2xl">No sessions scheduled yet. Tap "+ Add Session" to book ${sel.name.split(' ')[0]}.</div>`}
              </div>
            </div>

            <!-- Assigned Homework Drills -->
            <div class="card-white rounded-[28px] p-5 space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-extrabold">Homework Drills</h2>
                <button onclick="openAddDrillModal('${sel.id}')" class="px-3 py-1.5 rounded-xl surface-soft text-xs font-extrabold cursor-pointer">+ Drill</button>
              </div>
              <div class="space-y-2">
                ${sel.drills.map(d => `
                  <label class="surface-soft rounded-2xl p-3 flex items-center justify-between gap-2 cursor-pointer">
                    <div class="flex items-center gap-2.5">
                      <input type="checkbox" ${d.done ? 'checked' : ''} onchange="toggleDrill('${sel.id}','${d.id}')" class="w-4 h-4 accent-[#010101]" />
                      <div><div class="text-xs font-bold ${d.done ? 'line-through text-[var(--text-muted)]' : ''}">${d.title}</div><div class="text-[11px] text-[var(--text-muted)]">${d.focus}</div></div>
                    </div>
                    <span class="px-2 py-0.5 rounded-full bg-[#D6DFE2] text-[#010101] text-[10px] font-extrabold shrink-0">${d.reps}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Right: Session Notes & Video History (Replaces Apple Notes + Manual Texting!) -->
          <div class="lg:col-span-7 card-white rounded-[28px] p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="text-base font-extrabold tracking-tight">Session Notes &amp; Videos</h2>
                <p class="text-xs text-[var(--text-muted)]">Replaces Apple Notes — log notes + attach video &amp; send straight to ${sel.parentName}</p>
              </div>
              <button onclick="openSessionRecapModal('${sel.id}', null)" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer shadow-sm">
                ${uiIcon('note')} New Recap &amp; Send
              </button>
            </div>

            <div class="space-y-3">
              ${recaps.length ? recaps.map(r => `
                <div class="surface-soft rounded-[24px] p-4 space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <div class="flex items-center gap-1.5">
                        <span class="text-xs font-extrabold">${r.date} • ${r.sessionTitle}</span>
                        ${r.isDraft ? `<span class="px-2 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">AUTO-SAVED DRAFT</span>` : ''}
                      </div>
                      <div class="text-[11px] text-[#4E6075] dark:text-[#9AC0D6] font-semibold">${r.isDraft ? `✓ Auto-saved ${r.sentAt} — tap to keep editing or send` : `✓ Sent to ${r.sentTo} (${r.sentAt})`}</div>
                    </div>
                    <div class="flex flex-wrap items-center gap-1">
                      ${r.isDraft ? `<button onclick="openSessionRecapModal('${sel.id}', null)" class="px-2.5 py-1 rounded-full bg-[#010101] text-[#D5FF5F] text-[10px] font-extrabold cursor-pointer">${uiIcon('edit')} Continue Editing</button>` : ''}
                      ${r.tags.map(t => `<span class="px-2 py-0.5 rounded-full card-white text-[10px] font-extrabold">${t}</span>`).join('')}
                    </div>
                  </div>
                  ${renderRecapTemplateBody(r, true)}
                  <div class="flex items-center gap-2">
                    <button onclick="openRecapViewerModal('${r.id}')" class="flex-1 card-white rounded-2xl p-2.5 flex items-center gap-3 text-left cursor-pointer hover:border-[#010101] transition">
                      <div class="relative w-16 h-12 rounded-xl overflow-hidden shrink-0">
                        <img src="${r.videoImg}" class="w-full h-full object-cover" / alt="Fastpitch softball training" loading="lazy" decoding="async">
                        <div class="absolute inset-0 bg-[#010101]/40 flex items-center justify-center text-[#D5FF5F] text-xs">▶</div>
                      </div>
                      <div class="min-w-0 flex-1">
                        <div class="text-xs font-extrabold truncate">${r.videoTitle}</div>
                        <div class="text-[11px] text-[var(--text-muted)]">Attached session video • Tap to preview</div>
                      </div>
                    </button>
                    <button onclick="copyRecapNote('${r.id}')" title="Copy formatted note" class="px-3 py-3 rounded-2xl card-white text-xs font-extrabold cursor-pointer hover:border-[#010101] shrink-0">${uiIcon('copy')}</button>
                  </div>
                </div>
              `).join('') : `<div class="p-6 text-center text-xs text-[var(--text-muted)] surface-soft rounded-2xl">No session notes yet. Tap "+ New Recap &amp; Send" after today’s lesson!</div>`}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // POST-SESSION RECAP COMPOSER — GINA'S EXACT SESSION NOTES TEMPLATE
    // =========================================================================
    const GINA_WARMUP_DEFAULT = `walking pvc swings, recoils, pvc rotations\nMed ball - staggered, scoop, step back 5 each (4lbs)`;
    const GINA_HOMEWORK_DEFAULT = `At least 1 bucket of each drill 2-3x a week!`;

    let _recapDraftTags = ['Barrel Path', 'Timing'];
    let _recapDraftVideoUrl = null;
    let _recapDraftVideoName = null;

    function formatBulletLines(text) {
      if (!text || !text.trim()) return '';
      return text.split('\n').map(l => l.trim().replace(/^[•\-*]\s*/, '')).filter(Boolean)
        .map(l => `<li class="flex items-start gap-1.5"><span class="text-[#4E6075] dark:text-[#D5FF5F] font-extrabold">•</span><span>${l}</span></li>`).join('');
    }

    function formatRecapPlainText(r) {
      const lines = [];
      if (r.date) lines.push(r.date);
      if (r.warmup) {
        lines.push(`* Hitter’s Warm up routine`);
        lines.push(r.warmup);
        lines.push('');
      }
      lines.push(`What’s new/focus for lesson:`);
      lines.push(r.focus || r.note || '');
      lines.push('');
      lines.push(`What we did today:`);
      lines.push('');
      if (r.tee) {
        lines.push(`Tee:`);
        r.tee.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      }
      if (r.ft) {
        lines.push(`FT:`);
        r.ft.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      }
      if (r.machine) {
        lines.push(`Machine:`);
        r.machine.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      }
      lines.push('');
      const hwLines = (r.homework || GINA_HOMEWORK_DEFAULT).split('\n').map(x => x.trim()).filter(Boolean);
      lines.push(`Homework - ${hwLines[0] || GINA_HOMEWORK_DEFAULT}`);
      hwLines.slice(1).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      return lines.join('\n');
    }

    function copyRecapNote(recapId) {
      const r = state.sessionRecaps.find(x => x.id === recapId);
      if (!r) return;
      const txt = formatRecapPlainText(r);
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(txt).then(() => showToast('Session note copied to clipboard!')).catch(() => showToast('Note ready to share!'));
      } else {
        showToast('Session note copied!');
      }
    }

    function appendQuickDrill(inputId, text) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const cur = el.value.trim();
      el.value = cur ? `${cur}\n• ${text}` : `• ${text}`;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.focus();
    }

    function renderRecapTemplateBody(r, compact = false) {
      if (!r.focus && !r.tee && !r.ft && !r.machine && !r.warmup) {
        return `<p class="text-xs leading-relaxed">${r.note}</p>`;
      }
      const boxCls = compact ? 'card-white' : 'surface-soft';
      const hwLines = (r.homework || '').split('\n').map(l => l.trim()).filter(Boolean);
      const hwHead = hwLines[0] || '';
      const hwBullets = hwLines.slice(1);
      return `
        <div class="space-y-2.5 text-xs">
          ${r.warmup ? `
            <div class="${boxCls} rounded-2xl p-3 space-y-1">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">• Hitter’s Warm Up Routine</div>
              <div class="text-[11px] leading-relaxed whitespace-pre-line text-[var(--text-muted)]">${r.warmup}</div>
            </div>
          ` : ''}

          ${r.focus ? `
            <div class="space-y-0.5">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">What’s New / Focus for Lesson</div>
              <p class="text-xs font-semibold leading-relaxed whitespace-pre-line">${r.focus}</p>
            </div>
          ` : ''}

          ${(r.tee || r.ft || r.machine) ? `
            <div class="space-y-1.5">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">What We Did Today</div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                ${r.tee ? `
                  <div class="${boxCls} rounded-2xl p-2.5 space-y-1">
                    <div class="text-[10px] font-extrabold uppercase tracking-wider">Tee</div>
                    <ul class="space-y-1 text-[11px] leading-snug">${formatBulletLines(r.tee)}</ul>
                  </div>
                ` : ''}
                ${r.ft ? `
                  <div class="${boxCls} rounded-2xl p-2.5 space-y-1">
                    <div class="text-[10px] font-extrabold uppercase tracking-wider">FT (Front Toss)</div>
                    <ul class="space-y-1 text-[11px] leading-snug">${formatBulletLines(r.ft)}</ul>
                  </div>
                ` : ''}
                ${r.machine ? `
                  <div class="${boxCls} rounded-2xl p-2.5 space-y-1">
                    <div class="text-[10px] font-extrabold uppercase tracking-wider">Machine</div>
                    <ul class="space-y-1 text-[11px] leading-snug">${formatBulletLines(r.machine)}</ul>
                  </div>
                ` : ''}
              </div>
            </div>
          ` : ''}

          ${hwHead ? `
            <div class="rounded-2xl px-3 py-2.5 bg-[#D5FF5F]/25 dark:bg-[#D5FF5F]/15 border border-[#D5FF5F]/60 space-y-1">
              <div class="flex items-start gap-2 text-[11px] leading-snug">
                ${uiIcon('softball', 'w-4 h-4 mt-0.5')}
                <div><span class="font-extrabold">Homework:</span> ${hwHead}</div>
              </div>
              ${hwBullets.length ? `<ul class="pl-5 space-y-0.5 text-[11px] leading-snug">${formatBulletLines(hwBullets.join('\n'))}</ul>` : ''}
            </div>
          ` : ''}

          ${r.clips && r.clips.length > 1 ? `
            <div class="space-y-1.5">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">${uiIcon('video')} Attached Clips (${r.clips.length})</div>
              <div class="grid grid-cols-2 gap-2">
                ${r.clips.map(c => `
                  <button type="button" onclick="openRecapViewerModal('${r.id}')" class="relative h-20 rounded-2xl overflow-hidden text-left group cursor-pointer">
                    <img src="${c.img || r.videoImg}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" / alt="Fastpitch softball training" loading="lazy" decoding="async">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#010101]/80 via-[#010101]/20 to-transparent flex flex-col justify-between p-2">
                      <span class="w-6 h-6 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold flex items-center justify-center">▶</span>
                      <span class="text-[10px] font-extrabold text-white truncate">${c.title}</span>
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    let _recapDraftClips = [];
    let _recapActiveAthId = null;
    let _recapActiveSesId = null;
    let _recapAutoSaveTimer = null;

    function getRecapDraftStorageKey(athId) {
      return `gfuchs_recap_draft_${athId}`;
    }

    function loadSavedRecapDraft(athId) {
      const mem = state.sessionRecaps.find(r => r.id === `draft-${athId}` && r.isDraft);
      if (mem) {
        return {
          includeWarmup: !!mem.warmup,
          warmup: mem.warmup || GINA_WARMUP_DEFAULT,
          focus: mem.focus || '',
          tee: mem.tee || '',
          ft: mem.ft || '',
          machine: mem.machine || '',
          homework: mem.homework || GINA_HOMEWORK_DEFAULT,
          tags: mem.tags || ['Barrel Control', 'Variability'],
          savedAt: mem.sentAt || 'Just now'
        };
      }
      try {
        const raw = localStorage.getItem(getRecapDraftStorageKey(athId));
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      return null;
    }

    function autoSaveRecapDraft(immediate = false) {
      const athId = _recapActiveAthId;
      if (!athId) return;
      const badge = document.getElementById('recap-autosave-badge');
      if (badge && !immediate) {
        badge.textContent = 'Saving…';
      }
      clearTimeout(_recapAutoSaveTimer);
      const doSave = () => {
        const ath = state.athletes.find(a => a.id === athId);
        if (!ath) return;
        const ses = _recapActiveSesId ? state.sessions.find(s => s.id === _recapActiveSesId) : null;
        const d = readRecapComposerDraft();
        const nowTime = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const hasContent = !!(d.focus.trim() || d.tee.trim() || d.ft.trim() || d.machine.trim() || _recapDraftClips.length);

        try {
          localStorage.setItem(getRecapDraftStorageKey(athId), JSON.stringify({
            ...d,
            tags: [..._recapDraftTags],
            savedAt: nowTime
          }));
        } catch (_) {}

        if (hasContent) {
          const vidImg = getAthleteCoverImg(ath);
          const vidTitle = _recapDraftVideoName || `${ath.name.split(' ')[0]} Session Clip — Draft`;
          const clips = _recapDraftClips.length ? _recapDraftClips.map(c => ({ ...c, img: vidImg })) : [{ title: vidTitle, img: vidImg, url: _recapDraftVideoUrl }];
          const draftRecap = {
            id: `draft-${athId}`,
            isDraft: true,
            athleteId: athId,
            date: new Date().toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' }),
            sessionTitle: ses ? ses.focus : '1-on-1 Training Session',
            tags: [..._recapDraftTags],
            warmup: d.includeWarmup ? d.warmup.trim() : '',
            focus: d.focus.trim(),
            tee: d.tee.trim(),
            ft: d.ft.trim(),
            machine: d.machine.trim(),
            homework: d.homework.trim() || GINA_HOMEWORK_DEFAULT,
            note: d.focus.trim() || 'In-progress session note',
            videoTitle: vidTitle,
            videoImg: vidImg,
            videoUrl: _recapDraftVideoUrl,
            clips,
            sentTo: 'Auto-saved Draft',
            sentAt: nowTime
          };
          const idx = state.sessionRecaps.findIndex(r => r.id === `draft-${athId}`);
          if (idx >= 0) state.sessionRecaps[idx] = draftRecap;
          else state.sessionRecaps.unshift(draftRecap);
        }

        const b = document.getElementById('recap-autosave-badge');
        if (b) b.textContent = `✓ Auto-saved ${nowTime}`;
      };
      if (immediate) doSave();
      else _recapAutoSaveTimer = setTimeout(doSave, 250);
    }

    let _recapReturnTab = 'athletes';

    function clearRecapDraft(athId, sessionId) {
      try { localStorage.removeItem(getRecapDraftStorageKey(athId)); } catch (_) {}
      state.sessionRecaps = state.sessionRecaps.filter(r => r.id !== `draft-${athId}`);
      _recapDraftTags = ['Barrel Control', 'Variability'];
      _recapDraftVideoUrl = null;
      _recapDraftVideoName = null;
      _recapDraftClips = [];
      render();
      showToast('Draft reset to blank template.');
    }

    function closeRecapComposer() {
      autoSaveRecapDraft(true);
      _recapActiveAthId = null;
      _recapActiveSesId = null;
      state.coachTab = _recapReturnTab || 'athletes';
      render();
    }

    function switchRecapAthlete(newAthId) {
      if (newAthId === _recapActiveAthId) return;
      autoSaveRecapDraft(true);
      openSessionRecapModal(newAthId, null);
    }

    function openSessionRecapModal(athId, sessionId) {
      const ath = state.athletes.find(a => a.id === athId) || state.athletes[0];
      const ses = sessionId ? state.sessions.find(s => s.id === sessionId) : null;
      if (state.coachTab !== 'recap') _recapReturnTab = state.coachTab || 'athletes';
      _recapActiveAthId = ath.id;
      _recapActiveSesId = ses ? ses.id : null;
      state.selectedAthleteId = ath.id;
      const saved = loadSavedRecapDraft(ath.id);
      _recapDraftTags = saved?.tags ? [...saved.tags] : ['Barrel Control', 'Variability'];
      _recapDraftVideoUrl = null;
      _recapDraftVideoName = null;
      _recapDraftClips = [];
      _recapActiveStation = 'tee';
      state.role = 'coach';
      state.coachTab = 'recap';
      closeModal();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function readRecapComposerDraft() {
      return {
        includeWarmup: document.getElementById('recap-include-warmup')?.checked ?? true,
        warmup: document.getElementById('recap-warmup-input')?.value ?? GINA_WARMUP_DEFAULT,
        focus: document.getElementById('recap-focus-input')?.value ?? '',
        tee: document.getElementById('recap-tee-input')?.value ?? '',
        ft: document.getElementById('recap-ft-input')?.value ?? '',
        machine: document.getElementById('recap-machine-input')?.value ?? '',
        homework: document.getElementById('recap-homework-input')?.value ?? GINA_HOMEWORK_DEFAULT
      };
    }

    function toggleRecapTag(tag, athId, sessionId) {
      if (_recapDraftTags.includes(tag)) _recapDraftTags = _recapDraftTags.filter(t => t !== tag);
      else _recapDraftTags.push(tag);
      autoSaveRecapDraft(true);
      render();
    }

    function handleRecapVideoFile(input) {
      const files = Array.from(input.files || []);
      if (!files.length) return;
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        _recapDraftClips.push({ title: file.name, url, img: 'assets/images/fastpitch-hitter.jpg' });
      });
      _recapDraftVideoUrl = _recapDraftClips[0].url;
      _recapDraftVideoName = _recapDraftClips.length === 1 ? _recapDraftClips[0].title : `${_recapDraftClips.length} clips attached`;
      const label = document.getElementById('recap-video-status');
      if (label) label.textContent = _recapDraftVideoName;
      autoSaveRecapDraft(true);
    }

      _recapActiveStation = station;

        if (panel) panel.classList.toggle('hidden', st !== station);

      ['tee', 'ft', 'machine'].forEach(st => {

        const val = document.getElementById(`recap-${st}-input`)?.value?.trim();
        if (dot) dot.classList.toggle('hidden', !val);
      });
    }

    function startRecapDictation(targetId, btnEl) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        showToast('Use your iPhone keyboard mic to dictate!');
        document.getElementById(targetId)?.focus();
        return;
      }
      const rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = false;
      const orig = btnEl.innerHTML;
      btnEl.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Listening…`;
      rec.onresult = (ev) => {
        const spoken = ev.results?.[0]?.[0]?.transcript?.trim();
        if (spoken) {
          const el = document.getElementById(targetId);
          if (el) {
            const cur = el.value.trim();
            el.value = cur ? `${cur}\n• ${spoken}` : spoken;
            el.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
      };
      rec.onerror = () => showToast('Mic unavailable — use keyboard dictation.');
      rec.onend = () => { btnEl.innerHTML = orig; };
      rec.start();
    }

    function submitSessionRecap(e, athId, sessionId) {
      e.preventDefault();
      clearTimeout(_recapAutoSaveTimer);
      const ath = state.athletes.find(a => a.id === athId) || state.athletes[0];
      const ses = sessionId ? state.sessions.find(s => s.id === sessionId) : null;
      const includeWarmup = e.target.includeWarmup.checked;
      const warmup = includeWarmup ? e.target.warmup.value.trim() : '';
      const focus = e.target.focus.value.trim();
      const tee = e.target.tee.value.trim();
      const ft = e.target.ft.value.trim();
      const machine = e.target.machine.value.trim();
      const homework = e.target.homework.value.trim() || GINA_HOMEWORK_DEFAULT;
      const sendNow = e.target.sendNow.checked;
      const vidTitle = _recapDraftVideoName || `${ath.name.split(' ')[0]} Session Clip — Today (0:14)`;
      const vidImg = getAthleteCoverImg(ath);
      const clips = _recapDraftClips.length ? _recapDraftClips.map(c => ({ ...c, img: vidImg })) : [{ title: vidTitle, img: vidImg, url: _recapDraftVideoUrl }];

      const newRecap = {
        id: 'rec-' + Date.now(),
        isDraft: false,
        athleteId: ath.id,
        date: new Date().toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' }),
        sessionTitle: ses ? ses.focus : '1-on-1 Training Session',
        tags: [..._recapDraftTags],
        warmup,
        focus,
        tee,
        ft,
        machine,
        homework,
        note: focus,
        videoTitle: vidTitle,
        videoImg: vidImg,
        videoUrl: _recapDraftVideoUrl,
        clips,
        sentTo: sendNow ? `${ath.parentName} (SMS + App)` : 'Saved Private',
        sentAt: 'Just now'
      };

      // 1. Replace any auto-saved draft with the finalized recap & clear localStorage draft
      state.sessionRecaps = state.sessionRecaps.filter(r => r.id !== `draft-${ath.id}`);
      state.sessionRecaps.unshift(newRecap);
      try { localStorage.removeItem(getRecapDraftStorageKey(ath.id)); } catch (_) {}
      _recapActiveAthId = null;
      _recapActiveSesId = null;

      // 2. Also update athlete notes & sync first Tee/FT drill to weekly checklist
      ath.notes.unshift({ date: 'Today', text: focus });
      const firstDrillLine = (tee || ft || machine).split('\n').map(l => l.trim().replace(/^[•\-*]\s*/, '')).find(Boolean);
      if (firstDrillLine) {
        ath.drills.unshift({ id: 'd-' + Date.now(), title: firstDrillLine, reps: '1 bucket • 2-3x/wk', focus: _recapDraftTags[0] || 'Session Focus', done: false, img: vidImg });
      }

      // 3. Mark session completed if launched from a session
      if (ses) ses.status = 'Completed';

      // 4. Automatically message the parent thread with the formatted template + video!
      if (sendNow) {
        let thread = state.threads.find(t => t.parent === ath.parentName);
        if (!thread) {
          thread = { id: 'msg-' + Date.now(), parent: ath.parentName, athletes: ath.name, unread: 0, messages: [] };
          state.threads.unshift(thread);
        }
        thread.messages.push({
          from: 'coach',
          time: 'Just now',
          text: `Session Notes for ${ath.name.split(' ')[0]}:\n${formatRecapPlainText(newRecap)}\nVideo attached: ${vidTitle}`
        });
      }

      state.coachTab = _recapReturnTab || 'athletes';
      render();
      showToast(sendNow ? `Session notes + clips sent to ${ath.parentName}!` : 'Session notes saved to athlete history!');
    }

    function submitQuickAddSession(e) {
      e.preventDefault();

      if (!athId && f.newAthleteName) {
        const name = f.newAthleteName.value.trim();
        if (!name) return;
        const parts = name.split(/\s+/);
        const initials = ((parts[0]?.[0] || '') + (parts[1]?.[0] || parts[0]?.[1] || '')).toUpperCase() || 'EF';
        athId = 'ath-' + Date.now();
        state.athletes.unshift({
          id: athId,
          initials,
          name,
          familyId: 'fam-' + Date.now(),
          parentName: 'Parent / Guardian',
          parentPhone: '(412) 555-0100',
          ageGroup: '14U',
          gradYear: 2030,
          position: 'Hitter / Utility',
          batsThrows: 'R / R',
          team: 'Gina Fuchs Elite Fastpitch',
          height: '',
          streakDays: 1,
          weeklyReps: 0,
          weeklyDuration: '0:00 hours',
          waiverSigned: false,
          waiverDate: null,
          emergencyContact: 'Not set yet',
          medicalNotes: 'None reported',
          pitches: [],
          notes: [],
          drills: []
        });
        if (!state.selectedAthleteId) state.selectedAthleteId = athId;
        if (!state.activeSiblingId) state.activeSiblingId = athId;

      if (!athId) return;
      submitAddSessionForAthlete(e, athId);

    function exportAppBackup() {
      try {
        const payload = JSON.stringify({
          exportedAt: new Date().toISOString(),
          athletes: state.athletes,
          sessions: state.sessions,
          sessionRecaps: state.sessionRecaps,
          payments: state.payments,
          threads: state.threads,
          waitlist: state.waitlist,
          cal: state.cal
        }, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });

    function serializeSyncedState() {
      return {
        athletes: state.athletes,
        sessions: state.sessions,
        sessionRecaps: state.sessionRecaps.filter(r => !r.isDraft),
        videos: state.videos,

    function applySyncedState(data) {
      if (!data || typeof data !== 'object') return;
      _sbHydrating = true;
      if (Array.isArray(data.athletes)) state.athletes = data.athletes;
      if (Array.isArray(data.sessions)) state.sessions = data.sessions;
      if (Array.isArray(data.sessionRecaps)) {
        const localDrafts = state.sessionRecaps.filter(r => r.isDraft);
        state.sessionRecaps = [...localDrafts, ...data.sessionRecaps];
      }
      if (Array.isArray(data.videos)) state.videos = data.videos;
      if (Array.isArray(data.payments)) state.payments = data.payments;
      if (Array.isArray(data.threads)) state.threads = data.threads;
      if (Array.isArray(data.waitlist)) state.waitlist = data.waitlist;
      if (data.cal) {
        if (Array.isArray(data.cal.bookedSlots)) state.cal.bookedSlots = data.cal.bookedSlots;
        if (data.cal.availability) state.cal.availability = data.cal.availability;
        if (Array.isArray(data.cal.eventTypes) && data.cal.eventTypes.length) state.cal.eventTypes = data.cal.eventTypes;
      }
      if (!state.selectedAthleteId && state.athletes.length) state.selectedAthleteId = state.athletes[0].id;
      if (!state.activeSiblingId && state.athletes.length) state.activeSiblingId = state.athletes[0].id;
      _sbHydrating = false;
    }

    async function pushStateToSupabase(immediate = false) {
      if (!_sbClient || _sbHydrating) return;
      clearTimeout(_sbPushTimer);
      const run = async () => {
        try {
          updateSyncIndicators(true, 'Syncing…');
          const payload = serializeSyncedState();
          const { error } = await _sbClient
            .from('gfuchs_state')
            .upsert({ id: 'main', data: payload, updated_at: new Date().toISOString() }, { onConflict: 'id' });
          if (error) {
            console.warn('Supabase upsert error:', error.message);
            updateSyncIndicators(false, 'Sync Error');
          } else {
            updateSyncIndicators(true, 'Synced');
          }
        } catch (err) {
          console.warn('Supabase sync failed:', err);
          updateSyncIndicators(false, 'Offline');
        }
      };
      if (immediate) await run();
      else _sbPushTimer = setTimeout(run, 450);
    }

    async function initSupabaseSync() {
      const { url, key } = getSupabaseCreds();
      if (!url || !key || !window.supabase?.createClient) {
        updateSyncIndicators(false, 'Cloud Sync');
        return;
      }
      try {
        _sbClient = window.supabase.createClient(url, key);
        const { data, error } = await _sbClient.from('gfuchs_state').select('data').eq('id', 'main').maybeSingle();
        if (error) {
          console.warn('Supabase fetch error:', error.message);
          updateSyncIndicators(false, 'Check SQL');
          return;
        }
        if (data?.data && (data.data.athletes?.length || data.data.sessions?.length || data.data.sessionRecaps?.length)) {
          applySyncedState(data.data);
          saveLocalState();
          updateSyncIndicators(true, 'Synced');
          render(false);
        } else if (state.athletes.length || state.sessions.length || state.sessionRecaps.length) {
          // Cloud is empty, local has imported athletes — push up immediately!
          await pushStateToSupabase(true);
        } else {
          updateSyncIndicators(true, 'Synced');
        }

        // Subscribe to real-time updates from other devices
        _sbClient
          .channel('gfuchs-live-sync')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'gfuchs_state', filter: 'id=eq.main' }, (payload) => {
            const incoming = payload.new?.data;
            if (!incoming || incoming._clientId === CLIENT_SESSION_ID) return;
            applySyncedState(incoming);
            saveLocalState();
            render(false);
            showToast('Synced live update from another device!');
          })
          .subscribe();
      } catch (err) {
        console.warn('Supabase init failed:', err);
        updateSyncIndicators(false, 'Cloud Sync');
      }
    }

    (function initPullToRefresh() {
      const indicator = document.getElementById('ptr-indicator');

      function resetPtr() {

        text.textContent = 'Pull to refresh';
        pulling = false;
        pullDist = 0;
      }

      window.addEventListener('touchstart', (e) => {
        if (refreshing || window.scrollY > 2) return;
        const modalOpen = !document.getElementById('modal-root').classList.contains('hidden');
        if (modalOpen) return;
        startY = e.touches[0].clientY;
        pulling = true;
        indicator.classList.add('dragging');
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!pulling || refreshing) return;
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0 || window.scrollY > 2) {
          pullDist = 0;
          indicator.style.opacity = '0';
          return;
        }
        // Smooth rubber-band damping
        pullDist = Math.min(115, dy * 0.52);
        const progress = Math.min(1, pullDist / THRESHOLD);
        indicator.style.opacity = String(Math.min(1, progress * 1.25));
        indicator.style.transform = `translate(-50%, ${Math.round(-20 + pullDist)}px)`;

        if (pullDist >= THRESHOLD) {
          icon.style.transform = 'rotate(180deg)';
          text.textContent = 'Release to refresh';
          pill.style.background = '#D5FF5F';
          pill.style.color = '#010101';
        } else {
          icon.style.transform = `rotate(${Math.round(progress * 150)}deg)`;
          text.textContent = 'Pull to refresh';
          pill.style.background = '';
          pill.style.color = '';
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        if (!pulling || refreshing) return;
        if (pullDist >= THRESHOLD) {
          refreshing = true;
          indicator.classList.remove('dragging');
          indicator.style.transform = 'translate(-50%, 64px)';
          indicator.style.opacity = '1';
          icon.textContent = '↻';
          icon.style.transform = '';
          icon.classList.add('ptr-spinning');
          pill.style.background = '';
          pill.style.color = '';
          text.textContent = 'Syncing live data...';

          setTimeout(() => {
            render();
            refreshing = false;
            resetPtr();
            showToast('✓ Synced schedule, recaps & payments!');
          }, 650);
        } else {
          resetPtr();
        }
      }, { passive: true });
    })();
  </script>
</body>
</html>
