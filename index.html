                      ${s.status !== 'Canceled' ? `<button onclick="openSessionRecapModal('${sel.id}', '${s.id}')" class="px-2.5 py-1.5 rounded-xl bg-[#010101] text-[#D5FF5F] text-[10px] font-extrabold cursor-pointer">Notes</button>` : ''}
                    </div>
                  </div>
                `).join('') : `<div class="p-3 text-xs text-[var(--text-muted)] surface-soft rounded-2xl">No sessions scheduled yet. Tap "+ Add Session" to book ${sel.name.split(' ')[0]}.</div>`}
              </div>
            </div>

            <!-- Assigned Homework Drills -->
            <div class="card-white rounded-[28px] p-5 space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-extrabold">Homework Drills</h2>
                <button onclick="openAddDrillModal('${sel.id}')" class="px-3 py-1.5 rounded-xl surface-soft text-xs font-extrabold cursor-pointer">+ Drill</button>
              </div>
              <div class="space-y-2">
                ${sel.drills.map(d => `
                  <label class="surface-soft rounded-2xl p-3 flex items-center justify-between gap-2 cursor-pointer">
                    <div class="flex items-center gap-2.5">
                      <input type="checkbox" ${d.done ? 'checked' : ''} onchange="toggleDrill('${sel.id}','${d.id}')" class="w-4 h-4 accent-[#010101]" />
                      <div><div class="text-xs font-bold ${d.done ? 'line-through text-[var(--text-muted)]' : ''}">${d.title}</div><div class="text-[11px] text-[var(--text-muted)]">${d.focus}</div></div>
                    </div>
                    <span class="px-2 py-0.5 rounded-full bg-[#D6DFE2] text-[#010101] text-[10px] font-extrabold shrink-0">${d.reps}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Right: Session Notes & Video History -->
          <div class="lg:col-span-7 card-white rounded-[28px] p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="text-base font-extrabold tracking-tight">Session Notes &amp; Videos</h2>
                <p class="text-xs text-[var(--text-muted)]">Log notes + attach clips &amp; send straight to ${sel.parentName || 'parent'}</p>
              </div>
              <button onclick="openSessionRecapModal('${sel.id}', null)" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer shadow-sm">
                ${uiIcon('note')} New Recap &amp; Send
              </button>
            </div>

            <div class="space-y-3">
              ${recaps.length ? recaps.map(r => `
                <div class="surface-soft rounded-[24px] p-4 space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <div class="flex items-center gap-1.5">
                        <span class="text-xs font-extrabold">${r.date} • ${r.sessionTitle}</span>
                        ${r.isDraft ? `<span class="px-2 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">AUTO-SAVED DRAFT</span>` : ''}
                      </div>
                      <div class="text-[11px] text-[#4E6075] dark:text-[#9AC0D6] font-semibold">${r.isDraft ? `✓ Auto-saved ${r.sentAt} — tap to keep editing or send` : `✓ Sent to ${r.sentTo} (${r.sentAt})`}</div>
                    </div>
                    <div class="flex flex-wrap items-center gap-1">
                      ${r.isDraft ? `<button onclick="openSessionRecapModal('${sel.id}', null)" class="px-2.5 py-1 rounded-full bg-[#010101] text-[#D5FF5F] text-[10px] font-extrabold cursor-pointer">${uiIcon('edit')} Continue Editing</button>` : ''}
                      ${r.tags.map(t => `<span class="px-2 py-0.5 rounded-full card-white text-[10px] font-extrabold">${t}</span>`).join('')}
                    </div>
                  </div>
                  ${renderRecapTemplateBody(r, true)}
                  <div class="flex items-center gap-2 min-w-0">
                    <button onclick="openRecapViewerModal('${r.id}', 0)" class="flex-1 min-w-0 overflow-hidden card-white rounded-2xl p-2.5 flex items-center gap-3 text-left cursor-pointer hover:border-[#010101] transition">
                      <div class="relative w-16 h-12 rounded-xl overflow-hidden shrink-0">
                        <img src="${r.videoImg}" class="w-full h-full object-cover" alt="Fastpitch softball training" loading="lazy" decoding="async" />
                        <div class="absolute inset-0 bg-[#010101]/40 flex items-center justify-center text-[#D5FF5F] text-xs">▶</div>
                      </div>
                      <div class="min-w-0 flex-1 overflow-hidden">
                        <div class="text-xs font-extrabold truncate">${r.clips?.length ? `${r.clips.length} Attached Clip${r.clips.length === 1 ? '' : 's'} • ${formatClipLabel(r.clips[0]?.title || r.videoTitle, 0)}` : (r.videoUrl ? formatClipLabel(r.videoTitle, 0) : 'No video attached yet')}</div>
                        <div class="text-[11px] text-[var(--text-muted)] truncate">${r.videoUrl || r.clips?.length ? 'Tap to watch session clip' : 'Tap + Video to upload from Photos / Files'}</div>
                      </div>
                    </button>
                    <label title="Upload video clip to this note" class="px-3 py-3 rounded-2xl bg-[#010101] text-[#D5FF5F] text-[11px] font-extrabold cursor-pointer hover:opacity-90 shrink-0 inline-flex items-center gap-1">
                      + Video
                      <input type="file" accept="video/*,image/*" multiple onchange="attachVideosToRecap('${r.id}', this)" class="hidden" />
                    </label>
                    <button onclick="copyRecapNote('${r.id}')" title="Copy formatted note" class="px-3 py-3 rounded-2xl card-white text-xs font-extrabold cursor-pointer hover:border-[#010101] shrink-0">${uiIcon('copy')}</button>
                  </div>
                </div>
              `).join('') : `<div class="p-6 text-center text-xs text-[var(--text-muted)] surface-soft rounded-2xl">No session notes yet. Tap "+ New Recap &amp; Send" after today’s lesson!</div>`}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // POST-SESSION RECAP COMPOSER — GINA'S EXACT SESSION NOTES TEMPLATE
    // =========================================================================
    const GINA_WARMUP_DEFAULT = `walking pvc swings, recoils, pvc rotations\nMed ball - staggered, scoop, step back 5 each (4lbs)`;
    const GINA_HOMEWORK_DEFAULT = `At least 1 bucket of each drill 2-3x a week!`;

    let _recapDraftTags = ['Barrel Path', 'Timing'];
    let _recapDraftVideoUrl = null;
    let _recapDraftVideoName = null;

    function formatBulletLines(text) {
      if (!text || !text.trim()) return '';
      return text.split('\n').map(l => l.trim().replace(/^[•\-*]\s*/, '')).filter(Boolean)
        .map(l => `<li class="flex items-start gap-1.5"><span class="text-[#4E6075] dark:text-[#D5FF5F] font-extrabold">•</span><span>${l}</span></li>`).join('');
    }

    function formatRecapPlainText(r) {
      const lines = [];
      if (r.date) lines.push(r.date);
      if (r.warmup) {
        lines.push(`* Hitter’s Warm up routine`);
        lines.push(r.warmup);
        lines.push('');
      }
      lines.push(`What’s new/focus for lesson:`);
      lines.push(r.focus || r.note || '');
      lines.push('');
      lines.push(`What we did today:`);
      lines.push('');
      if (r.tee) {
        lines.push(`Tee:`);
        r.tee.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      }
      if (r.ft) {
        lines.push(`FT:`);
        r.ft.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      }
      if (r.machine) {
        lines.push(`Machine:`);
        r.machine.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      }
      lines.push('');
      const hwLines = (r.homework || GINA_HOMEWORK_DEFAULT).split('\n').map(x => x.trim()).filter(Boolean);
      lines.push(`Homework - ${hwLines[0] || GINA_HOMEWORK_DEFAULT}`);
      hwLines.slice(1).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      return lines.join('\n');
    }

    function copyRecapNote(recapId) {
      const r = state.sessionRecaps.find(x => x.id === recapId);
      if (!r) return;
      const txt = formatRecapPlainText(r);
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(txt).then(() => showToast('Session note copied to clipboard!')).catch(() => showToast('Note ready to share!'));
      } else {
        showToast('Session note copied!');
      }
    }

    function appendQuickDrill(inputId, text) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const cur = el.value.trim();
      el.value = cur ? `${cur}\n• ${text}` : `• ${text}`;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.focus();
    }

    function normalizeRecapForDisplay(r) {
      if (!r) return r;
      const focusStr = String(r.focus || '');
      const looksRawMarkdown = /(^|\n)\s*#\s|!\[[^\]]*\]\(|(\*\*|__)[_\s]*what[’']?s\s*new|\*\*tee|\*\*homework/i.test(focusStr) ||
        (!r.warmup && !r.tee && !r.ft && !r.machine && /(\*\*|!\[)/.test(focusStr));
      if (looksRawMarkdown) {
        const parsed = parseGinaAppleNote(focusStr, r.date || '');
        return {
          ...r,
          warmupTitle: parsed.warmupTitle || r.warmupTitle,
          warmup: parsed.warmup || r.warmup,
          focus: parsed.focus,
          tee: parsed.tee || r.tee,
          ft: parsed.ft || r.ft,
          machine: parsed.machine || r.machine,
          homework: parsed.homework || (r.homework === GINA_HOMEWORK_DEFAULT ? '' : r.homework)
        };
      }
      return r;
    }

    function renderRecapTemplateBody(rawRecap, compact = false) {
      const r = normalizeRecapForDisplay(rawRecap);
      if (!r.focus && !r.tee && !r.ft && !r.machine && !r.warmup && !r.homework) {
        return `<p class="text-xs leading-relaxed">${r.note || 'Session notes recorded.'}</p>`;
      }
      const boxCls = compact ? 'card-white' : 'surface-soft';
      const hwLines = (r.homework || '').split('\n').map(l => l.trim()).filter(Boolean);
      const hwHead = hwLines[0] || '';
      const hwBullets = hwLines.slice(1);
      const drillCols = [r.tee, r.ft, r.machine].filter(Boolean).length;
      const gridColsCls = drillCols === 1 ? 'grid-cols-1' : drillCols === 2 ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-1 sm:grid-cols-3';
      return `
        <div class="space-y-2.5 text-xs">
          ${r.warmup ? `
            <div class="${boxCls} rounded-2xl p-3 space-y-1">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">• ${r.warmupTitle || 'Warm Up Routine'}</div>
              <div class="text-[11px] leading-relaxed whitespace-pre-line text-[var(--text-muted)]">${r.warmup}</div>
            </div>
          ` : ''}

          ${r.focus ? `
            <div class="space-y-0.5">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">What’s New / Focus for Lesson</div>
              <p class="text-xs font-semibold leading-relaxed whitespace-pre-line">${r.focus}</p>
            </div>
          ` : ''}

          ${(r.tee || r.ft || r.machine) ? `
            <div class="space-y-1.5">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">What We Did Today</div>
              <div class="grid ${gridColsCls} gap-2">
                ${r.tee ? `
                  <div class="${boxCls} rounded-2xl p-2.5 space-y-1">
                    <div class="text-[10px] font-extrabold uppercase tracking-wider">Tee</div>
                    <ul class="space-y-1 text-[11px] leading-snug">${formatBulletLines(r.tee)}</ul>
                  </div>
                ` : ''}
                ${r.ft ? `
                  <div class="${boxCls} rounded-2xl p-2.5 space-y-1">
                    <div class="text-[10px] font-extrabold uppercase tracking-wider">FT (Front Toss)</div>
                    <ul class="space-y-1 text-[11px] leading-snug">${formatBulletLines(r.ft)}</ul>
                  </div>
                ` : ''}
                ${r.machine ? `
                  <div class="${boxCls} rounded-2xl p-2.5 space-y-1">
                    <div class="text-[10px] font-extrabold uppercase tracking-wider">Machine</div>
                    <ul class="space-y-1 text-[11px] leading-snug">${formatBulletLines(r.machine)}</ul>
                  </div>
                ` : ''}
              </div>
            </div>
          ` : ''}

          ${hwHead ? `
            <div class="rounded-2xl px-3 py-2.5 bg-[#D5FF5F]/25 dark:bg-[#D5FF5F]/15 border border-[#D5FF5F]/60 space-y-1">
              <div class="flex items-start gap-2 text-[11px] leading-snug">
                ${uiIcon('softball', 'w-4 h-4 mt-0.5')}
                <div><span class="font-extrabold">Homework:</span> ${hwHead}</div>
              </div>
              ${hwBullets.length ? `<ul class="pl-5 space-y-0.5 text-[11px] leading-snug">${formatBulletLines(hwBullets.join('\n'))}</ul>` : ''}
            </div>
          ` : ''}

          ${r.clips && r.clips.length > 1 ? `
            <div class="space-y-1.5">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">${uiIcon('video')} Attached Clips (${r.clips.length})</div>
              <div class="grid grid-cols-2 gap-2">
                ${r.clips.map((c, cIdx) => `
                  <button type="button" onclick="openRecapViewerModal('${r.id}', ${cIdx})" class="relative h-20 rounded-2xl overflow-hidden text-left group cursor-pointer min-w-0">
                    <img src="${c.img || r.videoImg}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="Fastpitch softball training" loading="lazy" decoding="async">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#010101]/80 via-[#010101]/20 to-transparent flex flex-col justify-between p-2 min-w-0">
                      <span class="w-6 h-6 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold flex items-center justify-center">▶</span>
                      <span class="text-[10px] font-extrabold text-white truncate block">${formatClipLabel(c.title, cIdx)}</span>
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function formatClipLabel(title, idx = 0) {
      const raw = String(title || '').trim();
      if (!raw) return `Clip ${idx + 1}`;
      // Strip file extension and Apple Notes Exporter UUIDs like -81492300167__48C065BD-692D-...
      const cleaned = raw
        .replace(/\.(mov|mp4|m4v|webm|3gp|avi|jpe?g|png|heic|gif)$/i, '')
        .replace(/[-_]?\d{8,}__[A-Fa-f0-9-]+$/i, '')
        .replace(/[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}/g, '')
        .replace(/[-_\s]+$/g, '')
        .trim();
      if (!cleaned || cleaned.length < 2) return `Clip ${idx + 1}`;
      // If it's just a date + index like "10-28-29-1", make it "Clip 1 (10-28)"
      if (/^\d{1,2}[-/]\d{1,2}(?:[-/]\d{2,4})?(?:-\d+)?$/.test(cleaned)) {
        return `Clip ${idx + 1} (${cleaned.replace(/-\d+$/, '')})`;
      }
      return cleaned.length > 32 ? cleaned.slice(0, 31) + '…' : cleaned;
    }

    let _recapDraftClips = [];
    let _recapActiveAthId = null;
    let _recapActiveSesId = null;
    let _recapAutoSaveTimer = null;

    function getRecapDraftStorageKey(athId) {
      return `gfuchs_recap_draft_${athId}`;
    }

    function loadSavedRecapDraft(athId) {
      const mem = state.sessionRecaps.find(r => r.id === `draft-${athId}` && r.isDraft);
      if (mem) {
        return {
          includeWarmup: !!mem.warmup,
          warmup: mem.warmup || GINA_WARMUP_DEFAULT,
          focus: mem.focus || '',
          tee: mem.tee || '',
          ft: mem.ft || '',
          machine: mem.machine || '',
          homework: mem.homework || GINA_HOMEWORK_DEFAULT,
          tags: mem.tags || ['Barrel Control', 'Variability'],
          savedAt: mem.sentAt || 'Just now'
        };
      }
      try {
        const raw = localStorage.getItem(getRecapDraftStorageKey(athId));
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      return null;
    }

    function autoSaveRecapDraft(immediate = false) {
      const athId = _recapActiveAthId;
      if (!athId) return;
      const badge = document.getElementById('recap-autosave-badge');
      if (badge && !immediate) {
        badge.textContent = 'Saving…';
      }
      clearTimeout(_recapAutoSaveTimer);
      const doSave = () => {
        const ath = state.athletes.find(a => a.id === athId);
        if (!ath) return;
        const ses = _recapActiveSesId ? state.sessions.find(s => s.id === _recapActiveSesId) : null;
        const d = readRecapComposerDraft();
        const nowTime = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const hasContent = !!(d.focus.trim() || d.tee.trim() || d.ft.trim() || d.machine.trim() || _recapDraftClips.length);

        try {
          localStorage.setItem(getRecapDraftStorageKey(athId), JSON.stringify({
            ...d,
            tags: [..._recapDraftTags],
            savedAt: nowTime
          }));
        } catch (_) {}

        if (hasContent) {
          const vidImg = getAthleteCoverImg(ath);
          const vidTitle = _recapDraftVideoName || `${ath.name.split(' ')[0]} Session Clip — Draft`;
          const clips = _recapDraftClips.length ? _recapDraftClips.map(c => ({ ...c, img: vidImg })) : [{ title: vidTitle, img: vidImg, url: _recapDraftVideoUrl }];
          const draftRecap = {
            id: `draft-${athId}`,
            isDraft: true,
            athleteId: athId,
            date: new Date().toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' }),
            sessionTitle: ses ? ses.focus : '1-on-1 Training Session',
            tags: [..._recapDraftTags],
            warmup: d.includeWarmup ? d.warmup.trim() : '',
            focus: d.focus.trim(),
            tee: d.tee.trim(),
            ft: d.ft.trim(),
            machine: d.machine.trim(),
            homework: d.homework.trim() || GINA_HOMEWORK_DEFAULT,
            note: d.focus.trim() || 'In-progress session note',
            videoTitle: vidTitle,
            videoImg: vidImg,
            videoUrl: _recapDraftVideoUrl,
            clips,
            sentTo: 'Auto-saved Draft',
            sentAt: nowTime
          };
          const idx = state.sessionRecaps.findIndex(r => r.id === `draft-${athId}`);
          if (idx >= 0) state.sessionRecaps[idx] = draftRecap;
          else state.sessionRecaps.unshift(draftRecap);
        }

        const b = document.getElementById('recap-autosave-badge');
        if (b) b.textContent = `✓ Auto-saved ${nowTime}`;
      };
      if (immediate) doSave();
      else _recapAutoSaveTimer = setTimeout(doSave, 250);
    }

    let _recapReturnTab = 'athletes';

    function clearRecapDraft(athId, sessionId) {
      try { localStorage.removeItem(getRecapDraftStorageKey(athId)); } catch (_) {}
      state.sessionRecaps = state.sessionRecaps.filter(r => r.id !== `draft-${athId}`);
      _recapDraftTags = ['Barrel Control', 'Variability'];
      _recapDraftVideoUrl = null;
      _recapDraftVideoName = null;
      _recapDraftClips = [];
      render();
      showToast('Draft reset to blank template.');
    }

    function closeRecapComposer() {
      autoSaveRecapDraft(true);
      _recapActiveAthId = null;
      _recapActiveSesId = null;
      state.coachTab = _recapReturnTab || 'athletes';
      render();
    }

    function switchRecapAthlete(newAthId) {
      if (newAthId === _recapActiveAthId) return;
      autoSaveRecapDraft(true);
      openSessionRecapModal(newAthId, null);
    }

    function openSessionRecapModal(athId, sessionId) {
      const ath = state.athletes.find(a => a.id === athId) || state.athletes[0];
      const ses = sessionId ? state.sessions.find(s => s.id === sessionId) : null;
      if (state.coachTab !== 'recap') _recapReturnTab = state.coachTab || 'athletes';
      _recapActiveAthId = ath.id;
      _recapActiveSesId = ses ? ses.id : null;
      state.selectedAthleteId = ath.id;
      const saved = loadSavedRecapDraft(ath.id);
      _recapDraftTags = saved?.tags ? [...saved.tags] : ['Barrel Control', 'Variability'];
      _recapDraftVideoUrl = null;
      _recapDraftVideoName = null;
      _recapDraftClips = [];
      _recapActiveStation = 'tee';
      state.role = 'coach';
      state.coachTab = 'recap';
      closeModal();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function readRecapComposerDraft() {
      return {
        includeWarmup: document.getElementById('recap-include-warmup')?.checked ?? true,
        warmup: document.getElementById('recap-warmup-input')?.value ?? GINA_WARMUP_DEFAULT,
        focus: document.getElementById('recap-focus-input')?.value ?? '',
        tee: document.getElementById('recap-tee-input')?.value ?? '',
        ft: document.getElementById('recap-ft-input')?.value ?? '',
        machine: document.getElementById('recap-machine-input')?.value ?? '',
        homework: document.getElementById('recap-homework-input')?.value ?? GINA_HOMEWORK_DEFAULT
      };
    }

    function toggleRecapTag(tag, athId, sessionId) {
      if (_recapDraftTags.includes(tag)) _recapDraftTags = _recapDraftTags.filter(t => t !== tag);
      else _recapDraftTags.push(tag);
      autoSaveRecapDraft(true);
      render();
    }

    function handleRecapVideoFile(input) {
      const files = Array.from(input.files || []);
      if (!files.length) return;
      autoSaveRecapDraft(true);
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        _recapDraftClips.push({ title: file.name || `Cage Clip ${_recapDraftClips.length + 1}`, url, img: 'assets/images/fastpitch-hitter.jpg' });
      });
      _recapDraftVideoUrl = _recapDraftClips[0].url;
      _recapDraftVideoName = _recapDraftClips.length === 1 ? _recapDraftClips[0].title : `${_recapDraftClips.length} clips attached`;
      render(false);
      showToast(`Attached ${files.length} clip${files.length === 1 ? '' : 's'}!`);
    }

    let _recapActiveStation = 'tee';

    function switchRecapStation(station) {
      _recapActiveStation = station;
      ['tee', 'ft', 'machine'].forEach(st => {
        const panel = document.getElementById(`recap-panel-${st}`);
        const tab = document.getElementById(`recap-tab-${st}`);
        if (panel) panel.classList.toggle('hidden', st !== station);
        if (tab) {
          tab.className = st === station
            ? 'flex-1 py-2.5 px-3 rounded-xl text-xs font-extrabold cursor-pointer transition bg-[#010101] text-[#D5FF5F] shadow-sm flex items-center justify-center gap-1.5'

      });

    function startRecapDictation(targetId, btnEl) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        showToast('Use your iPhone keyboard mic to dictate!');
        document.getElementById(targetId)?.focus();
        return;
      }
      const rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = false;
      const orig = btnEl.innerHTML;
      btnEl.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Listening…`;
      rec.onresult = (ev) => {
        const spoken = ev.results?.[0]?.[0]?.transcript?.trim();
        if (spoken) {
          const el = document.getElementById(targetId);
          if (el) {
            const cur = el.value.trim();
            el.value = cur ? `${cur}\n• ${spoken}` : spoken;
            el.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
      };
      rec.onerror = () => showToast('Mic unavailable — use keyboard dictation.');
      rec.onend = () => { btnEl.innerHTML = orig; };
      rec.start();
    }

                    <option value="Venmo / Zelle">Venmo / Zelle</option>
                    <option value="Clover • Card">Clover</option>
                  </select>
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-[var(--text-muted)] mb-1">Status</label>
                  <select name="wrapPayStatus" class="w-full px-2 py-2 rounded-xl card-white font-bold text-xs">

            ${ses ? `

                <div class="flex items-center gap-2.5">
                  <span class="w-8 h-8 rounded-xl card-white flex items-center justify-center text-[#4E6075] dark:text-[#9AC0D6] shrink-0">${uiIcon('repeat', 'w-4 h-4')}</span>
                  <div>
                    <div class="font-extrabold">Rebook Same Time Next Week (+7d)</div>
                    <div class="text-[11px] text-[var(--text-muted)]">Books ${ses.time} next week automatically if open</div>
                  </div>
                </div>
                <input type="checkbox" name="wrapRebookNextWeek" class="w-5 h-5 accent-[#010101]" />
              </label>
            ` : ''}

            ${groupAthletes.length > 1 ? `
              <div class="surface-soft rounded-2xl p-3.5 space-y-2.5">
                <label class="flex items-center justify-between gap-3 cursor-pointer">
                  <div class="flex items-center gap-2.5">
                    <span class="w-8 h-8 rounded-xl card-white flex items-center justify-center text-[#4E6075] dark:text-[#9AC0D6] shrink-0">${uiIcon('users', 'w-4 h-4')}</span>
                    <div>
                      <div class="font-extrabold">Share Group Note to All ${groupAthletes.length} Athletes</div>
                      <div class="text-[11px] text-[var(--text-muted)]">${groupAthletes.map(a => a.name.split(' ')[0]).join(', ')}</div>

                <div id="wrap-group-cues" class="space-y-1.5 pt-1">
                  <div class="text-[11px] font-bold text-[var(--text-muted)]">Optional 1-line personal cue per athlete:</div>

                    <div class="flex items-center gap-2">
                      <span class="text-[11px] font-extrabold w-20 truncate shrink-0">${ga.name.split(' ')[0]}:</span>
                      <input type="text" name="groupCue_${ga.id}" class="flex-1 px-3 py-1.5 rounded-xl card-white text-xs" placeholder="Personal cue for ${ga.name.split(' ')[0]}..." />

                ${uiIcon('video')}
                <span id="recap-video-status">${_recapDraftVideoName ? _recapDraftVideoName : '+ Add Videos / Photos'}</span>
                <input type="file" accept="video/*,image/*" multiple onchange="handleRecapVideoFile(this)" class="hidden" />

              <label class="inline-flex items-center gap-2 text-xs font-extrabold cursor-pointer">
                <span>Text ${(ath.parentName || 'Parent').split(' ')[0]}</span>
                <input type="checkbox" name="sendNow" checked class="w-5 h-5 accent-[#010101]" />
              </label>

            <button type="submit" class="w-full py-4 rounded-2xl bg-[#D5FF5F] text-[#010101] text-sm font-extrabold cursor-pointer shadow-lg hover:brightness-95 transition inline-flex items-center justify-center gap-2">
              ${uiIcon('send', 'w-4 h-4')}

            </button>
          </div>

    }

    function submitSessionRecap(e, athId, sessionId) {
      e.preventDefault();
      clearTimeout(_recapAutoSaveTimer);
      const ath = state.athletes.find(a => a.id === athId) || state.athletes[0];
      const ses = sessionId ? state.sessions.find(s => s.id === sessionId) : null;
      const f = e.target;
      const includeWarmup = f.includeWarmup.checked;
      const warmup = includeWarmup ? f.warmup.value.trim() : '';
      const baseFocus = f.focus.value.trim();
      const tee = f.tee.value.trim();
      const ft = f.ft.value.trim();
      const machine = f.machine.value.trim();
      const homework = f.homework.value.trim() || GINA_HOMEWORK_DEFAULT;
      const sendNow = f.sendNow.checked;

      // Determine target athletes (single or all athletes in a Small Group session)
      const shareGroup = Boolean(f.wrapShareGroup?.checked && ses && Array.isArray(ses.athleteIds) && ses.athleteIds.length > 1);
      const targets = shareGroup
        ? ses.athleteIds.map(id => state.athletes.find(a => a.id === id)).filter(Boolean)
        : [ath];

      const todayLabel = new Date().toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' });
      const todayShort = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const todayIso = getTodayIsoEst();

      targets.forEach((targetAth, idx) => {
        const personalCue = shareGroup ? (f[`groupCue_${targetAth.id}`]?.value || '').trim() : '';
        const focus = personalCue ? `${baseFocus}\nPersonal cue: ${personalCue}` : baseFocus;
        const vidTitle = _recapDraftVideoName || `${targetAth.name.split(' ')[0]} Session Clip — Today (0:14)`;
        const vidImg = getAthleteCoverImg(targetAth);
        const clips = _recapDraftClips.length ? _recapDraftClips.map(c => ({ ...c, img: vidImg })) : [{ title: vidTitle, img: vidImg, url: _recapDraftVideoUrl }];

        const newRecap = {
          id: 'rec-' + (Date.now() + idx),
          isDraft: false,
          athleteId: targetAth.id,
          date: todayLabel,
          sessionTitle: ses ? (ses.lessonTitle || ses.focus) : '1-on-1 Training Session',
          tags: [..._recapDraftTags],
          warmup,
          focus,
          tee,
          ft,
          machine,
          homework,
          note: focus,
          videoTitle: vidTitle,
          videoImg: vidImg,
          videoUrl: _recapDraftVideoUrl,
          clips,
          sentTo: sendNow ? `${targetAth.parentName || targetAth.name} (SMS + App)` : 'Saved Private',
          sentAt: 'Just now',
          createdAt: Date.now() + idx,
          _modifiedAt: Date.now() + idx
        };

        state.sessionRecaps = state.sessionRecaps.filter(r => r.id !== `draft-${targetAth.id}`);
        state.sessionRecaps.unshift(newRecap);
        try { localStorage.removeItem(getRecapDraftStorageKey(targetAth.id)); } catch (_) {}

        targetAth.notes.unshift({ date: 'Today', text: focus });
        const firstDrillLine = (tee || ft || machine).split('\n').map(l => l.trim().replace(/^[•\-*]\s*/, '')).find(Boolean);
        if (firstDrillLine) {
          targetAth.drills.unshift({ id: 'd-' + (Date.now() + idx), title: firstDrillLine, reps: '1 bucket • 2-3x/wk', focus: _recapDraftTags[0] || 'Session Focus', done: false, img: vidImg });
        }

        if (sendNow) {
          const parentKey = targetAth.parentName || targetAth.name;
          let thread = state.threads.find(t => t.parent === parentKey);
          if (!thread) {
            thread = { id: 'msg-' + (Date.now() + idx), parent: parentKey, athletes: targetAth.name, unread: 0, messages: [] };
            state.threads.unshift(thread);
          }
          thread.messages.push({
            from: 'coach',
            time: 'Just now',
            text: `Session Notes for ${targetAth.name.split(' ')[0]}:\n${formatRecapPlainText(newRecap)}\nVideo attached: ${vidTitle}`
          });
        }

        // Optional inline payment logging
        if (f.wrapLogPayment?.checked) {
          const amt = Number(f.wrapPayAmount?.value) || 0;
          const method = f.wrapPayMethod?.value || 'Cash';
          const status = f.wrapPayStatus?.value || 'Paid';
          const _nowWrap = Date.now() + idx * 10;
          state.payments.unshift({
            id: 'pay-' + _nowWrap,
            date: todayShort,
            dateIso: todayIso,
            createdAt: _nowWrap,
            paidAt: status === 'Paid' ? _nowWrap : null,
            athleteId: targetAth.id,
            sessionId: ses ? ses.id : null,
            family: `${(targetAth.parentName || targetAth.name).split(' ').slice(-1)[0]} Family`,
            item: `${ses?.lessonTitle || 'Training Session'} (${targetAth.name.split(' ')[0]})`,
            amount: amt,
            method: status === 'Paid' ? `${method} (Collected ✓)` : method,
            status: status === 'Paid' ? 'Paid' : 'Unpaid',
            _modifiedAt: _nowWrap
          });
        }
      });

      _recapActiveAthId = null;
      _recapActiveSesId = null;

      // Mark session completed & optionally rebook same time next week
      let rebookedMsg = '';
      if (ses) {
        ses.status = 'Completed';
        ses._modifiedAt = Date.now();
        if (f.wrapRebookNextWeek?.checked) {
          const rebooked = rebookSessionNextWeek(ses.id, true);
          rebookedMsg = rebooked ? ` + rebooked ${rebooked.day}` : ' (next week slot had a conflict)';
        }
      }

      const payMsg = f.wrapLogPayment?.checked ? ' + payment logged' : '';
      state.coachTab = _recapReturnTab || 'athletes';
      render();
      showToast(targets.length > 1
        ? `Group recap sent to ${targets.length} athletes${payMsg}${rebookedMsg}!`
        : `Session notes saved for ${ath.name.split(' ')[0]}${payMsg}${rebookedMsg}!`);
    }

    function openRecapViewerModal(recapId, clipIdx = 0) {
      const r = state.sessionRecaps.find(x => x.id === recapId);
      if (!r) return;
      const clips = (Array.isArray(r.clips) && r.clips.length)
        ? r.clips
        : (r.videoUrl ? [{ title: r.videoTitle || 'Session Clip', url: r.videoUrl, isVideo: true }] : []);
      const activeClip = clips[clipIdx] || clips[0] || null;
      const activeUrl = activeClip?.url || null;
      const activeIsImage = activeClip && (activeClip.isVideo === false || /\.(jpe?g|png|gif|webp|heic)(\?|$)/i.test(activeClip.title || activeUrl || ''));

      openModal(`
        <div>
          <div class="relative bg-[#010101]">
            ${activeUrl
              ? (activeIsImage
                  ? `<img src="${activeUrl}" alt="${activeClip.title || 'Session photo'}" class="w-full max-h-64 object-contain" />`
                  : `<video src="${activeUrl}" controls autoplay playsinline class="w-full max-h-64 object-contain"></video>`)
              : `<div class="relative h-48"><img src="${r.videoImg}" class="w-full h-full object-cover" alt="Fastpitch softball training" loading="lazy" decoding="async" /><div class="absolute inset-0 bg-[#010101]/55 flex flex-col items-center justify-center gap-2 text-white px-4 text-center"><div class="w-12 h-12 rounded-full bg-[#D5FF5F] text-[#010101] flex items-center justify-center text-base font-extrabold shadow-xl">▶</div><span class="text-xs font-extrabold">No video uploaded to this note yet</span><label class="px-3.5 py-2 rounded-full bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">+ Upload Video Clip<input type="file" accept="video/*,image/*" multiple onchange="attachVideosToRecap('${r.id}', this).then(() => openRecapViewerModal('${r.id}', 0))" class="hidden" /></label></div></div>`
            }
            <button onclick="closeModal()" aria-label="Close" class="absolute top-3 right-3 w-10 h-10 rounded-full flex items-center justify-center bg-[#010101]/70 text-white text-xs font-bold cursor-pointer">✕</button>
          </div>
          ${clips.length > 1 ? `
            <div class="px-4 py-2.5 bg-[#010101]/95 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              ${clips.map((c, i) => `
                <button onclick="openRecapViewerModal('${r.id}', ${i})" class="px-3 py-1 rounded-full text-[11px] font-extrabold shrink-0 cursor-pointer transition ${i === clipIdx ? 'bg-[#D5FF5F] text-[#010101]' : 'bg-white/15 text-white hover:bg-white/25'}">
                  Clip ${i + 1}: ${(c.title || 'Video').slice(0, 18)}
                </button>
              `).join('')}
            </div>
          ` : ''}
          <div class="p-5 space-y-3 bg-[var(--bg-card)]">
            <div class="flex items-center justify-between gap-2">
              <span class="px-2.5 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">${r.date}</span>
              <span class="text-[11px] text-[var(--text-muted)] font-semibold">${r.sentTo}</span>
            </div>
            <div class="font-extrabold text-base">${r.sessionTitle}</div>
            <div class="flex flex-wrap gap-1.5">
              ${r.tags.map(t => `<span class="px-2.5 py-0.5 rounded-full surface-soft text-[10px] font-extrabold">${t}</span>`).join('')}
            </div>
            ${renderRecapTemplateBody(r)}
            <div class="grid grid-cols-3 gap-2 pt-1">
              <label class="py-2.5 rounded-2xl surface-soft text-xs font-extrabold cursor-pointer text-center">+ Video<input type="file" accept="video/*,image/*" multiple onchange="attachVideosToRecap('${r.id}', this).then(() => openRecapViewerModal('${r.id}', 0))" class="hidden" /></label>
              <button onclick="copyRecapNote('${r.id}')" class="py-2.5 rounded-2xl surface-soft text-xs font-extrabold cursor-pointer">${uiIcon('copy')} Copy</button>
              <button onclick="closeModal()" class="py-2.5 rounded-2xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer">Done</button>
            </div>
          </div>
        </div>
      `, true);
    }

    function renderCoachVideo() {
      const vid = state.videos.find(v => v.id === state.selectedVideoId) || state.videos[0];
      if (!vid) return `<div class="card-white rounded-[28px] p-10 text-center space-y-2"><div class="text-base font-extrabold">No Practice Clips Yet</div><p class="text-xs text-[var(--text-muted)]">Clips uploaded by athletes or attached to session notes will appear here.</p></div>`;
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="space-y-3">
            ${state.videos.map(v => `
              <button onclick="state.selectedVideoId='${v.id}'; render();" class="w-full text-left p-4 rounded-[24px] border cursor-pointer ${v.id === vid.id ? 'bg-[#010101] text-white border-[#010101]' : 'card-white'}">
                <div class="flex justify-between items-center"><span class="font-extrabold text-xs">${v.athleteName}</span><span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${v.status === 'Reviewed' ? 'bg-[#D5FF5F] text-[#010101]' : 'bg-[#D6DFE2] text-[#010101]'}">${v.status}</span></div>
                <div class="text-xs font-semibold mt-1">${v.title}</div>
              </button>
            `).join('')}
          </div>
          <div class="lg:col-span-2 card-white rounded-[28px] overflow-hidden">
            <div class="relative h-56">
              <img src="${vid.img}" class="w-full h-full object-cover" / alt="Fastpitch softball training" loading="lazy" decoding="async">
              <div class="absolute inset-0 bg-[#010101]/45 flex flex-col items-center justify-center gap-2 text-white">
                <div class="w-14 h-14 rounded-full bg-[#D5FF5F] text-[#010101] flex items-center justify-center text-lg shadow-xl">▶</div>
                <div class="text-xs font-extrabold">Slow-Mo Mechanics Breakdown (${state.videoSpeed})</div>
              </div>
              <div class="absolute top-3 right-3 flex gap-1">
                ${['0.25x', '0.5x', '1x'].map(sp => `<button onclick="state.videoSpeed='${sp}'; render();" class="px-2.5 py-1 rounded-full text-[11px] font-extrabold cursor-pointer ${state.videoSpeed === sp ? 'bg-[#D5FF5F] text-[#010101]' : 'bg-[#010101]/70 text-white'}">${sp}</button>`).join('')}
              </div>
            </div>
            <div class="p-5 space-y-3">
              <div class="flex items-center justify-between"><h2 class="font-extrabold text-base">${vid.title}</h2><button onclick="markVideoReviewed('${vid.id}')" class="px-4 py-2 rounded-xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">${vid.status === 'Reviewed' ? 'Reviewed ✓' : 'Mark Reviewed'}</button></div>
              ${vid.cues.map(c => `<div class="surface-soft rounded-2xl p-3 flex items-start gap-2.5 text-xs"><span class="px-2 py-0.5 rounded-lg bg-[#010101] text-[#D5FF5F] font-mono font-extrabold">${c.time}</span><span>${c.note}</span></div>`).join('')}
              <form onsubmit="addVideoCue(event,'${vid.id}')" class="flex gap-2 pt-1"><input name="time" value="0:08" class="w-20 px-3 py-2.5 rounded-2xl surface-soft text-xs font-mono font-bold" required /><input name="note" class="flex-1 px-3.5 py-2.5 rounded-2xl surface-soft text-xs" placeholder="Add timestamped cue..." required /><button type="submit" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">Add</button></form>
            </div>
          </div>
        </div>
      `;
    }

    function renderCoachPayments() {
      const isUnpaid = (p) => p.status === 'Pending Cash' || p.status === 'Unpaid';
      const period = state.paymentFilterPeriod || 'all';
      const unpaidOnly = Boolean(state.paymentFilterUnpaid);
      const q = (state.paymentSearch || '').trim().toLowerCase();
      const todayIso = getTodayIsoEst();
      const todayMs = new Date(todayIso + 'T12:00:00').getTime();
      const monthPrefix = todayIso.slice(0, 7);

      const matchesPeriod = (p) => {
        if (period === 'all') return true;
        const iso = p.dateIso || parseFlexibleDateToIso(p.date);
        if (!iso) return false;
        if (period === 'month') return iso.startsWith(monthPrefix);
        if (period === 'week') {
          const ms = new Date(iso + 'T12:00:00').getTime();
          return (todayMs - ms) <= 7 * 86400000 && (todayMs - ms) >= -7 * 86400000;
        }
        return true;
      };

      const periodFiltered = state.payments.filter(matchesPeriod);
      const visiblePayments = periodFiltered.filter(p => {
        if (unpaidOnly && !isUnpaid(p)) return false;
        if (q) {
          const hay = `${p.family || ''} ${p.item || ''} ${p.method || ''} ${p.date || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const collected = periodFiltered.filter(p => !isUnpaid(p)).reduce((s, p) => s + Number(p.amount || 0), 0);
      const pendingCash = periodFiltered.filter(p => isUnpaid(p)).reduce((s, p) => s + Number(p.amount || 0), 0);
      const periodLabel = period === 'week' ? 'This Week' : period === 'month' ? 'This Month' : 'All Time';

      return `
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold">Payments</h1>
            <p class="text-[13px] text-[var(--text-muted)] mt-0.5">Clover Checkout, Cash, Venmo &amp; Zelle tracking</p>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="exportPaymentsCsv()" class="inline-flex items-center gap-1.5 px-3.5 py-2.5 rounded-2xl card-white text-[13px] font-extrabold cursor-pointer hover:border-[#010101]">${uiIcon('download', 'w-3.5 h-3.5')} Export CSV</button>
            <button onclick="openLogPaymentModal()" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-[13px] font-extrabold cursor-pointer shadow-sm hover:brightness-95">${uiIcon('plus', 'w-3.5 h-3.5')} Log Payment</button>
          </div>
        </div>

        <!-- Period & Unpaid Filters + Search -->
        <div class="card-mist rounded-[26px] p-3.5 space-y-2.5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              ${[
                { id: 'all', label: 'All Time' },
                { id: 'month', label: 'This Month' },
                { id: 'week', label: 'This Week' }
              ].map(tab => `
                <button type="button" onclick="state.paymentFilterPeriod='${tab.id}'; render(false);" class="px-3 py-1.5 rounded-full text-xs font-extrabold whitespace-nowrap cursor-pointer transition ${period === tab.id ? 'bg-[#010101] text-[#D5FF5F]' : 'card-white text-[var(--text-muted)]'}">${tab.label}</button>
              `).join('')}
              <button type="button" onclick="state.paymentFilterUnpaid=!state.paymentFilterUnpaid; render(false);" class="px-3 py-1.5 rounded-full text-xs font-extrabold whitespace-nowrap cursor-pointer transition ${unpaidOnly ? 'bg-amber-400 text-[#010101]' : 'card-white text-[var(--text-muted)]'}">Unpaid Only</button>
            </div>
            <input
              type="search"
              value="${(state.paymentSearch || '').replace(/"/g, '&quot;')}"
              oninput="state.paymentSearch=this.value; render(false);"
              placeholder="Search family or athlete…"
              class="w-full sm:w-56 px-3.5 py-1.5 rounded-xl card-white text-xs font-semibold"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="card-mist rounded-[24px] p-5 space-y-1.5">
            <div class="inline-flex items-center gap-1.5 text-[13px] font-bold text-[var(--text-muted)]">${uiIcon('cash', 'w-4 h-4 text-[#4E6075] dark:text-[#9AC0D6]')} Collected (${periodLabel})</div>
            <div class="text-3xl font-extrabold tabular-nums">$${collected.toLocaleString()}</div>
            <div class="text-xs text-[var(--text-muted)]">Card, Apple Pay, Cash, Venmo &amp; Zelle</div>
          </div>
          <div class="card-white rounded-[24px] p-5 space-y-1.5">
            <div class="inline-flex items-center gap-1.5 text-[13px] font-bold text-[var(--text-muted)]">${uiIcon('clock', 'w-4 h-4 text-amber-600 dark:text-amber-400')} Unpaid / Pending (${periodLabel})</div>
            <div class="text-3xl font-extrabold tabular-nums">$${pendingCash.toLocaleString()}</div>
            <div class="text-xs text-[var(--text-muted)]">${pendingCash > 0 ? 'Tap Paid ✓ to pick method, or Remind to copy text' : 'No unpaid sessions in this period'}</div>
          </div>
        </div>

        <div class="card-white rounded-[28px] overflow-hidden">
          <div class="px-5 py-4 flex justify-between items-center border-b border-[var(--border-subtle)]">
            <h2 class="text-base font-extrabold">${unpaidOnly ? 'Unpaid Transactions' : 'Transactions'}</h2>
            <span class="text-[13px] font-semibold text-[var(--text-muted)] tabular-nums">${visiblePayments.length} ${visiblePayments.length === 1 ? 'entry' : 'entries'}</span>
          </div>
          ${visiblePayments.length ? `
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-[var(--border-subtle)] bg-white/40 dark:bg-white/5 text-[13px] font-bold text-[var(--text-muted)]">
                    <th class="py-3 pl-5 pr-3">Family / Lesson</th>
                    <th class="py-3 px-3 whitespace-nowrap hidden md:table-cell">Date &amp; Time</th>
                    <th class="py-3 px-3 whitespace-nowrap hidden sm:table-cell">Method</th>
                    <th class="py-3 px-3 whitespace-nowrap">Status</th>
                    <th class="py-3 px-3 text-right whitespace-nowrap">Amount</th>
                    <th class="py-3 pl-3 pr-5 text-right whitespace-nowrap">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[var(--border-subtle)] text-xs">
                  ${visiblePayments.map(p => {
                    const unpaid = isUnpaid(p);
                    const hasNotes = Boolean((p.internalNote || '').trim() || (p.externalNote || '').trim());
                    const escP = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const tsText = formatPaymentTimestamp(p);
                    return `
                      <tr class="hover:bg-white/40 dark:hover:bg-white/5 transition align-top">
                        <td class="py-3.5 pl-5 pr-3">
                          <div class="font-extrabold text-[13px]">${escP(p.family)}</div>
                          <div class="text-[var(--text-muted)]">${escP(p.item)}</div>
                          <div class="md:hidden text-[11px] text-[var(--text-muted)] mt-0.5">${escP(tsText)} <span class="sm:hidden">• ${escP(p.method)}</span></div>
                          ${hasNotes ? `
                            <div class="mt-1.5 space-y-1 text-[11px]">
                              ${p.externalNote ? `<div class="flex items-start gap-1.5"><span class="px-1.5 py-0.5 rounded bg-[#D5FF5F]/70 text-[#010101] text-[9px] font-extrabold shrink-0">EXTERNAL</span><span class="font-medium">${escP(p.externalNote)}</span></div>` : ''}
                              ${p.internalNote ? `<div class="flex items-start gap-1.5"><span class="px-1.5 py-0.5 rounded bg-[#010101]/10 dark:bg-white/15 text-[var(--text-muted)] text-[9px] font-extrabold shrink-0">INTERNAL</span><span class="text-[var(--text-muted)]">${escP(p.internalNote)}</span></div>` : ''}
                            </div>
                          ` : ''}
                        </td>
                        <td class="py-3.5 px-3 whitespace-nowrap hidden md:table-cell text-[var(--text-muted)] font-medium">
                          ${escP(tsText)}
                        </td>
                        <td class="py-3.5 px-3 whitespace-nowrap hidden sm:table-cell">
                          <span class="px-2.5 py-1 rounded-full surface-soft text-[11px] font-bold">${escP(p.method)}</span>
                        </td>
                        <td class="py-3.5 px-3 whitespace-nowrap">
                          <div class="inline-flex items-center rounded-xl p-0.5 surface-soft">
                            <button type="button" onclick="setPaymentPaidStatus('${p.id}', true)" class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold cursor-pointer transition ${!unpaid ? 'bg-[#D5FF5F] text-[#010101]' : 'text-[var(--text-muted)] hover:text-[var(--text-main)]'}">
                              Paid ✓
                            </button>
                            <button type="button" onclick="setPaymentPaidStatus('${p.id}', false)" class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold cursor-pointer transition ${unpaid ? 'bg-[#010101] text-[#D5FF5F]' : 'text-[var(--text-muted)] hover:text-[var(--text-main)]'}">
                              Unpaid
                            </button>
                          </div>
                        </td>
                        <td class="py-3.5 px-3 text-right whitespace-nowrap font-extrabold tabular-nums text-[13px]">
                          ${unpaid ? '' : '+'}$${p.amount}
                        </td>
                        <td class="py-3.5 pl-3 pr-5 text-right whitespace-nowrap">
                          <div class="inline-flex items-center gap-1.5">
                            <button type="button" onclick="openPaymentNotesModal('${p.id}')" title="Add / edit internal &amp; external notes" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-[10px] font-extrabold cursor-pointer transition ${hasNotes ? 'bg-[#010101] text-[#D5FF5F]' : 'surface-soft text-[var(--text-muted)] hover:text-[var(--text-main)]'}">${uiIcon('note', 'w-3 h-3')} ${hasNotes ? 'Notes' : '+ Note'}</button>
                            ${unpaid ? `<button type="button" onclick="copyPaymentReminder('${p.id}')" title="Copy payment reminder" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl surface-soft text-[10px] font-extrabold text-[#4E6075] dark:text-[#9AC0D6] cursor-pointer hover:border-[#010101]">${uiIcon('bell', 'w-3 h-3')} Remind</button>` : ''}
                            <button type="button" onclick="deletePayment('${p.id}')" title="Delete transaction" aria-label="Delete transaction" class="w-7 h-7 rounded-xl surface-soft text-red-600 dark:text-red-400 hover:bg-red-500/10 inline-flex items-center justify-center cursor-pointer transition">${uiIcon('trash', 'w-3.5 h-3.5')}</button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          ` : `<div class="p-8 text-center text-xs text-[var(--text-muted)]">No transactions match this filter.</div>`}
        </div>
      `;
    }

    const COACH_QUICK_REPLIES = [
      'Running 10 min behind in the cage — see you shortly!',
      'Great work today! Session notes & video are up.',
      'Want to grab the same slot next week?',
      'Friendly reminder: session payment is due whenever you get a chance.'
    ];

    function findAthleteForThread(t) {
      if (!t) return null;
      const athText = String(t.athletes || '').toLowerCase();
      const parText = String(t.parent || '').toLowerCase();
      return state.athletes.find(a =>
        (a.name && athText.includes(a.name.toLowerCase())) ||
        (a.parentName && a.parentName.toLowerCase() === parText)
      ) || null;
    }

    function openNewMessageModal() {
      const activeAthletes = state.athletes.filter(a => !a.archived);
      const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      openModal(`
        <div class="flex items-start justify-between gap-2">
          <div>
            <div class="inline-flex items-center gap-1.5 text-xs font-bold text-[#4E6075] dark:text-[#9AC0D6]">${uiIcon('send', 'w-3.5 h-3.5')} New Message</div>
            <h3 class="font-extrabold text-base mt-0.5">Message an Athlete / Family</h3>
          </div>
          <button type="button" onclick="closeModal()" aria-label="Close" class="w-9 h-9 rounded-full surface-soft text-xs font-bold cursor-pointer">✕</button>
        </div>

        <form onsubmit="submitNewMessage(event)" class="space-y-3 text-xs">
          <div>
            <label class="block font-bold text-[var(--text-muted)] mb-1">Select Athlete / Family *</label>
            <select name="athleteId" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-bold text-sm" required>
              ${activeAthletes.length
                ? activeAthletes.map(a => `<option value="${a.id}">${esc(a.name)}${a.parentName ? ` (${esc(a.parentName)})` : ''}</option>`).join('')
                : `<option value="">No active athletes yet</option>`}
            </select>
          </div>
          <div class="space-y-1.5">
            <label class="block font-bold text-[var(--text-muted)]">Quick Templates (Tap to fill)</label>
            <div class="flex flex-wrap gap-1.5">
              ${COACH_QUICK_REPLIES.map(q => `<button type="button" onclick="const el=document.getElementById('new-msg-body'); if(el){el.value='${q.replace(/'/g, "\\'")}'; el.focus();}" class="px-2.5 py-1 rounded-full surface-soft text-[11px] font-bold cursor-pointer hover:bg-[#D5FF5F] hover:text-[#010101]">${q.slice(0, 32)}…</button>`).join('')}
            </div>
            <textarea id="new-msg-body" name="text" rows="3" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft text-sm leading-snug" placeholder="Write your message..." required></textarea>
          </div>
          <button type="submit" class="w-full py-3 rounded-2xl bg-[#D5FF5F] text-[#010101] text-sm font-extrabold cursor-pointer shadow-sm hover:brightness-95 inline-flex items-center justify-center gap-2">${uiIcon('send', 'w-4 h-4')} Send Message</button>
        </form>
      `);
    }

    function submitNewMessage(e) {
      e.preventDefault();
      const athId = e.target.athleteId?.value;
      const text = (e.target.text?.value || '').trim();
      const ath = state.athletes.find(a => a.id === athId);
      if (!ath || !text) return;
      const parentKey = ath.parentName || ath.name;
      const nowTime = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      let thread = state.threads.find(t => t.parent === parentKey || (t.athletes || '').includes(ath.name));
      if (!thread) {
        thread = { id: 'msg-' + Date.now(), parent: parentKey, athletes: ath.name, unread: 0, messages: [], _modifiedAt: Date.now() };
        state.threads.unshift(thread);
      }
      thread.messages.push({ from: 'coach', time: nowTime, text });
      thread._modifiedAt = Date.now();
      state.activeThreadId = thread.id;
      state.mobileMsgOpen = true;
      closeModal();
      render();
      showToast(`Message sent to ${parentKey}!`);
    }

    function openBroadcastModal() {
      const todayIso = getTodayIsoEst();
      const todayAthIds = new Set(state.sessions.filter(s => s.status !== 'Canceled' && s.dateIso === todayIso).flatMap(s => [s.athleteId, ...(s.athleteIds || [])]).filter(Boolean));
      const days7 = new Set(getRolling7Days().map(d => d.iso));
      const weekAthIds = new Set(state.sessions.filter(s => s.status !== 'Canceled' && days7.has(s.dateIso)).flatMap(s => [s.athleteId, ...(s.athleteIds || [])]).filter(Boolean));
      const activeCount = state.athletes.filter(a => !a.archived).length;
      const presets = [
        'Running 10 minutes behind in the cage today — thank you for your patience!',
        'Weather / facility update: lessons are still ON as scheduled today.',
        'I have an open cage slot today! Reply if you want to grab it.'
      ];
      openModal(`
        <div class="flex items-start justify-between gap-2">
          <div>
            <div class="inline-flex items-center gap-1.5 text-xs font-bold text-[#4E6075] dark:text-[#9AC0D6]">${uiIcon('bell', 'w-3.5 h-3.5')} Group Broadcast</div>
            <h3 class="font-extrabold text-base mt-0.5">Send Update to Multiple Families</h3>
          </div>
          <button type="button" onclick="closeModal()" aria-label="Close" class="w-9 h-9 rounded-full surface-soft text-xs font-bold cursor-pointer">✕</button>
        </div>

        <form onsubmit="submitBroadcastMessage(event)" class="space-y-3 text-xs">
          <div>
            <label class="block font-bold text-[var(--text-muted)] mb-1">Recipients</label>
            <select name="audience" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-bold text-sm">
              <option value="today">Today’s Booked Families (${todayAthIds.size})</option>
              <option value="week">This Week’s Booked Families (${weekAthIds.size})</option>
              <option value="all">All Active Families (${activeCount})</option>
            </select>
          </div>
          <div class="space-y-1.5">
            <label class="block font-bold text-[var(--text-muted)]">Quick Presets</label>
            <div class="flex flex-wrap gap-1.5">
              ${presets.map(p => `<button type="button" onclick="const el=document.getElementById('broadcast-body'); if(el){el.value='${p.replace(/'/g, "\\'")}'; el.focus();}" class="px-2.5 py-1 rounded-full surface-soft text-[11px] font-bold cursor-pointer hover:bg-[#D5FF5F] hover:text-[#010101]">${p.slice(0, 34)}…</button>`).join('')}
            </div>
            <textarea id="broadcast-body" name="text" rows="3" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft text-sm leading-snug" placeholder="Write your announcement..." required></textarea>
          </div>
          <button type="submit" class="w-full py-3 rounded-2xl bg-[#D5FF5F] text-[#010101] text-sm font-extrabold cursor-pointer shadow-sm hover:brightness-95 inline-flex items-center justify-center gap-2">${uiIcon('bell', 'w-4 h-4')} Send Broadcast</button>
        </form>
      `);
    }

    function submitBroadcastMessage(e) {
      e.preventDefault();
      const audience = e.target.audience?.value || 'today';
      const text = (e.target.text?.value || '').trim();
      if (!text) return;

      const todayIso = getTodayIsoEst();
      const days7 = new Set(getRolling7Days().map(d => d.iso));
      let targets = [];
      if (audience === 'today') {
        const ids = new Set(state.sessions.filter(s => s.status !== 'Canceled' && s.dateIso === todayIso).flatMap(s => [s.athleteId, ...(s.athleteIds || [])]).filter(Boolean));
        targets = state.athletes.filter(a => !a.archived && ids.has(a.id));
      } else if (audience === 'week') {
        const ids = new Set(state.sessions.filter(s => s.status !== 'Canceled' && days7.has(s.dateIso)).flatMap(s => [s.athleteId, ...(s.athleteIds || [])]).filter(Boolean));
        targets = state.athletes.filter(a => !a.archived && ids.has(a.id));
      } else {
        targets = state.athletes.filter(a => !a.archived);
      }

      if (!targets.length) {
        showToast('No families in that group right now.');
        return;
      }

      const nowTime = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      const seenParents = new Set();
      let sent = 0;
      targets.forEach((ath, idx) => {
        const parentKey = ath.parentName || ath.name;
        if (seenParents.has(parentKey)) return;
        seenParents.add(parentKey);
        let thread = state.threads.find(t => t.parent === parentKey);
        if (!thread) {
          thread = { id: 'msg-' + (Date.now() + idx), parent: parentKey, athletes: ath.name, unread: 0, messages: [], _modifiedAt: Date.now() };
          state.threads.unshift(thread);
        }
        thread.messages.push({ from: 'coach', time: nowTime, text });
        thread._modifiedAt = Date.now();
        sent++;
      });

      closeModal();
      render();
      showToast(`Broadcast sent to ${sent} ${sent === 1 ? 'family' : 'families'}!`);
    }

    function insertQuickReply(text) {
      const inp = document.getElementById('coach-reply-input');
      if (!inp) return;
      inp.value = text;
      inp.focus();
    }

    function markThreadUnread(id) {
      const t = state.threads.find(x => x.id === id);
      if (!t) return;
      t.unread = Math.max(1, Number(t.unread) || 1);
      t._modifiedAt = Date.now();
      state.mobileMsgOpen = false;
      render();
      showToast(`Marked ${t.parent} as unread.`);
    }

    function closeMobileThread() {
      state.mobileMsgOpen = false;
      render(false);
    }

    function renderCoachMessaging() {
      const q = (state.msgSearch || '').trim().toLowerCase();
      const unreadOnly = Boolean(state.msgUnreadOnly);
      const totalUnread = state.threads.reduce((s, t) => s + (Number(t.unread) || 0), 0);
      const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      const filteredThreads = state.threads.filter(t => {
        if (unreadOnly && !(Number(t.unread) > 0)) return false;
        if (q) {
          const lastMsg = t.messages?.[t.messages.length - 1]?.text || '';
          const hay = `${t.parent || ''} ${t.athletes || ''} ${lastMsg}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const thread = state.threads.find(t => t.id === state.activeThreadId) || filteredThreads[0] || state.threads[0] || null;
      const mobileShowingChat = Boolean(state.mobileMsgOpen && thread);
      const linkedAth = thread ? findAthleteForThread(thread) : null;
      const phone = linkedAth?.parentPhone || linkedAth?.playerPhone || '';
      const todayIso = getTodayIsoEst();
      const nextSes = linkedAth
        ? state.sessions.find(s => s.status !== 'Canceled' && (s.athleteId === linkedAth.id || (s.athletes || []).includes(linkedAth.name)) && (!s.dateIso || s.dateIso >= todayIso))
        : null;

      return `
        <!-- Header + Quick Actions -->
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold">Messages</h1>
            <p class="text-[13px] text-[var(--text-muted)] mt-0.5">${state.threads.length} ${state.threads.length === 1 ? 'conversation' : 'conversations'}${totalUnread ? ` • ${totalUnread} unread` : ''}</p>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="openBroadcastModal()" class="inline-flex items-center gap-1.5 px-3.5 py-2.5 rounded-2xl card-white text-xs sm:text-[13px] font-extrabold cursor-pointer hover:border-[#010101]">${uiIcon('bell', 'w-3.5 h-3.5')} Broadcast</button>
            <button type="button" onclick="openNewMessageModal()" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs sm:text-[13px] font-extrabold cursor-pointer shadow-sm hover:brightness-95">${uiIcon('plus', 'w-3.5 h-3.5')} New Message</button>
          </div>
        </div>

        ${state.threads.length === 0 ? `
          <div class="card-white rounded-[28px] p-10 text-center space-y-3">
            <div class="w-12 h-12 rounded-2xl bg-[#010101] text-[#D5FF5F] mx-auto flex items-center justify-center">${uiIcon('send', 'w-5 h-5')}</div>
            <div class="text-base font-extrabold">No Messages Yet</div>
            <p class="text-xs text-[var(--text-muted)] max-w-sm mx-auto">Start a conversation with any family, send a group broadcast, or messages will appear here automatically when you send session notes.</p>
            <div class="flex items-center justify-center gap-2 pt-1">
              <button type="button" onclick="openNewMessageModal()" class="px-5 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer shadow-sm">+ Start Conversation</button>
            </div>
          </div>
        ` : `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- Left: Inbox List (Hidden on mobile when a conversation is open) -->
            <div class="lg:col-span-4 space-y-3 ${mobileShowingChat ? 'hidden lg:block' : ''}">
              <div class="card-mist rounded-[24px] p-3 space-y-2">
                <input
                  type="search"
                  value="${(state.msgSearch || '').replace(/"/g, '&quot;')}"
                  oninput="state.msgSearch=this.value; render(false);"
                  placeholder="Search families or messages…"
                  class="w-full px-3.5 py-2 rounded-xl card-white text-xs font-medium"
                />
                <div class="flex items-center gap-1.5">
                  <button type="button" onclick="state.msgUnreadOnly=false; render(false);" class="px-3 py-1 rounded-full text-[11px] font-extrabold cursor-pointer transition ${!unreadOnly ? 'bg-[#010101] text-[#D5FF5F]' : 'card-white text-[var(--text-muted)]'}">All (${state.threads.length})</button>
                  <button type="button" onclick="state.msgUnreadOnly=true; render(false);" class="px-3 py-1 rounded-full text-[11px] font-extrabold cursor-pointer transition ${unreadOnly ? 'bg-[#010101] text-[#D5FF5F]' : 'card-white text-[var(--text-muted)]'}">Unread (${totalUnread})</button>
                </div>
              </div>

              <div class="space-y-2 max-h-[65dvh] overflow-y-auto pr-0.5">
                ${filteredThreads.length ? filteredThreads.map(t => {
                  const isActive = thread && t.id === thread.id;
                  const last = t.messages?.[t.messages.length - 1];
                  const initials = String(t.parent || 'F').split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase() || 'GF';
                  return `
                    <button type="button" onclick="openThread('${t.id}')" class="w-full text-left p-3.5 rounded-[22px] border transition cursor-pointer flex items-start gap-3 ${isActive ? 'bg-[#010101] text-white border-[#010101] shadow-md' : 'card-white hover:border-[#010101]'}">
                      <div class="w-10 h-10 rounded-xl ${isActive ? 'bg-[#D5FF5F] text-[#010101]' : 'surface-soft text-[var(--text-main)]'} font-extrabold text-xs flex items-center justify-center shrink-0">${esc(initials)}</div>
                      <div class="min-w-0 flex-1">
                        <div class="flex items-center justify-between gap-2">
                          <span class="font-extrabold text-xs truncate">${esc(t.parent)}</span>
                          <span class="text-[10px] shrink-0 ${isActive ? 'text-white/70' : 'text-[var(--text-muted)]'}">${esc(last?.time || '')}</span>
                        </div>
                        <div class="text-[11px] truncate ${isActive ? 'text-[#D5FF5F]' : 'text-[#4E6075] dark:text-[#9AC0D6]'} font-semibold">${esc(t.athletes || '')}</div>
                        <div class="flex items-center justify-between gap-2 mt-0.5">
                          <span class="text-[11px] truncate ${isActive ? 'text-white/75' : 'text-[var(--text-muted)]'}">${esc(last ? (last.from === 'coach' ? 'You: ' : '') + last.text.replace(/\n/g, ' ') : 'No messages yet')}</span>
                          ${t.unread ? `<span class="px-1.5 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[9px] font-extrabold shrink-0">${t.unread}</span>` : ''}
                        </div>
                      </div>
                    </button>
                  `;
                }).join('') : `<div class="card-white rounded-2xl p-6 text-center text-xs text-[var(--text-muted)]">No conversations match this filter.</div>`}
              </div>
            </div>

            <!-- Right: Active Conversation View -->
            ${thread ? `
              <div class="lg:col-span-8 card-white rounded-[28px] overflow-hidden flex flex-col ${!mobileShowingChat ? 'hidden lg:flex' : 'flex'}">
                <!-- Thread Context Header -->
                <div class="p-4 sm:p-5 border-b border-[var(--border-subtle)] flex flex-wrap items-center justify-between gap-2.5">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <button type="button" onclick="closeMobileThread()" class="lg:hidden px-2.5 py-1.5 rounded-xl surface-soft text-xs font-extrabold cursor-pointer shrink-0">← Inbox</button>
                    <div class="min-w-0">
                      <div class="font-extrabold text-sm truncate">${esc(thread.parent)}</div>
                      <div class="text-[11px] text-[var(--text-muted)] truncate">
                        ${esc(thread.athletes || '')}${nextSes ? ` • Next: ${esc(nextSes.day)} ${esc(nextSes.time)}` : ''}
                      </div>
                    </div>
                  </div>
                  <div class="flex items-center gap-1.5 flex-wrap shrink-0">
                    ${phone ? `
                      <a href="sms:${esc(phone)}" class="px-2.5 py-1.5 rounded-xl surface-soft text-[11px] font-extrabold hover:border-[#010101]">SMS</a>
                      <a href="tel:${esc(phone)}" class="px-2.5 py-1.5 rounded-xl surface-soft text-[11px] font-extrabold hover:border-[#010101]">Call</a>
                    ` : ''}
                    ${linkedAth ? `
                      <button type="button" onclick="openAddSessionForAthleteModal('${linkedAth.id}')" class="px-2.5 py-1.5 rounded-xl surface-soft text-[11px] font-extrabold cursor-pointer hover:border-[#010101]">+ Book</button>
                      <button type="button" onclick="jumpToAthlete('${linkedAth.id}')" class="px-2.5 py-1.5 rounded-xl surface-soft text-[11px] font-extrabold cursor-pointer hover:border-[#010101]">Profile</button>
                    ` : ''}
                    <button type="button" onclick="markThreadUnread('${thread.id}')" title="Mark Unread" class="px-2.5 py-1.5 rounded-xl surface-soft text-[11px] font-bold text-[var(--text-muted)] cursor-pointer hover:text-[var(--text-main)]">Unread</button>
                  </div>
                </div>

                <!-- Messages Feed -->
                <div class="p-4 sm:p-5 space-y-3 max-h-[50dvh] overflow-y-auto flex-1">
                  ${thread.messages.map(m => `
                    <div class="flex flex-col ${m.from === 'coach' ? 'items-end' : 'items-start'}">

      if (!confirmed) {
        openDoubleConfirmModal({
          tag: 'Cancel Session',
          title: `Cancel ${s.lessonTitle || s.focus || 'your session'}?`,
          detail: `Scheduled for ${s.day || s.dateIso} at ${s.time}. Confirm to notify Coach Gina and reopen this slot.`,
          step1Label: 'Continue to Cancel',
          step2Title: 'Final Confirmation — Cancel Session',
          step2Detail: 'Tap below to confirm canceling this scheduled session.',

        });

      s.status = 'Canceled';
      s._modifiedAt = Date.now();

    function bookSlot(slotId, payMode) {
      const slot = state.openSlots.find(s => s.id === slotId), ath = state.athletes.find(a => a.id === state.activeSiblingId);

      else state.payments.unshift({ id: 'p' + Date.now(), date: 'Today', family: 'Miller Family', item: slot.focus, amount: slot.price, method: 'Clover • Apple Pay' });
      state.sessions.unshift({ id: 's' + Date.now(), dayKey: slot.dayKey, day: slot.day, time: slot.time, duration: slot.duration, type: slot.type, focus: slot.focus, athletes: [ath.name], athleteId: ath.id, spotsMax: slot.spotsMax, status: 'Confirmed', payment: payMode === 'credit' ? '1 Credit' : `Paid ($${slot.price})`, price: slot.price, img: slot.img });
      state.parentTab = 'home'; render(); showToast(`Booked ${slot.focus}!`);
    }

    function setPaymentPaidStatus(payId, isPaid, selectedMethod = null) {
      const p = state.payments.find(x => x.id === payId);
      if (!p) return;
      const wasPaid = p.status !== 'Pending Cash' && p.status !== 'Unpaid';
      if (wasPaid === Boolean(isPaid) && !selectedMethod) return;

      // When marking Paid without a chosen method, prompt Coach Gina to pick Cash / Venmo / Zelle / Clover
      if (isPaid && !selectedMethod) {
        openMarkPaidMethodModal(payId);
        return;
      }

      p.status = isPaid ? 'Paid' : 'Pending Cash';
      p.paidAt = isPaid ? Date.now() : null;
      if (!p.createdAt) p.createdAt = p._modifiedAt || Date.now();
      if (isPaid && selectedMethod) {
        p.method = selectedMethod;
        const extEl = document.getElementById('mark-paid-ext-note');
        const intEl = document.getElementById('mark-paid-int-note');
        if (extEl) p.externalNote = extEl.value.trim();
        if (intEl) p.internalNote = intEl.value.trim();
      } else if (!isPaid && /cash/i.test(p.method || '')) {
        p.method = 'Cash at Session';
      }
      p._modifiedAt = Date.now();
      if (selectedMethod) closeModal();
      render();
      showToast(isPaid
        ? `Marked $${p.amount} Paid via ${p.method} ✓ (${p.family})`
        : `Marked $${p.amount} as Unpaid (${p.family})`);
    }
    function markCashPaid(payId) {
      setPaymentPaidStatus(payId, true);
    }
    function deletePayment(payId, confirmed = false) {
      const p = state.payments.find(x => x.id === payId);

      if (!confirmed) {
        openDoubleConfirmModal({
          tag: 'Delete Transaction',
          title: `Delete $${p.amount} transaction for ${p.family}?`,
          detail: `${p.item} (${p.date} • ${p.method}). Deleting this will remove it from your Payments history and totals across all synced devices.`,
          step1Label: 'Continue to Delete',
          step2Title: 'Final Confirmation — Delete Transaction',
          step2Detail: `This cannot be undone. Confirm one more time to permanently delete this $${p.amount} entry.`,
          step2Label: 'Yes, Delete Transaction',
          onConfirm: () => deletePayment(payId, true)
        });
        return;
      }
      recordDeletedId('payments', payId);
      state.payments = state.payments.filter(x => x.id !== payId);
      render();
      showToast(`Deleted $${p.amount} transaction (${p.family}).`);
    }

    function submitQuickAddSession(e) {
      e.preventDefault();
      const f = e.target;
      let athId = f.athleteId ? (f.athleteId.value || null) : null;
      const extraIds = Array.from(f.querySelectorAll('input[name="extraAthleteIds"]:checked')).map(el => el.value);
      if (!athId && f.newAthleteName && f.newAthleteName.value.trim()) {
        const name = f.newAthleteName.value.trim();
        const parts = name.split(/\s+/);
        const initials = ((parts[0]?.[0] || '') + (parts[1]?.[0] || parts[0]?.[1] || '')).toUpperCase() || 'EF';
        athId = 'ath-' + Date.now();
        state.athletes.unshift({
          id: athId,
          initials,
          name,
          familyId: 'fam-' + Date.now(),
          parentName: '',
          parentPhone: '',
          ageGroup: '',
          gradYear: '',
          position: '',
          batsThrows: '',
          team: '',
          height: '',
          streakDays: 0,
          weeklyReps: 0,
          weeklyDuration: '',
          waiverSigned: false,
          waiverDate: null,
          emergencyContact: '',
          medicalNotes: '',
          pitches: [],
          notes: [],
          drills: [],
          _modifiedAt: Date.now()

          cal: state.cal
        }, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `gfuchs-elite-backup-${getTodayIsoEst()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Backup JSON downloaded!');
      } catch (_) {
        showToast('Unable to export backup on this browser.');
      }
    }

    function saveLocation(e, editId = '') {
      e.preventDefault();
      if (!Array.isArray(state.cal.locations)) state.cal.locations = [];
      const f = e.target;
      const payload = {
        name: f.name.value.trim(),
        address: f.address.value.trim(),
        notes: f.notes.value.trim()
      };
      if (!payload.name) return;
      if (editId) {
        const idx = state.cal.locations.findIndex(l => l.id === editId);
        if (idx >= 0) state.cal.locations[idx] = { ...state.cal.locations[idx], ...payload, _modifiedAt: Date.now() };
      } else {
        state.cal.locations.push({ id: 'loc-' + Date.now(), ...payload, _modifiedAt: Date.now() });
      }
      closeModal();
      render();
      showToast(editId ? `Updated "${payload.name}"!` : `Added "${payload.name}" to Facility Locations!`);
    }

      if (!Array.isArray(state.cal.locations)) return;
      const loc = state.cal.locations.find(l => l.id === id);
      if (!confirmed) {
        openDoubleConfirmModal({
          tag: 'Delete Location',
          title: `Remove "${loc?.name || 'this location'}"?`,
          detail: 'This removes the facility location from your Settings list across all devices.',
          step1Label: 'Continue to Delete',
          step2Title: 'Final Confirmation — Delete Location',
          step2Detail: `Confirm one more time to permanently remove "${loc?.name || 'this location'}".`,
          step2Label: 'Yes, Delete Location',
          onConfirm: () => deleteLocation(id, true)

        return;

      recordDeletedId('locations', id);
      state.cal.locations = state.cal.locations.filter(l => l.id !== id);
      render();
      showToast('Facility location removed.');
    }
