  <style>
    :root {
      /* Exact Brand System */
      --volt: #D5FF5F;
      --obsidian: #010101;
      --mist: #D6DFE2;
      --white: #FFFFFF;
      --slate-blue: #4E6075;
      --sky-blue: #9AC0D6;
      --charcoal: #595959;
      --mid-gray: #9F9F9F;

      /* Apple Liquid Glass — Light Mode */
      --bg-page: #DDE6EA;
      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.48) 100%);
      --glass-mist: linear-gradient(135deg, rgba(226, 234, 238, 0.84) 0%, rgba(182, 208, 224, 0.42) 100%);
      --glass-soft: rgba(255, 255, 255, 0.54);
      --glass-dock: linear-gradient(180deg, rgba(255, 255, 255, 0.84) 0%, rgba(255, 255, 255, 0.64) 100%);
      --glass-border: rgba(255, 255, 255, 0.82);
      --glass-border-outer: rgba(78, 96, 117, 0.14);
      --glass-specular: inset 0 1.5px 1px rgba(255, 255, 255, 0.94), inset 0 -1px 1px rgba(78, 96, 117, 0.08);
      --glass-shadow: 0 14px 36px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(15, 23, 42, 0.04);
      --border-subtle: rgba(78, 96, 117, 0.16);
      --text-main: #010101;
      --text-muted: #4A5562;
      --text-soft: #64707D;
      --bg-card: rgba(255, 255, 255, 0.78);
      --bg-elevated: rgba(255, 255, 255, 0.56);
    }

    html.dark {
      /* Apple Liquid Glass — Dark Mode */
      --bg-page: #07090C;
      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.04) 100%);
      --glass-mist: linear-gradient(135deg, rgba(78, 96, 117, 0.34) 0%, rgba(154, 192, 214, 0.12) 100%);
      --glass-soft: rgba(255, 255, 255, 0.07);
      --glass-dock: linear-gradient(180deg, rgba(28, 34, 42, 0.80) 0%, rgba(16, 20, 25, 0.68) 100%);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-border-outer: rgba(255, 255, 255, 0.10);
      --glass-specular: inset 0 1px 1px rgba(255, 255, 255, 0.28), inset 0 -1px 1px rgba(0, 0, 0, 0.35);
      --glass-shadow: 0 18px 44px rgba(0, 0, 0, 0.48), 0 2px 10px rgba(0, 0, 0, 0.32);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --text-main: #FFFFFF;
      --text-muted: #C2CBD3;
      --text-soft: #8F99A3;
      --bg-card: rgba(20, 25, 31, 0.76);
      --bg-elevated: rgba(255, 255, 255, 0.08);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Accessible Focus Rings & Native Tactile Tap Feedback */
    button, a[href], input, select, textarea, [tabindex] {
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid #010101;
      outline-offset: 2px;
    }
    html.dark button:focus-visible, html.dark a:focus-visible, html.dark input:focus-visible, html.dark select:focus-visible, html.dark textarea:focus-visible {
      outline-color: #D5FF5F;
    }
    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    /* iOS Safe-Area-Aware Mobile Header & Bottom Dock */
    .mobile-header-wrap {
      position: sticky;
      top: 0;
      z-index: 30;
      padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
      padding-left: 12px;
      padding-right: 12px;
      padding-bottom: 6px;
      background: linear-gradient(180deg, var(--bg-page) 0%, rgba(221, 230, 234, 0.86) 66%, rgba(221, 230, 234, 0) 100%);
    }
    html.dark .mobile-header-wrap {
      background: linear-gradient(180deg, var(--bg-page) 0%, rgba(7, 9, 12, 0.88) 66%, rgba(7, 9, 12, 0) 100%);
    }
    .mobile-dock-safe {
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    }
    .mobile-main-safe {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 108px);
    }

    /* Ambient Luminous Mesh Behind Liquid Glass */
    .liquid-ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .liquid-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(90px);
      opacity: 0.36;
    }
    html.dark .liquid-orb { opacity: 0.28; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* True Multi-Layered Apple Liquid Glass Materials */
    .card-white {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(195%);
      -webkit-backdrop-filter: blur(28px) saturate(195%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), var(--glass-shadow);
    }

    .card-mist {
      background: var(--glass-mist);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), var(--glass-shadow);
    }

    .surface-soft {
      background: var(--glass-soft);
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }
    html.dark .surface-soft {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .glass-dock {
      background: var(--glass-dock);
      backdrop-filter: blur(36px) saturate(220%);
      -webkit-backdrop-filter: blur(36px) saturate(220%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), 0 16px 42px rgba(1, 1, 1, 0.16);
    }

    .glass-pill-hero {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .modal-backdrop {
      background: rgba(7, 10, 14, 0.45);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
    }

    html, body {
      overscroll-behavior-y: contain;
    }

    @keyframes ptrSpin {
      to { transform: rotate(360deg); }
    }
    .ptr-spinning {
      animation: ptrSpin 0.75s linear infinite;
    }
    #ptr-indicator {
      top: env(safe-area-inset-top, 0px);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    }
    #ptr-indicator.dragging {
      transition: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    // =========================================================================
    // CAL.COM-STYLE BOOKING ENGINE (3-Column Calendar + Slots + Details + .ICS)
    // =========================================================================
    function calFormatTime(hhmm) {
      if (state.cal.timeFormat === '24h') return hhmm;
      const [hStr, m] = hhmm.split(':');
      const h = parseInt(hStr, 10);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${h12}:${m} ${ampm}`;
    }

    function calDateLabel(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function timeToMins(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function minsToTime(mins) {
      const h = String(Math.floor(mins / 60)).padStart(2, '0');
      const m = String(mins % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    function calGetSlotsForDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const dow = dt.getDay(); // 0=Sun..6=Sat
      if (!state.cal.availability.days.includes(dow)) return [];
      const blocks = state.cal.availability.weeklyBlocks[dow] || [];
      if (!blocks.length) return [];
      const evt = state.cal.eventTypes.find(e => e.id === state.cal.eventTypeId) || state.cal.eventTypes[0];
      const dur = Number(evt.duration) || 45;
      const buf = Number(state.cal.availability.bufferMin) || 0;
      const step = Math.max(15, dur + buf);

      const slots = [];
      blocks.forEach(b => {
        let cur = timeToMins(b.start);
        const end = timeToMins(b.end);
        while (cur + dur <= end) {
          const tStr = minsToTime(cur);
          if (!state.cal.bookedSlots.includes(`${iso}@${tStr}`) && !slots.includes(tStr)) {
            slots.push(tStr);
          }
          cur += step;
        }
      });
      return slots.sort();
    }

    function calChangeMonth(delta) {
      state.cal.month += delta;
      if (state.cal.month > 11) { state.cal.month = 0; state.cal.year += 1; }
      if (state.cal.month < 0) { state.cal.month = 11; state.cal.year -= 1; }
      render();
    }

    function calSelectEvent(id) {
      state.cal.eventTypeId = id;
      state.cal.step = 'calendar';
      state.cal.selectedTime = null;
      const evt = state.cal.eventTypes.find(e => e.id === id);
      const ath = state.athletes.find(a => a.id === state.activeSiblingId);
      state.cal.payMode = (evt?.allowCredit && ath?.credits > 0) ? 'credit' : 'card';
      if (id === 'evt-clinic') state.cal.selectedDate = '2026-11-28';
      render();
    }

    function calSelectDate(iso) {
      state.cal.selectedDate = iso;
      state.cal.selectedTime = null;
      render();
    }

    function calCartTotals() {
      const cardTotal = state.cal.cart.reduce((sum, item) => sum + item.evt.price, 0);
      return { cardTotal };
    }

    function calAddToCart(time24, goToCheckout = false) {
      const evt = state.cal.eventTypes.find(x => x.id === state.cal.eventTypeId) || state.cal.eventTypes[0];
      const ath = getActiveAthlete();
      const iso = state.cal.selectedDate;
      const slotKey = `${iso}@${time24}`;
      if (state.cal.cart.some(i => i.slotKey === slotKey)) {
        if (goToCheckout) { state.cal.step = 'details'; render(); }
        else showToast('This time slot is already in your cart!');
        return;
      }

      state.cal.cart.push({
        id: 'ci-' + Date.now() + Math.random().toString(36).slice(2, 5),
        slotKey,
        iso,
        dayNice: calDateLabel(iso),
        time24,
        timeDisplay: calFormatTime(time24),
        evt: { ...evt },
        athleteId: ath.id,
        athleteName: ath.name,
        athleteAge: ath.ageGroup,
      });
      state.cal.selectedTime = null;
      if (goToCheckout) {
        state.cal.step = 'details';
      } else {
        showToast(`🛒 Added ${evt.title} (${calDateLabel(iso)} • ${calFormatTime(time24)}) to cart!`);
      }
      render();
    }

    function calRemoveFromCart(itemId) {
      state.cal.cart = state.cal.cart.filter(i => i.id !== itemId);
      if (state.cal.cart.length === 0 && state.cal.step === 'details') {
        state.cal.step = 'calendar';
      }
      render();
      showToast('Removed session from cart.');
    }

    function calToggleCartItemPay(itemId) {
      const item = state.cal.cart.find(i => i.id === itemId);
      if (!item || !item.evt.allowCredit) return;
      if (item.payMode === 'credit') {
        item.payMode = 'card';
      } else {
        const { creditsUsed, availCredits } = calCartTotals();
        if (creditsUsed >= availCredits) {
          showToast(`All ${availCredits} available credits are already applied in your cart.`);
          return;
        }
        item.payMode = 'credit';
      }
      render();
    }

    function calConfirmBooking(e) {
      e.preventDefault();
      if (!state.cal.cart.length) return;
      const focusNote = e.target.notes.value.trim();
      const parentName = e.target.parentName.value;
      const email = e.target.email.value;
      const phone = e.target.phone.value;
      const { cardTotal } = calCartTotals();
      const confirmedItems = [];

      state.cal.cart.forEach(item => {

        // Prevent double-booking
        state.cal.bookedSlots.push(item.slotKey);

        const dayParts = item.dayNice.split(', ');
        const shortDayKey = dayParts[0] + ' ' + item.iso.split('-')[2].replace(/^0/, '');
        state.sessions.unshift({
          id: 'ses-' + Date.now() + Math.random().toString(36).slice(2, 5),
          dayKey: shortDayKey,
          day: item.dayNice,
          time: item.timeDisplay,
          duration: item.evt.durationLabel.toUpperCase(),
          type: item.evt.type,
          focus: focusNote ? `${item.evt.title} — ${focusNote}` : item.evt.title,
          athletes: [item.athleteName],
          athleteId: item.athleteId,
          spotsMax: item.evt.type === '1-on-1 Private' ? 1 : 6,
          status: 'Confirmed',
          payment: state.cal.checkoutMethod === 'cash' ? `Cash Due ($${item.evt.price})` : `Clover Paid ($${item.evt.price})`,
          price: item.evt.price,
          img: item.evt.img
        });

        confirmedItems.push({
          ...item,
          payLabel: state.cal.checkoutMethod === 'cash' ? `$${item.evt.price} Cash Due` : `$${item.evt.price} Clover`
        });
      });


      const isCash = state.cal.checkoutMethod === 'cash';
      if (cardTotal > 0) {
        state.payments.unshift({
          id: 'pay-' + Date.now(),
          date: 'Today',
          family: 'Miller Family',
          item: confirmedItems.length === 1 ? `${confirmedItems[0].evt.title} (${confirmedItems[0].dayNice})` : `Multi-Session Booking (${confirmedItems.length} sessions)`,
          amount: cardTotal,
          method: isCash ? 'Cash (Due at Lesson)' : 'Clover • Card / Apple Pay',
          status: isCash ? 'Pending Cash' : 'Paid'
        });
      }

      state.cal.lastBooking = {
        items: confirmedItems,
        cardTotal,
        checkoutMethod: state.cal.checkoutMethod,
        parentName,
        email,
        phone,
        notes: focusNote
      };
      state.cal.cart = [];
      state.cal.step = 'confirmed';
      render();
      showToast(`Confirmed ${confirmedItems.length} ${confirmedItems.length === 1 ? 'session' : 'sessions'}!`);
    }

    function downloadIcs() {
      const b = state.cal.lastBooking;
      if (!b || !b.items?.length) return;
      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Gina Fuchs Elite Fastpitch//Booking//EN'
      ];
      b.items.forEach(item => {
        const dtStart = item.iso.replace(/-/g, '') + 'T' + item.time24.replace(':', '') + '00';
        const [h, m] = item.time24.split(':').map(Number);
        const endMins = h * 60 + m + item.evt.duration;
        const eh = String(Math.floor(endMins / 60)).padStart(2, '0');
        const em = String(endMins % 60).padStart(2, '0');
        const dtEnd = item.iso.replace(/-/g, '') + 'T' + eh + em + '00';
        lines.push(
          'BEGIN:VEVENT',
          `DTSTART:${dtStart}`,
          `DTEND:${dtEnd}`,
          `SUMMARY:${item.evt.title} — ${item.athleteName} w/ Coach Gina`,
          `LOCATION:${item.evt.location}`,
          `DESCRIPTION:Athlete: ${item.athleteName}\\nNotes: ${b.notes || 'Fastpitch training session'}\\n24-hour cancellation policy applies.`,
          'END:VEVENT'
        );
      });
      lines.push('END:VCALENDAR');
      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gina-fuchs-sessions-${b.items.length}.ics`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`Calendar invite (.ics) for ${b.items.length} ${b.items.length === 1 ? 'session' : 'sessions'} downloaded!`);
    }

              </div>

              <!-- Cart Totals Summary -->
              <div class="card-white rounded-2xl p-4 flex items-center justify-between text-sm">
                <span class="font-extrabold">Total Due</span>
                <span class="font-extrabold tabular-nums text-lg">$${cardTotal}</span>
              </div>
            </div>

            <!-- Right: Single Checkout Form -->
            <form onsubmit="calConfirmBooking(event)" class="lg:col-span-7 p-6 space-y-4 text-xs">
              <h2 class="text-lg font-extrabold tracking-tight">Complete Checkout</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-[var(--text-muted)] font-bold mb-1">Parent / Guardian Name *</label>
                  <input name="parentName" value="${ath.parentName}" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" required />
                </div>
                <div>
                  <label class="block text-[var(--text-muted)] font-bold mb-1">Email for Calendar Invites *</label>
                  <input name="email" type="email" value="sarah.miller@example.com" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" required />
                </div>
              </div>
              <div>
                <label class="block text-[var(--text-muted)] font-bold mb-1">Mobile Phone (24h SMS Reminders) *</label>
                <input name="phone" value="${ath.parentPhone}" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" required />
              </div>
              <div>
                <label class="block text-[var(--text-muted)] font-bold mb-1">Focus Notes for Coach Gina (Optional)</label>
                <textarea name="notes" rows="2" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" placeholder="e.g., Inside pitch barrel path, slapping footwork, infield transfers, pre-tournament tune-up..."></textarea>
              </div>
              ${cardTotal > 0 ? `
                <div>
                  <label class="block text-[var(--text-muted)] font-bold mb-1.5">Payment Method for $${cardTotal} Balance</label>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <button type="button" onclick="state.cal.checkoutMethod='clover'; render();" class="p-3.5 rounded-2xl border text-left cursor-pointer transition ${state.cal.checkoutMethod === 'clover' ? 'bg-[#010101] text-white border-[#010101] shadow-md' : 'surface-soft'}">
                      <div class="flex items-center justify-between">
                        <span class="font-extrabold">🍀 Clover Checkout</span>
                        ${state.cal.checkoutMethod === 'clover' ? `<span class="px-2 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">Selected</span>` : ''}
                      </div>
                      <div class="text-[11px] opacity-75 mt-1">Card, Apple Pay, or Google Pay via Clover</div>
                    </button>
                    <button type="button" onclick="state.cal.checkoutMethod='cash'; render();" class="p-3.5 rounded-2xl border text-left cursor-pointer transition ${state.cal.checkoutMethod === 'cash' ? 'bg-[#010101] text-white border-[#010101] shadow-md' : 'surface-soft'}">
                      <div class="flex items-center justify-between">
                        <span class="font-extrabold">💵 Pay Cash at Lesson</span>
                        ${state.cal.checkoutMethod === 'cash' ? `<span class="px-2 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">Selected</span>` : ''}
                      </div>
                      <div class="text-[11px] opacity-75 mt-1">Reserve now • Pay Gina $${cardTotal} cash at check-in</div>
                    </button>
                  </div>
                </div>
              ` : ''}
              <label class="flex items-center gap-2 cursor-pointer pt-1">
                <input type="checkbox" checked required class="w-4 h-4 accent-[#010101]" />
                <span class="text-[11px] text-[var(--text-muted)]">I agree to the 24-hour reschedule &amp; cancellation policy for all sessions in my cart.</span>
              </label>
              <button type="submit" class="w-full py-3.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-sm font-extrabold cursor-pointer shadow-lg hover:brightness-95 transition">
                Confirm ${state.cal.cart.length} ${state.cal.cart.length === 1 ? 'Session' : 'Sessions'} • ${state.cal.checkoutMethod === 'cash' ? `$${cardTotal} Cash at Lesson` : `Pay $${cardTotal} w/ Clover`} →
              </button>
            </form>
          </div>
        `;
      }

      // STEP 1: CAL.COM 3-COLUMN SCHEDULER + LIVE SHOPPING CART BAR
      const eventStrip = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          ${state.cal.eventTypes.map(t => {
            const active = t.id === evt.id;
            return `
              <button onclick="calSelectEvent('${t.id}')" class="text-left rounded-[24px] overflow-hidden transition cursor-pointer group ${active ? 'bg-[#010101] text-white shadow-xl ring-2 ring-[#D5FF5F]' : 'card-white hover:-translate-y-0.5'}">
                <div class="relative h-24 w-full overflow-hidden">
                  <img src="${t.img || 'assets/images/fastpitch-hitter.jpg'}" alt="${t.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" / loading="lazy" decoding="async">
                  <div class="absolute inset-0 bg-gradient-to-t from-[#010101]/70 via-[#010101]/15 to-transparent"></div>
                  <div class="absolute top-2.5 left-2.5 right-2.5 flex items-center justify-between gap-2">
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${active ? 'bg-[#D5FF5F] text-[#010101]' : 'bg-[#010101]/70 text-white backdrop-blur'}">${t.durationLabel}</span>
                    <span class="px-2.5 py-0.5 rounded-full bg-white/90 text-[#010101] text-[11px] font-extrabold tabular-nums">$${t.price}</span>
                  </div>
                </div>
                <div class="p-3.5">
                  <div class="font-extrabold text-sm leading-snug">${t.title}</div>
                  <div class="text-[11px] mt-0.5 ${active ? 'text-[#D6DFE2]' : 'text-[var(--text-muted)]'}">${t.type}</div>
                </div>
              </button>
            `;
          }).join('')}
        </div>
      `;

      const cartBanner = state.cal.cart.length > 0 ? `
        <div class="glass-dock rounded-[26px] p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-2 border-[#010101] dark:border-[#D5FF5F]">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold text-sm flex items-center justify-center shrink-0">🛒</div>
            <div class="min-w-0">
              <div class="font-extrabold text-sm">${state.cal.cart.length} ${state.cal.cart.length === 1 ? 'Session' : 'Sessions'} in Booking Cart</div>
              <div class="text-xs text-[var(--text-muted)] truncate">
                ${state.cal.cart.map(i => `${i.athleteName.split(' ')[0]}: ${i.dayNice} ${i.timeDisplay}`).join(' • ')}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="px-3 py-1.5 rounded-full surface-soft text-xs font-extrabold">$${cardTotal}</span>
            <button onclick="state.cal.step='details'; render();" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer shadow-md">Checkout (${state.cal.cart.length}) →</button>
          </div>
        </div>
      ` : '';

      const year = state.cal.year;
      const month = state.cal.month;
      const monthName = new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const availableSlots = calGetSlotsForDate(state.cal.selectedDate);

      let calendarCells = '';
      for (let i = 0; i < firstDow; i++) calendarCells += `<div></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isPast = (year === 2026 && month === 10 && day < 26);
        const slots = isPast ? [] : calGetSlotsForDate(iso);
        const hasSlots = slots.length > 0;
        const isSelected = iso === state.cal.selectedDate;
        const hasCartOnDay = state.cal.cart.some(i => i.iso === iso);
        calendarCells += `
          <button ${!hasSlots ? 'disabled' : `onclick="calSelectDate('${iso}')"`} class="aspect-square rounded-2xl flex flex-col items-center justify-center text-xs font-extrabold transition ${
            isSelected
              ? 'bg-[#010101] text-[#D5FF5F] shadow-md cursor-pointer'
              : hasSlots
                ? 'surface-soft hover:bg-[#D5FF5F] hover:text-[#010101] cursor-pointer'
                : 'opacity-30 cursor-not-allowed'
          }">
            <span>${day}</span>
            ${hasCartOnDay
              ? `<span class="w-1.5 h-1.5 rounded-full mt-0.5 bg-[#D5FF5F] ring-1 ring-[#010101]"></span>`
              : hasSlots ? `<span class="w-1 h-1 rounded-full mt-0.5 ${isSelected ? 'bg-[#D5FF5F]' : 'bg-[#4E6075] dark:bg-[#9AC0D6]'}"></span>` : ''}
          </button>
        `;
      }

      return `
        ${renderSiblingBar()}
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Book Sessions</h1>
            <p class="text-xs text-[var(--text-muted)]">Add multiple dates or class types to your cart &amp; check out in one step</p>
          </div>
          ${state.cal.cart.length > 0 ? `<button onclick="state.cal.step='details'; render();" class="px-3.5 py-2 rounded-full bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">${uiIcon('cart')} Cart (${state.cal.cart.length})</button>` : ''}
        </div>

        ${cartBanner}
        ${eventStrip}

        <!-- Cal.com 3-Column Liquid Glass Booking Card -->
        <div class="card-white rounded-[32px] overflow-hidden grid grid-cols-1 lg:grid-cols-12">
          <!-- Col 1: Event Details & Timezone -->
          <div class="lg:col-span-4 card-mist p-5 sm:p-6 flex flex-col justify-between gap-5">
            <div class="space-y-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-[#010101] text-[#D5FF5F] font-extrabold text-xs flex items-center justify-center shrink-0">GF</div>
                <div>
                  <div class="text-xs text-[var(--text-muted)] font-bold">Booking for ${ath.name.split(' ')[0]} (${ath.ageGroup})</div>
                  <div class="font-extrabold text-base leading-tight">${evt.title}</div>
                </div>
              </div>
              <p class="text-xs text-[var(--text-muted)] leading-relaxed">${evt.desc}</p>
              <div class="space-y-2 text-xs font-semibold">
                <div class="flex items-center gap-2"><span>⏱️</span><span>${evt.durationLabel} (${evt.duration} min)</span></div>
                <div class="flex items-center gap-2"><span>📍</span><span>${evt.location}</span></div>
                <div class="flex items-center gap-2"><span>💳</span><span>$${evt.price} • Clover or Cash</span></div>
              </div>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-[var(--text-muted)] mb-1">Timezone</label>
              <select onchange="state.cal.timezone=this.value; render();" class="w-full px-3 py-2 rounded-xl surface-soft text-xs font-bold cursor-pointer">
                <option value="America/New_York" ${state.cal.timezone === 'America/New_York' ? 'selected' : ''}>🌎 Pittsburgh / Eastern (EST)</option>
                <option value="America/Chicago" ${state.cal.timezone === 'America/Chicago' ? 'selected' : ''}>🌎 Central Time (CST)</option>
                <option value="America/Denver" ${state.cal.timezone === 'America/Denver' ? 'selected' : ''}>🌎 Mountain Time (MST)</option>
                <option value="America/Los_Angeles" ${state.cal.timezone === 'America/Los_Angeles' ? 'selected' : ''}>🌎 Pacific Time (PST)</option>
              </select>
            </div>
          </div>

          <!-- Col 2: Interactive Month Calendar -->
          <div class="lg:col-span-5 p-5 sm:p-6 border-b lg:border-b-0 lg:border-r border-[var(--border-subtle)] space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="font-extrabold text-sm">${monthName}</h2>
              <div class="flex items-center gap-1.5">
                <button onclick="calChangeMonth(-1)" class="w-8 h-8 rounded-full surface-soft font-bold text-xs cursor-pointer">‹</button>
                <button onclick="calChangeMonth(1)" class="w-8 h-8 rounded-full surface-soft font-bold text-xs cursor-pointer">›</button>
              </div>
            </div>
            <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-extrabold text-[var(--text-muted)] uppercase">
              <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div class="grid grid-cols-7 gap-1.5">
              ${calendarCells}
            </div>
          </div>

          <!-- Col 3: Time Slots + Add to Cart / Book Now -->
          <div class="lg:col-span-3 p-5 sm:p-6 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div class="font-extrabold text-sm">${calDateLabel(state.cal.selectedDate)}</div>
              <div class="flex p-0.5 rounded-full surface-soft text-[10px] font-extrabold">
                <button onclick="state.cal.timeFormat='12h'; render();" class="px-2 py-0.5 rounded-full cursor-pointer ${state.cal.timeFormat === '12h' ? 'bg-[#010101] text-[#D5FF5F]' : 'text-[var(--text-muted)]'}">12h</button>
                <button onclick="state.cal.timeFormat='24h'; render();" class="px-2 py-0.5 rounded-full cursor-pointer ${state.cal.timeFormat === '24h' ? 'bg-[#010101] text-[#D5FF5F]' : 'text-[var(--text-muted)]'}">24h</button>
              </div>
            </div>
            <div class="space-y-2 max-h-72 overflow-y-auto no-scrollbar pr-0.5">
              ${availableSlots.length ? availableSlots.map(t => {
                const slotKey = `${state.cal.selectedDate}@${t}`;
                const inCartItem = state.cal.cart.find(i => i.slotKey === slotKey);
                if (inCartItem) {
                  return `
                    <div class="p-2.5 rounded-2xl bg-[#D5FF5F]/25 border border-[#010101]/20 flex items-center justify-between text-xs font-extrabold">
                      <span>✓ ${calFormatTime(t)}</span>
                      <button onclick="calRemoveFromCart('${inCartItem.id}')" class="text-[11px] underline cursor-pointer">Remove</button>
                    </div>
                  `;
                }
                const selected = state.cal.selectedTime === t;
                return selected ? `
                  <div class="space-y-1.5 p-2 rounded-2xl surface-soft">
                    <div class="text-center text-xs font-extrabold">${calFormatTime(t)}</div>
                    <div class="grid grid-cols-2 gap-1.5">
                      <button onclick="calAddToCart('${t}', false)" class="py-2 rounded-xl bg-[#010101] text-[#D5FF5F] text-[11px] font-extrabold cursor-pointer">+ Add Cart</button>
                      <button onclick="calAddToCart('${t}', true)" class="py-2 rounded-xl bg-[#D5FF5F] text-[#010101] text-[11px] font-extrabold cursor-pointer">Book Now →</button>
                    </div>
                  </div>
                ` : `
                  <button onclick="state.cal.selectedTime='${t}'; render();" class="w-full py-2.5 px-3 rounded-2xl surface-soft hover:border-[#010101] text-xs font-extrabold flex items-center justify-center gap-2 cursor-pointer transition">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#22c55e]"></span>
                    <span>${calFormatTime(t)}</span>
                  </button>
                `;
              }).join('') : `<div class="p-4 rounded-2xl surface-soft text-xs text-[var(--text-muted)] text-center">No open slots on this date. Pick another highlighted day!</div>`}
            </div>
          </div>
        </div>
      `;
    }

    function openAvailabilityModal() {
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      openModal(`
        <div class="flex items-center justify-between">
          <div>
            <h3 class="font-extrabold text-sm">Coach Gina’s Cal.com Availability</h3>
            <p class="text-[11px] text-[var(--text-muted)]">Changes update the Athlete Booking Calendar live</p>
          </div>
          <button onclick="closeModal()" class="text-xs font-bold cursor-pointer">✕</button>
        </div>
        <div class="space-y-4 text-xs">
          <div>
            <div class="font-bold text-[var(--text-muted)] mb-2">Open Coaching Days</div>
            <div class="grid grid-cols-7 gap-1">
              ${dayNames.map((name, idx) => {
                const on = state.cal.availability.days.includes(idx);
                return `<button type="button" onclick="toggleAvailDay(${idx})" class="py-2 rounded-xl font-extrabold cursor-pointer ${on ? 'bg-[#D5FF5F] text-[#010101]' : 'surface-soft text-[var(--text-muted)]'}">${name}</button>`;
              }).join('')}
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div class="surface-soft rounded-2xl p-3">
              <div class="text-[11px] text-[var(--text-muted)]">Buffer Between Lessons</div>
              <div class="font-extrabold text-sm mt-0.5">${state.cal.availability.bufferMin} min</div>
            </div>
            <div class="surface-soft rounded-2xl p-3">
              <div class="text-[11px] text-[var(--text-muted)]">Minimum Notice</div>
              <div class="font-extrabold text-sm mt-0.5">${state.cal.availability.minNoticeHours} hours</div>
            </div>
          </div>
          <button onclick="copyCalLink('hitting-45')" class="w-full py-2.5 rounded-2xl bg-[#010101] text-[#D5FF5F] font-extrabold cursor-pointer">${uiIcon('link')} Copy Shareable Booking Link</button>
        </div>
      `);
    }

    function toggleAvailDay(idx) {
      const d = state.cal.availability.days;
      if (d.includes(idx)) state.cal.availability.days = d.filter(x => x !== idx);
      else state.cal.availability.days.push(idx);
      openAvailabilityModal();
      render();
      showToast('Availability updated on live booking calendar!');
    }

    function renderParentPackages() {
      const famPayments = state.payments.filter(p => p.family === 'Miller Family');
      const totalPaid = famPayments.filter(p => p.status !== 'Pending Cash').reduce((s, p) => s + p.amount, 0);
      const pendingCash = famPayments.filter(p => p.status === 'Pending Cash').reduce((s, p) => s + p.amount, 0);
      return `
        ${renderSiblingBar()}
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Billing &amp; Receipts</h1>
            <p class="text-xs text-[var(--text-muted)]">Pay per session online via 🍀 Clover (Card / Apple Pay) or 💵 Cash at the facility</p>
          </div>
          <button onclick="setTab('book')" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">+ Book Sessions</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="card-mist rounded-[28px] p-5 space-y-1">
            <div class="text-xs font-bold text-[var(--text-muted)]">Total Paid (Miller Family)</div>
            <div class="text-3xl font-extrabold tabular-nums">$${totalPaid.toLocaleString()}</div>
            <div class="text-xs font-semibold text-[#4E6075] dark:text-[#9AC0D6]">🍀 Clover &amp; Cash receipts saved automatically</div>
          </div>
          <div class="card-white rounded-[28px] p-5 space-y-1">
            <div class="text-xs font-bold text-[var(--text-muted)]">Cash Due at Upcoming Lessons</div>
            <div class="text-3xl font-extrabold tabular-nums">$${pendingCash.toLocaleString()}</div>
            <div class="text-xs font-semibold text-[var(--text-muted)]">${pendingCash > 0 ? 'Bring cash to Coach Gina at check-in' : 'All caught up — $0 due!'}</div>
          </div>
        </div>

        <div class="card-white rounded-[28px] p-5 space-y-3">
          <h2 class="text-sm font-extrabold">Payment History &amp; Receipts</h2>
          ${famPayments.map(p => `
            <div class="surface-soft rounded-2xl p-3.5 flex items-center justify-between text-xs">
              <div>
                <div class="font-extrabold">${p.item}</div>
                <div class="text-[var(--text-muted)]">${p.date} • ${p.method}</div>
              </div>
              <div class="flex items-center gap-2">
                ${p.status === 'Pending Cash' ? `<span class="px-2.5 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">Cash Due</span>` : `<span class="px-2.5 py-0.5 rounded-full surface-soft text-[10px] font-bold">Paid ✓</span>`}
                <div class="font-extrabold tabular-nums">$${p.amount}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderParentVideo() {

      const recaps = state.sessionRecaps.filter(r => r.athleteId === ath.id && !r.isDraft);
      return `
        ${renderSiblingBar()}
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Session Recaps &amp; Video</h1>
            <p class="text-xs text-[var(--text-muted)]">Every lesson note &amp; video clip from Coach Gina saved in one organized timeline</p>
          </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="card-mist rounded-[28px] p-5 space-y-3 h-fit">
            <h2 class="text-sm font-extrabold">Send Practice Clip to Gina</h2>
            <p class="text-xs text-[var(--text-muted)]">Upload a home swing or fielding clip for Coach Gina’s review.</p>
            <form onsubmit="uploadParentVideo(event,'${ath.id}')" class="space-y-2.5">

              <button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">Upload to Coach Gina</button>

          </div>
          <div class="lg:col-span-2 space-y-4">
            ${recaps.length ? recaps.map(r => `

                  <div class="absolute inset-0 bg-[#010101]/45 flex items-center justify-center">
                    <div class="w-12 h-12 rounded-full bg-[#D5FF5F] text-[#010101] flex items-center justify-center shadow-lg text-base">▶</div>
                  </div>

                      ${r.tags.map(t => `<span class="px-2.5 py-0.5 rounded-full surface-soft text-[10px] font-extrabold">${t}</span>`).join('')}

    // COACH GINA SCHEDULING: DAILY BOOKINGS + ADJUSTABLE BLOCKS + CLASS TYPES

    function toggleCoachDay(dow) {
      const days = state.cal.availability.days;
      if (days.includes(dow)) {
        state.cal.availability.days = days.filter(d => d !== dow);
      } else {
        days.push(dow);
        if (!state.cal.availability.weeklyBlocks[dow]?.length) {
          state.cal.availability.weeklyBlocks[dow] = [{ id: 'b-' + Date.now(), start: '15:30', end: '19:00' }];
        }
      }
      render();
      showToast('Updated open coaching days — Athlete Booking Calendar synced!');
    }

    function updateCoachBlock(dow, blockId, field, value) {
      const blocks = state.cal.availability.weeklyBlocks[dow] || [];
      const b = blocks.find(x => x.id === blockId);
      if (!b) return;
      b[field] = value;
      render();
      showToast('Time block adjusted — live booking slots recalculated!');
    }

    function addCoachBlock(dow) {
      if (!state.cal.availability.days.includes(dow)) state.cal.availability.days.push(dow);
      if (!state.cal.availability.weeklyBlocks[dow]) state.cal.availability.weeklyBlocks[dow] = [];
      state.cal.availability.weeklyBlocks[dow].push({ id: 'b-' + Date.now(), start: '17:00', end: '20:00' });
      render();
      showToast('Added new time block!');
    }

    function removeCoachBlock(dow, blockId) {
      state.cal.availability.weeklyBlocks[dow] = (state.cal.availability.weeklyBlocks[dow] || []).filter(b => b.id !== blockId);
      if (!state.cal.availability.weeklyBlocks[dow].length) {
        state.cal.availability.days = state.cal.availability.days.filter(d => d !== dow);
      }
      render();
      showToast('Removed time block.');
    }

    function saveClassType(e, editId) {
      e.preventDefault();
      const dur = Number(e.target.duration.value);
      const durationLabel = dur >= 60 && dur % 60 === 0 ? `${dur / 60}h` : `${dur}m`;
      const payload = {
        title: e.target.title.value.trim(),
        type: e.target.type.value,
        duration: dur,
        durationLabel,
        price: Number(e.target.price.value),
        location: e.target.location.value.trim(),
        desc: e.target.desc.value.trim() || 'Fastpitch training session with Coach Gina.',
        allowCredit: false,
        img: (() => {
          const t = (e.target.title.value + ' ' + e.target.type.value).toLowerCase();
          if (t.includes('small group')) return 'assets/images/fastpitch-group.jpg';
          if (t.includes('catch')) return 'assets/images/fastpitch-catcher.jpg';
          if (t.includes('slap') || t.includes('clinic') || t.includes('camp')) return 'assets/images/fastpitch-slapper.jpg';
          if (t.includes('field') || t.includes('defen') || t.includes('infield')) return 'assets/images/fastpitch-fielding.jpg';
          return 'assets/images/fastpitch-hitter.jpg';
        })()
      };
      if (editId) {
        const idx = state.cal.eventTypes.findIndex(x => x.id === editId);
        if (idx >= 0) state.cal.eventTypes[idx] = { ...state.cal.eventTypes[idx], ...payload };
      } else {
        const slug = payload.title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        state.cal.eventTypes.push({ id: 'evt-' + Date.now(), slug, ...payload });
      }
      closeModal();
      render();
      showToast(editId ? `Updated "${payload.title}" (${durationLabel}) — synced to Booking!` : `Added "${payload.title}" (${durationLabel}) to Booking!`);
    }

    function getTodayIsoEst() {
      try {
        const parts = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'America/New_York',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).formatToParts(new Date());
        const y = parts.find(p => p.type === 'year')?.value;
        const m = parts.find(p => p.type === 'month')?.value;
        const d = parts.find(p => p.type === 'day')?.value;
        if (y && m && d) return `${y}-${m}-${d}`;
      } catch (_) {}
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function getRolling7Days() {
      const todayIso = getTodayIsoEst();
      const base = new Date(todayIso + 'T12:00:00');
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(base.getTime() + i * 86400000);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const dow = d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
        const num = String(d.getDate());
        const shortLabel = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        const dayKey = d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' }).replace(',', '');
        days.push({ iso, dow, num, shortLabel, dayKey, isToday: i === 0 });
      }
      return days;
    }

    function sessionMatchesDay(s, d) {
      if (!s || !d) return false;
      if (s.dateIso) return s.dateIso === d.iso;
      return s.dayKey === d.dayKey || s.day === d.shortLabel;
    }

    function submitAddAthlete(e, familyId = null) {
      e.preventDefault();
      const f = e.target;
      const name = f.name.value.trim();
      const parts = name.split(/\s+/).filter(Boolean);
      const initials = ((parts[0]?.[0] || 'A') + (parts[1]?.[0] || parts[0]?.[1] || 'F')).toUpperCase();
      const position = f.position.value;
      const posLow = position.toLowerCase();
      const isCatcher = posLow.includes('catcher');
      const isSlapper = posLow.includes('slap');
      const id = 'ath-' + Date.now();
      const newAth = {
        id,
        initials,
        name,
        familyId: familyId || ('fam-' + Date.now()),
        parentName: f.parentName.value.trim(),
        parentPhone: f.parentPhone.value.trim(),
        ageGroup: f.ageGroup.value,
        gradYear: Number(f.gradYear.value) || 2030,
        position,
        batsThrows: f.batsThrows.value,
        team: f.team.value.trim() || 'Pittsburgh Fastpitch Travel',
        height: '5\'4"',
        streakDays: 1,
        weeklyReps: 0,
        weeklyDuration: '0:00 hours',
        waiverSigned: f.waiverSigned.checked,
        waiverDate: f.waiverSigned.checked ? new Date().toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }) : null,
        emergencyContact: `${f.parentName.value.trim()} — ${f.parentPhone.value.trim()}`,
        medicalNotes: f.medicalNotes.value.trim() || 'None reported',
        primaryMetricLabel: isCatcher ? 'Pop Time PR' : isSlapper ? 'Home-to-1st' : 'Exit Velo PR',
        primaryMetricValue: isCatcher ? '1.95' : isSlapper ? '3.05' : '60.0',
        primaryMetricUnit: isCatcher || isSlapper ? 'SEC' : 'MPH',
        primaryMetricDelta: 'Baseline eval',
        pitches: [],
        notes: [{ date: 'Today', text: 'Athlete profile created — ready for baseline hitting & defense evaluation!' }],
        drills: [
          {
            id: 'd-' + Date.now(),
            title: 'Hitter’s Warmup: PVC Swings & 4lb Med Ball',
            reps: '5 each',
            focus: 'Pre-session routine',
            done: false,
            img: getAthleteCoverImg({ position, batsThrows: f.batsThrows.value })
          }
        ]
      };

      state.athletes.push(newAth);
      if (state.role === 'coach') {
        state.selectedAthleteId = id;
        state.rosterView = 'detail';
      } else {
        state.activeSiblingId = id;
      }
      closeModal();
      render();
      showToast(`${name} added to ${familyId === 'fam-1' ? 'your family hub' : 'Coach Gina’s roster'}!`);
    }

    function submitAddSessionForAthlete(e, athId) {
      e.preventDefault();
      const ath = state.athletes.find(a => a.id === athId);
      if (!ath) return;
      const f = e.target;
      const evt = state.cal.eventTypes.find(t => t.id === f.eventTypeId.value) || state.cal.eventTypes[0];
      const iso = f.date.value;
      const hm = f.time.value; // "16:00"
      const [hh, mm] = hm.split(':').map(Number);
      const ampm = hh >= 12 ? 'PM' : 'AM';
      const h12 = hh % 12 || 12;
      const timeNice = `${h12}:${String(mm).padStart(2, '0')} ${ampm}`;
      const dObj = new Date(iso + 'T12:00:00');
      const dayNice = dObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const dayKey = dObj.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' }).replace(',', '');
      const focus = f.focus.value.trim() || evt.title;
      const payMode = f.paymentMode.value;
      const payLabel = payMode === 'cash-pending' ? `Cash at Lesson ($${evt.price})`
        : payMode === 'cash-paid' ? `Cash Paid ($${evt.price})`
        : payMode === 'clover-paid' ? `Clover Paid ($${evt.price})`
        : `Venmo/Zelle ($${evt.price})`;

      // 1. Add session to shared schedule (syncs to Coach Home, Coach Roster & Athlete Portal)
      state.sessions.unshift({
        id: 'ses-' + Date.now(),
        dateIso: iso,
        dayKey,
        day: dayNice,
        time: timeNice,
        duration: evt.durationLabel.toUpperCase(),
        type: evt.type,
        focus,
        athletes: [ath.name],
        athleteId: ath.id,
        spotsMax: evt.type === 'Small Group' ? 6 : 1,
        status: 'Confirmed',
        payment: payLabel,
        price: evt.price,
        img: evt.img || getAthleteCoverImg(ath)
      });

      // 2. Block slot on Coach Gina's live booking calendar
      const slotKey = `${iso}@${hm}`;
      if (!state.cal.bookedSlots.includes(slotKey)) state.cal.bookedSlots.push(slotKey);

      // 3. Log payment entry in Coach Payments
      state.payments.unshift({
        id: 'pay-' + Date.now(),
        date: dObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
        family: `${ath.parentName.split(' ').slice(-1)[0]} Family`,
        item: `${focus} (${ath.name.split(' ')[0]})`,
        amount: evt.price,
        method: payMode === 'cash-pending' ? 'Cash at Lesson' : payMode === 'cash-paid' ? 'Cash (Collected ✓)' : payMode === 'clover-paid' ? 'Clover • Card' : 'Venmo / Zelle (Logged)',
        status: payMode === 'cash-pending' ? 'Pending Cash' : 'Paid'
      });

      // 4. Optional confirmation message to parent
      if (f.notify.checked) {
        let thread = state.threads.find(t => t.parent === ath.parentName);
        if (!thread) {
          thread = { id: 'msg-' + Date.now(), parent: ath.parentName, athletes: ath.name, unread: 0, messages: [] };
          state.threads.unshift(thread);
        }
        thread.messages.push({
          from: 'coach',
          time: 'Just now',
          text: `Scheduled ${ath.name.split(' ')[0]} for ${focus} on ${dayNice} at ${timeNice} EST (${payLabel}). See you in the cage!`
        });
      }

      closeModal();
      render();
      showToast(`Added ${focus} on ${dayNice} at ${timeNice} to ${ath.name.split(' ')[0]}’s profile!`);
    }

    function setRosterSort(col) {
      if (state.rosterSortCol === col) state.rosterSortDir = state.rosterSortDir === 'asc' ? 'desc' : 'asc';
      else { state.rosterSortCol = col; state.rosterSortDir = 'asc'; }
      const box = document.getElementById('roster-list-container');
      if (box) box.innerHTML = renderRosterRowsHtml();
    }

    function getFilteredRosterAthletes() {
      const q = (state.rosterSearch || '').trim().toLowerCase();
      const f = state.rosterFilter || 'all';
      const todayNames = new Set(
        state.sessions.filter(s => s.dayKey === 'Thu 26' || s.day.includes('Today')).flatMap(s => s.athletes || [])
      );
      const todayIds = new Set(
        state.sessions.filter(s => s.dayKey === 'Thu 26' || s.day.includes('Today')).map(s => s.athleteId).filter(Boolean)
      );
      const draftIds = new Set(state.sessionRecaps.filter(r => r.isDraft).map(r => r.athleteId));
      const col = state.rosterSortCol || 'name';
      const dir = state.rosterSortDir === 'desc' ? -1 : 1;

      return state.athletes
        .filter(a => {
          if (f === 'today' && !(todayIds.has(a.id) || todayNames.has(a.name))) return false;
          if (f === 'waiver' && a.waiverSigned) return false;
          if (f === 'drafts' && !draftIds.has(a.id)) return false;
          if (['10U', '12U', '14U', '16U', '18U'].includes(f) && a.ageGroup !== f) return false;
          if (q) {
            const hay = `${a.name} ${a.parentName} ${a.position} ${a.ageGroup} ${a.team || ''}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        })
        .sort((a, b) => {
          if (col === 'age') return (parseInt(a.ageGroup, 10) - parseInt(b.ageGroup, 10)) * dir || a.name.localeCompare(b.name);
          if (col === 'waiver') return (Number(a.waiverSigned) - Number(b.waiverSigned)) * dir || a.name.localeCompare(b.name);
          return a.name.localeCompare(b.name) * dir;
        });
    }

    function renderRosterRowsHtml() {
      const list = getFilteredRosterAthletes();
      if (!list.length) {
        if (state.athletes.length === 0) {
          return `

              <div class="w-14 h-14 rounded-2xl bg-[#010101] text-[#D5FF5F] font-extrabold text-xl flex items-center justify-center mx-auto">+</div>

                <button onclick="openAppleNotesImporterModal()" class="px-5 py-3 rounded-full card-white text-xs font-extrabold cursor-pointer hover:border-[#010101] transition inline-flex items-center gap-1.5">${uiIcon('note')} Import Apple Notes</button>
              </div>
            </div>
          `;
        }
        return `
          <div class="card-white rounded-[28px] p-8 text-center space-y-2">
            <div class="text-sm font-extrabold">No athletes match "${state.rosterSearch || state.rosterFilter}"</div>
            <p class="text-xs text-[var(--text-muted)]">Try clearing your search or switching age group filters.</p>
            <button onclick="state.rosterSearch=''; state.rosterFilter='all'; render();" class="mt-1 px-4 py-2 rounded-full bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer">Show All ${state.athletes.length} Athletes</button>
          </div>
        `;
      }

      const draftIds = new Set(state.sessionRecaps.filter(r => r.isDraft).map(r => r.athleteId));
      const col = state.rosterSortCol || 'name';
      const arrow = (c) => col === c ? (state.rosterSortDir === 'desc' ? ' ↓' : ' ↑') : '';

      return `
        <div class="card-white rounded-[26px] overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-[var(--border-subtle)] bg-white/40 dark:bg-white/5 text-[11px] font-extrabold uppercase tracking-wider text-[var(--text-muted)]">
                  <th class="py-3 pl-4 pr-2">
                    <button type="button" onclick="setRosterSort('name')" class="cursor-pointer hover:text-[var(--text-main)]">Athlete${arrow('name')}</button>
                  </th>
                  <th class="py-3 px-2">
                    <button type="button" onclick="setRosterSort('age')" class="cursor-pointer hover:text-[var(--text-main)]">Age${arrow('age')}</button>

    // =========================================================================
    // APPLE NOTES BULK IMPORTER (Folder Upload / JSON Export / Quick Paste)
    // =========================================================================
    let _importPreviewData = []; // [{ athleteName, ageGroup, notes: [{ date, warmup, focus, tee, ft, machine, homework, tags, clips }] }]
    let _importTab = 'folder'; // 'folder' | 'json' | 'paste'

    function stripHtmlToText(str) {
      if (!/<[a-z][\s\S]*>/i.test(str)) return str;
      const div = document.createElement('div');
      div.innerHTML = str.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|h[1-6])>/gi, '\n');
      return (div.textContent || div.innerText || '').replace(/\r\n/g, '\n');
    }

    function parseGinaAppleNote(rawText, fallbackTitle = '') {
      const text = stripHtmlToText(rawText || '').replace(/\uFFFC/g, '').trim();
      const lines = text.split('\n').map(l => l.trim());

      // Detect leading date like 11/23 or 11/9/26
      let date = fallbackTitle.replace(/\.(md|txt|html?)$/i, '').trim() || new Date().toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' });
      const dateMatch = lines[0]?.match(/^(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)$/);
      if (dateMatch) {
        date = dateMatch[1];
        lines.shift();
      }

      const sections = { warmup: [], focus: [], tee: [], ft: [], machine: [], homework: [], other: [] };
      let cur = 'other';

      for (const raw of lines) {
        if (!raw) continue;
        const low = raw.toLowerCase();
        if (/^[•\-*]?\s*hitter[’']?s?\s*warm\s*up/i.test(raw)) { cur = 'warmup'; continue; }
        if (/^what[’']?s\s*new\s*\/?\s*focus/i.test(raw)) {
          cur = 'focus';
          const after = raw.replace(/^what[’']?s\s*new\s*\/?\s*focus[^:]*:?\s*/i, '').trim();
          if (after) sections.focus.push(after);
          continue;
        }
        if (/^what\s+we\s+did\s+today/i.test(raw)) { cur = 'other'; continue; }
        if (/^tee\s*:/i.test(raw)) {
          cur = 'tee';
          const after = raw.replace(/^tee\s*:\s*/i, '').trim();
          if (after) sections.tee.push(after);
          continue;
        }
        if (/^(ft|front\s*toss)\s*:/i.test(raw)) {
          cur = 'ft';
          const after = raw.replace(/^(ft|front\s*toss)\s*:\s*/i, '').trim();
          if (after) sections.ft.push(after);
          continue;
        }
        if (/^machine\s*:?/i.test(raw) && low.length < 24) {
          cur = 'machine';
          const after = raw.replace(/^machine\s*:?\s*/i, '').trim();
          if (after) sections.machine.push(after);
          continue;
        }
        if (/^homework\s*[-:–]?/i.test(raw)) {
          cur = 'homework';
          const after = raw.replace(/^homework\s*[-:–]?\s*/i, '').trim();
          if (after) sections.homework.push(after);
          continue;
        }
        sections[cur].push(raw);
      }

      const cleanBullets = (arr) => arr.map(x => x.replace(/^[•\-*]\s*/, '').trim()).filter(Boolean).join('\n');
      const focus = sections.focus.join('\n').trim() || sections.other.join('\n').trim() || 'Session notes imported from Apple Notes';
      const tee = cleanBullets(sections.tee);
      const ft = cleanBullets(sections.ft);
      const machine = cleanBullets(sections.machine);
      const warmup = sections.warmup.join('\n').trim();
      const homework = sections.homework.length ? sections.homework.join('\n').trim() : GINA_HOMEWORK_DEFAULT;

      // Auto-tag based on content
      const fullLow = text.toLowerCase();
      const tags = [];
      if (fullLow.includes('variability')) tags.push('Variability');
      if (fullLow.includes('barrel')) tags.push('Barrel Control');
      if (fullLow.includes('3/3/3') || fullLow.includes('extension')) tags.push('Extensions');
      if (fullLow.includes('at bat') || fullLow.includes('hunting')) tags.push('Approach');
      if (fullLow.includes('slap')) tags.push('Slapping');
      if (fullLow.includes('catch') || fullLow.includes('pop time')) tags.push('Catching');
      if (fullLow.includes('infield') || fullLow.includes('short hop')) tags.push('Defense');
      if (!tags.length) tags.push('Hitting');

      return { date, warmup, focus, tee, ft, machine, homework, tags: tags.slice(0, 3), clips: [] };
    }

    function splitMultipleDatedNotes(rawText) {
      const text = stripHtmlToText(rawText || '').trim();
      if (!text) return [];
      const chunks = text.split(/(?=^\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\s*$)/m).map(c => c.trim()).filter(Boolean);
      return chunks.length ? chunks.map(c => parseGinaAppleNote(c)) : [parseGinaAppleNote(text)];
    }

    async function handleAppleNotesFolderUpload(input) {
      const files = Array.from(input.files || []);
      if (!files.length) return;
      const byAthlete = {};
      for (const file of files) {
        const rel = file.webkitRelativePath || file.name;
        const parts = rel.split('/').filter(Boolean);
        // Folder structure: RootExport / AthleteName / note.md (or AthleteName / note.md)
        const athleteName = parts.length >= 3 ? parts[parts.length - 2] : parts.length === 2 ? parts[0] : 'Imported Athlete';
        if (athleteName.startsWith('.') || file.name.startsWith('.')) continue;
        if (!byAthlete[athleteName]) byAthlete[athleteName] = { athleteName, ageGroup: '14U', notes: [], media: [] };

        if (/\.(md|txt|html?)$/i.test(file.name)) {
          const content = await file.text();
          const parsed = parseGinaAppleNote(content, file.name);
          byAthlete[athleteName].notes.push(parsed);
        } else if (/\.(mp4|mov|m4v|webm|jpe?g|png)$/i.test(file.name)) {
          byAthlete[athleteName].media.push({ title: file.name, url: URL.createObjectURL(file), img: 'assets/images/fastpitch-hitter.jpg' });
        }
      }
      // Attach folder media to latest note for that athlete
      _importPreviewData = Object.values(byAthlete).filter(a => a.notes.length > 0).map(a => {
        if (a.media.length && a.notes.length) a.notes[0].clips = a.media;
        return a;
      });
      renderAppleNotesPreviewBox();
    }

    async function handleAppleNotesJsonUpload(input) {
      const file = input.files?.[0];
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        const arr = Array.isArray(data) ? data : (data.athletes || data.folders || []);
        const map = {};
        arr.forEach(item => {
          const name = (item.athlete || item.folder || item.name || 'Imported Athlete').trim();
          if (!map[name]) map[name] = { athleteName: name, ageGroup: item.ageGroup || '14U', notes: [] };
          if (Array.isArray(item.notes)) {
            item.notes.forEach(n => map[name].notes.push(parseGinaAppleNote(n.body || n.text || n.content || '', n.title || n.date || '')));
          } else if (item.body || item.text || item.content) {
            map[name].notes.push(parseGinaAppleNote(item.body || item.text || item.content, item.title || item.date || ''));
          }
        });
        _importPreviewData = Object.values(map).filter(a => a.notes.length > 0);
        renderAppleNotesPreviewBox();
      } catch (err) {
        showToast('Could not read JSON file — check format and try again.');
      }
    }

    function copyMacExportScript() {
      const script = `osascript -l JavaScript -e '
const app = Application("Notes");
const out = [];
for (const folder of app.folders()) {
  const fname = folder.name();
  if (["Notes","Recently Deleted"].includes(fname)) continue;
  const notes = [];
  for (const n of folder.notes()) {
    notes.push({ title: n.name(), body: n.plaintext() });
  }
  if (notes.length) out.push({ athlete: fname, notes });
}
const str = JSON.stringify(out, null, 2);
const path = $.NSString.alloc.initWithUTF8String("~/Desktop/gina_notes_export.json").stringByExpandingTildeInPath;
$.NSString.alloc.initWithUTF8String(str).writeToFileAtomicallyEncodingError(path, true, $.NSUTF8StringEncoding, null);
"Exported " + out.length + " athlete folders to Desktop/gina_notes_export.json";
'`;
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(script).then(() => showToast('Mac Terminal export command copied!')).catch(() => showToast('Script ready!'));
      } else {
        showToast('Mac export command copied!');
      }
    }
