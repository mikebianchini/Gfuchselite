              <button type="button" onclick="openSessionPlanModal('${s.id}')" class="w-full text-left surface-soft rounded-2xl px-3.5 py-2.5 space-y-0.5 cursor-pointer hover:border-[#010101] transition">
                <div class="flex items-center justify-between gap-2">
                  <span class="inline-flex items-center gap-1 text-[11px] font-extrabold text-[#4E6075] dark:text-[#D5FF5F]">${uiIcon('clipboard', 'w-3 h-3')} Session Plan</span>
                  <span class="text-[10px] font-bold text-[var(--text-muted)]">Edit</span>
                </div>
                ${plan.goal ? `<div class="text-xs font-bold truncate">${esc(plan.goal)}</div>` : ''}
                ${plan.drills ? `<div class="text-[11px] text-[var(--text-muted)] truncate">${esc(plan.drills.replace(/\n/g, ' • '))}</div>` : ''}
              </button>
            ` : ''}

            ${!isCanceled ? `
              <div class="flex flex-wrap items-center gap-2">
                ${s.athleteId ? `
                  <button onclick="openSessionRecapModal('${s.athleteId}', '${s.id}')" class="flex-1 sm:flex-none px-3.5 py-2.5 rounded-xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer inline-flex items-center justify-center gap-1.5 shadow-sm hover:brightness-95">${uiIcon('note')} Start Notes</button>
                  <label class="px-3.5 py-2.5 rounded-xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer inline-flex items-center justify-center gap-1.5 hover:opacity-90">
                    ${uiIcon('video')} Record Video
                    <input type="file" accept="video/*" capture="environment" onchange="quickRecordSessionVideo('${s.athleteId}', '${s.id}', this)" class="hidden" />
                  </label>
                ` : ''}
                <button onclick="openSessionPlanModal('${s.id}')" class="px-3 py-2.5 rounded-xl surface-soft text-xs font-extrabold cursor-pointer hover:border-[#010101] inline-flex items-center gap-1.5">${uiIcon('clipboard')} ${plan ? 'Edit Plan' : '+ Plan'}</button>
                ${s.athleteId ? `<button onclick="openPreviousSessionsModal('${s.athleteId}', '${s.id}')" class="px-3 py-2.5 rounded-xl surface-soft text-xs font-bold cursor-pointer hover:border-[#010101] inline-flex items-center gap-1.5">${uiIcon('history')} Last Session</button>` : ''}
              </div>
            ` : `
              <div class="flex items-center justify-between gap-2">
                <span class="px-2.5 py-1.5 rounded-xl bg-red-500/15 text-red-600 dark:text-red-400 text-[11px] font-extrabold">Canceled</span>
                <button onclick="openManageSessionModal('${s.id}')" class="px-3 py-2 rounded-xl surface-soft text-xs font-extrabold cursor-pointer">Restore / Delete</button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderCoachToday() {
      const days = getRolling7Days();
      const today = days[0];
      const todayFullLabel = new Date(today.iso + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

      const todaySessions = state.sessions.filter(s => sessionMatchesDay(s, today));
      const next7DaysWithSessions = days.map(d => ({
        ...d,
        sessions: state.sessions.filter(s => sessionMatchesDay(s, d))
      }));
      const totalNext7Count = next7DaysWithSessions.reduce((sum, d) => sum + d.sessions.length, 0);

      // Build dynamic Important Actions Needed list
      const pendingCash = state.payments.filter(p => p.status === 'Pending Cash');
      const pendingCashTotal = pendingCash.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
      const draftRecaps = state.sessionRecaps.filter(r => r.isDraft);
      const unreadCount = state.threads.reduce((sum, t) => sum + (Number(t.unread) || 0), 0);

      const actionItems = [];
      if (pendingCash.length > 0) {
        actionItems.push({
          badge: `$${pendingCashTotal.toLocaleString()}`,
          badgeCls: 'bg-amber-400/20 text-amber-800 dark:text-amber-300',
          title: `${pendingCash.length} Pending Cash Payment${pendingCash.length === 1 ? '' : 's'}`,
          sub: 'Collect cash at lesson or mark as paid in Payments.',
          btnLabel: 'Review Payments',
          onClick: `setTab('payments')`
        });
      }
      if (draftRecaps.length > 0) {
        const latestDraft = draftRecaps[0];
        actionItems.push({
          badge: `${draftRecaps.length} Draft${draftRecaps.length === 1 ? '' : 's'}`,
          badgeCls: 'bg-[#D5FF5F] text-[#010101]',
          title: `${draftRecaps.length} Auto-Saved Session Note Draft${draftRecaps.length === 1 ? '' : 's'}`,
          sub: 'Finish & share with parent when ready.',
          btnLabel: 'Continue Note',
          onClick: latestDraft.athleteId
            ? `openSessionRecapModal('${latestDraft.athleteId}', '${latestDraft.sessionId || ''}', '${latestDraft.id}')`
            : `state.rosterFilter='drafts'; state.rosterView='list'; setTab('athletes');`
        });
      }
      if (unreadCount > 0) {
        actionItems.push({
          badge: `${unreadCount} New`,
          badgeCls: 'bg-[#010101] text-[#D5FF5F]',
          title: `${unreadCount} Unread Parent Message${unreadCount === 1 ? '' : 's'}`,
          sub: 'Reply in Coach Messages.',
          btnLabel: 'Open Messages',
          onClick: `setTab('messaging')`
        });
      }
      if (state.waitlist.length > 0) {
        actionItems.push({
          badge: `${state.waitlist.length}`,
          badgeCls: 'bg-[#D6DFE2] text-[#010101]',
          title: `${state.waitlist.length} Athlete${state.waitlist.length === 1 ? '' : 's'} on Waitlist`,
          sub: 'Offer open cage slots via 1-tap text.',
          btnLabel: 'Offer Slot',
          onClick: `notifyWaitlist('${state.waitlist[0].id}')`
        });
      }

      const activeDayFilter = state.homeDayFilter || 'all7';
      const filtered7Days = activeDayFilter === 'all7'
        ? next7DaysWithSessions.filter(d => d.sessions.length > 0)
        : next7DaysWithSessions.filter(d => d.iso === activeDayFilter);

      const isReordering = Boolean(state.homeReordering);
      const sectionOrder = getHomeSectionOrder();
      const sectionMeta = {
        metrics: { label: 'At-a-Glance Metrics', sub: 'Today, Next 7 Days & Athletes counters' },
        actions: { label: 'Important Actions Needed', sub: actionItems.length ? `${actionItems.length} pending item${actionItems.length === 1 ? '' : 's'}` : 'Auto-hides when all caught up' },
        today: { label: 'Today’s Schedule', sub: `${todaySessions.length} session${todaySessions.length === 1 ? '' : 's'} today` },
        next7: { label: 'Next 7 Days', sub: `${totalNext7Count} scheduled this week` }
      };

      const activeAthletesCount = state.athletes.filter(a => !a.archived).length;
      const sectionHtmlMap = {
        metrics: `
          <div class="card-white rounded-[24px] grid grid-cols-3 divide-x divide-[var(--border-subtle)] overflow-hidden">
            <button onclick="scheduleSelectDate('${today.iso}', 'day'); setTab('schedule');" class="p-3.5 sm:p-4 text-left hover:bg-white/40 dark:hover:bg-white/5 cursor-pointer">
              <div class="inline-flex items-center gap-1.5 text-[13px] font-semibold text-[var(--text-muted)]">${uiIcon('calendar', 'w-3.5 h-3.5 text-[#4E6075] dark:text-[#9AC0D6]')} Today</div>
              <div class="text-2xl font-extrabold tabular-nums mt-0.5">${todaySessions.length}</div>
              <div class="inline-flex items-center gap-0.5 text-xs text-[#4E6075] dark:text-[#9AC0D6] font-bold mt-0.5">Day view ${uiIcon('chevronRight', 'w-3 h-3')}</div>
            </button>
            <button onclick="state.schedule.view='week'; setTab('schedule');" class="p-3.5 sm:p-4 text-left hover:bg-white/40 dark:hover:bg-white/5 cursor-pointer">
              <div class="inline-flex items-center gap-1.5 text-[13px] font-semibold text-[var(--text-muted)]">${uiIcon('clock', 'w-3.5 h-3.5 text-[#4E6075] dark:text-[#9AC0D6]')} Next 7 days</div>
              <div class="text-2xl font-extrabold tabular-nums mt-0.5">${totalNext7Count}</div>
              <div class="inline-flex items-center gap-0.5 text-xs text-[#4E6075] dark:text-[#9AC0D6] font-bold mt-0.5">Week view ${uiIcon('chevronRight', 'w-3 h-3')}</div>
            </button>
            <button onclick="setTab('athletes')" class="p-3.5 sm:p-4 text-left hover:bg-white/40 dark:hover:bg-white/5 cursor-pointer">
              <div class="inline-flex items-center gap-1.5 text-[13px] font-semibold text-[var(--text-muted)]">${uiIcon('users', 'w-3.5 h-3.5 text-[#4E6075] dark:text-[#9AC0D6]')} Athletes</div>
              <div class="text-2xl font-extrabold tabular-nums mt-0.5">${activeAthletesCount}</div>
              <div class="inline-flex items-center gap-0.5 text-xs text-[#4E6075] dark:text-[#9AC0D6] font-bold mt-0.5">Roster ${uiIcon('chevronRight', 'w-3 h-3')}</div>
            </button>
          </div>
        `,
        actions: actionItems.length ? `
          <div class="card-white rounded-[28px] p-5 sm:p-6 space-y-3.5">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-base font-extrabold tracking-tight">Important Actions Needed</h2>
                <p class="text-xs text-[var(--text-muted)]">Pending payments, draft notes &amp; unread messages</p>
              </div>
              <span class="px-2.5 py-1 rounded-full text-[11px] font-extrabold bg-[#010101] text-[#D5FF5F]">
                ${actionItems.length} Action${actionItems.length === 1 ? '' : 's'}
              </span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              ${actionItems.map(item => `
                <div class="surface-soft rounded-2xl p-4 flex items-center justify-between gap-3">
                  <div class="min-w-0">
                    <div class="flex items-center gap-2">
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${item.badgeCls}">${item.badge}</span>
                      <span class="font-extrabold text-xs sm:text-sm truncate">${item.title}</span>
                    </div>
                    <div class="text-[11px] text-[var(--text-muted)] mt-1 truncate">${item.sub}</div>
                  </div>
                  <button onclick="${item.onClick}" class="px-3 py-2 rounded-xl bg-[#010101] text-[#D5FF5F] text-[11px] font-extrabold shrink-0 cursor-pointer hover:opacity-90 transition">
                    ${item.btnLabel}
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        ` : (isReordering ? `
          <div class="card-white rounded-[24px] p-4 text-xs text-[var(--text-muted)] flex items-center justify-between gap-2">
            <span class="font-bold">Important Actions Needed</span>
            <span class="px-2.5 py-1 rounded-full surface-soft text-[10px] font-extrabold">Auto-hides when empty</span>
          </div>
        ` : ''),
        today: `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-lg font-extrabold tracking-tight">Today’s Schedule</h2>
                <p class="text-xs text-[var(--text-muted)]">${todayFullLabel}</p>
              </div>
              ${todaySessions.length ? `<button onclick="openAddSessionModal('${today.iso}')" class="px-3 py-1.5 rounded-xl surface-soft text-xs font-extrabold cursor-pointer hover:border-[#010101] transition">+ Add Today</button>` : ''}
            </div>

            ${todaySessions.length ? `
              <div class="space-y-3">
                ${todaySessions.map(s => renderCoachSessionRow(s, false)).join('')}
              </div>
            ` : `
              <div class="card-white rounded-[22px] p-4 flex items-center justify-between gap-3">
                <div class="min-w-0">
                  <div class="font-extrabold text-xs sm:text-sm">No sessions scheduled today</div>
                  <div class="text-[11px] text-[var(--text-muted)] truncate">Your cage is open for 1-on-1 or group sessions</div>
                </div>
                <button onclick="openAddSessionModal('${today.iso}')" class="px-3.5 py-2 rounded-xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer shrink-0 hover:brightness-95 transition">+ Schedule</button>
              </div>
            `}
          </div>
        `,
        next7: `
          <div class="space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="text-lg font-extrabold tracking-tight">Next 7 Days</h2>
                <p class="text-xs text-[var(--text-muted)]">${days[0].shortLabel} – ${days[6].shortLabel}</p>
              </div>
              <button onclick="state.homeDayFilter='all7'; render(false);" class="px-3.5 py-1.5 rounded-full text-xs font-extrabold cursor-pointer transition ${activeDayFilter === 'all7' ? 'bg-[#010101] text-[#D5FF5F]' : 'surface-soft text-[var(--text-muted)]'}">
                All 7 Days (${totalNext7Count})
              </button>
            </div>

            <!-- 7-Day Rolling Strip -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
              ${next7DaysWithSessions.map(d => {
                const isSelected = activeDayFilter === d.iso;
                const count = d.sessions.length;
                return `
                  <button onclick="state.homeDayFilter='${d.iso}'; render(false);" class="flex flex-col items-center justify-center min-w-[68px] py-3 px-2 rounded-2xl border transition cursor-pointer ${isSelected ? 'bg-[#010101] text-[#D5FF5F] border-[#010101] font-extrabold shadow-md' : 'card-white text-[var(--text-muted)] hover:border-[#010101]'}">
                    <span class="text-[10px] font-bold">${d.isToday ? 'TODAY' : d.dow}</span>
                    <span class="text-lg font-extrabold leading-tight mt-0.5 ${isSelected ? 'text-[#D5FF5F]' : 'text-[var(--text-main)]'}">${d.num}</span>
                    <span class="mt-1 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full ${count ? (isSelected ? 'bg-[#D5FF5F] text-[#010101]' : 'bg-[#D5FF5F]/80 text-[#010101]') : 'opacity-40'}">${count ? count : '—'}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- 7-Day Agenda List -->
            ${filtered7Days.some(d => d.sessions.length > 0) ? `
              <div class="space-y-4">
                ${filtered7Days.map(d => d.sessions.length ? `
                  <div class="space-y-2.5">
                    <div class="flex items-center justify-between px-1">
                      <span class="text-xs font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">${d.isToday ? `Today • ${d.shortLabel}` : d.shortLabel}</span>
                      <span class="text-[11px] font-bold text-[var(--text-muted)]">${d.sessions.length} session${d.sessions.length === 1 ? '' : 's'}</span>
                    </div>
                    ${d.sessions.map(s => renderCoachSessionRow(s, false)).join('')}
                  </div>
                ` : '').join('')}
              </div>
            ` : `
              <div class="card-white rounded-[22px] p-4 flex items-center justify-between gap-3">
                <div class="min-w-0">
                  <div class="font-extrabold text-xs sm:text-sm">${activeDayFilter === 'all7' ? 'No sessions in the next 7 days' : 'No sessions on this day'}</div>
                  <div class="text-[11px] text-[var(--text-muted)] truncate">Schedule a session for any lesson</div>
                </div>
                <button onclick="openAddSessionModal('${activeDayFilter === 'all7' ? today.iso : activeDayFilter}')" class="px-3.5 py-2 rounded-xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer shrink-0">+ Add Session</button>
              </div>
            `}
          </div>
        `
      };

      const renderedSections = sectionOrder.map((secId, idx) => {
        const content = sectionHtmlMap[secId] || '';
        if (!content) return '';
        if (!isReordering) return content;
        const meta = sectionMeta[secId] || { label: secId, sub: '' };
        const isFirst = idx === 0;
        const isLast = idx === sectionOrder.length - 1;
        return `
          <div
            draggable="true"
            ondragstart="onHomeSectionDragStart(event, '${secId}')"
            ondragover="onHomeSectionDragOver(event)"
            ondrop="onHomeSectionDrop(event, '${secId}')"
            class="rounded-[30px] p-3.5 border-2 border-dashed border-[#010101]/25 dark:border-[#D5FF5F]/35 bg-[#D5FF5F]/5 space-y-3 transition"
          >
            <div class="flex items-center justify-between gap-2 px-1">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-7 h-7 rounded-xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold flex items-center justify-center cursor-grab shrink-0" title="Drag to reorder">⋮⋮</span>
                <div class="min-w-0">
                  <div class="text-xs font-extrabold truncate">${idx + 1}. ${meta.label}</div>
                  <div class="text-[10px] text-[var(--text-muted)] truncate">${meta.sub}</div>
                </div>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button type="button" onclick="moveHomeSection('${secId}', -1)" ${isFirst ? 'disabled' : ''} aria-label="Move up" class="w-8 h-8 rounded-xl card-white text-xs font-extrabold flex items-center justify-center ${isFirst ? 'opacity-30 cursor-not-allowed' : 'cursor-pointer hover:border-[#010101]'}">↑</button>
                <button type="button" onclick="moveHomeSection('${secId}', 1)" ${isLast ? 'disabled' : ''} aria-label="Move down" class="w-8 h-8 rounded-xl card-white text-xs font-extrabold flex items-center justify-center ${isLast ? 'opacity-30 cursor-not-allowed' : 'cursor-pointer hover:border-[#010101]'}">↓</button>
              </div>
            </div>
            ${content}
          </div>
        `;
      }).filter(Boolean).join('');

      return `
        <!-- Coach Home Header + Quick Actions + 1-Tap Athlete Jump -->
        <div class="card-mist rounded-[28px] p-4 sm:p-6 space-y-3.5">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h1 class="text-2xl sm:text-3xl font-extrabold">Coach Gina</h1>
              <p class="text-[13px] font-medium text-[var(--text-muted)] mt-0.5">${todayFullLabel} · Pittsburgh Eastern Time</p>
            </div>
            <button onclick="toggleHomeReorderMode()" title="Reorder Home sections" aria-label="Reorder Home sections" class="px-3 py-2 rounded-2xl text-[13px] font-bold cursor-pointer shrink-0 inline-flex items-center gap-1 ${isReordering ? 'bg-[#010101] text-[#D5FF5F] shadow-sm' : 'card-white text-[var(--text-muted)] hover:text-[var(--text-main)] hover:border-[#010101]'}">
              <span>⇅</span>
              <span class="${isReordering ? '' : 'hidden sm:inline'}">${isReordering ? 'Done' : 'Reorder'}</span>
            </button>
          </div>

          <div class="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-2">
            <button onclick="openAddSessionModal()" class="py-2.5 px-4 rounded-2xl bg-[#D5FF5F] text-[#010101] text-[13px] font-extrabold cursor-pointer shadow-sm hover:brightness-95 inline-flex items-center justify-center gap-1.5">
              + Add Session
            </button>
            <button onclick="openAddAthleteModal(null)" class="py-2.5 px-4 rounded-2xl bg-[#010101] text-[#D5FF5F] text-[13px] font-extrabold cursor-pointer shadow-sm hover:opacity-90 inline-flex items-center justify-center gap-1.5">
              + Add Athlete
            </button>
          </div>

          ${activeAthletesCount > 0 ? `
            <div class="relative">
              <svg class="w-4 h-4 text-[var(--text-muted)] absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/></svg>
              <input
                type="search"
                value="${(state.homeQuickSearch || '').replace(/"/g, '&quot;')}"
                oninput="updateHomeQuickSearch(this.value)"
                placeholder="Quick find any of ${activeAthletesCount} athletes &amp; notes…"
                class="w-full pl-10 pr-4 py-2.5 rounded-2xl card-white text-[16px] sm:text-xs font-medium"
              />
              <div id="home-quick-search-results" class="${(state.homeQuickSearch || '').trim() ? '' : 'hidden'} mt-2 space-y-1.5">${renderHomeQuickSearchResults()}</div>
            </div>
          ` : ''}

          ${isReordering ? `
            <div class="card-white rounded-2xl p-3 flex flex-wrap items-center justify-between gap-2 text-xs">
              <span class="font-bold text-[var(--text-muted)]">Drag sections or tap <strong>↑ / ↓</strong> to customize Home — syncs across devices.</span>
              <button type="button" onclick="resetHomeSectionOrder()" class="px-3 py-1.5 rounded-xl surface-soft text-[11px] font-extrabold cursor-pointer hover:border-[#010101]">Reset Default</button>
            </div>
          ` : ''}
        </div>

        ${renderedSections}
      `;
    }

    function renderHomeQuickSearchResults() {
      const q = (state.homeQuickSearch || '').trim().toLowerCase();
      if (!q) return '';
      const matches = state.athletes
        .filter(a => !a.archived && `${a.name} ${a.parentName || ''} ${a.team || ''}`.toLowerCase().includes(q))
        .slice(0, 5);
      if (!matches.length) {
        return `<div class="card-white rounded-2xl p-3 text-xs text-[var(--text-muted)]">No active athletes match "${q}".</div>`;
      }
      return matches.map(a => `
        <div class="card-white rounded-2xl p-2.5 flex items-center justify-between gap-2">
          <button type="button" onclick="state.homeQuickSearch=''; jumpToAthlete('${a.id}');" class="flex items-center gap-2.5 min-w-0 flex-1 text-left cursor-pointer">
            <span class="w-8 h-8 rounded-xl bg-[#010101] text-[#D5FF5F] font-extrabold text-[11px] flex items-center justify-center shrink-0">${a.initials}</span>
            <span class="font-extrabold text-xs truncate">${a.name}</span>
          </button>
          <button type="button" onclick="state.homeQuickSearch=''; openSessionRecapModal('${a.id}', null);" class="px-2.5 py-1.5 rounded-xl bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold shrink-0 cursor-pointer">Notes</button>
        </div>
      `).join('');
    }

    function updateHomeQuickSearch(val) {
      state.homeQuickSearch = val;
      const box = document.getElementById('home-quick-search-results');
      if (!box) return;
      if (!val.trim()) {
        box.classList.add('hidden');
        box.innerHTML = '';
      } else {
        box.classList.remove('hidden');
        box.innerHTML = renderHomeQuickSearchResults();
      }
    }

    const HOME_SECTION_DEFAULTS = ['today', 'next7', 'metrics', 'actions'];
    let _draggedHomeSectionId = null;

    function getHomeSectionOrder() {
      const saved = Array.isArray(state.cal?.homeSectionOrder) ? state.cal.homeSectionOrder : [];
      const valid = saved.filter(id => HOME_SECTION_DEFAULTS.includes(id));
      HOME_SECTION_DEFAULTS.forEach(id => {
        if (!valid.includes(id)) valid.push(id);
      });
      return valid;
    }

    function toggleHomeReorderMode() {
      state.homeReordering = !state.homeReordering;
      render(false);
    }

    function moveHomeSection(secId, delta) {
      const order = getHomeSectionOrder();
      const idx = order.indexOf(secId);
      const nextIdx = idx + delta;
      if (idx < 0 || nextIdx < 0 || nextIdx >= order.length) return;
      [order[idx], order[nextIdx]] = [order[nextIdx], order[idx]];
      state.cal.homeSectionOrder = order;
      render();
    }

    function resetHomeSectionOrder() {
      state.cal.homeSectionOrder = [...HOME_SECTION_DEFAULTS];
      render();
      showToast('Home section order reset to default!');
    }

    function onHomeSectionDragStart(e, secId) {
      _draggedHomeSectionId = secId;
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', secId); } catch (_) {}
      }
    }

    function onHomeSectionDragOver(e) {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    }

    function onHomeSectionDrop(e, targetSecId) {
      e.preventDefault();
      const srcId = _draggedHomeSectionId || e.dataTransfer?.getData('text/plain');
      _draggedHomeSectionId = null;
      if (!srcId || srcId === targetSecId) return;
      const order = getHomeSectionOrder();
      const fromIdx = order.indexOf(srcId);
      const toIdx = order.indexOf(targetSecId);
      if (fromIdx < 0 || toIdx < 0) return;
      order.splice(fromIdx, 1);
      order.splice(toIdx, 0, srcId);
      state.cal.homeSectionOrder = order;
      render();
    }

    function splitAthleteName(ath) {
      if (!ath) return { firstName: '', lastName: '' };
      if (ath.firstName || ath.lastName) {
        return { firstName: String(ath.firstName || '').trim(), lastName: String(ath.lastName || '').trim() };
      }
      const parts = String(ath.name || '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return { firstName: '', lastName: '' };
      if (parts.length === 1) return { firstName: parts[0], lastName: '' };
      return { firstName: parts[0], lastName: parts.slice(1).join(' ') };
    }

    function submitEditAthlete(e, athId) {
      e.preventDefault();
      const ath = state.athletes.find(a => a.id === athId);
      if (!ath) return;
      const f = e.target;
      const oldName = ath.name;
      const firstName = (f.firstName?.value || '').trim();
      const lastName = (f.lastName?.value || '').trim();
      const newName = [firstName, lastName].filter(Boolean).join(' ') || (f.name?.value || '').trim();
      if (!newName) return;

      const parts = newName.split(/\s+/).filter(Boolean);
      ath.firstName = firstName || parts[0] || '';
      ath.lastName = lastName || parts.slice(1).join(' ') || '';
      ath.name = newName;
      ath.initials = ((ath.firstName[0] || parts[0]?.[0] || 'A') + (ath.lastName[0] || parts[1]?.[0] || parts[0]?.[1] || 'F')).toUpperCase();
      ath.ageGroup = f.ageGroup.value;
      ath.gradYear = f.gradYear.value ? Number(f.gradYear.value) : '';
      ath.height = f.height.value.trim();
      ath.position = f.position.value.trim();
      ath.batsThrows = f.batsThrows.value;
      ath.team = f.team.value.trim();
      ath.playerPhone = (f.playerPhone?.value || '').trim();
      ath.playerEmail = (f.playerEmail?.value || '').trim();
      ath.parentName = f.parentName.value.trim();
      ath.parentPhone = f.parentPhone.value.trim();
      ath.parentEmail = f.parentEmail.value.trim();
      ath.emergencyContact = f.emergencyContact.value.trim();
      ath.medicalNotes = f.medicalNotes.value.trim();
      ath.coachBio = f.coachBio.value.trim();
      ath._modifiedAt = Date.now();

      // Cascade renamed athlete name across sessions, recaps & videos
      if (oldName !== newName) {
        state.sessions.forEach(s => {
          if (s.athleteId === ath.id && Array.isArray(s.athletes)) {
            s.athletes = s.athletes.map(n => n === oldName ? newName : n);
            s._modifiedAt = Date.now();
          }
        });
        state.sessionRecaps.forEach(r => {
          if (r.athleteId === ath.id) { r.athleteName = newName; r._modifiedAt = Date.now(); }
        });
        state.videos.forEach(v => {
          if (v.athleteId === ath.id) { v.athleteName = newName; v._modifiedAt = Date.now(); }
        });
      }

      closeModal();
      render();
      showToast(`Updated ${ath.name}’s profile!`);
    }

    function confirmRemoveAthlete(athId) {
      
      const ath = state.athletes.find(a => a.id === athId);
      if (!ath) return;
      recordDeletedId('athletes', athId);
      state.athletes = state.athletes.filter(a => a.id !== athId);
      state.cal.cart = state.cal.cart.filter(item => item.athleteId !== athId);

      if (state.selectedAthleteId === athId) {
        state.selectedAthleteId = state.athletes[0]?.id || null;
      }
      state.rosterView = 'list';
      if (state.activeSiblingId === athId) {
        const nextFam = state.athletes.find(a => a.familyId === 'fam-1') || state.athletes[0];
        state.activeSiblingId = nextFam?.id || null;
      }
      closeModal();
      render();
      showToast(`Removed ${ath.name} from roster.`);
    }

            </div>
            <div>
              <label class="block font-bold text-[var(--text-muted)] mb-1">Start (EST) *</label>

                ${durations.map(m => `<option value="${m}" ${defaultDur === m ? 'selected' : ''}>${m >= 60 && m % 60 === 0 ? `${m / 60}h` : `${m}m`}</option>`).join('')}

              <option value="cash-pending">Cash at Session (Pending — Cash Price)</option>
              <option value="cash-paid">Cash Collected ✓ (Cash Price)</option>
              <option value="clover-paid">Clover Card Paid ✓ (Card Price)</option>
              <option value="venmo-paid">Venmo / Zelle Logged ✓ (Cash Price)</option>
            </select>

          <label class="flex items-center justify-between gap-3 p-3 rounded-2xl card-mist cursor-pointer">

            </div>

          <button type="submit" class="w-full py-3.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-sm font-extrabold cursor-pointer shadow-lg hover:brightness-95 transition">
            + Schedule Session for ${ath.name.split(' ')[0]}
          </button>
        </form>
      `);
    }

    function submitAddSessionForAthlete(e, athId, extraAthleteIds = []) {
      e.preventDefault();
      const f = e.target;
      const evt = state.cal.eventTypes.find(t => t.id === f.eventTypeId.value) || state.cal.eventTypes[0];
      const baseIso = f.date.value;
      const hm = f.time.value; // "16:00"
      const [hh, mm] = hm.split(':').map(Number);
      const ampm = hh >= 12 ? 'PM' : 'AM';
      const h12 = hh % 12 || 12;
      const timeNice = `${h12}:${String(mm).padStart(2, '0')} ${ampm}`;
      const durMin = Number(f.durationMin?.value) || Number(evt?.duration) || 45;
      const durLabel = durMin >= 60 && durMin % 60 === 0 ? `${durMin / 60}H` : `${durMin}M`;
      const focus = f.focus.value.trim() || evt.title;
      const payMode = f.paymentMode.value;
      const isCard = payMode === 'clover-paid';
      const appliedPrice = isCard ? getCardPrice(evt) : getCashPrice(evt);

      // Collect all selected athletes (primary + any group multi-select)
      const allIds = [...new Set([athId, ...(Array.isArray(extraAthleteIds) ? extraAthleteIds : [])].filter(Boolean))];
      const selectedAthletes = allIds.map(id => state.athletes.find(a => a.id === id)).filter(Boolean);
      const primaryAth = selectedAthletes[0] || null;
      const athNames = selectedAthletes.map(a => a.name);

      const payLabel = !primaryAth ? `${formatDualPrice(evt)}`
        : payMode === 'cash-pending' ? `Cash at Session ($${appliedPrice})`
        : payMode === 'cash-paid' ? `Cash Paid ($${appliedPrice})`
        : payMode === 'clover-paid' ? `Clover Paid ($${appliedPrice})`
        : `Venmo/Zelle ($${appliedPrice})`;

      // Build occurrence dates for single or recurring bookings
      const repeatMode = f.repeatMode?.value || 'none';
      let count = 1;
      let stepDays = 7;
      if (repeatMode === 'weekly-4') { count = 4; stepDays = 7; }
      else if (repeatMode === 'weekly-8') { count = 8; stepDays = 7; }
      else if (repeatMode === 'biweekly-4') { count = 4; stepDays = 14; }

      const recGroupId = count > 1 ? 'recgrp-' + Date.now() : null;
      let createdCount = 0;
      let skippedCount = 0;
      let firstCreatedId = null;
      let firstDayNice = '';

      for (let i = 0; i < count; i++) {
        const iso = i === 0 ? baseIso : addDaysToIso(baseIso, i * stepDays);
        const slotKey = `${iso}@${hm}`;
        const hasConflict = i > 0 && state.sessions.some(x => x.status !== 'Canceled' && x.dateIso === iso && parseTime12To24(x.time) === hm);
        if (hasConflict) {
          skippedCount++;
          continue;
        }
        const dObj = new Date(iso + 'T12:00:00');
        const dayNice = dObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        const dayKey = dObj.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' }).replace(',', '');
        if (!firstDayNice) firstDayNice = dayNice;
        const sesId = 'ses-' + (Date.now() + i);
        if (!firstCreatedId) firstCreatedId = sesId;

        state.sessions.unshift({
          id: sesId,
          lessonId: evt.id,
          lessonTitle: evt.title,
          dateIso: iso,
          dayKey,
          day: dayNice,
          time: timeNice,
          durationMin: durMin,
          duration: durLabel,
          type: selectedAthletes.length > 1 ? 'Small Group' : evt.type,
          location: evt.location || '',
          focus,
          athletes: athNames,
          athleteId: primaryAth ? primaryAth.id : null,
          athleteIds: selectedAthletes.map(a => a.id),
          recurrenceGroupId: recGroupId,
          spotsMax: evt.type === 'Small Group' ? Math.max(6, selectedAthletes.length) : evt.type === 'Camp / Clinic' ? 16 : Math.max(1, selectedAthletes.length),
          status: 'Confirmed',
          payment: payLabel,
          price: appliedPrice,
          img: evt.img || (primaryAth ? getAthleteCoverImg(primaryAth) : 'assets/images/fastpitch-hitter.jpg'),
          _modifiedAt: Date.now()
        });

        if (!state.cal.bookedSlots.includes(slotKey)) state.cal.bookedSlots.push(slotKey);

        // Log payment entry for each athlete on the first occurrence (or pending cash on future)
        selectedAthletes.forEach((ath, aIdx) => {
          const isFuture = i > 0;
          const _nowPay = Date.now() + i * 10 + aIdx;
          const _isPaidNow = !(isFuture || payMode === 'cash-pending');
          state.payments.unshift({
            id: 'pay-' + _nowPay,
            date: dObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
            dateIso: iso,
            createdAt: _nowPay,
            paidAt: _isPaidNow ? _nowPay : null,
            athleteId: ath.id,
            sessionId: sesId,
            family: `${(ath.parentName || ath.name).split(' ').slice(-1)[0]} Family`,
            item: `${evt.title} (${ath.name.split(' ')[0]})`,
            amount: appliedPrice,
            method: (isFuture || payMode === 'cash-pending') ? 'Cash at Session' : payMode === 'cash-paid' ? 'Cash (Collected ✓)' : payMode === 'clover-paid' ? 'Clover • Card' : 'Venmo / Zelle (Logged)',
            status: _isPaidNow ? 'Paid' : 'Pending Cash',
            _modifiedAt: _nowPay
          });
        });
        createdCount++;
      }

      // Optional confirmation message to each parent
      if (selectedAthletes.length && f.notify?.checked) {
        const seriesNote = createdCount > 1 ? ` (${createdCount} recurring sessions)` : '';
        selectedAthletes.forEach((ath, aIdx) => {
          const parentKey = ath.parentName || ath.name;
          let thread = state.threads.find(t => t.parent === parentKey);
          if (!thread) {
            thread = { id: 'msg-' + (Date.now() + aIdx), parent: parentKey, athletes: ath.name, unread: 0, messages: [] };
            state.threads.unshift(thread);
          }
          thread.messages.push({
            from: 'coach',
            time: 'Just now',
            text: `Scheduled ${ath.name.split(' ')[0]} for ${evt.title} session on ${firstDayNice} at ${timeNice} EST${seriesNote} (${durLabel.toLowerCase()}, ${payLabel}). See you in the cage!`
          });
        });
      }

      closeModal();
      render();
      const whoLabel = selectedAthletes.length > 1
        ? `${selectedAthletes.length} athletes`
        : (primaryAth ? primaryAth.name.split(' ')[0] : 'Open Session');
      const skipMsg = skippedCount ? ` (${skippedCount} skipped due to conflict)` : '';
      showToast(createdCount > 1
        ? `Scheduled ${createdCount} recurring sessions for ${whoLabel} starting ${firstDayNice} at ${timeNice}!${skipMsg}`
        : `Scheduled ${evt.title} on ${firstDayNice} at ${timeNice} for ${whoLabel}!`);
      if (state.cal?.calendarSync?.autoPrompt && firstCreatedId) {
        openCalendarSyncModal(firstCreatedId);
      }
    }

    function archiveAthlete(athId) {
      const ath = state.athletes.find(a => a.id === athId);
      if (!ath) return;
      ath.archived = true;
      ath.archivedAt = new Date().toISOString();
      ath._modifiedAt = Date.now();
      state.cal.cart = (state.cal.cart || []).filter(item => item.athleteId !== athId);
      if (state.rosterView === 'detail' && state.selectedAthleteId === athId) {
        state.rosterView = 'list';
      }
      render();
      showToast(`Archived ${ath.name} — notes & videos preserved.`);
    }

    function unarchiveAthlete(athId) {
      const ath = state.athletes.find(a => a.id === athId);
      if (!ath) return;
      ath.archived = false;
      ath.archivedAt = null;
      ath._modifiedAt = Date.now();
      if (state.rosterFilter === 'archived' && !state.athletes.some(a => a.archived)) {
        state.rosterFilter = 'all';
      }
      render();
      showToast(`Restored ${ath.name} to active roster!`);
    }

    function setRosterSort(col) {
      if (state.rosterSortCol === col) state.rosterSortDir = state.rosterSortDir === 'asc' ? 'desc' : 'asc';
      else { state.rosterSortCol = col; state.rosterSortDir = 'asc'; }
      const sel = document.getElementById('roster-sort-select');
      if (sel) sel.value = `${state.rosterSortCol}:${state.rosterSortDir}`;
      const box = document.getElementById('roster-list-container');
      if (box) box.innerHTML = renderRosterRowsHtml();
    }

    function setRosterSortPreset(val) {
      const [col, dir] = String(val || 'firstName:asc').split(':');
      state.rosterSortCol = col || 'firstName';
      state.rosterSortDir = dir === 'desc' ? 'desc' : 'asc';
      const box = document.getElementById('roster-list-container');
      if (box) box.innerHTML = renderRosterRowsHtml();
    }

    function getFilteredRosterAthletes() {
      const q = (state.rosterSearch || '').trim().toLowerCase();
      const f = state.rosterFilter || 'all';
      const todayIso = getTodayIsoEst();
      const todayNames = new Set(
        state.sessions.filter(s => s.dateIso === todayIso || s.dayKey === 'Thu 26' || (s.day || '').includes('Today')).flatMap(s => s.athletes || [])
      );
      const todayIds = new Set(
        state.sessions.filter(s => s.dateIso === todayIso || s.dayKey === 'Thu 26' || (s.day || '').includes('Today')).map(s => s.athleteId).filter(Boolean)
      );
      const draftIds = new Set(state.sessionRecaps.filter(r => r.isDraft).map(r => r.athleteId));
      const col = state.rosterSortCol || 'firstName';
      const dir = state.rosterSortDir === 'desc' ? -1 : 1;

      return state.athletes
        .filter(a => {
          const isArchived = Boolean(a.archived);
          if (f === 'archived') {
            if (!isArchived) return false;
          } else {
            if (isArchived) return false;
            if (f === 'today' && !(todayIds.has(a.id) || todayNames.has(a.name))) return false;
            if (f === 'waiver' && a.waiverSigned) return false;
            if (f === 'drafts' && !draftIds.has(a.id)) return false;
            if (['10U', '12U', '14U', '16U', '18U'].includes(f) && a.ageGroup !== f) return false;
          }
          if (q) {
            const hay = `${a.name} ${a.firstName || ''} ${a.lastName || ''} ${a.parentName || ''} ${a.position || ''} ${a.ageGroup || ''} ${a.gradYear || ''} ${a.team || ''}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        })
        .sort((a, b) => {
          const sa = splitAthleteName(a);
          const sb = splitAthleteName(b);
          if (col === 'lastName') {
            const la = (sa.lastName || sa.firstName || '').toLowerCase();
            const lb = (sb.lastName || sb.firstName || '').toLowerCase();
            return la.localeCompare(lb) * dir || sa.firstName.localeCompare(sb.firstName);
          }
          if (col === 'age') {
            const na = parseInt(a.ageGroup, 10);
            const nb = parseInt(b.ageGroup, 10);
            const va = isNaN(na) ? 999 : na;
            const vb = isNaN(nb) ? 999 : nb;
            return (va - vb) * dir || (a.name || '').localeCompare(b.name || '');
          }
          if (col === 'gradYear') {
            const ga = Number(a.gradYear) || 9999;
            const gb = Number(b.gradYear) || 9999;
            return (ga - gb) * dir || (a.name || '').localeCompare(b.name || '');
          }
          if (col === 'lastSeen') {
            const da = getAthleteLastSeenInfo(a.id).daysAgo ?? 9999;
            const db = getAthleteLastSeenInfo(b.id).daysAgo ?? 9999;
            return (da - db) * dir || (a.name || '').localeCompare(b.name || '');
          }
          return (sa.firstName || a.name || '').localeCompare(sb.firstName || b.name || '') * dir || (sa.lastName || '').localeCompare(sb.lastName || '');
        });
    }

                  </th>
                  <th class="py-3 px-2 hidden sm:table-cell">Parent</th>
                  <th class="py-3 pl-2 pr-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[var(--border-subtle)] text-xs">
                ${list.map(a => {
                  const hasDraft = draftIds.has(a.id);
                  const isArchived = Boolean(a.archived);
                  const seen = getAthleteLastSeenInfo(a.id);
                  const unpaid = getAthleteUnpaidInfo(a.id);
                  return `
                    <tr onclick="openCoachAthleteDetail('${a.id}')" class="hover:bg-white/50 dark:hover:bg-white/5 transition cursor-pointer ${isArchived ? 'opacity-75' : ''}">
                      <td class="py-3 pl-4 pr-2">
                        <div class="flex items-center gap-2.5 min-w-0">
                          <div class="relative w-8 h-8 rounded-xl ${isArchived ? 'surface-soft text-[var(--text-muted)]' : 'bg-[#010101] text-[#D5FF5F]'} font-extrabold text-[11px] flex items-center justify-center shrink-0">
                            ${a.initials}
                          </div>
                          <div class="min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap">
                              <span class="font-extrabold text-[13px] truncate">${a.name}</span>
                              ${isArchived ? `<span class="px-1.5 py-0.5 rounded surface-soft text-[var(--text-muted)] text-[9px] font-extrabold shrink-0">ARCHIVED</span>` : ''}
                              ${hasDraft ? `<span class="px-1.5 py-0.5 rounded bg-[#D5FF5F] text-[#010101] text-[9px] font-extrabold shrink-0">DRAFT</span>` : ''}
                              ${unpaid.total > 0 && !isArchived ? `<span class="px-1.5 py-0.5 rounded bg-amber-400/20 text-amber-800 dark:text-amber-300 text-[9px] font-extrabold shrink-0">$${unpaid.total} due</span>` : ''}
                            </div>
                            ${[a.ageGroup, a.position, a.team].filter(Boolean).length ? `<div class="md:hidden text-[11px] text-[var(--text-muted)] truncate">${[a.ageGroup, a.position, a.team].filter(Boolean).join(' • ')}</div>` : ''}
                          </div>

                      </td>
                      <td class="py-3 px-2 whitespace-nowrap">
                        <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${seen.isAtRisk ? 'bg-amber-400/20 text-amber-800 dark:text-amber-300' : 'surface-soft text-[var(--text-muted)]'}">${seen.label}</span>
                      </td>
                      <td class="py-3 px-2 hidden md:table-cell whitespace-nowrap">
                        ${a.ageGroup ? `<span class="px-2 py-0.5 rounded-full surface-soft text-[11px] font-extrabold">${a.ageGroup}</span>` : `<span class="text-[var(--text-muted)]">—</span>`}
                      </td>
                      <td class="py-3 px-2 hidden sm:table-cell">
                        ${a.parentName || a.parentPhone ? `
                          <div class="font-semibold truncate max-w-[140px]">${a.parentName || '—'}</div>
                          ${a.parentPhone ? `<div class="text-[11px] text-[var(--text-muted)] tabular-nums">${a.parentPhone}</div>` : ''}
                        ` : `<span class="text-[var(--text-muted)]">—</span>`}
                      </td>
                      <td class="py-3 pl-2 pr-4 text-right whitespace-nowrap" onclick="event.stopPropagation()">
                        <div class="inline-flex items-center gap-1.5">
                          ${isArchived ? `

                          ` : `

                            <button onclick="openSessionRecapModal('${a.id}', null)" title="Session Notes" class="px-2.5 py-1.5 rounded-xl bg-[#D5FF5F] text-[#010101] text-[11px] font-extrabold cursor-pointer">Notes</button>
                            <button onclick="openAddSessionForAthleteModal('${a.id}')" title="Add Session" aria-label="Add session for ${a.name}" class="w-8 h-8 rounded-xl surface-soft text-xs font-extrabold inline-flex items-center justify-center cursor-pointer">+</button>
                          `}
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // APPLE NOTES BULK IMPORTER (Folder Upload / JSON Export / Quick Paste)
    // =========================================================================
    let _importPreviewData = []; // [{ athleteName, ageGroup, notes: [{ date, warmup, focus, tee, ft, machine, homework, tags, clips }] }]
    let _importTab = 'folder'; // 'folder' | 'json' | 'paste'

    function sanitizeUnicodeText(str, maxLen = 0) {
      if (typeof str !== 'string') return '';
      // Remove null bytes, non-tab/newline control chars, object replacement chars, and inline base64 blobs
      let s = str
        .replace(/\u0000/g, '')
        .replace(/[\u0001-\u0008\u000B\u000C\u000E-\u001F\uFFFC]/g, '')
        .replace(/data:[a-z0-9/+.-]+;base64,[A-Za-z0-9+/=\s]{120,}/gi, '[embedded attachment]');
      // Strip lone/unpaired UTF-16 surrogates (PostgreSQL jsonb rejects unpaired surrogates!)
      let clean = '';
      for (let i = 0; i < s.length; i++) {
        const code = s.charCodeAt(i);
        if (code >= 0xD800 && code <= 0xDBFF) {
          const next = s.charCodeAt(i + 1);
          if (next >= 0xDC00 && next <= 0xDFFF) {
            clean += s[i] + s[i + 1];
            i++;
          }
        } else if (code >= 0xDC00 && code <= 0xDFFF) {
          // Drop lone low surrogate
        } else {
          clean += s[i];
        }
      }
      if (maxLen > 0 && clean.length > maxLen) clean = clean.slice(0, maxLen) + '…';
      return clean;
    }

    function stripHtmlToText(str) {
      const raw = sanitizeUnicodeText(String(str || ''));
      if (!/<[a-z][\s\S]*>/i.test(raw)) return raw;
      // Strip <head>, <style>, <script>, and base64 src attributes before parsing HTML
      const stripped = raw
        .replace(/<head\b[\s\S]*?<\/head>/gi, '\n')
        .replace(/<style\b[\s\S]*?<\/style>/gi, '\n')
        .replace(/<script\b[\s\S]*?<\/script>/gi, '\n')
        .replace(/src\s*=\s*["']data:[^"']*["']/gi, 'src=""')
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/(p|div|li|h[1-6]|tr)>/gi, '\n');
      const div = document.createElement('div');
      div.innerHTML = stripped;
      return sanitizeUnicodeText((div.textContent || div.innerText || '').replace(/\r\n/g, '\n'));
    }

    function cleanAppleNoteLine(rawLine) {
      let s = sanitizeUnicodeText(String(rawLine || ''));
      // Remove markdown image/video attachment syntax like ![file.MOV](attachments/file.MOV)
      s = s.replace(/!\[[^\]]*\]\([^)]*\)/g, ' ');
      // Remove raw attachments/ markdown links [file.MOV](attachments/...)
      s = s.replace(/\[[^\]]*\]\((?:attachments|files|media)\/[^)]*\)/gi, ' ');
      // Remove leading markdown heading hashes (#, ##, ###)
      s = s.replace(/^\s*#{1,6}\s*/, '');
      // Remove leading list bullets (*, -, •) before stripping emphasis
      s = s.replace(/^\s*[•\-*]\s+/, '');
      // Strip markdown bold/italic wrappers (**text**, __text__, _text_, *text*)
      s = s.replace(/\*{2,}/g, '');
      s = s.replace(/_{2,}/g, '');
      s = s.replace(/(^|\s)_([^_\n]+)_(\s|$|[.,!?:;])/g, '$1$2$3');
      s = s.replace(/(^|\s)\*([^*\n]+)\*(\s|$|[.,!?:;])/g, '$1$2$3');
      // Strip stray leading/trailing markdown punctuation
      s = s.replace(/^[\s*_`]+/, '').replace(/[\s*_`]+$/, '');
      // Collapse extra spaces and clean space before punctuation
      s = s.replace(/\s{2,}/g, ' ').replace(/\s+([,.:;!?])/g, '$1').trim();
      // Drop lines that are purely markdown/bullet noise
      if (!s || /^[\s*_~`#\-•–—]+$/.test(s)) return '';
      return s;
    }

    function parseGinaAppleNote(rawText, fallbackTitle = '') {
      const text = stripHtmlToText(rawText || '').trim();
      const rawLines = text.split('\n');
      const lines = [];
      for (const rl of rawLines) {
        const cleaned = cleanAppleNoteLine(rl);
        if (!cleaned) continue;
        // Skip consecutive duplicate lines (common in Apple Notes title + H1 exports)
        if (lines.length && lines[lines.length - 1].toLowerCase() === cleaned.toLowerCase()) continue;
        lines.push(cleaned);
      }

      // Detect leading date like 10/19/26, 9-14-26, or 9/29
      let date = sanitizeUnicodeText(fallbackTitle.replace(/\.(md|txt|html?)$/i, '').trim(), 160) || new Date().toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' });
      const dateMatch = lines[0]?.match(/^(\d{1,2}[\/-]\d{1,2}(?:[\/-]\d{2,4})?)$/);
      if (dateMatch) {
        date = dateMatch[1];
        lines.shift();
      }

      const sections = { warmup: [], focus: [], tee: [], ft: [], machine: [], homework: [], other: [] };
      let warmupTitle = 'Hitter’s Warm Up Routine';
      let cur = 'other';

      for (const raw of lines) {
        if (!raw) continue;
        const low = raw.toLowerCase();
        if (/^(?:hitter|slapper|catcher|player)?[’']?s?\s*warm\s*-?\s*up(?:\s+routine)?\s*:?/i.test(raw) && low.length < 48) {
          cur = 'warmup';
          if (low.includes('slapper')) warmupTitle = 'Slapper Warm Up Routine';
          else if (low.includes('catcher')) warmupTitle = 'Catcher’s Warm Up Routine';
          const after = raw.replace(/^(?:hitter|slapper|catcher|player)?[’']?s?\s*warm\s*-?\s*up(?:\s+routine)?\s*:?\s*/i, '').trim();
          if (after) sections.warmup.push(after);
          continue;
        }
        if (/^what[’']?s\s*new\s*\/?\s*focus/i.test(raw)) {
          cur = 'focus';
          const after = raw.replace(/^what[’']?s\s*new\s*\/?\s*focus[^:]*:?\s*/i, '').trim();
          if (after) sections.focus.push(after);
          continue;
        }
        if (/^what\s+we\s+did\s+today\s*:?$/i.test(raw)) { cur = 'other'; continue; }
        if (/^tee\s*:?/i.test(raw) && (raw.includes(':') || low.length <= 6)) {
          cur = 'tee';
          const after = raw.replace(/^tee\s*:?\s*/i, '').trim();
          if (after) sections.tee.push(after);
          continue;
        }
        if (/^(?:ft|front\s*toss)\s*:?/i.test(raw) && (raw.includes(':') || low.length <= 14)) {
          cur = 'ft';
          const after = raw.replace(/^(?:ft|front\s*toss)\s*:?\s*/i, '').trim();
          if (after) sections.ft.push(after);
          continue;
        }
        if (/^machine\s*:?/i.test(raw) && (raw.includes(':') || low.length < 24)) {
          cur = 'machine';
          const after = raw.replace(/^machine\s*:?\s*/i, '').trim();
          if (after) sections.machine.push(after);
          continue;
        }
        if (/^homework\s*[-:–]?/i.test(raw)) {
          cur = 'homework';
          const after = raw.replace(/^homework\s*[-:–]?\s*/i, '').trim();
          if (after) sections.homework.push(after);
          continue;
        }
        sections[cur].push(raw);
      }

      const cleanBullets = (arr) => arr.map(x => x.replace(/^[•\-*]\s*/, '').trim()).filter(Boolean).join('\n');
      const focusParts = [...sections.focus];
      if (sections.other.length && !sections.focus.length) focusParts.push(...sections.other);
      const focus = focusParts.join('\n').trim();
      const tee = cleanBullets(sections.tee);
      const ft = cleanBullets(sections.ft);
      const machine = cleanBullets(sections.machine);
      const warmup = sections.warmup.join('\n').trim();
      const homework = sections.homework.length ? cleanBullets(sections.homework) : '';

      // Auto-tag based on content
      const fullLow = text.toLowerCase();
      const tags = [];
      if (fullLow.includes('variability')) tags.push('Variability');
      if (fullLow.includes('barrel')) tags.push('Barrel Control');
      if (fullLow.includes('3/3/3') || fullLow.includes('extension')) tags.push('Extensions');
      if (fullLow.includes('at bat') || fullLow.includes('hunting')) tags.push('Approach');
      if (fullLow.includes('slap')) tags.push('Slapping');
      if (fullLow.includes('bunt')) tags.push('Bunting');
      if (fullLow.includes('bat speed')) tags.push('Bat Speed');
      if (fullLow.includes('catch') || fullLow.includes('pop time')) tags.push('Catching');
      if (fullLow.includes('infield') || fullLow.includes('short hop')) tags.push('Defense');
      if (!tags.length) tags.push('Hitting');

      return { date, warmupTitle, warmup, focus, tee, ft, machine, homework, tags: tags.slice(0, 3), clips: [] };
    }

    function splitMultipleDatedNotes(rawText) {
      const text = stripHtmlToText(rawText || '').trim();
      if (!text) return [];
      const chunks = text.split(/(?=^\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\s*$)/m).map(c => c.trim()).filter(Boolean);
      return chunks.length ? chunks.map(c => parseGinaAppleNote(c)) : [parseGinaAppleNote(text)];
    }

    const MEDIA_SUBFOLDER_NAMES = new Set(['files', 'attachments', 'media', 'assets', 'images', 'videos', 'resources']);

    function toStorageSlug(folderSlug = 'clips') {
      return String(folderSlug || 'clips').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'clips';
    }

    async function listExistingStorageFiles(folderSlug) {
      try {
        const sb = _sbClient || window._sb;
        if (!sb || !sb.storage) return [];
        const safeSlug = toStorageSlug(folderSlug);
        const { data, error } = await sb.storage.from('gfuchs-media').list(safeSlug, { limit: 1000 });
        if (!error && Array.isArray(data)) return data.map(f => f.name).filter(Boolean);
      } catch (_) {}
      return [];
    }

    async function uploadMediaToSupabase(file, folderSlug = 'clips', existingNames = null) {
      if (!file) return { url: null, cloud: false, reused: false };
      try {
        const sb = _sbClient || window._sb;
        if (sb && sb.storage) {
          const safeSlug = toStorageSlug(folderSlug);
          const safeName = String(file.name || 'clip.mp4').replace(/[^a-zA-Z0-9._-]+/g, '_');

          // Reuse existing uploaded file in Supabase Storage if already present!
          if (Array.isArray(existingNames) && existingNames.length) {
            const match = existingNames.find(n => n === safeName || n.endsWith('-' + safeName));
            if (match) {
              const { data } = sb.storage.from('gfuchs-media').getPublicUrl(`${safeSlug}/${match}`);
              if (data?.publicUrl) return { url: data.publicUrl, cloud: true, reused: true };
            }
          }

          const path = `${safeSlug}/${Date.now()}-${Math.random().toString(36).slice(2, 6)}-${safeName}`;
          const { error } = await sb.storage.from('gfuchs-media').upload(path, file, {
            cacheControl: '3600',
            upsert: true,
            contentType: file.type || undefined
          });
          if (!error) {
            const { data } = sb.storage.from('gfuchs-media').getPublicUrl(path);
            if (data?.publicUrl) return { url: data.publicUrl, cloud: true, reused: false };
          } else {
            console.warn('Supabase Storage upload error:', error.message || error);
          }
        }
      } catch (err) {
        console.warn('Supabase Storage upload failed:', err);
      }
      return { url: URL.createObjectURL(file), cloud: false, reused: false };
    }

    function resolveAthleteNameFromPath(relPath) {
      const parts = String(relPath || '').split('/').filter(Boolean);
      if (parts.length <= 1) return 'Imported Athlete';
      // Drop filename at the end
      const dirs = parts.slice(0, -1);
      // Walk from innermost folder outward, skipping attachment/media helper folders
      for (let i = dirs.length - 1; i >= 0; i--) {
        const seg = dirs[i].trim();
        if (!seg || seg.startsWith('.')) continue;
        if (MEDIA_SUBFOLDER_NAMES.has(seg.toLowerCase())) continue;
        // Skip generic root export folder if there's a deeper folder, otherwise use it
        return seg;
      }
      return dirs[0] || 'Imported Athlete';
    }

    async function handleAppleNotesFolderUpload(input) {
      const files = Array.from(input.files || []);
      if (!files.length) return;
      const byAthlete = {};
      for (const file of files) {
        const rel = file.webkitRelativePath || file.name;
        if (file.name.startsWith('.') || rel.split('/').some(p => p.startsWith('.'))) continue;
        const athleteName = resolveAthleteNameFromPath(rel);
        if (!byAthlete[athleteName]) byAthlete[athleteName] = { athleteName, ageGroup: '14U', notes: [], media: [] };

        if (/\.(md|txt|html?)$/i.test(file.name)) {
          const content = await file.text();
          const parsed = parseGinaAppleNote(content, file.name);
          parsed._rawContent = content;
          byAthlete[athleteName].notes.push(parsed);
        } else if (/\.(mp4|mov|m4v|webm|3gp|avi|jpe?g|png|heic|gif)$/i.test(file.name)) {
          const isVideo = /\.(mp4|mov|m4v|webm|3gp|avi)$/i.test(file.name);
          byAthlete[athleteName].media.push({
            title: file.name,
            isVideo,
            rawFile: file,
            url: URL.createObjectURL(file),
            img: isVideo ? 'assets/images/fastpitch-hitter.jpg' : URL.createObjectURL(file)
          });
        }
      }

      // Match media to specific notes (if referenced in note text/HTML), otherwise attach to latest note
      _importPreviewData = Object.values(byAthlete).filter(a => a.notes.length > 0 || a.media.length > 0).map(a => {
        if (a.notes.length === 0 && a.media.length > 0) {
          a.notes.push(parseGinaAppleNote('Imported session video clips from Apple Notes.', 'Video Clips'));
        }
        const unmatched = [];
        a.media.forEach(m => {
          const fnameLow = m.title.toLowerCase();
          const matchedNote = a.notes.find(n => (n._rawContent || '').toLowerCase().includes(fnameLow));
          if (matchedNote) {
            if (!matchedNote.clips) matchedNote.clips = [];
            matchedNote.clips.push(m);
          } else {
            unmatched.push(m);
          }
        });
        if (unmatched.length && a.notes.length) {
          a.notes[0].clips = [...(a.notes[0].clips || []), ...unmatched];
        }
        a.notes.forEach(n => delete n._rawContent);
        return a;
      });
      renderAppleNotesPreviewBox();
    }

    async function handleAppleNotesJsonUpload(input) {
      const file = input.files?.[0];
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        const arr = Array.isArray(data) ? data : (data.athletes || data.folders || []);
        const map = {};
        arr.forEach(item => {
          const name = (item.athlete || item.folder || item.name || 'Imported Athlete').trim();
          if (!map[name]) map[name] = { athleteName: name, ageGroup: item.ageGroup || '14U', notes: [] };
          if (Array.isArray(item.notes)) {
            item.notes.forEach(n => map[name].notes.push(parseGinaAppleNote(n.body || n.text || n.content || '', n.title || n.date || '')));
          } else if (item.body || item.text || item.content) {
            map[name].notes.push(parseGinaAppleNote(item.body || item.text || item.content, item.title || item.date || ''));
          }
        });
        _importPreviewData = Object.values(map).filter(a => a.notes.length > 0);
        renderAppleNotesPreviewBox();
      } catch (err) {
        showToast('Could not read JSON file — check format and try again.');
      }
    }

    function handleAppleNotesPastePreview() {
      const name = (document.getElementById('import-paste-athlete')?.value || '').trim();
      const raw = (document.getElementById('import-paste-text')?.value || '').trim();
      if (!raw) {
        _importPreviewData = [];
        renderAppleNotesPreviewBox();
        return;
      }
      const notes = splitMultipleDatedNotes(raw);
      _importPreviewData = [{ athleteName: name || 'New Athlete', ageGroup: document.getElementById('import-paste-age')?.value || '14U', notes }];
      renderAppleNotesPreviewBox();
    }

    function renderAppleNotesPreviewBox() {
      const box = document.getElementById('apple-notes-preview');
      const btn = document.getElementById('apple-notes-confirm-btn');
      if (!box) return;
      const totalNotes = _importPreviewData.reduce((s, a) => s + a.notes.length, 0);
      const totalMedia = _importPreviewData.reduce((s, a) => s + a.notes.reduce((ms, n) => ms + (n.clips?.length || 0), 0), 0);
      if (!_importPreviewData.length || totalNotes === 0) {
        box.innerHTML = `<div class="text-xs text-[var(--text-muted)] text-center py-3">Select a folder, upload a JSON export, or paste notes above to preview.</div>`;
        if (btn) { btn.disabled = true; btn.classList.add('opacity-40'); btn.textContent = 'Import All →'; }
        return;
      }
      box.innerHTML = `
        <div class="flex items-center justify-between text-xs pb-2 border-b border-[var(--border-subtle)]">
          <span class="font-extrabold text-[#010101] dark:text-[#D5FF5F]">✓ Ready to Import</span>
          <span class="font-bold text-[var(--text-muted)]">${_importPreviewData.length} ${_importPreviewData.length === 1 ? 'Athlete' : 'Athletes'} • ${totalNotes} ${totalNotes === 1 ? 'Lesson' : 'Lessons'}${totalMedia ? ` • ${totalMedia} ${totalMedia === 1 ? 'Video/Photo' : 'Videos/Photos'}` : ''}</span>
        </div>
        <div class="max-h-36 overflow-y-auto space-y-1.5 pt-2">
          ${_importPreviewData.map(a => {
            const mediaCnt = a.notes.reduce((ms, n) => ms + (n.clips?.length || 0), 0);
            return `
              <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl card-white text-xs">
                <span class="font-extrabold truncate">${a.athleteName}</span>
                <div class="flex items-center gap-1 shrink-0">
                  <span class="px-2 py-0.5 rounded-full surface-soft text-[10px] font-extrabold">${a.notes.length} ${a.notes.length === 1 ? 'note' : 'notes'}</span>
                  ${mediaCnt ? `<span class="px-2 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">${mediaCnt} media</span>` : ''}
                </div>

        </div>
      `;
      if (btn) {

      }

for (const folder of app.folders()) {

$.NSString.alloc.initWithUTF8String(str).writeToFileAtomicallyEncodingError(path, true, $.NSUTF8StringEncoding, null);

    async function confirmAppleNotesImport() {
      if (!_importPreviewData.length) return;
      const btn = document.getElementById('apple-notes-confirm-btn');
      let addedAthletes = 0;
      let addedNotes = 0;
      let uploadedMedia = 0;
      let reusedMedia = 0;
      let localOnlyMedia = 0;

      // Count total files to upload for progress feedback
      const totalFiles = _importPreviewData.reduce((s, e) => s + e.notes.reduce((ns, n) => ns + (n.clips || []).filter(c => c.rawFile).length, 0), 0);
      let fileIdx = 0;

      if (btn) {
        btn.disabled = true;
        btn.textContent = totalFiles ? `Syncing media (0/${totalFiles})…` : 'Importing…';
      }

      window._importingInProgress = true;
      try {
        for (let idx = 0; idx < _importPreviewData.length; idx++) {
          const entry = _importPreviewData[idx];
          const cleanName = sanitizeUnicodeText(entry.athleteName.trim(), 120) || 'Imported Athlete';
          let ath = state.athletes.find(a => a.name.toLowerCase() === cleanName.toLowerCase());
          const impNow = Date.now();
          if (!ath) {
            const parts = cleanName.split(/\s+/).filter(Boolean);
            const initials = ((parts[0]?.[0] || 'A') + (parts[1]?.[0] || parts[0]?.[1] || 'F')).toUpperCase();
            ath = {
              id: `ath-imp-${impNow}-${idx}`,
              initials,
              name: cleanName,
              familyId: `fam-imp-${impNow}-${idx}`,
              parentName: '',
              parentPhone: '',
              parentEmail: '',
              ageGroup: '',
              gradYear: '',
              position: '',
              batsThrows: '',
              team: '',
              height: '',
              streakDays: 0,
              weeklyReps: 0,
              weeklyDuration: '',
              waiverSigned: false,
              waiverDate: null,
              emergencyContact: '',
              medicalNotes: '',
              coachBio: '',
              pitches: [],
              notes: [],
              drills: [],
              _modifiedAt: impNow
            };
            state.athletes.push(ath);
            addedAthletes++;
          } else {
            ath._modifiedAt = impNow;
          }

          // Fetch already-uploaded media in Supabase Storage for this athlete so we never re-upload!
          const existingNames = await listExistingStorageFiles(cleanName);
          const vidImg = getAthleteCoverImg(ath);

          for (let nIdx = 0; nIdx < entry.notes.length; nIdx++) {
            const n = entry.notes[nIdx];
            const finalClips = [];
            for (const clip of (n.clips || [])) {
              if (clip.rawFile) {
                fileIdx++;
                if (btn) btn.textContent = `Syncing media (${fileIdx}/${totalFiles})…`;
                const res = await uploadMediaToSupabase(clip.rawFile, cleanName, existingNames);
                if (res.cloud) {
                  if (res.reused) reusedMedia++;
                  else uploadedMedia++;
                } else {
                  localOnlyMedia++;
                }
                finalClips.push({
                  title: sanitizeUnicodeText(clip.title || 'Session Clip', 180),
                  url: res.url,
                  isVideo: clip.isVideo !== false,
                  img: clip.isVideo === false ? res.url : vidImg
                });
              } else if (clip.url) {
                finalClips.push({ title: sanitizeUnicodeText(clip.title || 'Session Clip', 180), url: clip.url, isVideo: clip.isVideo !== false, img: clip.img || vidImg });
              }
            }

            const safeDate = sanitizeUnicodeText(n.date || '', 160);
            const safeWarmup = sanitizeUnicodeText(n.warmup || '', 4000);
            const safeFocus = sanitizeUnicodeText(n.focus || '', 12000);
            const safeTee = sanitizeUnicodeText(n.tee || '', 4000);
            const safeFt = sanitizeUnicodeText(n.ft || '', 4000);
            const safeMachine = sanitizeUnicodeText(n.machine || '', 4000);
            const safeHomework = sanitizeUnicodeText(n.homework || '', 4000);

            // If this athlete already has an imported note on the same date, attach new videos to it instead of duplicating
            const existingRecap = state.sessionRecaps.find(r => r.athleteId === ath.id && r.date === safeDate && (r.focus || '').trim() === safeFocus.trim());
            if (existingRecap && finalClips.length) {
              existingRecap.clips = [...(existingRecap.clips || []), ...finalClips];
              if (!existingRecap.videoUrl) {
                existingRecap.videoUrl = finalClips[0].url;
                existingRecap.videoTitle = finalClips[0].title;
              }
              existingRecap._modifiedAt = Date.now();
            } else {
              state.sessionRecaps.unshift({
                id: `rec-imp-${Date.now()}-${idx}-${nIdx}`,
                isDraft: false,
                athleteId: ath.id,
                athleteName: ath.name,
                date: safeDate,
                sessionTitle: '1-on-1 Hitting Private (45m)',
                tags: Array.isArray(n.tags) ? n.tags.slice(0, 3) : ['Hitting'],
                warmup: safeWarmup,
                focus: safeFocus,
                tee: safeTee,
                ft: safeFt,
                machine: safeMachine,
                homework: safeHomework,
                note: '',
                videoTitle: finalClips[0]?.title || `${safeDate} Session Clip`,
                videoImg: finalClips[0]?.img || vidImg,
                videoUrl: finalClips[0]?.url || null,
                clips: finalClips,
                sentTo: 'Imported from Apple Notes',
                sentAt: safeDate,
                _modifiedAt: Date.now()
              });
              ath.notes.unshift({ date: safeDate, text: safeFocus.slice(0, 240) });
              addedNotes++;
            }

            // Also add video clips to state.videos for the athlete
            finalClips.forEach((c, cIdx) => {
              if (c.url) {
                state.videos.unshift({
                  id: `vid-imp-${Date.now()}-${idx}-${nIdx}-${cIdx}`,
                  athleteId: ath.id,
                  athleteName: ath.name,
                  title: c.title,
                  uploadedAt: safeDate,
                  status: 'Reviewed',
                  img: c.img || vidImg,
                  videoUrl: c.url,
                  cues: [],
                  _modifiedAt: Date.now()
                });
              }
            });
          }
        }

        if (!state.selectedAthleteId && state.athletes.length) state.selectedAthleteId = state.athletes[0].id;
        if (!state.activeSiblingId && state.athletes.length) state.activeSiblingId = state.athletes[0].id;
        state.coachTab = 'athletes';
        state.rosterView = 'list';
        _importPreviewData = [];
        closeModal();
        saveLocalState();
        render(false);
        let syncRes = await pushStateToSupabase(true);
        if (!syncRes?.ok) {
          await new Promise(r => setTimeout(r, 900));
          syncRes = await pushStateToSupabase(true);
        }
        const totalCloud = uploadedMedia + reusedMedia;
        if (!syncRes?.ok) {
          showToast(`Imported ${addedAthletes} athletes locally, but cloud sync failed (${syncRes?.error || 'network'}) — check Settings → Sync!`);
        } else if (localOnlyMedia > 0) {
          showToast(`Imported ${addedAthletes} athletes & ${addedNotes} notes (${totalCloud} cloud videos, ${localOnlyMedia} local only) — synced to cloud!`);
        } else {
          showToast(`Imported ${addedAthletes} athletes, ${addedNotes} notes & linked ${totalCloud} cloud videos — synced to cloud!`);
        }
      } finally {
        window._importingInProgress = false;
      }
    }

    async function attachVideosToRecap(recapId, input) {
      const files = Array.from(input.files || []);
      if (!files.length) return;
      const r = state.sessionRecaps.find(x => x.id === recapId);
      if (!r) return;
      const ath = state.athletes.find(a => a.id === r.athleteId);
      const vidImg = ath ? getAthleteCoverImg(ath) : 'assets/images/fastpitch-hitter.jpg';
      showToast(`Uploading ${files.length} clip${files.length === 1 ? '' : 's'}…`);
      let cloudCount = 0;
      for (const file of files) {
        const isVideo = /\.(mp4|mov|m4v|webm|3gp|avi)$/i.test(file.name) || (file.type || '').startsWith('video/');
        const res = await uploadMediaToSupabase(file, ath?.name || 'clips');
        if (res.cloud) cloudCount++;
        const clip = { title: file.name, url: res.url, isVideo, img: isVideo ? vidImg : res.url };
        if (!Array.isArray(r.clips)) r.clips = [];
        r.clips.push(clip);
        if (!r.videoUrl) {
          r.videoUrl = clip.url;
          r.videoTitle = clip.title;
          r.videoImg = clip.img;
        }
      }
      render();
      if (cloudCount === files.length) {
        showToast(`Uploaded ${files.length} video${files.length === 1 ? '' : 's'} to cloud!`);
      } else {
        showToast(`Attached ${files.length} clip(s) locally — enable Supabase Storage bucket to sync across devices.`);
      }
    }
