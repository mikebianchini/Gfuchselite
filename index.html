<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Gina Fuchs Elite Fastpitch — Training App</title>
  <meta name="description" content="Personal fastpitch training app for Gina Fuchs Elite Fastpitch: Peloton-inspired drill workouts, live booking, velocity tracking, video mechanics, packages & waivers." />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#010101" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Elite Fastpitch" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      /* Exact Brand System */
      --volt: #D5FF5F;
      --obsidian: #010101;
      --mist: #D6DFE2;
      --white: #FFFFFF;
      --slate-blue: #4E6075;
      --sky-blue: #9AC0D6;
      --charcoal: #595959;
      --mid-gray: #9F9F9F;

      /* Apple Liquid Glass — Light Mode */
      --bg-page: #DDE6EA;
      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.42) 100%);
      --glass-mist: linear-gradient(135deg, rgba(214, 223, 226, 0.76) 0%, rgba(154, 192, 214, 0.34) 100%);
      --glass-soft: rgba(255, 255, 255, 0.48);
      --glass-dock: linear-gradient(180deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.56) 100%);
      --glass-border: rgba(255, 255, 255, 0.78);
      --glass-border-outer: rgba(78, 96, 117, 0.14);
      --glass-specular: inset 0 1.5px 1px rgba(255, 255, 255, 0.92), inset 0 -1px 1px rgba(78, 96, 117, 0.08);
      --glass-shadow: 0 14px 36px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(15, 23, 42, 0.04);
      --border-subtle: rgba(78, 96, 117, 0.16);
      --text-main: #010101;
      --text-muted: #595959;
      --text-soft: #7A8694;
      --bg-card: rgba(255, 255, 255, 0.72);
      --bg-elevated: rgba(255, 255, 255, 0.52);
    }

    html.dark {
      /* Apple Liquid Glass — Dark Mode */
      --bg-page: #07090C;
      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.04) 100%);
      --glass-mist: linear-gradient(135deg, rgba(78, 96, 117, 0.34) 0%, rgba(154, 192, 214, 0.12) 100%);
      --glass-soft: rgba(255, 255, 255, 0.07);
      --glass-dock: linear-gradient(180deg, rgba(28, 34, 42, 0.76) 0%, rgba(16, 20, 25, 0.64) 100%);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-border-outer: rgba(255, 255, 255, 0.10);
      --glass-specular: inset 0 1px 1px rgba(255, 255, 255, 0.28), inset 0 -1px 1px rgba(0, 0, 0, 0.35);
      --glass-shadow: 0 18px 44px rgba(0, 0, 0, 0.48), 0 2px 10px rgba(0, 0, 0, 0.32);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --text-main: #FFFFFF;
      --text-muted: #B4BCC4;
      --text-soft: #7E8791;
      --bg-card: rgba(20, 25, 31, 0.76);
      --bg-elevated: rgba(255, 255, 255, 0.08);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Ambient Luminous Mesh Behind Liquid Glass */
    .liquid-ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .liquid-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(80px);
      opacity: 0.62;
    }
    html.dark .liquid-orb { opacity: 0.32; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* True Multi-Layered Apple Liquid Glass Materials */
    .card-white {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(195%);
      -webkit-backdrop-filter: blur(28px) saturate(195%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), var(--glass-shadow);
    }

    .card-mist {
      background: var(--glass-mist);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), var(--glass-shadow);
    }

    .surface-soft {
      background: var(--glass-soft);
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }
    html.dark .surface-soft {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .glass-dock {
      background: var(--glass-dock);
      backdrop-filter: blur(36px) saturate(220%);
      -webkit-backdrop-filter: blur(36px) saturate(220%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), 0 16px 42px rgba(1, 1, 1, 0.16);
    }

    .glass-pill-hero {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .modal-backdrop {
      background: rgba(7, 10, 14, 0.45);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
    }

    html, body {
      overscroll-behavior-y: contain;
    }

    @keyframes ptrSpin {
      to { transform: rotate(360deg); }
    }
    .ptr-spinning {
      animation: ptrSpin 0.75s linear infinite;
    }
    #ptr-indicator {
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    }
    #ptr-indicator.dragging {
      transition: none;
    }
  </style>
</head>

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
    }

    function closeModal() {
      const m = document.getElementById('modal-root');
      m.classList.add('hidden');
      m.classList.remove('flex');
      m.innerHTML = '';
    }

    function openModal(html, noPad = false) {
      const m = document.getElementById('modal-root');
      m.innerHTML = `<div class="card-white rounded-[30px] max-w-md w-full ${noPad ? 'overflow-hidden' : 'p-6 space-y-4'} shadow-2xl max-h-[92vh] overflow-y-auto">${html}</div>`;
      m.classList.remove('hidden');
      m.classList.add('flex');
      m.onclick = (e) => { if (e.target === m) closeModal(); };
    }

    // =========================================================================
    // CAL.COM-STYLE BOOKING ENGINE (3-Column Calendar + Slots + Details + .ICS)
    // =========================================================================
    function calFormatTime(hhmm) {
      if (state.cal.timeFormat === '24h') return hhmm;
      const [hStr, m] = hhmm.split(':');
      const h = parseInt(hStr, 10);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${h12}:${m} ${ampm}`;
    }

    function calDateLabel(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function timeToMins(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function minsToTime(mins) {
      const h = String(Math.floor(mins / 60)).padStart(2, '0');
      const m = String(mins % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    function calGetSlotsForDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const dow = dt.getDay(); // 0=Sun..6=Sat
      if (!state.cal.availability.days.includes(dow)) return [];
      const blocks = state.cal.availability.weeklyBlocks[dow] || [];
      if (!blocks.length) return [];
      const evt = state.cal.eventTypes.find(e => e.id === state.cal.eventTypeId) || state.cal.eventTypes[0];
      const dur = Number(evt.duration) || 45;
      const buf = Number(state.cal.availability.bufferMin) || 0;
      const step = Math.max(15, dur + buf);

      const slots = [];
      blocks.forEach(b => {
        let cur = timeToMins(b.start);
        const end = timeToMins(b.end);
        while (cur + dur <= end) {
          const tStr = minsToTime(cur);
          if (!state.cal.bookedSlots.includes(`${iso}@${tStr}`) && !slots.includes(tStr)) {
            slots.push(tStr);
          }
          cur += step;
        }
      });
      return slots.sort();
    }

    function calChangeMonth(delta) {
      state.cal.month += delta;
      if (state.cal.month > 11) { state.cal.month = 0; state.cal.year += 1; }
      if (state.cal.month < 0) { state.cal.month = 11; state.cal.year -= 1; }
      render();
    }

    function calSelectEvent(id) {
      state.cal.eventTypeId = id;
      state.cal.step = 'calendar';
      state.cal.selectedTime = null;
      const evt = state.cal.eventTypes.find(e => e.id === id);
      const ath = state.athletes.find(a => a.id === state.activeSiblingId);
      state.cal.payMode = (evt?.allowCredit && ath?.credits > 0) ? 'credit' : 'card';
      if (id === 'evt-clinic') state.cal.selectedDate = '2026-11-28';
      render();
    }

    function calSelectDate(iso) {
      state.cal.selectedDate = iso;
      state.cal.selectedTime = null;
      render();
    }

    function calCartTotals() {
      const cardTotal = state.cal.cart.reduce((sum, item) => sum + item.evt.price, 0);
      return { cardTotal };
    }

    function calAddToCart(time24, goToCheckout = false) {
      const evt = state.cal.eventTypes.find(x => x.id === state.cal.eventTypeId) || state.cal.eventTypes[0];
      const ath = state.athletes.find(x => x.id === state.activeSiblingId) || state.athletes[0];
      const iso = state.cal.selectedDate;
      const slotKey = `${iso}@${time24}`;
      if (state.cal.cart.some(i => i.slotKey === slotKey)) {
        if (goToCheckout) { state.cal.step = 'details'; render(); }
        else showToast('This time slot is already in your cart!');
        return;
      }

      state.cal.cart.push({
        id: 'ci-' + Date.now() + Math.random().toString(36).slice(2, 5),
        slotKey,
        iso,
        dayNice: calDateLabel(iso),
        time24,
        timeDisplay: calFormatTime(time24),
        evt: { ...evt },
        athleteId: ath.id,
        athleteName: ath.name,
        athleteAge: ath.ageGroup,
      });
      state.cal.selectedTime = null;
      if (goToCheckout) {
        state.cal.step = 'details';
      } else {
        showToast(`🛒 Added ${evt.title} (${calDateLabel(iso)} • ${calFormatTime(time24)}) to cart!`);
      }
      render();
    }

    function calRemoveFromCart(itemId) {
      state.cal.cart = state.cal.cart.filter(i => i.id !== itemId);
      if (state.cal.cart.length === 0 && state.cal.step === 'details') {
        state.cal.step = 'calendar';
      }
      render();
      showToast('Removed session from cart.');
    }

    function calToggleCartItemPay(itemId) {
      const item = state.cal.cart.find(i => i.id === itemId);
      if (!item || !item.evt.allowCredit) return;
      if (item.payMode === 'credit') {
        item.payMode = 'card';
      } else {
        const { creditsUsed, availCredits } = calCartTotals();
        if (creditsUsed >= availCredits) {
          showToast(`All ${availCredits} available credits are already applied in your cart.`);
          return;
        }
        item.payMode = 'credit';
      }
      render();
    }

    function calConfirmBooking(e) {
      e.preventDefault();
      if (!state.cal.cart.length) return;
      const focusNote = e.target.notes.value.trim();
      const parentName = e.target.parentName.value;
      const email = e.target.email.value;
      const phone = e.target.phone.value;
      const { cardTotal } = calCartTotals();
      const confirmedItems = [];

      state.cal.cart.forEach(item => {

        // Prevent double-booking
        state.cal.bookedSlots.push(item.slotKey);

        const dayParts = item.dayNice.split(', ');
        const shortDayKey = dayParts[0] + ' ' + item.iso.split('-')[2].replace(/^0/, '');
        state.sessions.unshift({

          status: 'Confirmed',

          price: item.evt.price,
          img: item.evt.img
        });

        confirmedItems.push({
          ...item,
          payLabel: state.cal.checkoutMethod === 'cash' ? `$${item.evt.price} Cash Due` : `$${item.evt.price} Clover`
        });
      });


      const isCash = state.cal.checkoutMethod === 'cash';
      if (cardTotal > 0) {
        state.payments.unshift({
          id: 'pay-' + Date.now(),
          date: 'Today',
          family: 'Miller Family',
          item: confirmedItems.length === 1 ? `${confirmedItems[0].evt.title} (${confirmedItems[0].dayNice})` : `Multi-Session Booking (${confirmedItems.length} sessions)`,
          amount: cardTotal,
          method: isCash ? 'Cash (Due at Lesson)' : 'Clover • Card / Apple Pay',
          status: isCash ? 'Pending Cash' : 'Paid'
        });
      }

      state.cal.lastBooking = {
        items: confirmedItems,
        cardTotal,
        checkoutMethod: state.cal.checkoutMethod,
        parentName,
        email,
        phone,
        notes: focusNote
      };
      state.cal.cart = [];
      state.cal.step = 'confirmed';
      render();
      showToast(`Confirmed ${confirmedItems.length} ${confirmedItems.length === 1 ? 'session' : 'sessions'}!`);
    }

    function downloadIcs() {
      const b = state.cal.lastBooking;
      if (!b || !b.items?.length) return;
      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Gina Fuchs Elite Fastpitch//Booking//EN'
      ];
      b.items.forEach(item => {
        const dtStart = item.iso.replace(/-/g, '') + 'T' + item.time24.replace(':', '') + '00';
        const [h, m] = item.time24.split(':').map(Number);
        const endMins = h * 60 + m + item.evt.duration;
        const eh = String(Math.floor(endMins / 60)).padStart(2, '0');
        const em = String(endMins % 60).padStart(2, '0');
        const dtEnd = item.iso.replace(/-/g, '') + 'T' + eh + em + '00';
        lines.push(
          'BEGIN:VEVENT',
          `DTSTART:${dtStart}`,
          `DTEND:${dtEnd}`,
          `SUMMARY:${item.evt.title} — ${item.athleteName} w/ Coach Gina`,
          `LOCATION:${item.evt.location}`,
          `DESCRIPTION:Athlete: ${item.athleteName}\\nNotes: ${b.notes || 'Fastpitch training session'}\\n24-hour cancellation policy applies.`,
          'END:VEVENT'
        );
      });
      lines.push('END:VCALENDAR');
      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gina-fuchs-sessions-${b.items.length}.ics`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`Calendar invite (.ics) for ${b.items.length} ${b.items.length === 1 ? 'session' : 'sessions'} downloaded!`);
    }

                      <span class="text-[11px] font-bold text-[var(--text-muted)]">${item.evt.durationLabel} • ${item.evt.location.split('•')[1] || 'Cage 1'}</span>
                      <span class="font-extrabold">$${item.evt.price}</span>
                    </div>
                  </div>
                `).join('')}
              </div>

              <!-- Cart Totals Summary -->
              <div class="card-white rounded-2xl p-4 flex items-center justify-between text-sm">
                <span class="font-extrabold">Total Due</span>
                <span class="font-extrabold tabular-nums text-lg">$${cardTotal}</span>
              </div>
            </div>

            <!-- Right: Single Checkout Form -->
            <form onsubmit="calConfirmBooking(event)" class="lg:col-span-7 p-6 space-y-4 text-xs">
              <h2 class="text-lg font-extrabold tracking-tight">Complete Checkout</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-[var(--text-muted)] font-bold mb-1">Parent / Guardian Name *</label>
                  <input name="parentName" value="${ath.parentName}" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" required />
                </div>
                <div>
                  <label class="block text-[var(--text-muted)] font-bold mb-1">Email for Calendar Invites *</label>
                  <input name="email" type="email" value="sarah.miller@example.com" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" required />
                </div>
              </div>
              <div>
                <label class="block text-[var(--text-muted)] font-bold mb-1">Mobile Phone (24h SMS Reminders) *</label>
                <input name="phone" value="${ath.parentPhone}" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" required />
              </div>
              <div>
                <label class="block text-[var(--text-muted)] font-bold mb-1">Focus Notes for Coach Gina (Optional)</label>
                <textarea name="notes" rows="2" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" placeholder="e.g., Inside pitch barrel path, slapping footwork, infield transfers, pre-tournament tune-up..."></textarea>
              </div>
              ${cardTotal > 0 ? `
                <div>
                  <label class="block text-[var(--text-muted)] font-bold mb-1.5">Payment Method for $${cardTotal} Balance</label>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <button type="button" onclick="state.cal.checkoutMethod='clover'; render();" class="p-3.5 rounded-2xl border text-left cursor-pointer transition ${state.cal.checkoutMethod === 'clover' ? 'bg-[#010101] text-white border-[#010101] shadow-md' : 'surface-soft'}">
                      <div class="flex items-center justify-between">
                        <span class="font-extrabold">🍀 Clover Checkout</span>
                        ${state.cal.checkoutMethod === 'clover' ? `<span class="px-2 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">Selected</span>` : ''}
                      </div>
                      <div class="text-[11px] opacity-75 mt-1">Card, Apple Pay, or Google Pay via Clover</div>
                    </button>
                    <button type="button" onclick="state.cal.checkoutMethod='cash'; render();" class="p-3.5 rounded-2xl border text-left cursor-pointer transition ${state.cal.checkoutMethod === 'cash' ? 'bg-[#010101] text-white border-[#010101] shadow-md' : 'surface-soft'}">
                      <div class="flex items-center justify-between">
                        <span class="font-extrabold">💵 Pay Cash at Lesson</span>
                        ${state.cal.checkoutMethod === 'cash' ? `<span class="px-2 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">Selected</span>` : ''}
                      </div>
                      <div class="text-[11px] opacity-75 mt-1">Reserve now • Pay Gina $${cardTotal} cash at check-in</div>
                    </button>
                  </div>
                </div>
              ` : ''}
              <label class="flex items-center gap-2 cursor-pointer pt-1">
                <input type="checkbox" checked required class="w-4 h-4 accent-[#010101]" />
                <span class="text-[11px] text-[var(--text-muted)]">I agree to the 24-hour reschedule &amp; cancellation policy for all sessions in my cart.</span>
              </label>
              <button type="submit" class="w-full py-3.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-sm font-extrabold cursor-pointer shadow-lg hover:brightness-95 transition">
                Confirm ${state.cal.cart.length} ${state.cal.cart.length === 1 ? 'Session' : 'Sessions'} • ${state.cal.checkoutMethod === 'cash' ? `$${cardTotal} Cash at Lesson` : `Pay $${cardTotal} w/ Clover`} →
              </button>
            </form>
          </div>
        `;
      }

      // STEP 1: CAL.COM 3-COLUMN SCHEDULER + LIVE SHOPPING CART BAR
      const eventStrip = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          ${state.cal.eventTypes.map(t => {
            const active = t.id === evt.id;
            return `
              <button onclick="calSelectEvent('${t.id}')" class="text-left rounded-[24px] overflow-hidden transition cursor-pointer group ${active ? 'bg-[#010101] text-white shadow-xl ring-2 ring-[#D5FF5F]' : 'card-white hover:-translate-y-0.5'}">
                <div class="relative h-24 w-full overflow-hidden">
                  <img src="${t.img || 'assets/images/fastpitch-hitter.jpg'}" alt="${t.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                  <div class="absolute inset-0 bg-gradient-to-t from-[#010101]/70 via-[#010101]/15 to-transparent"></div>
                  <div class="absolute top-2.5 left-2.5 right-2.5 flex items-center justify-between gap-2">
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${active ? 'bg-[#D5FF5F] text-[#010101]' : 'bg-[#010101]/70 text-white backdrop-blur'}">${t.durationLabel}</span>
                    <span class="px-2.5 py-0.5 rounded-full bg-white/90 text-[#010101] text-[11px] font-extrabold tabular-nums">$${t.price}</span>
                  </div>
                </div>
                <div class="p-3.5">
                  <div class="font-extrabold text-sm leading-snug">${t.title}</div>
                  <div class="text-[11px] mt-0.5 ${active ? 'text-[#D6DFE2]' : 'text-[var(--text-muted)]'}">${t.type}</div>
                </div>
              </button>
            `;
          }).join('')}
        </div>
      `;

      const cartBanner = state.cal.cart.length > 0 ? `
        <div class="glass-dock rounded-[26px] p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-2 border-[#010101] dark:border-[#D5FF5F]">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold text-sm flex items-center justify-center shrink-0">🛒</div>
            <div class="min-w-0">
              <div class="font-extrabold text-sm">${state.cal.cart.length} ${state.cal.cart.length === 1 ? 'Session' : 'Sessions'} in Booking Cart</div>
              <div class="text-xs text-[var(--text-muted)] truncate">
                ${state.cal.cart.map(i => `${i.athleteName.split(' ')[0]}: ${i.dayNice} ${i.timeDisplay}`).join(' • ')}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="px-3 py-1.5 rounded-full surface-soft text-xs font-extrabold">$${cardTotal}</span>
            <button onclick="state.cal.step='details'; render();" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer shadow-md">Checkout (${state.cal.cart.length}) →</button>
          </div>
        </div>
      ` : '';

      const year = state.cal.year;
      const month = state.cal.month;
      const monthName = new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const availableSlots = calGetSlotsForDate(state.cal.selectedDate);

      let calendarCells = '';
      for (let i = 0; i < firstDow; i++) calendarCells += `<div></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isPast = (year === 2026 && month === 10 && day < 26);
        const slots = isPast ? [] : calGetSlotsForDate(iso);
        const hasSlots = slots.length > 0;
        const isSelected = iso === state.cal.selectedDate;
        const hasCartOnDay = state.cal.cart.some(i => i.iso === iso);
        calendarCells += `
          <button ${!hasSlots ? 'disabled' : `onclick="calSelectDate('${iso}')"`} class="aspect-square rounded-2xl flex flex-col items-center justify-center text-xs font-extrabold transition ${
            isSelected
              ? 'bg-[#010101] text-[#D5FF5F] shadow-md cursor-pointer'
              : hasSlots
                ? 'surface-soft hover:bg-[#D5FF5F] hover:text-[#010101] cursor-pointer'
                : 'opacity-30 cursor-not-allowed'
          }">
            <span>${day}</span>
            ${hasCartOnDay
              ? `<span class="w-1.5 h-1.5 rounded-full mt-0.5 bg-[#D5FF5F] ring-1 ring-[#010101]"></span>`
              : hasSlots ? `<span class="w-1 h-1 rounded-full mt-0.5 ${isSelected ? 'bg-[#D5FF5F]' : 'bg-[#4E6075] dark:bg-[#9AC0D6]'}"></span>` : ''}
          </button>
        `;
      }

      return `
        ${renderSiblingBar()}
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Book Sessions</h1>
            <p class="text-xs text-[var(--text-muted)]">Add multiple dates, class types, or siblings to your cart &amp; check out in one step</p>
          </div>
          <div class="flex items-center gap-2">
            ${state.cal.cart.length > 0 ? `<button onclick="state.cal.step='details'; render();" class="px-3.5 py-2 rounded-full bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">🛒 Cart (${state.cal.cart.length})</button>` : ''}
            <button onclick="copyCalLink('${evt.slug}')" class="px-3.5 py-2 rounded-full card-white text-xs font-extrabold cursor-pointer">🔗 Copy Link</button>
          </div>
        </div>

        ${cartBanner}
        ${eventStrip}

        <!-- Cal.com 3-Column Liquid Glass Booking Card -->
        <div class="card-white rounded-[32px] overflow-hidden grid grid-cols-1 lg:grid-cols-12">
          <!-- Col 1: Event Details & Timezone -->
          <div class="lg:col-span-4 card-mist p-5 sm:p-6 flex flex-col justify-between gap-5">
            <div class="space-y-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-[#010101] text-[#D5FF5F] font-extrabold text-xs flex items-center justify-center shrink-0">GF</div>
                <div>
                  <div class="text-xs text-[var(--text-muted)] font-bold">Booking for ${ath.name.split(' ')[0]} (${ath.ageGroup})</div>
                  <div class="font-extrabold text-base leading-tight">${evt.title}</div>
                </div>
              </div>
              <p class="text-xs text-[var(--text-muted)] leading-relaxed">${evt.desc}</p>
              <div class="space-y-2 text-xs font-semibold">
                <div class="flex items-center gap-2"><span>⏱️</span><span>${evt.durationLabel} (${evt.duration} min)</span></div>
                <div class="flex items-center gap-2"><span>📍</span><span>${evt.location}</span></div>
                <div class="flex items-center gap-2"><span>💳</span><span>$${evt.price} • Clover or Cash</span></div>
              </div>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-[var(--text-muted)] mb-1">Timezone</label>
              <select onchange="state.cal.timezone=this.value; render();" class="w-full px-3 py-2 rounded-xl surface-soft text-xs font-bold cursor-pointer">
                <option value="America/New_York" ${state.cal.timezone === 'America/New_York' ? 'selected' : ''}>🌎 Pittsburgh / Eastern (EST)</option>
                <option value="America/Chicago" ${state.cal.timezone === 'America/Chicago' ? 'selected' : ''}>🌎 Central Time (CST)</option>
                <option value="America/Denver" ${state.cal.timezone === 'America/Denver' ? 'selected' : ''}>🌎 Mountain Time (MST)</option>
                <option value="America/Los_Angeles" ${state.cal.timezone === 'America/Los_Angeles' ? 'selected' : ''}>🌎 Pacific Time (PST)</option>
              </select>
            </div>
          </div>

          <!-- Col 2: Interactive Month Calendar -->
          <div class="lg:col-span-5 p-5 sm:p-6 border-b lg:border-b-0 lg:border-r border-[var(--border-subtle)] space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="font-extrabold text-sm">${monthName}</h2>
              <div class="flex items-center gap-1.5">
                <button onclick="calChangeMonth(-1)" class="w-8 h-8 rounded-full surface-soft font-bold text-xs cursor-pointer">‹</button>
                <button onclick="calChangeMonth(1)" class="w-8 h-8 rounded-full surface-soft font-bold text-xs cursor-pointer">›</button>
              </div>
            </div>
            <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-extrabold text-[var(--text-muted)] uppercase">
              <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div class="grid grid-cols-7 gap-1.5">
              ${calendarCells}
            </div>
          </div>

          <!-- Col 3: Time Slots + Add to Cart / Book Now -->
          <div class="lg:col-span-3 p-5 sm:p-6 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div class="font-extrabold text-sm">${calDateLabel(state.cal.selectedDate)}</div>
              <div class="flex p-0.5 rounded-full surface-soft text-[10px] font-extrabold">
                <button onclick="state.cal.timeFormat='12h'; render();" class="px-2 py-0.5 rounded-full cursor-pointer ${state.cal.timeFormat === '12h' ? 'bg-[#010101] text-[#D5FF5F]' : 'text-[var(--text-muted)]'}">12h</button>
                <button onclick="state.cal.timeFormat='24h'; render();" class="px-2 py-0.5 rounded-full cursor-pointer ${state.cal.timeFormat === '24h' ? 'bg-[#010101] text-[#D5FF5F]' : 'text-[var(--text-muted)]'}">24h</button>
              </div>
            </div>
            <div class="space-y-2 max-h-72 overflow-y-auto no-scrollbar pr-0.5">
              ${availableSlots.length ? availableSlots.map(t => {
                const slotKey = `${state.cal.selectedDate}@${t}`;
                const inCartItem = state.cal.cart.find(i => i.slotKey === slotKey);
                if (inCartItem) {
                  return `
                    <div class="p-2.5 rounded-2xl bg-[#D5FF5F]/25 border border-[#010101]/20 flex items-center justify-between text-xs font-extrabold">
                      <span>✓ ${calFormatTime(t)}</span>
                      <button onclick="calRemoveFromCart('${inCartItem.id}')" class="text-[11px] underline cursor-pointer">Remove</button>
                    </div>
                  `;
                }
                const selected = state.cal.selectedTime === t;
                return selected ? `
                  <div class="space-y-1.5 p-2 rounded-2xl surface-soft">
                    <div class="text-center text-xs font-extrabold">${calFormatTime(t)}</div>
                    <div class="grid grid-cols-2 gap-1.5">
                      <button onclick="calAddToCart('${t}', false)" class="py-2 rounded-xl bg-[#010101] text-[#D5FF5F] text-[11px] font-extrabold cursor-pointer">+ Add Cart</button>
                      <button onclick="calAddToCart('${t}', true)" class="py-2 rounded-xl bg-[#D5FF5F] text-[#010101] text-[11px] font-extrabold cursor-pointer">Book Now →</button>
                    </div>
                  </div>
                ` : `
                  <button onclick="state.cal.selectedTime='${t}'; render();" class="w-full py-2.5 px-3 rounded-2xl surface-soft hover:border-[#010101] text-xs font-extrabold flex items-center justify-center gap-2 cursor-pointer transition">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#22c55e]"></span>
                    <span>${calFormatTime(t)}</span>
                  </button>
                `;
              }).join('') : `<div class="p-4 rounded-2xl surface-soft text-xs text-[var(--text-muted)] text-center">No open slots on this date. Pick another highlighted day!</div>`}
            </div>
          </div>
        </div>
      `;
    }

    function openAvailabilityModal() {
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      openModal(`
        <div class="flex items-center justify-between">
          <div>
            <h3 class="font-extrabold text-sm">Coach Gina’s Cal.com Availability</h3>
            <p class="text-[11px] text-[var(--text-muted)]">Changes update the Athlete Booking Calendar live</p>
          </div>
          <button onclick="closeModal()" class="text-xs font-bold cursor-pointer">✕</button>
        </div>
        <div class="space-y-4 text-xs">
          <div>
            <div class="font-bold text-[var(--text-muted)] mb-2">Open Coaching Days</div>
            <div class="grid grid-cols-7 gap-1">
              ${dayNames.map((name, idx) => {
                const on = state.cal.availability.days.includes(idx);
                return `<button type="button" onclick="toggleAvailDay(${idx})" class="py-2 rounded-xl font-extrabold cursor-pointer ${on ? 'bg-[#D5FF5F] text-[#010101]' : 'surface-soft text-[var(--text-muted)]'}">${name}</button>`;
              }).join('')}
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div class="surface-soft rounded-2xl p-3">
              <div class="text-[11px] text-[var(--text-muted)]">Buffer Between Lessons</div>
              <div class="font-extrabold text-sm mt-0.5">${state.cal.availability.bufferMin} min</div>
            </div>
            <div class="surface-soft rounded-2xl p-3">
              <div class="text-[11px] text-[var(--text-muted)]">Minimum Notice</div>
              <div class="font-extrabold text-sm mt-0.5">${state.cal.availability.minNoticeHours} hours</div>
            </div>
          </div>
          <button onclick="copyCalLink('hitting-45')" class="w-full py-2.5 rounded-2xl bg-[#010101] text-[#D5FF5F] font-extrabold cursor-pointer">🔗 Copy Shareable Booking Link</button>
        </div>
      `);
    }

    function toggleAvailDay(idx) {
      const d = state.cal.availability.days;
      if (d.includes(idx)) state.cal.availability.days = d.filter(x => x !== idx);
      else state.cal.availability.days.push(idx);
      openAvailabilityModal();
      render();
      showToast('Availability updated on live booking calendar!');
    }

    function renderParentPackages() {
      const famPayments = state.payments.filter(p => p.family === 'Miller Family');
      const totalPaid = famPayments.filter(p => p.status !== 'Pending Cash').reduce((s, p) => s + p.amount, 0);
      const pendingCash = famPayments.filter(p => p.status === 'Pending Cash').reduce((s, p) => s + p.amount, 0);
      return `
        ${renderSiblingBar()}
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Billing &amp; Receipts</h1>
            <p class="text-xs text-[var(--text-muted)]">Pay per session online via 🍀 Clover (Card / Apple Pay) or 💵 Cash at the facility</p>
          </div>
          <button onclick="setTab('book')" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">+ Book Sessions</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="card-mist rounded-[28px] p-5 space-y-1">
            <div class="text-xs font-bold text-[var(--text-muted)]">Total Paid (Miller Family)</div>
            <div class="text-3xl font-extrabold tabular-nums">$${totalPaid.toLocaleString()}</div>
            <div class="text-xs font-semibold text-[#4E6075] dark:text-[#9AC0D6]">🍀 Clover &amp; Cash receipts saved automatically</div>
          </div>
          <div class="card-white rounded-[28px] p-5 space-y-1">
            <div class="text-xs font-bold text-[var(--text-muted)]">Cash Due at Upcoming Lessons</div>
            <div class="text-3xl font-extrabold tabular-nums">$${pendingCash.toLocaleString()}</div>
            <div class="text-xs font-semibold text-[var(--text-muted)]">${pendingCash > 0 ? 'Bring cash to Coach Gina at check-in' : 'All caught up — $0 due!'}</div>
          </div>
        </div>

        <div class="card-white rounded-[28px] p-5 space-y-3">
          <h2 class="text-sm font-extrabold">Payment History &amp; Receipts</h2>
          ${famPayments.map(p => `
            <div class="surface-soft rounded-2xl p-3.5 flex items-center justify-between text-xs">
              <div>
                <div class="font-extrabold">${p.item}</div>
                <div class="text-[var(--text-muted)]">${p.date} • ${p.method}</div>
              </div>
              <div class="flex items-center gap-2">
                ${p.status === 'Pending Cash' ? `<span class="px-2.5 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">Cash Due</span>` : `<span class="px-2.5 py-0.5 rounded-full surface-soft text-[10px] font-bold">Paid ✓</span>`}
                <div class="font-extrabold tabular-nums">$${p.amount}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderParentVideo() {
      const ath = state.athletes.find(a => a.id === state.activeSiblingId) || state.athletes[0];
      const recaps = state.sessionRecaps.filter(r => r.athleteId === ath.id);
      return `
        ${renderSiblingBar()}
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Session Recaps &amp; Video</h1>
            <p class="text-xs text-[var(--text-muted)]">Every lesson note &amp; video clip from Coach Gina saved in one organized timeline</p>
          </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="card-mist rounded-[28px] p-5 space-y-3 h-fit">
            <h2 class="text-sm font-extrabold">Send Practice Clip to Gina</h2>
            <p class="text-xs text-[var(--text-muted)]">Upload a home swing or fielding clip for Coach Gina’s review.</p>
            <form onsubmit="uploadParentVideo(event,'${ath.id}')" class="space-y-2.5">
              <input name="title" class="w-full px-3.5 py-2.5 rounded-2xl card-white text-xs" placeholder="e.g., Front Toss Swing (Side View)" required />
              <button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">Upload to Coach Gina</button>
            </form>
          </div>
          <div class="lg:col-span-2 space-y-4">
            ${recaps.length ? recaps.map(r => `
              <div class="card-white rounded-[28px] overflow-hidden">
                <div onclick="openRecapViewerModal('${r.id}')" class="relative h-48 cursor-pointer group">
                  <img src="${r.videoImg}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                  <div class="absolute inset-0 bg-[#010101]/45 flex items-center justify-center">
                    <div class="w-12 h-12 rounded-full bg-[#D5FF5F] text-[#010101] flex items-center justify-center shadow-lg text-base">▶</div>
                  </div>
                  <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-[#010101]/80 text-[#D5FF5F] text-[10px] font-extrabold">${r.date}</span>

    // COACH GINA SCHEDULING: DAILY BOOKINGS + ADJUSTABLE BLOCKS + CLASS TYPES
    // =========================================================================
    function toggleCoachDay(dow) {
      const days = state.cal.availability.days;
      if (days.includes(dow)) {
        state.cal.availability.days = days.filter(d => d !== dow);
      } else {
        days.push(dow);
        if (!state.cal.availability.weeklyBlocks[dow]?.length) {
          state.cal.availability.weeklyBlocks[dow] = [{ id: 'b-' + Date.now(), start: '15:30', end: '19:00' }];
        }
      }
      render();
      showToast('Updated open coaching days — Athlete Booking Calendar synced!');
    }

    function updateCoachBlock(dow, blockId, field, value) {
      const blocks = state.cal.availability.weeklyBlocks[dow] || [];
      const b = blocks.find(x => x.id === blockId);
      if (!b) return;
      b[field] = value;
      render();
      showToast('Time block adjusted — live booking slots recalculated!');
    }

    function addCoachBlock(dow) {
      if (!state.cal.availability.days.includes(dow)) state.cal.availability.days.push(dow);
      if (!state.cal.availability.weeklyBlocks[dow]) state.cal.availability.weeklyBlocks[dow] = [];
      state.cal.availability.weeklyBlocks[dow].push({ id: 'b-' + Date.now(), start: '17:00', end: '20:00' });
      render();
      showToast('Added new time block!');
    }

    function removeCoachBlock(dow, blockId) {
      state.cal.availability.weeklyBlocks[dow] = (state.cal.availability.weeklyBlocks[dow] || []).filter(b => b.id !== blockId);
      if (!state.cal.availability.weeklyBlocks[dow].length) {
        state.cal.availability.days = state.cal.availability.days.filter(d => d !== dow);
      }
      render();
      showToast('Removed time block.');
    }

    function saveClassType(e, editId) {
      e.preventDefault();
      const dur = Number(e.target.duration.value);
      const durationLabel = dur >= 60 && dur % 60 === 0 ? `${dur / 60}h` : `${dur}m`;
      const payload = {
        title: e.target.title.value.trim(),
        type: e.target.type.value,
        duration: dur,
        durationLabel,
        price: Number(e.target.price.value),
        location: e.target.location.value.trim(),
        desc: e.target.desc.value.trim() || 'Fastpitch training session with Coach Gina.',
        allowCredit: false,
        img: (() => {
          const t = (e.target.title.value + ' ' + e.target.type.value).toLowerCase();
          if (t.includes('small group')) return 'assets/images/fastpitch-group.jpg';
          if (t.includes('catch')) return 'assets/images/fastpitch-catcher.jpg';
          if (t.includes('slap') || t.includes('clinic') || t.includes('camp')) return 'assets/images/fastpitch-slapper.jpg';
          if (t.includes('field') || t.includes('defen') || t.includes('infield')) return 'assets/images/fastpitch-fielding.jpg';
          return 'assets/images/fastpitch-hitter.jpg';
        })()
      };
      if (editId) {
        const idx = state.cal.eventTypes.findIndex(x => x.id === editId);
        if (idx >= 0) state.cal.eventTypes[idx] = { ...state.cal.eventTypes[idx], ...payload };
      } else {
        const slug = payload.title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        state.cal.eventTypes.push({ id: 'evt-' + Date.now(), slug, ...payload });
      }
      closeModal();
      render();
      showToast(editId ? `Updated "${payload.title}" (${durationLabel}) — synced to Booking!` : `Added "${payload.title}" (${durationLabel}) to Booking!`);
    }

    function deleteClassType(id) {
      if (state.cal.eventTypes.length <= 1) {
        showToast('Keep at least one class type active.');
        return;
      }
      state.cal.eventTypes = state.cal.eventTypes.filter(x => x.id !== id);
      if (state.cal.eventTypeId === id) state.cal.eventTypeId = state.cal.eventTypes[0].id;
      render();
      showToast('Class type removed.');
    }

                      ${r.tags.map(t => `<span class="px-2 py-0.5 rounded-full card-white text-[10px] font-extrabold">${t}</span>`).join('')}
                    </div>
                  </div>
                  ${renderRecapTemplateBody(r, true)}
                  <div class="flex items-center gap-2">
                    <button onclick="openRecapViewerModal('${r.id}')" class="flex-1 card-white rounded-2xl p-2.5 flex items-center gap-3 text-left cursor-pointer hover:border-[#010101] transition">
                      <div class="relative w-16 h-12 rounded-xl overflow-hidden shrink-0">
                        <img src="${r.videoImg}" class="w-full h-full object-cover" />
                        <div class="absolute inset-0 bg-[#010101]/40 flex items-center justify-center text-[#D5FF5F] text-xs">▶</div>
                      </div>
                      <div class="min-w-0 flex-1">
                        <div class="text-xs font-extrabold truncate">${r.videoTitle}</div>
                        <div class="text-[11px] text-[var(--text-muted)]">Attached session video • Tap to preview</div>
                      </div>
                    </button>
                    <button onclick="copyRecapNote('${r.id}')" title="Copy formatted note" class="px-3 py-3 rounded-2xl card-white text-xs font-extrabold cursor-pointer hover:border-[#010101] shrink-0">📋</button>
                  </div>
                </div>
              `).join('') : `<div class="p-6 text-center text-xs text-[var(--text-muted)] surface-soft rounded-2xl">No session notes yet. Tap "+ New Recap &amp; Send" after today’s lesson!</div>`}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // POST-SESSION RECAP COMPOSER — GINA'S EXACT SESSION NOTES TEMPLATE
    // =========================================================================
    const GINA_WARMUP_DEFAULT = `walking pvc swings, recoils, pvc rotations\nMed ball - staggered, scoop, step back 5 each (4lbs)`;
    const GINA_HOMEWORK_DEFAULT = `At least 1 bucket of each drill 2-3x a week!`;

    let _recapDraftTags = ['Barrel Path', 'Timing'];
    let _recapDraftVideoUrl = null;
    let _recapDraftVideoName = null;

    function formatBulletLines(text) {
      if (!text || !text.trim()) return '';
      return text.split('\n').map(l => l.trim().replace(/^[•\-*]\s*/, '')).filter(Boolean)
        .map(l => `<li class="flex items-start gap-1.5"><span class="text-[#4E6075] dark:text-[#D5FF5F] font-extrabold">•</span><span>${l}</span></li>`).join('');
    }

    function formatRecapPlainText(r) {
      const lines = [];
      if (r.date) lines.push(r.date);
      if (r.warmup) {
        lines.push(`* Hitter’s Warm up routine`);
        lines.push(r.warmup);
        lines.push('');
      }
      lines.push(`What’s new/focus for lesson:`);
      lines.push(r.focus || r.note || '');
      lines.push('');
      lines.push(`What we did today:`);
      lines.push('');
      if (r.tee) {
        lines.push(`Tee:`);
        r.tee.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      }
      if (r.ft) {
        lines.push(`FT:`);
        r.ft.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      }
      if (r.machine) {
        lines.push(`Machine:`);
        r.machine.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      }
      lines.push('');
      const hwLines = (r.homework || GINA_HOMEWORK_DEFAULT).split('\n').map(x => x.trim()).filter(Boolean);
      lines.push(`Homework - ${hwLines[0] || GINA_HOMEWORK_DEFAULT}`);
      hwLines.slice(1).forEach(x => lines.push(`* ${x.replace(/^[•\-*]\s*/, '')}`));
      return lines.join('\n');
    }

    function copyRecapNote(recapId) {
      const r = state.sessionRecaps.find(x => x.id === recapId);
      if (!r) return;
      const txt = formatRecapPlainText(r);
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(txt).then(() => showToast('Session note copied to clipboard!')).catch(() => showToast('Note ready to share!'));
      } else {
        showToast('Session note copied!');
      }
    }

    function appendQuickDrill(inputId, text) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const cur = el.value.trim();
      el.value = cur ? `${cur}\n• ${text}` : `• ${text}`;
      el.focus();
    }

    function renderRecapTemplateBody(r, compact = false) {
      if (!r.focus && !r.tee && !r.ft && !r.machine && !r.warmup) {
        return `<p class="text-xs leading-relaxed">${r.note}</p>`;
      }
      const boxCls = compact ? 'card-white' : 'surface-soft';
      const hwLines = (r.homework || '').split('\n').map(l => l.trim()).filter(Boolean);
      const hwHead = hwLines[0] || '';
      const hwBullets = hwLines.slice(1);
      return `
        <div class="space-y-2.5 text-xs">
          ${r.warmup ? `
            <div class="${boxCls} rounded-2xl p-3 space-y-1">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">• Hitter’s Warm Up Routine</div>
              <div class="text-[11px] leading-relaxed whitespace-pre-line text-[var(--text-muted)]">${r.warmup}</div>
            </div>
          ` : ''}

          ${r.focus ? `
            <div class="space-y-0.5">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">What’s New / Focus for Lesson</div>
              <p class="text-xs font-semibold leading-relaxed whitespace-pre-line">${r.focus}</p>
            </div>
          ` : ''}

          ${(r.tee || r.ft || r.machine) ? `
            <div class="space-y-1.5">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">What We Did Today</div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                ${r.tee ? `
                  <div class="${boxCls} rounded-2xl p-2.5 space-y-1">
                    <div class="text-[10px] font-extrabold uppercase tracking-wider">Tee</div>
                    <ul class="space-y-1 text-[11px] leading-snug">${formatBulletLines(r.tee)}</ul>
                  </div>
                ` : ''}
                ${r.ft ? `
                  <div class="${boxCls} rounded-2xl p-2.5 space-y-1">
                    <div class="text-[10px] font-extrabold uppercase tracking-wider">FT (Front Toss)</div>
                    <ul class="space-y-1 text-[11px] leading-snug">${formatBulletLines(r.ft)}</ul>
                  </div>
                ` : ''}
                ${r.machine ? `
                  <div class="${boxCls} rounded-2xl p-2.5 space-y-1">
                    <div class="text-[10px] font-extrabold uppercase tracking-wider">Machine</div>
                    <ul class="space-y-1 text-[11px] leading-snug">${formatBulletLines(r.machine)}</ul>
                  </div>
                ` : ''}
              </div>
            </div>
          ` : ''}

          ${hwHead ? `
            <div class="rounded-2xl px-3 py-2.5 bg-[#D5FF5F]/25 dark:bg-[#D5FF5F]/15 border border-[#D5FF5F]/60 space-y-1">
              <div class="flex items-start gap-2 text-[11px] leading-snug">
                <span class="text-xs">🥎</span>
                <div><span class="font-extrabold">Homework:</span> ${hwHead}</div>
              </div>
              ${hwBullets.length ? `<ul class="pl-5 space-y-0.5 text-[11px] leading-snug">${formatBulletLines(hwBullets.join('\n'))}</ul>` : ''}
            </div>
          ` : ''}

          ${r.clips && r.clips.length > 1 ? `
            <div class="space-y-1.5">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">🎥 Attached Clips (${r.clips.length})</div>
              <div class="grid grid-cols-2 gap-2">
                ${r.clips.map(c => `
                  <button type="button" onclick="openRecapViewerModal('${r.id}')" class="relative h-20 rounded-2xl overflow-hidden text-left group cursor-pointer">
                    <img src="${c.img || r.videoImg}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                    <div class="absolute inset-0 bg-gradient-to-t from-[#010101]/80 via-[#010101]/20 to-transparent flex flex-col justify-between p-2">
                      <span class="w-6 h-6 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold flex items-center justify-center">▶</span>
                      <span class="text-[10px] font-extrabold text-white truncate">${c.title}</span>
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    let _recapDraftClips = [];

    function openSessionRecapModal(athId, sessionId) {
      const ath = state.athletes.find(a => a.id === athId) || state.athletes[0];
      const ses = sessionId ? state.sessions.find(s => s.id === sessionId) : null;
      _recapDraftTags = ['Barrel Control', 'Variability'];
      _recapDraftVideoUrl = null;
      _recapDraftVideoName = null;
      _recapDraftClips = [];
      renderRecapComposerModal(ath, ses);
    }

    function readRecapComposerDraft() {
      return {
        includeWarmup: document.getElementById('recap-include-warmup')?.checked ?? true,
        warmup: document.getElementById('recap-warmup-input')?.value ?? GINA_WARMUP_DEFAULT,
        focus: document.getElementById('recap-focus-input')?.value ?? '',
        tee: document.getElementById('recap-tee-input')?.value ?? '',
        ft: document.getElementById('recap-ft-input')?.value ?? '',
        machine: document.getElementById('recap-machine-input')?.value ?? '',
        homework: document.getElementById('recap-homework-input')?.value ?? GINA_HOMEWORK_DEFAULT
      };
    }

    function toggleRecapTag(tag, athId, sessionId) {
      if (_recapDraftTags.includes(tag)) _recapDraftTags = _recapDraftTags.filter(t => t !== tag);
      else _recapDraftTags.push(tag);
      const ath = state.athletes.find(a => a.id === athId) || state.athletes[0];
      const ses = sessionId ? state.sessions.find(s => s.id === sessionId) : null;
      renderRecapComposerModal(ath, ses, readRecapComposerDraft());
    }

    function handleRecapVideoFile(input) {
      const files = Array.from(input.files || []);
      if (!files.length) return;
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        _recapDraftClips.push({ title: file.name, url, img: 'assets/images/fastpitch-hitter.jpg' });
      });
      _recapDraftVideoUrl = _recapDraftClips[0].url;
      _recapDraftVideoName = _recapDraftClips.length === 1 ? _recapDraftClips[0].title : `${_recapDraftClips.length} clips attached`;
      const label = document.getElementById('recap-video-status');
      if (label) label.textContent = `✓ ${_recapDraftVideoName}`;
    }

    function renderRecapComposerModal(ath, ses, draft = null) {
      const d = draft || {
        includeWarmup: true,
        warmup: GINA_WARMUP_DEFAULT,
        focus: '',
        tee: '',
        ft: '',
        machine: '',
        homework: GINA_HOMEWORK_DEFAULT
      };
      const allTags = ['Barrel Control', 'Variability', 'Approach', 'Exit Velo', 'Timing', 'Slapping', 'Footwork', 'Pop Time'];
      const teeQuick = ['Extensions 3/3/3', 'Swing 3/3/3'];
      const ftQuick = ['Shorty baseballs', 'Baseball bat baseballs', 'Regular bat softballs'];
      const hwQuick = ['Extensions in mid out', 'Step back drill to stay in legs', 'Outside pitches'];
      openModal(`
        <div class="flex items-start justify-between gap-2">
          <div>
            <div class="text-[11px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">Gina’s Session Notes Template</div>

        </div>

        <form onsubmit="submitSessionRecap(event, '${ath.id}', '${ses ? ses.id : ''}')" class="space-y-3 text-xs">
          <!-- 1-Tap Focus Tags -->
          <div>
            <label class="block text-[var(--text-muted)] font-bold mb-1.5">Quick Focus Tags</label>
            <div class="flex flex-wrap gap-1.5">
              ${allTags.map(t => {
                const on = _recapDraftTags.includes(t);
                return `<button type="button" onclick="toggleRecapTag('${t}','${ath.id}','${ses ? ses.id : ''}')" class="px-2.5 py-1 rounded-full text-[11px] font-extrabold cursor-pointer transition ${on ? 'bg-[#010101] text-[#D5FF5F]' : 'surface-soft text-[var(--text-muted)]'}">${t}</button>`;
              }).join('')}
            </div>
          </div>

          <!-- 1. Hitter's Warm up routine (Pre-filled from Gina's template) -->
          <div class="surface-soft rounded-2xl p-3 space-y-1.5">
            <label class="flex items-center justify-between gap-2 cursor-pointer">
              <span class="font-extrabold text-[11px]">• Hitter’s Warm up routine</span>
              <input id="recap-include-warmup" type="checkbox" name="includeWarmup" ${d.includeWarmup ? 'checked' : ''} class="w-4 h-4 accent-[#010101]" />
            </label>
            <textarea id="recap-warmup-input" name="warmup" rows="2" class="w-full px-3 py-2 rounded-xl card-white text-[11px] leading-relaxed">${d.warmup}</textarea>
          </div>

          <!-- 2. What's new / focus for lesson -->
          <div>
            <label class="block font-extrabold mb-1">What’s new / focus for lesson: *</label>
            <textarea id="recap-focus-input" name="focus" rows="2" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft leading-relaxed" placeholder="e.g., Playing in 14u tourney this weekend • Barrel control w diff bats..." required>${d.focus}</textarea>
          </div>

          <!-- 3. What we did today: Tee / FT / Machine -->
          <div class="surface-soft rounded-2xl p-3 space-y-2.5">
            <div class="font-extrabold text-[11px] uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">What we did today</div>
            <div>
              <div class="flex flex-wrap items-center justify-between gap-1 mb-1">
                <label class="font-bold">Tee:</label>
                <div class="flex flex-wrap gap-1">
                  ${teeQuick.map(q => `<button type="button" onclick="appendQuickDrill('recap-tee-input','${q}')" class="px-2 py-0.5 rounded-full card-white text-[10px] font-bold cursor-pointer hover:bg-[#D5FF5F] hover:text-[#010101]">+ ${q}</button>`).join('')}
                </div>
              </div>
              <textarea id="recap-tee-input" name="tee" rows="2" class="w-full px-3 py-2 rounded-xl card-white leading-snug" placeholder="• Extensions 3/3/3&#10;• Swing 3/3/3">${d.tee}</textarea>
            </div>
            <div>
              <div class="flex flex-wrap items-center justify-between gap-1 mb-1">
                <label class="font-bold">FT (Front Toss):</label>
                <div class="flex flex-wrap gap-1">
                  ${ftQuick.map(q => `<button type="button" onclick="appendQuickDrill('recap-ft-input','${q}')" class="px-2 py-0.5 rounded-full card-white text-[10px] font-bold cursor-pointer hover:bg-[#D5FF5F] hover:text-[#010101]">+ ${q}</button>`).join('')}
                </div>
              </div>
              <textarea id="recap-ft-input" name="ft" rows="3" class="w-full px-3 py-2 rounded-xl card-white leading-snug" placeholder="• Shorty baseballs&#10;• Worked on at bats & attacking pitches you are hunting!!">${d.ft}</textarea>
            </div>
            <div>
              <label class="block font-bold mb-1">Machine:</label>
              <textarea id="recap-machine-input" name="machine" rows="2" class="w-full px-3 py-2 rounded-xl card-white leading-snug" placeholder="• Fastball timing reps (optional)">${d.machine}</textarea>
            </div>
          </div>

          <!-- 4. Homework (Multi-line with bullet points, pre-filled from Gina's template) -->
          <div class="space-y-1.5">
            <div class="flex flex-wrap items-center justify-between gap-1">
              <label class="font-extrabold">Homework:</label>
              <div class="flex flex-wrap gap-1">
                ${hwQuick.map(q => `<button type="button" onclick="appendQuickDrill('recap-homework-input','${q}')" class="px-2 py-0.5 rounded-full surface-soft text-[10px] font-bold cursor-pointer hover:bg-[#D5FF5F] hover:text-[#010101]">+ ${q}</button>`).join('')}
              </div>
            </div>
            <textarea id="recap-homework-input" name="homework" rows="3" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft leading-snug font-semibold" placeholder="At least 1 bucket of each drill 2-3x a week!&#10;• Extensions in mid out&#10;• Step back drill to stay in legs.">${d.homework}</textarea>
          </div>

          <!-- Attach Session Videos / Photos from Camera Roll (Supports Multiple Clips!) -->
          <div class="surface-soft rounded-2xl p-3 space-y-2">
            <div class="flex items-center justify-between">
              <span class="font-extrabold">🎥 Attach Session Videos / Clips</span>
              <span id="recap-video-status" class="text-[11px] font-bold text-[#4E6075] dark:text-[#9AC0D6]">${_recapDraftVideoName ? `✓ ${_recapDraftVideoName}` : '1 or more clips'}</span>
            </div>
            <label class="block w-full py-2 px-3 rounded-xl card-white text-center font-bold cursor-pointer hover:border-[#010101]">
              Choose Videos or Photos from Phone / Computer
              <input type="file" accept="video/*,image/*" multiple onchange="handleRecapVideoFile(this)" class="hidden" />
            </label>
          </div>

          <!-- Auto-Send to Player & Parent Toggle -->
          <label class="flex items-center justify-between gap-3 p-3 rounded-2xl card-mist cursor-pointer">
            <div>
              <div class="font-extrabold">Message Player &amp; Parent Automatically</div>
              <div class="text-[11px] text-[var(--text-muted)]">Sends formatted note + clips to ${ath.parentName} (${ath.parentPhone})</div>
            </div>
            <input type="checkbox" name="sendNow" checked class="w-5 h-5 accent-[#010101]" />
          </label>

          <button type="submit" class="w-full py-3.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-sm font-extrabold cursor-pointer shadow-lg hover:brightness-95 transition">
            Save Recap &amp; Send to Player →
          </button>
        </form>
      `);
    }

    function submitSessionRecap(e, athId, sessionId) {
      e.preventDefault();
      const ath = state.athletes.find(a => a.id === athId) || state.athletes[0];
      const ses = sessionId ? state.sessions.find(s => s.id === sessionId) : null;
      const includeWarmup = e.target.includeWarmup.checked;
      const warmup = includeWarmup ? e.target.warmup.value.trim() : '';
      const focus = e.target.focus.value.trim();
      const tee = e.target.tee.value.trim();
      const ft = e.target.ft.value.trim();
      const machine = e.target.machine.value.trim();
      const homework = e.target.homework.value.trim() || GINA_HOMEWORK_DEFAULT;
      const sendNow = e.target.sendNow.checked;
      const vidTitle = _recapDraftVideoName || `${ath.name.split(' ')[0]} Session Clip — Today (0:14)`;
      const vidImg = getAthleteCoverImg(ath);
      const clips = _recapDraftClips.length ? _recapDraftClips.map(c => ({ ...c, img: vidImg })) : [{ title: vidTitle, img: vidImg, url: _recapDraftVideoUrl }];

      const newRecap = {
        id: 'rec-' + Date.now(),
        athleteId: ath.id,
        date: new Date().toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' }),
        sessionTitle: ses ? ses.focus : '1-on-1 Training Session',
        tags: [..._recapDraftTags],
        warmup,
        focus,
        tee,
        ft,
        machine,
        homework,
        note: focus,
        videoTitle: vidTitle,
        videoImg: vidImg,
        videoUrl: _recapDraftVideoUrl,
        clips,
        sentTo: sendNow ? `${ath.parentName} (SMS + App)` : 'Saved Private (Draft)',
        sentAt: 'Just now'
      };

      // 1. Save permanently in Session Recaps timeline (replaces Apple Notes!)
      state.sessionRecaps.unshift(newRecap);

      // 2. Also update athlete notes & sync first Tee/FT drill to weekly checklist
      ath.notes.unshift({ date: 'Today', text: focus });
      const firstDrillLine = (tee || ft || machine).split('\n').map(l => l.trim().replace(/^[•\-*]\s*/, '')).find(Boolean);
      if (firstDrillLine) {
        ath.drills.unshift({ id: 'd-' + Date.now(), title: firstDrillLine, reps: '1 bucket • 2-3x/wk', focus: _recapDraftTags[0] || 'Session Focus', done: false, img: vidImg });
      }

      // 3. Mark session completed if launched from a session
      if (ses) ses.status = 'Completed';

      // 4. Automatically message the parent thread with the formatted template + video!
      if (sendNow) {
        let thread = state.threads.find(t => t.parent === ath.parentName);
        if (!thread) {
          thread = { id: 'msg-' + Date.now(), parent: ath.parentName, athletes: ath.name, unread: 0, messages: [] };
          state.threads.unshift(thread);
        }
        thread.messages.push({
          from: 'coach',
          time: 'Just now',
          text: `📝 Session Notes for ${ath.name.split(' ')[0]}:\n${formatRecapPlainText(newRecap)}\n🎥 Video attached: ${vidTitle}`
        });
      }

      closeModal();
      render();
      showToast(sendNow ? `Session notes + video saved & sent to ${ath.parentName}!` : 'Session notes saved to athlete history!');
    }

    function openRecapViewerModal(recapId) {
      const r = state.sessionRecaps.find(x => x.id === recapId);
      if (!r) return;
      openModal(`
        <div>
          <div class="relative bg-[#010101]">
            ${r.videoUrl
              ? `<video src="${r.videoUrl}" controls autoplay playsinline class="w-full max-h-64 object-contain"></video>`
              : `<div class="relative h-48"><img src="${r.videoImg}" class="w-full h-full object-cover" /><div class="absolute inset-0 bg-[#010101]/40 flex flex-col items-center justify-center gap-1.5 text-white"><div class="w-14 h-14 rounded-full bg-[#D5FF5F] text-[#010101] flex items-center justify-center text-lg shadow-xl">▶</div><span class="text-xs font-extrabold">${r.videoTitle}</span></div></div>`
            }
            <button onclick="closeModal()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-[#010101]/70 text-white text-xs font-bold cursor-pointer">✕</button>
          </div>
          <div class="p-5 space-y-3 bg-[var(--bg-card)]">
            <div class="flex items-center justify-between gap-2">
              <span class="px-2.5 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">${r.date}</span>
              <span class="text-[11px] text-[var(--text-muted)] font-semibold">${r.sentTo}</span>
            </div>
            <div class="font-extrabold text-base">${r.sessionTitle}</div>
            <div class="flex flex-wrap gap-1.5">
              ${r.tags.map(t => `<span class="px-2.5 py-0.5 rounded-full surface-soft text-[10px] font-extrabold">${t}</span>`).join('')}
            </div>

            </div>
          </div>
        </div>
      `, true);
    }

    function renderCoachVideo() {
      const vid = state.videos.find(v => v.id === state.selectedVideoId) || state.videos[0];
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="space-y-3">
            ${state.videos.map(v => `
              <button onclick="state.selectedVideoId='${v.id}'; render();" class="w-full text-left p-4 rounded-[24px] border cursor-pointer ${v.id === vid.id ? 'bg-[#010101] text-white border-[#010101]' : 'card-white'}">
                <div class="flex justify-between items-center"><span class="font-extrabold text-xs">${v.athleteName}</span><span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${v.status === 'Reviewed' ? 'bg-[#D5FF5F] text-[#010101]' : 'bg-[#D6DFE2] text-[#010101]'}">${v.status}</span></div>
                <div class="text-xs font-semibold mt-1">${v.title}</div>
              </button>
            `).join('')}
          </div>
          <div class="lg:col-span-2 card-white rounded-[28px] overflow-hidden">
            <div class="relative h-56">
              <img src="${vid.img}" class="w-full h-full object-cover" />
              <div class="absolute inset-0 bg-[#010101]/45 flex flex-col items-center justify-center gap-2 text-white">
                <div class="w-14 h-14 rounded-full bg-[#D5FF5F] text-[#010101] flex items-center justify-center text-lg shadow-xl">▶</div>
                <div class="text-xs font-extrabold">Slow-Mo Mechanics Breakdown (${state.videoSpeed})</div>
              </div>
              <div class="absolute top-3 right-3 flex gap-1">
                ${['0.25x', '0.5x', '1x'].map(sp => `<button onclick="state.videoSpeed='${sp}'; render();" class="px-2.5 py-1 rounded-full text-[11px] font-extrabold cursor-pointer ${state.videoSpeed === sp ? 'bg-[#D5FF5F] text-[#010101]' : 'bg-[#010101]/70 text-white'}">${sp}</button>`).join('')}
              </div>
            </div>
            <div class="p-5 space-y-3">
              <div class="flex items-center justify-between"><h2 class="font-extrabold text-base">${vid.title}</h2><button onclick="markVideoReviewed('${vid.id}')" class="px-4 py-2 rounded-xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">${vid.status === 'Reviewed' ? 'Reviewed ✓' : 'Mark Reviewed'}</button></div>
              ${vid.cues.map(c => `<div class="surface-soft rounded-2xl p-3 flex items-start gap-2.5 text-xs"><span class="px-2 py-0.5 rounded-lg bg-[#010101] text-[#D5FF5F] font-mono font-extrabold">${c.time}</span><span>${c.note}</span></div>`).join('')}
              <form onsubmit="addVideoCue(event,'${vid.id}')" class="flex gap-2 pt-1"><input name="time" value="0:08" class="w-20 px-3 py-2.5 rounded-2xl surface-soft text-xs font-mono font-bold" required /><input name="note" class="flex-1 px-3.5 py-2.5 rounded-2xl surface-soft text-xs" placeholder="Add timestamped cue..." required /><button type="submit" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">Add</button></form>
            </div>
          </div>
        </div>
      `;
    }

    function renderCoachPayments() {
      const collected = state.payments.filter(p => p.status !== 'Pending Cash').reduce((s, p) => s + p.amount, 0);
      const pendingCash = state.payments.filter(p => p.status === 'Pending Cash').reduce((s, p) => s + p.amount, 0);
      return `
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-2xl font-extrabold">Payments</h1>
              <span class="px-2.5 py-1 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">🍀 CLOVER CONNECTED ✓</span>
            </div>
            <p class="text-xs text-[var(--text-muted)] mt-0.5">Clover Hosted Checkout &amp; Tap-to-Pay + Cash / Venmo / Zelle tracking</p>
          </div>
          <button onclick="openLogPaymentModal()" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">+ Log Cash / Clover</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="space-y-3">
            <div class="card-mist rounded-[24px] p-5 space-y-2">
              <div class="flex items-center justify-between text-xs">
                <span class="font-extrabold">🍀 Clover Merchant Sync</span>
                <span class="text-[11px] font-extrabold text-[#22c55e]">● Live</span>
              </div>
              <div class="text-3xl font-extrabold tabular-nums">$${collected.toLocaleString()}</div>
              <div class="text-[11px] text-[var(--text-muted)]">Collected via Clover (Card / Apple Pay) &amp; Cash</div>
            </div>
            <div class="card-white rounded-[24px] p-5 space-y-1.5">
              <div class="text-xs font-extrabold">💵 Pending Cash Due</div>
              <div class="text-2xl font-extrabold tabular-nums">$${pendingCash.toLocaleString()}</div>
              <div class="text-[11px] text-[var(--text-muted)]">${pendingCash > 0 ? 'Tap "Mark Cash Paid ✓" when collected at the cage' : 'No unpaid cash sessions right now'}</div>
            </div>
          </div>

          <div class="lg:col-span-2 card-white rounded-[28px] p-5 space-y-3">
            <div class="flex justify-between items-center"><h2 class="text-sm font-extrabold">Recent Transactions</h2><span class="px-3 py-1 rounded-full bg-[#D5FF5F] text-[#010101] text-xs font-extrabold">${state.payments.length} entries</span></div>
            ${state.payments.map(p => `
              <div class="surface-soft rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-2 text-xs">
                <div>
                  <div class="font-extrabold">${p.family} — ${p.item}</div>

                  <div class="font-extrabold tabular-nums">+$${p.amount}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCoachMessaging() {
      const thread = state.threads.find(t => t.id === state.activeThreadId) || state.threads[0];
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="space-y-3">
            ${state.threads.map(t => `<button onclick="openThread('${t.id}')" class="w-full text-left p-4 rounded-[24px] border cursor-pointer ${t.id === thread.id ? 'bg-[#010101] text-white border-[#010101]' : 'card-white'}"><div class="font-extrabold text-xs">${t.parent}</div><div class="text-xs opacity-70">${t.athletes}</div></button>`).join('')}
            <div class="card-mist rounded-[24px] p-4 space-y-2">
              <div class="text-xs font-extrabold">Waiver Status</div>
              ${state.athletes.map(a => `<div class="flex justify-between text-xs"><span>${a.name}</span><span class="font-extrabold">${a.waiverSigned ? 'Signed ✓' : 'Pending'}</span></div>`).join('')}
            </div>
          </div>
          <div class="lg:col-span-2 card-white rounded-[28px] p-5 space-y-4">
            <div class="space-y-2.5">${thread.messages.map(m => `<div class="flex ${m.from === 'coach' ? 'justify-end' : 'justify-start'}"><div class="max-w-md px-4 py-3 rounded-2xl text-xs whitespace-pre-line ${m.from === 'coach' ? 'bg-[#D5FF5F] text-[#010101] font-bold' : 'surface-soft'}">${m.text}</div></div>`).join('')}</div>
            <form onsubmit="sendCoachReply(event,'${thread.id}')" class="flex gap-2"><input name="text" class="flex-1 px-4 py-2.5 rounded-2xl surface-soft text-xs" placeholder="Reply to ${thread.parent}..." required /><button type="submit" class="px-5 py-2.5 rounded-2xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer">Send</button></form>
          </div>
        </div>
