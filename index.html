  <style>
    :root {
      /* Exact Brand System */
      --volt: #D5FF5F;
      --obsidian: #010101;
      --mist: #D6DFE2;
      --white: #FFFFFF;
      --slate-blue: #4E6075;
      --sky-blue: #9AC0D6;
      --charcoal: #595959;
      --mid-gray: #9F9F9F;

      /* Apple Liquid Glass — Light Mode */
      --bg-page: #DDE6EA;
      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.48) 100%);
      --glass-mist: linear-gradient(135deg, rgba(226, 234, 238, 0.84) 0%, rgba(182, 208, 224, 0.42) 100%);
      --glass-soft: rgba(255, 255, 255, 0.54);
      --glass-dock: linear-gradient(180deg, rgba(255, 255, 255, 0.84) 0%, rgba(255, 255, 255, 0.64) 100%);
      --glass-border: rgba(255, 255, 255, 0.82);
      --glass-border-outer: rgba(78, 96, 117, 0.14);
      --glass-specular: inset 0 1.5px 1px rgba(255, 255, 255, 0.94), inset 0 -1px 1px rgba(78, 96, 117, 0.08);
      --glass-shadow: 0 14px 36px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(15, 23, 42, 0.04);
      --border-subtle: rgba(78, 96, 117, 0.16);
      --text-main: #010101;
      --text-muted: #4A5562;
      --text-soft: #64707D;
      --bg-card: rgba(255, 255, 255, 0.78);
      --bg-elevated: rgba(255, 255, 255, 0.56);
      --bg-canvas: var(--bg-page);
    }

    html.dark {
      color-scheme: dark;
      /* High-Contrast Frosted Dark Mode (WCAG AA/AAA) */
      --bg-page: #0B0F14;
      --glass-bg: linear-gradient(135deg, rgba(24, 31, 42, 0.90) 0%, rgba(16, 21, 29, 0.84) 100%);
      --glass-mist: linear-gradient(135deg, rgba(33, 45, 62, 0.92) 0%, rgba(20, 29, 41, 0.86) 100%);
      --glass-soft: rgba(255, 255, 255, 0.09);
      --glass-dock: linear-gradient(180deg, rgba(24, 31, 41, 0.92) 0%, rgba(14, 18, 25, 0.90) 100%);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-outer: rgba(255, 255, 255, 0.12);
      --glass-specular: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -1px 0 rgba(0, 0, 0, 0.45);
      --glass-shadow: 0 18px 44px rgba(0, 0, 0, 0.55), 0 2px 10px rgba(0, 0, 0, 0.35);
      --border-subtle: rgba(255, 255, 255, 0.14);
      --text-main: #F8FAFC;
      --text-muted: #CBD5E1;
      --text-soft: #94A3B8;
      --bg-card: rgba(20, 26, 35, 0.90);
      --bg-elevated: rgba(255, 255, 255, 0.10);
      --bg-canvas: var(--bg-page);
    }

    html.dark #modal-root > .card-white {
      background: rgba(17, 22, 30, 0.97);
      border-color: rgba(255, 255, 255, 0.18);
    }
    html.dark input, html.dark select, html.dark textarea {
      color: #F8FAFC;
      background-color: rgba(255, 255, 255, 0.08);
    }
    html.dark input::placeholder, html.dark textarea::placeholder {
      color: #94A3B8;
      opacity: 1;
    }
    html.dark option {
      background-color: #11161E;
      color: #F8FAFC;
    }
    html.dark .modal-backdrop {
      background: rgba(3, 6, 10, 0.72);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      overflow-x: hidden;
    }

    h1 { letter-spacing: -0.03em; }
    h2 { letter-spacing: -0.02em; }

    /* Accessible Focus Rings & Calibrated Tactile Tap Feedback */
    button, a[href], input, select, textarea, [tabindex] {
      -webkit-tap-highlight-color: transparent;
    }
    button {
      transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1), background-color 180ms ease-out, border-color 180ms ease-out, color 180ms ease-out, opacity 180ms ease-out;
    }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid #010101;
      outline-offset: 2px;
    }
    html.dark button:focus-visible, html.dark a:focus-visible, html.dark input:focus-visible, html.dark select:focus-visible, html.dark textarea:focus-visible {
      outline-color: #D5FF5F;
    }
    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    /* iOS Safe-Area-Aware Mobile Header & Bottom Dock */
    .mobile-header-wrap {
      position: sticky;
      top: 0;
      z-index: 30;
      padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
      padding-left: 12px;
      padding-right: 12px;
      padding-bottom: 6px;
      background: linear-gradient(180deg, var(--bg-page) 0%, rgba(221, 230, 234, 0.86) 66%, rgba(221, 230, 234, 0) 100%);
    }
    html.dark .mobile-header-wrap {
      background: linear-gradient(180deg, var(--bg-page) 0%, rgba(7, 9, 12, 0.88) 66%, rgba(7, 9, 12, 0) 100%);
    }
    .mobile-dock-safe {
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    }
    .mobile-main-safe {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 108px);
    }

    /* Ambient Luminous Mesh Behind Liquid Glass */
    .liquid-ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .liquid-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(90px);
      opacity: 0.36;
    }
    html.dark .liquid-orb { opacity: 0.14; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* True Multi-Layered Apple Liquid Glass Materials */
    .card-white {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(195%);
      -webkit-backdrop-filter: blur(28px) saturate(195%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), var(--glass-shadow);
    }

    .card-mist {
      background: var(--glass-mist);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), var(--glass-shadow);
    }

    .surface-soft {
      background: var(--glass-soft);
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }
    html.dark .surface-soft {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .glass-dock {
      background: var(--glass-dock);
      backdrop-filter: blur(36px) saturate(220%);
      -webkit-backdrop-filter: blur(36px) saturate(220%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), 0 16px 42px rgba(1, 1, 1, 0.16);
    }

    .glass-pill-hero {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .modal-backdrop {
      background: rgba(7, 10, 14, 0.45);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
    }

    html, body {
      overscroll-behavior-y: contain;
    }

    @keyframes ptrSpin {
      to { transform: rotate(360deg); }
    }
    .ptr-spinning {
      animation: ptrSpin 0.75s linear infinite;
    }
    #ptr-indicator {
      top: env(safe-area-inset-top, 0px);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    }
    #ptr-indicator.dragging {
      transition: none;
    }

    /* Thoughtful Calibrated Motion System (v3.4.0) */
    @keyframes viewEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .view-enter {
      animation: viewEnter 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes staggerItem {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stagger-list > * {
      animation: staggerItem 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .stagger-list > *:nth-child(1) { animation-delay: 0ms; }
    .stagger-list > *:nth-child(2) { animation-delay: 35ms; }
    .stagger-list > *:nth-child(3) { animation-delay: 70ms; }
    .stagger-list > *:nth-child(4) { animation-delay: 105ms; }
    .stagger-list > *:nth-child(5) { animation-delay: 140ms; }
    .stagger-list > *:nth-child(n+6) { animation-delay: 165ms; }

    @keyframes backdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes sheetEnter {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalEnter {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    #modal-root.flex {
      animation: backdropFade 180ms ease-out both;
    }
    .modal-sheet-enter {
      animation: sheetEnter 280ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @media (min-width: 640px) {
      .modal-sheet-enter {
        animation: modalEnter 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
    }

    @keyframes toastPop {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast-enter {
      animation: toastPop 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes dockPop {
      0% { transform: scale(0.9); }
      60% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .dock-active-pill {
      animation: dockPop 260ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    @media (hover: hover) {
      .card-interactive {
        transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 200ms cubic-bezier(0.22, 1, 0.36, 1), border-color 180ms ease;
      }
      .card-interactive:hover {
        transform: translateY(-2px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    function getRecapSortTimestamp(r) {
      if (!r) return 0;
      if (r.isDraft) return Number.MAX_SAFE_INTEGER;
      // Newly created session notes always sort newest-first via createdAt
      if (r.createdAt) {
        const ts = typeof r.createdAt === 'number' ? r.createdAt : Date.parse(r.createdAt);
        if (!Number.isNaN(ts)) return ts;
      }
      // Imported session notes sort by their imported date
      const raw = String(r.date || '').trim();
      if (!raw) return 0;
      if (/^today$/i.test(raw)) return Date.now();
      // Match M/D/YY, M-D-YY, M/D/YYYY, M-D-YYYY (even with trailing text like "11-3-26- group...")
      const mFull = raw.match(/(?:^|\b)(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})(?:\b|$)/);
      if (mFull) {
        const mo = Number(mFull[1]);
        const dy = Number(mFull[2]);
        let yr = Number(mFull[3]);
        if (yr < 100) yr += 2000;
        if (mo >= 1 && mo <= 12 && dy >= 1 && dy <= 31) {
          return new Date(yr, mo - 1, dy, 12, 0, 0).getTime();
        }
      }
      // Match M/D or M-D without year (e.g. "9-29" or "10/15")
      const mShort = raw.match(/^(\d{1,2})[\/\-](\d{1,2})(?:\b|$)/);
      if (mShort) {
        const mo = Number(mShort[1]);
        const dy = Number(mShort[2]);
        if (mo >= 1 && mo <= 12 && dy >= 1 && dy <= 31) {
          const yr = new Date().getFullYear();
          return new Date(yr, mo - 1, dy, 12, 0, 0).getTime();
        }
      }
      // Fallback: ISO YYYY-MM-DD or "Nov 26, 2026"
      const parsed = Date.parse(raw);
      if (!Number.isNaN(parsed)) return parsed;
      return 0;
    }

    function getSortedRecapsForAthlete(athId, includeDrafts = false) {
      return state.sessionRecaps
        .filter(r => r.athleteId === athId && (includeDrafts || !r.isDraft))

        .sort((a, b) => {
          const diff = getRecapSortTimestamp(b) - getRecapSortTimestamp(a);
          if (diff !== 0) return diff;
          return String(b.id || '').localeCompare(String(a.id || ''));
        });
    }

              <span class="px-2 py-0.5 rounded-full ${isStep2 ? 'bg-red-600 text-white' : 'bg-red-600/15 text-red-600 dark:text-red-400'} text-[10px]">Step ${cfg.step} of 2</span>
            </div>
            <h3 class="font-extrabold text-base mt-1">${esc(isStep2 ? cfg.step2Title : cfg.title)}</h3>
          </div>
          <button type="button" onclick="closeModal(); _doubleConfirmState=null;" aria-label="Close" class="w-10 h-10 rounded-full flex items-center justify-center surface-soft text-xs font-bold cursor-pointer">✕</button>
        </div>

        <div class="${isStep2 ? 'p-3.5 rounded-2xl bg-red-600/10 border border-red-500/25' : 'p-3.5 rounded-2xl surface-soft'} text-xs leading-relaxed">
          ${isStep2 ? `<div class="font-extrabold text-red-600 dark:text-red-400 mb-1">${esc(cfg.title)}</div>` : ''}
          <p class="${isStep2 ? 'text-[var(--text-main)]' : 'text-[var(--text-muted)]'}">${esc(isStep2 ? cfg.step2Detail : cfg.detail)}</p>
        </div>

        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <button type="button" onclick="closeModal(); _doubleConfirmState=null;" class="py-3 rounded-2xl surface-soft text-xs font-extrabold cursor-pointer">Keep / Go Back</button>
          ${isStep2 ? `
            <button type="button" onclick="executeDoubleConfirm()" class="py-3 rounded-2xl bg-red-600 text-white text-xs font-extrabold cursor-pointer hover:bg-red-700 shadow-lg transition">
              ${esc(cfg.step2Label)}
            </button>
          ` : `
            <button type="button" onclick="advanceDoubleConfirmStep()" class="py-3 rounded-2xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer hover:opacity-90 transition">
              ${esc(cfg.step1Label)} →
            </button>
          `}
        </div>
      `);
    }

    function advanceDoubleConfirmStep() {
      if (!_doubleConfirmState) return;
      _doubleConfirmState.step = 2;
      renderDoubleConfirmModal();
    }

    function executeDoubleConfirm() {
      const fn = _doubleConfirmState?.onConfirm;
      _doubleConfirmState = null;
      closeModal();
      if (typeof fn === 'function') fn();
    }

    function openMobileDrawer() {
      const d = document.getElementById('mobile-drawer');
      if (d) d.classList.remove('hidden');
    }

    function closeMobileDrawer() {
      const d = document.getElementById('mobile-drawer');
      if (d) d.classList.add('hidden');
    }

    function switchRole(role) {
      state.role = role;
      render(false);
      showToast(role === 'coach' ? 'Switched to Coach Gina Dashboard' : 'Switched to Athlete Training Hub');
    }

    function setTab(tab) {
      if (state.role === 'coach') state.coachTab = tab;
      else state.parentTab = tab;
      closeMobileDrawer();
      render(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openProfileFromName(athId = null) {
      if (athId) state.activeSiblingId = athId;
      if (state.role === 'coach') {
        state.coachTab = 'athletes';
      } else {
        state.parentTab = 'profile';
      }
      closeMobileDrawer();
      render(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // CAL.COM-STYLE BOOKING ENGINE (3-Column Calendar + Slots + Details + .ICS)
    // =========================================================================
    function calFormatTime(hhmm) {
      if (state.cal.timeFormat === '24h') return hhmm;
      const [hStr, m] = hhmm.split(':');
      const h = parseInt(hStr, 10);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${h12}:${m} ${ampm}`;
    }

    function calDateLabel(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function timeToMins(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function minsToTime(mins) {
      const h = String(Math.floor(mins / 60)).padStart(2, '0');
      const m = String(mins % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    function calGetSlotsForDate(iso) {
      const evt = state.cal.eventTypes.find(e => e.id === state.cal.eventTypeId) || state.cal.eventTypes[0];
      if (!evt) return [];
      const [y, m, d] = iso.split('-').map(Number);
      const dow = new Date(y, m - 1, d).getDay();

      let blocks = [];
      if (evt.availabilityMode === 'custom') {
        const allowedDays = Array.isArray(evt.availableDays) ? evt.availableDays : [];
        if (!allowedDays.includes(dow)) return [];
        const eff = getEffectiveDayAvailability(iso);
        // If coach explicitly marked this specific date as Day Off via override, respect Day Off
        if (eff.isOverride && eff.off) return [];
        if (evt.availableStart && evt.availableEnd) {
          blocks = [{ start: evt.availableStart, end: evt.availableEnd }];
        } else {
          blocks = eff.off ? [] : eff.blocks;
        }
      } else {
        const eff = getEffectiveDayAvailability(iso);
        if (eff.off || !eff.blocks.length) return [];
        blocks = eff.blocks;
      }
      if (!blocks.length) return [];
      const dur = Number(evt.duration) || 45;
      const buf = Number(state.cal.availability.bufferMin) || 0;
      const step = Math.max(15, dur + buf);

      const slots = [];
      blocks.forEach(b => {
        let cur = timeToMins(b.start);
        const end = timeToMins(b.end);
        while (cur + dur <= end) {
          const tStr = minsToTime(cur);
          if (!state.cal.bookedSlots.includes(`${iso}@${tStr}`) && !slots.includes(tStr)) {
            slots.push(tStr);
          }
          cur += step;
        }
      });
      return slots.sort();
    }

    function calChangeMonth(delta) {
      state.cal.month += delta;
      if (state.cal.month > 11) { state.cal.month = 0; state.cal.year += 1; }
      if (state.cal.month < 0) { state.cal.month = 11; state.cal.year -= 1; }
      render(false);
    }

    function calSelectEvent(id) {
      state.cal.eventTypeId = id;
      state.cal.step = 'calendar';
      state.cal.selectedTime = null;
      const evt = state.cal.eventTypes.find(e => e.id === id);
      const ath = state.athletes.find(a => a.id === state.activeSiblingId);
      state.cal.payMode = (evt?.allowCredit && ath?.credits > 0) ? 'credit' : 'card';
      if (id === 'evt-clinic') state.cal.selectedDate = '2026-11-28';
      render(false);
    }

    function calSelectDate(iso) {
      state.cal.selectedDate = iso;
      state.cal.selectedTime = null;
      render(false);
    }

    function getCashPrice(evt) {
      return Number(evt?.cashPrice ?? evt?.price ?? 0);
    }

    function getCardPrice(evt) {
      return Number(evt?.cardPrice ?? evt?.price ?? 0);
    }

    function formatDualPrice(evt) {
      const cash = getCashPrice(evt);
      const card = getCardPrice(evt);
      return cash === card ? `$${cash}` : `$${cash} Cash • $${card} Card`;
    }

    function calCartTotals() {
      const cashTotal = state.cal.cart.reduce((sum, item) => sum + getCashPrice(item.evt), 0);
      const cardTotal = state.cal.cart.reduce((sum, item) => sum + getCardPrice(item.evt), 0);
      const activeTotal = state.cal.checkoutMethod === 'cash' ? cashTotal : cardTotal;
      return { cashTotal, cardTotal, activeTotal };
    }

    function calAddToCart(time24, goToCheckout = false) {
      const evt = state.cal.eventTypes.find(x => x.id === state.cal.eventTypeId) || state.cal.eventTypes[0];
      const ath = getActiveAthlete();
      const iso = state.cal.selectedDate;
      const slotKey = `${iso}@${time24}`;
      if (state.cal.cart.some(i => i.slotKey === slotKey)) {
        if (goToCheckout) { state.cal.step = 'details'; render(); }
        else showToast('This time slot is already in your cart!');
        return;
      }

      state.cal.cart.push({
        id: 'ci-' + Date.now() + Math.random().toString(36).slice(2, 5),
        slotKey,
        iso,
        dayNice: calDateLabel(iso),
        time24,
        timeDisplay: calFormatTime(time24),
        evt: { ...evt },
        athleteId: ath.id,
        athleteName: ath.name,
        athleteAge: ath.ageGroup,
      });
      state.cal.selectedTime = null;
      if (goToCheckout) {
        state.cal.step = 'details';
      } else {
        showToast(`🛒 Added ${evt.title} (${calDateLabel(iso)} • ${calFormatTime(time24)}) to cart!`);
      }
      render();
    }

    function calRemoveFromCart(itemId) {
      state.cal.cart = state.cal.cart.filter(i => i.id !== itemId);
      if (state.cal.cart.length === 0 && state.cal.step === 'details') {
        state.cal.step = 'calendar';
      }
      render();
      showToast('Removed session from cart.');
    }

    function calToggleCartItemPay(itemId) {
      const item = state.cal.cart.find(i => i.id === itemId);
      if (!item || !item.evt.allowCredit) return;
      if (item.payMode === 'credit') {
        item.payMode = 'card';
      } else {
        const { creditsUsed, availCredits } = calCartTotals();
        if (creditsUsed >= availCredits) {
          showToast(`All ${availCredits} available credits are already applied in your cart.`);
          return;
        }
        item.payMode = 'credit';
      }
      render();
    }

    function calConfirmBooking(e) {
      e.preventDefault();
      if (!state.cal.cart.length) return;
      const focusNote = e.target.notes.value.trim();
      const parentName = e.target.parentName.value;
      const email = e.target.email.value;
      const phone = e.target.phone.value;
      const isCash = state.cal.checkoutMethod === 'cash';
      const { activeTotal } = calCartTotals();
      const confirmedItems = [];

      state.cal.cart.forEach(item => {
        const itemPrice = isCash ? getCashPrice(item.evt) : getCardPrice(item.evt);

        // Prevent double-booking
        state.cal.bookedSlots.push(item.slotKey);

        const dayParts = item.dayNice.split(', ');
        const shortDayKey = dayParts[0] + ' ' + item.iso.split('-')[2].replace(/^0/, '');
        state.sessions.unshift({

          durationMin: Number(item.evt.duration) || 45,

          type: item.evt.type,
          location: item.evt.location || '',
          focus: focusNote ? `${item.evt.title} — ${focusNote}` : item.evt.title,
          athletes: [item.athleteName],
          athleteId: item.athleteId,
          spotsMax: item.evt.type === '1-on-1 Private' ? 1 : 6,
          status: 'Confirmed',
          payment: isCash ? `Cash Due ($${itemPrice})` : `Clover Paid ($${itemPrice})`,
          price: itemPrice,
          img: item.evt.img,
          _modifiedAt: Date.now()
        });

        confirmedItems.push({
          ...item,
          payLabel: isCash ? `$${itemPrice} Cash Due` : `$${itemPrice} Clover`
        });
      });

      if (activeTotal > 0) {
        state.payments.unshift({
          id: 'pay-' + Date.now(),
          date: 'Today',
          family: parentName || 'Family',
          item: confirmedItems.length === 1 ? `${confirmedItems[0].evt.title} (${confirmedItems[0].dayNice})` : `Multi-Session Booking (${confirmedItems.length} sessions)`,
          amount: activeTotal,
          method: isCash ? 'Cash (Due at Lesson)' : 'Clover • Card / Apple Pay',
          status: isCash ? 'Pending Cash' : 'Paid'
        });
      }

      state.cal.lastBooking = {
        items: confirmedItems,
        cardTotal: activeTotal,
        checkoutMethod: state.cal.checkoutMethod,
        parentName,
        email,
        phone,
        notes: focusNote
      };
      state.cal.cart = [];
      state.cal.step = 'confirmed';
      render();
      showToast(`Confirmed ${confirmedItems.length} ${confirmedItems.length === 1 ? 'session' : 'sessions'}!`);
    }

    function downloadIcs() {
      const b = state.cal.lastBooking;
      if (!b || !b.items?.length) return;
      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Gina Fuchs Elite Fastpitch//Booking//EN'
      ];
      b.items.forEach(item => {
        const dtStart = item.iso.replace(/-/g, '') + 'T' + item.time24.replace(':', '') + '00';
        const [h, m] = item.time24.split(':').map(Number);
        const endMins = h * 60 + m + item.evt.duration;
        const eh = String(Math.floor(endMins / 60)).padStart(2, '0');
        const em = String(endMins % 60).padStart(2, '0');
        const dtEnd = item.iso.replace(/-/g, '') + 'T' + eh + em + '00';
        lines.push(
          'BEGIN:VEVENT',
          `DTSTART:${dtStart}`,
          `DTEND:${dtEnd}`,
          `SUMMARY:${item.evt.title} — ${item.athleteName} w/ Coach Gina`,
          `LOCATION:${item.evt.location}`,
          `DESCRIPTION:Athlete: ${item.athleteName}\\nNotes: ${b.notes || 'Fastpitch training session'}\\n24-hour cancellation policy applies.`,
          'END:VEVENT'
        );
      });
      lines.push('END:VCALENDAR');
      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gina-fuchs-sessions-${b.items.length}.ics`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`Calendar invite (.ics) for ${b.items.length} ${b.items.length === 1 ? 'session' : 'sessions'} downloaded!`);
    }

              <button type="submit" class="w-full py-3.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-sm font-extrabold cursor-pointer shadow-lg hover:brightness-95 transition">
                Confirm ${state.cal.cart.length} ${state.cal.cart.length === 1 ? 'Session' : 'Sessions'} • ${isCashSelected ? `$${cashTotal} Cash at Lesson` : `Pay $${cardTotal} w/ Clover`} →
              </button>
            </form>
          </div>
        `;
      }

      // STEP 1: CAL.COM 3-COLUMN SCHEDULER + LIVE SHOPPING CART BAR
      const eventStrip = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          ${state.cal.eventTypes.map(t => {
            const active = t.id === evt.id;
            return `
              <button onclick="calSelectEvent('${t.id}')" class="text-left rounded-[24px] overflow-hidden transition cursor-pointer group ${active ? 'bg-[#010101] text-white shadow-xl ring-2 ring-[#D5FF5F]' : 'card-white hover:-translate-y-0.5'}">
                <div class="relative h-24 w-full overflow-hidden">
                  <img src="${t.img || 'assets/images/fastpitch-hitter.jpg'}" alt="${t.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" decoding="async" />
                  <div class="absolute inset-0 bg-gradient-to-t from-[#010101]/70 via-[#010101]/15 to-transparent"></div>
                  <div class="absolute top-2.5 left-2.5 right-2.5 flex items-center justify-between gap-2">
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${active ? 'bg-[#D5FF5F] text-[#010101]' : 'bg-[#010101]/70 text-white backdrop-blur'}">${t.durationLabel}</span>
                    <span class="px-2.5 py-0.5 rounded-full bg-white/90 text-[#010101] text-[10px] font-extrabold tabular-nums">${formatDualPrice(t)}</span>
                  </div>
                </div>
                <div class="p-3.5">
                  <div class="font-extrabold text-sm leading-snug">${t.title}</div>
                  <div class="text-[11px] mt-0.5 ${active ? 'text-[#D6DFE2]' : 'text-[var(--text-muted)]'}">${t.type}</div>
                </div>
              </button>
            `;
          }).join('')}
        </div>
      `;

      const cartBanner = state.cal.cart.length > 0 ? `
        <div class="glass-dock rounded-[26px] p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-2 border-[#010101] dark:border-[#D5FF5F]">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold text-sm flex items-center justify-center shrink-0">🛒</div>
            <div class="min-w-0">
              <div class="font-extrabold text-sm">${state.cal.cart.length} ${state.cal.cart.length === 1 ? 'Session' : 'Sessions'} in Booking Cart</div>
              <div class="text-xs text-[var(--text-muted)] truncate">
                ${state.cal.cart.map(i => `${i.athleteName.split(' ')[0]}: ${i.dayNice} ${i.timeDisplay}`).join(' • ')}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="px-3 py-1.5 rounded-full surface-soft text-xs font-extrabold">$${cardTotal}</span>
            <button onclick="state.cal.step='details'; render();" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer shadow-md">Checkout (${state.cal.cart.length}) →</button>
          </div>
        </div>
      ` : '';

      const year = state.cal.year;
      const month = state.cal.month;
      const monthName = new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const availableSlots = calGetSlotsForDate(state.cal.selectedDate);

      let calendarCells = '';
      for (let i = 0; i < firstDow; i++) calendarCells += `<div></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isPast = (year === 2026 && month === 10 && day < 26);
        const slots = isPast ? [] : calGetSlotsForDate(iso);
        const hasSlots = slots.length > 0;
        const isSelected = iso === state.cal.selectedDate;
        const hasCartOnDay = state.cal.cart.some(i => i.iso === iso);
        calendarCells += `
          <button ${!hasSlots ? 'disabled' : `onclick="calSelectDate('${iso}')"`} class="aspect-square rounded-2xl flex flex-col items-center justify-center text-xs font-extrabold transition ${
            isSelected
              ? 'bg-[#010101] text-[#D5FF5F] shadow-md cursor-pointer'
              : hasSlots
                ? 'surface-soft hover:bg-[#D5FF5F] hover:text-[#010101] cursor-pointer'
                : 'opacity-30 cursor-not-allowed'
          }">
            <span>${day}</span>
            ${hasCartOnDay
              ? `<span class="w-1.5 h-1.5 rounded-full mt-0.5 bg-[#D5FF5F] ring-1 ring-[#010101]"></span>`
              : hasSlots ? `<span class="w-1 h-1 rounded-full mt-0.5 ${isSelected ? 'bg-[#D5FF5F]' : 'bg-[#4E6075] dark:bg-[#9AC0D6]'}"></span>` : ''}
          </button>
        `;
      }

      return `
        ${renderSiblingBar()}
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Book Sessions</h1>
            <p class="text-xs text-[var(--text-muted)]">Choose a lesson below, then pick your session dates &amp; times in one step</p>
          </div>
          ${state.cal.cart.length > 0 ? `<button onclick="state.cal.step='details'; render();" class="px-3.5 py-2 rounded-full bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">${uiIcon('cart')} Cart (${state.cal.cart.length})</button>` : ''}
        </div>

        ${cartBanner}
        ${eventStrip}

        <!-- Cal.com 3-Column Liquid Glass Booking Card -->
        <div class="card-white rounded-[32px] overflow-hidden grid grid-cols-1 lg:grid-cols-12">
          <!-- Col 1: Event Details & Timezone -->
          <div class="lg:col-span-4 card-mist p-5 sm:p-6 flex flex-col justify-between gap-5">
            <div class="space-y-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-[#010101] text-[#D5FF5F] font-extrabold text-xs flex items-center justify-center shrink-0">GF</div>
                <div>
                  <div class="text-xs text-[var(--text-muted)] font-bold">Booking for ${ath.name.split(' ')[0]} (${ath.ageGroup})</div>
                  <div class="font-extrabold text-base leading-tight">${evt.title}</div>
                </div>
              </div>
              <p class="text-xs text-[var(--text-muted)] leading-relaxed">${evt.desc}</p>
              <div class="space-y-2 text-xs font-semibold">
                <div class="flex items-center gap-2"><span>⏱️</span><span>${evt.durationLabel} (${evt.duration} min)</span></div>
                <div class="flex items-center gap-2"><span>📍</span><span>${evt.location}</span></div>
                <div class="flex items-center gap-2"><span>${uiIcon('card')}</span><span>${formatDualPrice(evt)}</span></div>
              </div>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-[var(--text-muted)] mb-1">Timezone</label>
              <select onchange="state.cal.timezone=this.value; render();" class="w-full px-3 py-2 rounded-xl surface-soft text-xs font-bold cursor-pointer">
                <option value="America/New_York" ${state.cal.timezone === 'America/New_York' ? 'selected' : ''}>🌎 Pittsburgh / Eastern (EST)</option>
                <option value="America/Chicago" ${state.cal.timezone === 'America/Chicago' ? 'selected' : ''}>🌎 Central Time (CST)</option>
                <option value="America/Denver" ${state.cal.timezone === 'America/Denver' ? 'selected' : ''}>🌎 Mountain Time (MST)</option>
                <option value="America/Los_Angeles" ${state.cal.timezone === 'America/Los_Angeles' ? 'selected' : ''}>🌎 Pacific Time (PST)</option>
              </select>
            </div>
          </div>

          <!-- Col 2: Interactive Month Calendar -->
          <div class="lg:col-span-5 p-5 sm:p-6 border-b lg:border-b-0 lg:border-r border-[var(--border-subtle)] space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="font-extrabold text-sm">${monthName}</h2>
              <div class="flex items-center gap-1.5">
                <button onclick="calChangeMonth(-1)" class="w-8 h-8 rounded-full surface-soft font-bold text-xs cursor-pointer">‹</button>
                <button onclick="calChangeMonth(1)" class="w-8 h-8 rounded-full surface-soft font-bold text-xs cursor-pointer">›</button>
              </div>
            </div>
            <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-extrabold text-[var(--text-muted)] uppercase">
              <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div class="grid grid-cols-7 gap-1.5">
              ${calendarCells}
            </div>
          </div>

          <!-- Col 3: Time Slots + Add to Cart / Book Now -->
          <div class="lg:col-span-3 p-5 sm:p-6 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div class="font-extrabold text-sm">${calDateLabel(state.cal.selectedDate)}</div>
              <div class="flex p-0.5 rounded-full surface-soft text-[10px] font-extrabold">
                <button onclick="state.cal.timeFormat='12h'; render();" class="px-2 py-0.5 rounded-full cursor-pointer ${state.cal.timeFormat === '12h' ? 'bg-[#010101] text-[#D5FF5F]' : 'text-[var(--text-muted)]'}">12h</button>
                <button onclick="state.cal.timeFormat='24h'; render();" class="px-2 py-0.5 rounded-full cursor-pointer ${state.cal.timeFormat === '24h' ? 'bg-[#010101] text-[#D5FF5F]' : 'text-[var(--text-muted)]'}">24h</button>
              </div>
            </div>
            <div class="space-y-2 max-h-72 overflow-y-auto no-scrollbar pr-0.5">
              ${availableSlots.length ? availableSlots.map(t => {
                const slotKey = `${state.cal.selectedDate}@${t}`;
                const inCartItem = state.cal.cart.find(i => i.slotKey === slotKey);
                if (inCartItem) {
                  return `
                    <div class="p-2.5 rounded-2xl bg-[#D5FF5F]/25 border border-[#010101]/20 flex items-center justify-between text-xs font-extrabold">
                      <span>✓ ${calFormatTime(t)}</span>
                      <button onclick="calRemoveFromCart('${inCartItem.id}')" class="text-[11px] underline cursor-pointer">Remove</button>
                    </div>
                  `;
                }
                const selected = state.cal.selectedTime === t;
                return selected ? `
                  <div class="space-y-1.5 p-2 rounded-2xl surface-soft">
                    <div class="text-center text-xs font-extrabold">${calFormatTime(t)}</div>
                    <div class="grid grid-cols-2 gap-1.5">
                      <button onclick="calAddToCart('${t}', false)" class="py-2 rounded-xl bg-[#010101] text-[#D5FF5F] text-[11px] font-extrabold cursor-pointer">+ Add Cart</button>
                      <button onclick="calAddToCart('${t}', true)" class="py-2 rounded-xl bg-[#D5FF5F] text-[#010101] text-[11px] font-extrabold cursor-pointer">Book Now →</button>
                    </div>
                  </div>
                ` : `
                  <button onclick="state.cal.selectedTime='${t}'; render();" class="w-full py-2.5 px-3 rounded-2xl surface-soft hover:border-[#010101] text-xs font-extrabold flex items-center justify-center gap-2 cursor-pointer transition">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#22c55e]"></span>
                    <span>${calFormatTime(t)}</span>
                  </button>
                `;
              }).join('') : `<div class="p-4 rounded-2xl surface-soft text-xs text-[var(--text-muted)] text-center">No open slots on this date. Pick another highlighted day!</div>`}
            </div>
          </div>
        </div>
      `;
    }

    function openAvailabilityModal() {
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      openModal(`
        <div class="flex items-center justify-between">
          <div>
            <h3 class="font-extrabold text-sm">Coach Gina’s Cal.com Availability</h3>
            <p class="text-[11px] text-[var(--text-muted)]">Changes update the Athlete Booking Calendar live</p>
          </div>
          <button onclick="closeModal()" class="text-xs font-bold cursor-pointer">✕</button>
        </div>
        <div class="space-y-4 text-xs">
          <div>
            <div class="font-bold text-[var(--text-muted)] mb-2">Open Coaching Days</div>
            <div class="grid grid-cols-7 gap-1">
              ${dayNames.map((name, idx) => {
                const on = state.cal.availability.days.includes(idx);
                return `<button type="button" onclick="toggleAvailDay(${idx})" class="py-2 rounded-xl font-extrabold cursor-pointer ${on ? 'bg-[#D5FF5F] text-[#010101]' : 'surface-soft text-[var(--text-muted)]'}">${name}</button>`;
              }).join('')}
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div class="surface-soft rounded-2xl p-3">
              <div class="text-[11px] text-[var(--text-muted)]">Buffer Between Sessions</div>
              <div class="font-extrabold text-sm mt-0.5">${state.cal.availability.bufferMin} min</div>
            </div>
            <div class="surface-soft rounded-2xl p-3">
              <div class="text-[11px] text-[var(--text-muted)]">Minimum Notice</div>
              <div class="font-extrabold text-sm mt-0.5">${state.cal.availability.minNoticeHours} ${state.cal.availability.minNoticeHours === 1 ? 'hour' : 'hours'}</div>
            </div>
          </div>
          <button onclick="copyCalLink('hitting-45')" class="w-full py-2.5 rounded-2xl bg-[#010101] text-[#D5FF5F] font-extrabold cursor-pointer">${uiIcon('link')} Copy Shareable Booking Link</button>
        </div>
      `);
    }

    function toggleAvailDay(idx) {
      const d = state.cal.availability.days;
      if (d.includes(idx)) state.cal.availability.days = d.filter(x => x !== idx);
      else state.cal.availability.days.push(idx);
      openAvailabilityModal();
      render();
      showToast('Availability updated on live booking calendar!');
    }

    function renderParentPackages() {
      const famPayments = state.payments.filter(p => p.family === 'Miller Family');
      const totalPaid = famPayments.filter(p => p.status !== 'Pending Cash').reduce((s, p) => s + p.amount, 0);
      const pendingCash = famPayments.filter(p => p.status === 'Pending Cash').reduce((s, p) => s + p.amount, 0);
      return `
        ${renderSiblingBar()}
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Billing &amp; Receipts</h1>
            <p class="text-xs text-[var(--text-muted)]">Pay per session online via 🍀 Clover (Card / Apple Pay) or 💵 Cash at the facility</p>
          </div>
          <button onclick="setTab('book')" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">+ Book Sessions</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="card-mist rounded-[28px] p-5 space-y-1">
            <div class="text-xs font-bold text-[var(--text-muted)]">Total Paid (Miller Family)</div>
            <div class="text-3xl font-extrabold tabular-nums">$${totalPaid.toLocaleString()}</div>
            <div class="text-xs font-semibold text-[#4E6075] dark:text-[#9AC0D6]">🍀 Clover &amp; Cash receipts saved automatically</div>
          </div>
          <div class="card-white rounded-[28px] p-5 space-y-1">
            <div class="text-xs font-bold text-[var(--text-muted)]">Cash Due at Upcoming Sessions</div>
            <div class="text-3xl font-extrabold tabular-nums">$${pendingCash.toLocaleString()}</div>
            <div class="text-xs font-semibold text-[var(--text-muted)]">${pendingCash > 0 ? 'Bring cash to Coach Gina at check-in' : 'All caught up — $0 due!'}</div>
          </div>
        </div>

        <div class="card-white rounded-[28px] p-5 space-y-3">
          <h2 class="text-sm font-extrabold">Payment History &amp; Receipts</h2>
          ${famPayments.map(p => `
            <div class="surface-soft rounded-2xl p-3.5 flex items-center justify-between gap-2 text-xs">
              <div class="min-w-0">
                <div class="font-extrabold">${p.item}</div>
                <div class="text-[var(--text-muted)]">${formatPaymentTimestamp(p)} • ${p.method}</div>
                ${p.externalNote ? `<div class="text-[11px] text-[#4E6075] dark:text-[#9AC0D6] font-semibold mt-1">${String(p.externalNote).replace(/</g, '&lt;')}</div>` : ''}
              </div>
              <div class="flex items-center gap-2 shrink-0">
                ${p.status === 'Pending Cash' ? `<span class="px-2.5 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">Cash Due</span>` : `<span class="px-2.5 py-0.5 rounded-full surface-soft text-[10px] font-bold">Paid ✓</span>`}
                <div class="font-extrabold tabular-nums">$${p.amount}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderParentVideo() {
      const ath = getActiveAthlete();
      const recaps = getSortedRecapsForAthlete(ath.id, false);
      return `
        ${renderSiblingBar()}
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Session Recaps &amp; Video</h1>
            <p class="text-xs text-[var(--text-muted)]">Every lesson note &amp; video clip from Coach Gina saved in one organized timeline</p>
          </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="card-mist rounded-[28px] p-5 space-y-3 h-fit">
            <h2 class="text-sm font-extrabold">Send Practice Clip to Gina</h2>
            <p class="text-xs text-[var(--text-muted)]">Upload a home swing or fielding clip for Coach Gina’s review.</p>
            <form onsubmit="uploadParentVideo(event,'${ath.id}')" class="space-y-2.5">
              <input name="title" class="w-full px-3.5 py-2.5 rounded-2xl card-white text-xs" placeholder="e.g., Front Toss Swing (Side View)" required />
              <button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">Upload to Coach Gina</button>
            </form>
          </div>
          <div class="lg:col-span-2 space-y-4">
            ${recaps.length ? recaps.map(r => `
              <div class="card-white rounded-[28px] overflow-hidden">
                <div onclick="openRecapViewerModal('${r.id}')" class="relative h-48 cursor-pointer group">
                  <img src="${r.videoImg}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" / alt="Fastpitch softball training" loading="lazy" decoding="async">
                  <div class="absolute inset-0 bg-[#010101]/45 flex items-center justify-center">
                    <div class="w-12 h-12 rounded-full bg-[#D5FF5F] text-[#010101] flex items-center justify-center shadow-lg text-base">▶</div>
                  </div>
                  <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-[#010101]/80 text-[#D5FF5F] text-[10px] font-extrabold">${r.date}</span>
                  <span class="absolute bottom-3 left-3 right-3 text-white text-xs font-extrabold truncate">${r.videoTitle}</span>
                </div>
                <div class="p-5 space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="font-extrabold text-sm">${r.sessionTitle}</div>
                    <div class="flex flex-wrap gap-1">
                      ${r.tags.map(t => `<span class="px-2.5 py-0.5 rounded-full surface-soft text-[10px] font-extrabold">${t}</span>`).join('')}
                    </div>
                  </div>
                  ${renderRecapTemplateBody(r)}
                </div>
              </div>
            `).join('') : `<div class="card-white rounded-[28px] p-6 text-xs text-[var(--text-muted)]">No session recaps yet.</div>`}

        </div>
      `;

    function ensureAthleteProfileExtras(ath) {
      if (!ath.team) ath.team = ath.id === 'ath-1' ? 'Pittsburgh Passion 14U Premier' : ath.id === 'ath-2' ? 'Pittsburgh Passion 12U Gold' : 'Elite Travel Fastpitch';
      if (!ath.height) ath.height = ath.id === 'ath-1' ? '5\'6"' : ath.id === 'ath-2' ? '5\'1"' : '5\'7"';
      if (!ath.measurables) {
        ath.measurables = false
          ? [
              { label: 'Fastball Velo', value: `${ath.primaryMetricValue} mph`, delta: '+3.5 mph' },
              { label: 'Changeup Velo', value: '43.0 mph', delta: '15.5 mph diff' },
              { label: 'Exit Velo (Tee)', value: '64.0 mph', delta: '+2.0 mph' },
              { label: 'Home to 1st', value: '3.08 sec', delta: '-0.06 sec' }
            ]
          : [
              { label: 'Exit Velo (Tee)', value: `${ath.primaryMetricValue} mph`, delta: '+3.0 mph' },
              { label: 'Overhand Velo', value: '57.0 mph', delta: '+2.5 mph' },
              { label: 'Home to 1st', value: '2.96 sec', delta: '-0.08 sec' },
              { label: 'Bat Speed', value: '62.5 mph', delta: '+1.8 mph' }
            ];
      }
      if (!ath.skills) {
        ath.skills = false
          ? [
              { name: 'Fastball Command', pct: 92 },
              { name: 'Flip Changeup', pct: 78 },
              { name: 'Drop Ball Spin', pct: 74 },
              { name: 'Curveball (New)', pct: 56 }
            ]
          : [
              { name: 'Inside-Out Bat Path', pct: 86 },
              { name: 'Opposite-Field Power', pct: 79 },
              { name: 'Bunt / Short Game', pct: 84 },
              { name: 'Glove-to-Hand Transfer', pct: 88 }
            ];
      }
      if (!ath.goals) {
        ath.goals = false
          ? [
              { id: 'g1', text: 'Hit 60 MPH Fastball before Spring showcase', done: false },
              { id: 'g2', text: 'Locate flip changeup on outside corner 7/10', done: true },
              { id: 'g3', text: 'Complete 100% of weekly arm-care band drills', done: false }
            ]
          : [
              { id: 'g4', text: 'Reach 62 MPH Exit Velo off the tee', done: false },
              { id: 'g5', text: 'Keep front shoulder closed on outside pitch', done: true }
            ];
      }
      return ath;
    }

    function toggleAthleteGoal(athId, goalId) {
      const ath = state.athletes.find(a => a.id === athId);
      const g = ath?.goals?.find(x => x.id === goalId);
      if (g) g.done = !g.done;
      render();
      showToast(g?.done ? 'Goal achieved! Keep pushing!' : 'Goal reopened.');
    }

    function addAthleteGoal(e, athId) {
      e.preventDefault();
      const ath = state.athletes.find(a => a.id === athId);
      const text = e.target.goal.value.trim();
      if (!text) return;
      ath.goals.unshift({ id: 'g-' + Date.now(), text, done: false });
      render();
      showToast('Added new season goal!');
    }

    // =========================================================================
    // COACH GINA SCHEDULING: DAILY BOOKINGS + ADJUSTABLE BLOCKS + CLASS TYPES

    function toggleCoachDay(dow) {
      const days = state.cal.availability.days;
      if (days.includes(dow)) {
        state.cal.availability.days = days.filter(d => d !== dow);
      } else {
        days.push(dow);
        if (!state.cal.availability.weeklyBlocks[dow]?.length) {
          state.cal.availability.weeklyBlocks[dow] = [{ id: 'b-' + Date.now(), start: '15:30', end: '19:00' }];
        }
      }
      render();
      showToast('Updated open coaching days — Athlete Booking Calendar synced!');
    }

    function updateCoachBlock(dow, blockId, field, value) {
      const blocks = state.cal.availability.weeklyBlocks[dow] || [];
      const b = blocks.find(x => x.id === blockId);
      if (!b) return;
      b[field] = value;
      render();
      showToast('Time block adjusted — live booking slots recalculated!');
    }

    function addCoachBlock(dow) {
      if (!state.cal.availability.days.includes(dow)) state.cal.availability.days.push(dow);
      if (!state.cal.availability.weeklyBlocks[dow]) state.cal.availability.weeklyBlocks[dow] = [];
      state.cal.availability.weeklyBlocks[dow].push({ id: 'b-' + Date.now(), start: '17:00', end: '20:00' });
      render();
      showToast('Added new time block!');
    }

    function removeCoachBlock(dow, blockId, confirmed = false) {
      if (!confirmed) {
        const block = (state.cal.availability.weeklyBlocks[dow] || []).find(b => b.id === blockId);
        const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        openDoubleConfirmModal({
          tag: 'Delete Availability Block',
          title: `Remove ${dayNames[dow] || 'Day'} time block?`,
          detail: block ? `This removes ${fmt24To12Short(block.start)}–${fmt24To12Short(block.end)} EST from your weekly availability.` : 'This removes the selected time block.',
          step1Label: 'Continue to Delete',
          step2Title: 'Final Confirmation — Delete Block',
          step2Detail: 'Confirm again to remove this open coaching window from your weekly schedule.',
          step2Label: 'Yes, Delete Block',
          onConfirm: () => removeCoachBlock(dow, blockId, true)
        });
        return;
      }
      state.cal.availability.weeklyBlocks[dow] = (state.cal.availability.weeklyBlocks[dow] || []).filter(b => b.id !== blockId);
      if (!state.cal.availability.weeklyBlocks[dow].length) {
        state.cal.availability.days = state.cal.availability.days.filter(d => d !== dow);
      }
      render();
      showToast('Removed time block.');
    }

    function saveClassType(e, editId) {
      e.preventDefault();
      const f = e.target;
      const dur = Number(f.duration.value);
      const durationLabel = dur >= 60 && dur % 60 === 0 ? `${dur / 60}h` : `${dur}m`;
      const availabilityMode = f.availabilityMode?.value === 'custom' ? 'custom' : 'coach';
      const checkedDays = Array.from(f.querySelectorAll('input[name="availDay"]:checked')).map(el => Number(el.value));
      const cashPrice = Number(f.cashPrice.value);
      const cardPrice = Number(f.cardPrice.value);
      const payload = {
        title: f.title.value.trim(),
        type: f.type.value,
        duration: dur,
        durationLabel,
        price: cashPrice,
        cashPrice,
        cardPrice,
        location: f.location.value.trim(),
        desc: f.desc.value.trim() || 'Fastpitch training lesson with Coach Gina.',
        allowCredit: false,
        availabilityMode,
        availableDays: availabilityMode === 'custom' ? checkedDays : [1, 2, 3, 4, 5, 6],
        availableStart: availabilityMode === 'custom' ? (f.availableStart?.value || '') : '',
        availableEnd: availabilityMode === 'custom' ? (f.availableEnd?.value || '') : '',
        img: (() => {
          const t = (f.title.value + ' ' + f.type.value).toLowerCase();
          if (t.includes('small group')) return 'assets/images/fastpitch-group.jpg';
          if (t.includes('catch')) return 'assets/images/fastpitch-catcher.jpg';
          if (t.includes('slap') || t.includes('clinic') || t.includes('camp')) return 'assets/images/fastpitch-slapper.jpg';
          if (t.includes('field') || t.includes('defen') || t.includes('infield')) return 'assets/images/fastpitch-fielding.jpg';
          return 'assets/images/fastpitch-hitter.jpg';
        })()
      };
      if (editId) {
        const idx = state.cal.eventTypes.findIndex(x => x.id === editId);
        if (idx >= 0) state.cal.eventTypes[idx] = { ...state.cal.eventTypes[idx], ...payload, _modifiedAt: Date.now() };
      } else {
        const slug = payload.title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        state.cal.eventTypes.push({ id: 'evt-' + Date.now(), slug, ...payload, _modifiedAt: Date.now() });
      }
      closeModal();
      render();
      showToast(editId ? `Updated lesson "${payload.title}" (${durationLabel}) — synced!` : `Added lesson "${payload.title}" (${durationLabel})!`);
    }

    function deleteClassType(id, confirmed = false) {
      if (state.cal.eventTypes.length <= 1) {
        showToast('Keep at least one lesson active.');
        return;
      }
      const lesson = state.cal.eventTypes.find(x => x.id === id);
      if (!confirmed) {
        openDoubleConfirmModal({
          tag: 'Delete Lesson',
          title: `Delete "${lesson?.title || 'this lesson'}"?`,
          detail: 'This removes the lesson from your Lessons catalog and booking options across all devices.',
          step1Label: 'Continue to Delete',
          step2Title: 'Final Confirmation — Delete Lesson',
          step2Detail: `Confirm one more time to permanently remove "${lesson?.title || 'this lesson'}".`,
          step2Label: 'Yes, Delete Lesson',
          onConfirm: () => deleteClassType(id, true)
        });
        return;
      }
      recordDeletedId('eventTypes', id);
      state.cal.eventTypes = state.cal.eventTypes.filter(x => x.id !== id);
      if (state.cal.eventTypeId === id) state.cal.eventTypeId = state.cal.eventTypes[0].id;
      render();
      showToast('Lesson removed.');
    }

    function formatSessionAvailabilitySummary(t) {
      if (t.availabilityMode !== 'custom') return 'Matches Coach Gina’s Schedule';
      const dowNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const days = (Array.isArray(t.availableDays) ? t.availableDays : []).map(i => dowNames[i]).filter(Boolean);
      const dayText = days.length ? days.join(', ') : 'No days selected';
      const timeText = t.availableStart && t.availableEnd
        ? ` • ${fmt24To12Short(t.availableStart)}–${fmt24To12Short(t.availableEnd)} EST`
        : '';
      return `${dayText}${timeText}`;
    }

    function getSessionsForLesson(lesson) {
      if (!lesson) return [];
      const titleLow = (lesson.title || '').toLowerCase();
      return (state.sessions || [])
        .filter(s => {
          if (s.status === 'Canceled') return false;
          if (s.lessonId && s.lessonId === lesson.id) return true;
          if (s.lessonTitle && s.lessonTitle.toLowerCase() === titleLow) return true;
          if (!s.lessonId && titleLow && (s.focus || '').toLowerCase().startsWith(titleLow)) return true;
          return false;
        })
        .sort((a, b) => String(a.dateIso || '').localeCompare(String(b.dateIso || '')) || String(a.time || '').localeCompare(String(b.time || '')));
    }

    function getTodayIsoEst() {
      try {
        const parts = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'America/New_York',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).formatToParts(new Date());
        const y = parts.find(p => p.type === 'year')?.value;
        const m = parts.find(p => p.type === 'month')?.value;
        const d = parts.find(p => p.type === 'day')?.value;
        if (y && m && d) return `${y}-${m}-${d}`;
      } catch (_) {}
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function getRolling7Days() {
      const todayIso = getTodayIsoEst();
      const base = new Date(todayIso + 'T12:00:00');
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(base.getTime() + i * 86400000);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const dow = d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
        const num = String(d.getDate());
        const shortLabel = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        const dayKey = d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' }).replace(',', '');
        days.push({ iso, dow, num, shortLabel, dayKey, isToday: i === 0 });
      }
      return days;
    }

    function sessionMatchesDay(s, d) {
      if (!s || !d) return false;
      if (s.dateIso) return s.dateIso === d.iso;
      return s.dayKey === d.dayKey || s.day === d.shortLabel;
    }

    function parseTime12To24(tStr) {
      const t = String(tStr || '4:00 PM').trim();
      const m24 = t.match(/^(\d{1,2}):(\d{2})$/);
      if (m24) return `${String(Number(m24[1])).padStart(2, '0')}:${m24[2]}`;
      const m12 = t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
      if (m12) {
        let hh = Number(m12[1]) % 12;
        if (m12[3].toUpperCase() === 'PM') hh += 12;
        return `${String(hh).padStart(2, '0')}:${m12[2]}`;
      }
      return '16:00';
    }

    // =========================================================================
    // COACH GINA PERFORMANCE & CLIENT MANAGEMENT HELPERS (v3.3.0)
    // =========================================================================
    function parseFlexibleDateToIso(str) {
      if (!str) return null;
      const s = String(str).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      if (/^today$/i.test(s)) return getTodayIsoEst();
      const slash = s.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/);
      if (slash) {
        const m = Number(slash[1]);
        const d = Number(slash[2]);
        let y = slash[3] ? Number(slash[3]) : new Date().getFullYear();
        if (y < 100) y += 2000;
        if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
          return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        }
      }
      const parsed = Date.parse(s.includes(',') || /\d{4}/.test(s) ? s : `${s}, ${new Date().getFullYear()}`);
      if (!isNaN(parsed)) {
        const dt = new Date(parsed);
        return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      }
      return null;
    }

    function getAthleteLastSeenInfo(athId) {
      const ath = state.athletes.find(a => a.id === athId);
      if (!ath) return { daysAgo: null, label: 'New', isAtRisk: false, lastFocus: '', lastHomework: '', hasUpcoming: false };
      const todayIso = getTodayIsoEst();
      const todayMs = new Date(todayIso + 'T12:00:00').getTime();

      const recaps = getSortedRecapsForAthlete(ath.id, false);
      const latestRecap = recaps[0] || null;
      let latestMs = null;

      recaps.forEach(r => {
        const iso = parseFlexibleDateToIso(r.date);
        const ms = iso ? new Date(iso + 'T12:00:00').getTime() : (r.createdAt || null);
        if (ms && ms <= todayMs + 86400000 && (!latestMs || ms > latestMs)) latestMs = ms;
      });

      let hasUpcoming = false;
      state.sessions.forEach(s => {
        const matchesAth = s.athleteId === ath.id
          || (Array.isArray(s.athleteIds) && s.athleteIds.includes(ath.id))
          || (Array.isArray(s.athletes) && s.athletes.includes(ath.name));
        if (!matchesAth || s.status === 'Canceled' || s.status === 'No-Show' || s.status === 'Late Cancel') return;
        const iso = s.dateIso || parseFlexibleDateToIso(s.day);
        if (!iso) return;
        const ms = new Date(iso + 'T12:00:00').getTime();
        if (ms > todayMs) {
          hasUpcoming = true;
        } else if (!latestMs || ms > latestMs) {
          latestMs = ms;
        }
      });

      const daysAgo = latestMs !== null ? Math.max(0, Math.round((todayMs - latestMs) / 86400000)) : null;
      const label = daysAgo === null ? 'No sessions'
        : daysAgo === 0 ? 'Today'
        : daysAgo === 1 ? 'Yesterday'
        : daysAgo < 14 ? `${daysAgo}d ago`
        : daysAgo < 60 ? `${Math.floor(daysAgo / 7)}w ago`
        : `${Math.floor(daysAgo / 30)}mo ago`;

      const isAtRisk = !ath.archived && !hasUpcoming && daysAgo !== null && daysAgo >= 21;
      const lastFocus = (latestRecap?.focus || latestRecap?.note || '').split('\n').map(l => l.trim()).find(Boolean) || '';
      const lastHomework = (latestRecap?.homework || '').split('\n').map(l => l.trim()).find(Boolean) || '';
      return { daysAgo, label, isAtRisk, lastFocus, lastHomework, hasUpcoming };
    }

    function getAthleteUnpaidInfo(athId) {
      const ath = state.athletes.find(a => a.id === athId);
      if (!ath) return { count: 0, total: 0 };
      const first = (ath.name || '').split(/\s+/)[0]?.toLowerCase() || '';
      const last = (ath.parentName || ath.name || '').split(/\s+/).slice(-1)[0]?.toLowerCase() || '';
      let count = 0;
      let total = 0;
      state.payments.forEach(p => {
        const unpaid = p.status === 'Pending Cash' || p.status === 'Unpaid';
        if (!unpaid) return;
        const matchById = p.athleteId && p.athleteId === ath.id;
        const itemL = (p.item || '').toLowerCase();
        const famL = (p.family || '').toLowerCase();
        const matchByName = (first && itemL.includes(`(${first})`)) || (last && last.length > 2 && famL.includes(last) && (!first || itemL.includes(first)));
        if (matchById || matchByName) {
          count++;
          total += Number(p.amount) || 0;
        }
      });
      return { count, total };
    }

    function addDaysToIso(iso, days) {

    function rebookSessionNextWeek(sessionId, silent = false) {
      const s = state.sessions.find(x => x.id === sessionId);
      if (!s) return null;
      const baseIso = s.dateIso || getTodayIsoEst();
      const nextIso = addDaysToIso(baseIso, 7);
      const hm = parseTime12To24(s.time);
      const slotKey = `${nextIso}@${hm}`;
      const conflict = state.sessions.find(x => x.status !== 'Canceled' && x.dateIso === nextIso && parseTime12To24(x.time) === hm);
      if (conflict) {
        if (!silent) showToast(`Conflict: ${conflict.athletes?.join(', ') || conflict.lessonTitle} is already booked on ${nextIso} at ${s.time}.`);
        return null;
      }
      const dObj = new Date(nextIso + 'T12:00:00');
      const dayNice = dObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const dayKey = dObj.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' }).replace(',', '');
      const cloned = {
        ...s,
        id: 'ses-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        dateIso: nextIso,
        day: dayNice,
        dayKey,
        status: 'Confirmed',
        payment: s.price ? `Cash at Session ($${s.price})` : (s.payment || 'Scheduled'),
        _modifiedAt: Date.now()
      };
      state.sessions.unshift(cloned);
      if (!state.cal.bookedSlots.includes(slotKey)) state.cal.bookedSlots.push(slotKey);
      if (!silent) {
        closeModal();
        render();
        showToast(`Rebooked for ${dayNice} at ${s.time}!`);
      }
      return cloned;
    }

    function formatPaymentTimestamp(p) {
      if (!p) return '';
      const isPaid = p.status !== 'Pending Cash' && p.status !== 'Unpaid';
      const ts = (isPaid ? p.paidAt : null) || p.createdAt || p._modifiedAt || null;
      if (ts && Number(ts) > 1000000000000) {
        const dt = new Date(Number(ts));
        if (!isNaN(dt.getTime())) {
          const datePart = dt.toLocaleDateString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', year: 'numeric' });
          const timePart = dt.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });
          return `${isPaid && p.paidAt ? 'Paid ' : ''}${datePart} at ${timePart}`;
        }
      }
      return p.date || '';
    }

    function exportPaymentsCsv() {
      const rows = [['Date', 'Timestamp', 'Family', 'Item', 'Method', 'Status', 'Amount', 'External Note', 'Internal Note']];

      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      try {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `gfuchs-payments-${getTodayIsoEst()}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Payments CSV downloaded!');

        showToast('Unable to export CSV on this browser.');
      }
    }

    function submitRescheduleSession(e, sessionId) {
      e.preventDefault();
      const s = state.sessions.find(x => x.id === sessionId);
      if (!s) return;
      const f = e.target;
      const oldSlotKey = s.dateIso ? `${s.dateIso}@${parseTime12To24(s.time)}` : null;

      const iso = f.date.value;
      const hm = f.time.value;
      const [hh, mm] = hm.split(':').map(Number);
      const ampm = hh >= 12 ? 'PM' : 'AM';
      const h12 = hh % 12 || 12;
      const timeNice = `${h12}:${String(mm).padStart(2, '0')} ${ampm}`;
      const dObj = new Date(iso + 'T12:00:00');
      const dayNice = dObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const dayKey = dObj.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' }).replace(',', '');
      const durMin = Number(f.durationMin?.value) || Number(s.durationMin) || 45;
      const durLabel = durMin >= 60 && durMin % 60 === 0 ? `${durMin / 60}H` : `${durMin}M`;
      const newFocus = f.focus.value.trim() || s.lessonTitle || s.focus;

      if (oldSlotKey) {
        state.cal.bookedSlots = (state.cal.bookedSlots || []).filter(k => k !== oldSlotKey);
      }
      const newSlotKey = `${iso}@${hm}`;
      if (!state.cal.bookedSlots.includes(newSlotKey)) state.cal.bookedSlots.push(newSlotKey);

      s.dateIso = iso;
      s.day = dayNice;
      s.dayKey = dayKey;
      s.time = timeNice;
      s.durationMin = durMin;
      s.duration = durLabel;
      s.focus = newFocus;
      s.status = 'Confirmed';
      s._modifiedAt = Date.now();

      if (s.athleteId && f.notify?.checked) {
        const ath = state.athletes.find(a => a.id === s.athleteId);
        const parentKey = ath?.parentName || ath?.name || (s.athletes?.[0] || 'Family');
        let thread = state.threads.find(t => t.parent === parentKey);
        if (!thread) {
          thread = { id: 'msg-' + Date.now(), parent: parentKey, athletes: ath?.name || (s.athletes?.[0] || ''), unread: 0, messages: [] };
          state.threads.unshift(thread);
        }
        thread.messages.push({
          from: 'coach',
          time: 'Just now',
          text: `Rescheduled ${s.lessonTitle || s.focus} session to ${dayNice} at ${timeNice} EST (${durLabel.toLowerCase()}). See you then!`
        });
      }

      closeModal();
      render();
      showToast(`Rescheduled to ${dayNice} at ${timeNice} — calendar synced!`);
    }

    function cancelSessionCoach(sessionId, confirmed = false) {
      const s = state.sessions.find(x => x.id === sessionId);
      if (!s) return;
      if (!confirmed) {
        const label = s.lessonTitle || s.focus || 'this session';
        const players = (s.athletes && s.athletes.length) ? ` with ${s.athletes.join(', ')}` : '';
        openDoubleConfirmModal({
          tag: 'Cancel Session',
          title: `Cancel ${label}${players}?`,
          detail: `Scheduled for ${s.day || s.dateIso} at ${s.time} (${s.duration}). Canceling will reopen this time slot on your booking calendar and remove it from your synced calendar feed.`,
          step1Label: 'Continue to Cancel',
          step2Title: 'Final Confirmation — Cancel Session',
          step2Detail: `Tap below to confirm canceling ${label}${players} on ${s.day || s.dateIso} at ${s.time}.`,
          step2Label: 'Yes, Cancel Session',
          onConfirm: () => cancelSessionCoach(sessionId, true)
        });
        return;
      }
      const oldSlotKey = s.dateIso ? `${s.dateIso}@${parseTime12To24(s.time)}` : null;
      if (oldSlotKey) {
        state.cal.bookedSlots = (state.cal.bookedSlots || []).filter(k => k !== oldSlotKey);
      }
      s.status = 'Canceled';
      s._modifiedAt = Date.now();

      if (s.athleteId) {
        const ath = state.athletes.find(a => a.id === s.athleteId);
        const parentKey = ath?.parentName || ath?.name || (s.athletes?.[0] || 'Family');
        let thread = state.threads.find(t => t.parent === parentKey);
        if (!thread) {
          thread = { id: 'msg-' + Date.now(), parent: parentKey, athletes: ath?.name || (s.athletes?.[0] || ''), unread: 0, messages: [] };
          state.threads.unshift(thread);
        }
        thread.messages.push({
          from: 'coach',
          time: 'Just now',
          text: `Canceled ${s.lessonTitle || s.focus} session originally scheduled for ${s.day || s.dateIso} at ${s.time} EST.`
        });
      }

      closeModal();
      render();
      showToast('Session canceled & time slot reopened!');
    }

    function restoreSessionCoach(sessionId) {
      const s = state.sessions.find(x => x.id === sessionId);
      if (!s) return;
      s.status = 'Confirmed';
      s._modifiedAt = Date.now();
      if (s.dateIso) {
        const slotKey = `${s.dateIso}@${parseTime12To24(s.time)}`;
        if (!state.cal.bookedSlots.includes(slotKey)) state.cal.bookedSlots.push(slotKey);
      }
      closeModal();
      render();
      showToast('Session restored to schedule!');
    }

    function deleteSessionCoach(sessionId, confirmed = false) {
      const s = state.sessions.find(x => x.id === sessionId);
      if (!s) return;
      if (!confirmed) {
        const label = s.lessonTitle || s.focus || 'this session';
        openDoubleConfirmModal({
          tag: 'Delete Session',
          title: `Permanently delete ${label}?`,
          detail: `This will completely erase the session on ${s.day || s.dateIso} at ${s.time} from all synced devices.`,
          step1Label: 'Continue to Delete',
          step2Title: 'Final Confirmation — Permanent Delete',
          step2Detail: 'This cannot be undone. Confirm one more time to permanently delete this session.',
          step2Label: 'Yes, Delete Permanently',
          onConfirm: () => deleteSessionCoach(sessionId, true)
        });
        return;
      }
      const oldSlotKey = s.dateIso ? `${s.dateIso}@${parseTime12To24(s.time)}` : null;
      if (oldSlotKey) {
        state.cal.bookedSlots = (state.cal.bookedSlots || []).filter(k => k !== oldSlotKey);
      }
      recordDeletedId('sessions', sessionId);
      state.sessions = state.sessions.filter(x => x.id !== sessionId);
      closeModal();
      render();
      showToast('Session permanently deleted.');
    }
