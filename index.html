    function progressRing(pct, size = 64, label = '') {
      const r = (size - 10) / 2;
      const c = 2 * Math.PI * r;
      const offset = c - (pct / 100) * c;
      return `
        <div class="relative inline-flex items-center justify-center shrink-0" style="width:${size}px;height:${size}px">
          <svg width="${size}" height="${size}" class="-rotate-90">
            <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--border-subtle)" stroke-width="6" fill="none"/>
            <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#D5FF5F" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 0.4s ease"/>
          </svg>
          <span class="absolute text-xs font-extrabold tabular-nums">${label || pct + '%'}</span>
        </div>
      `;
    }

      render();
      showToast(`Checked in ${s.athletes[0]}!`);

    function cancelSessionCoach(id) {

      if (!s) return;
      s.status = 'Canceled';
      if (s.payment.includes('Credit')) state.athletes.filter(a => a.familyId === 'fam-1').forEach(a => a.credits += 1);
      render();
      showToast('Canceled (>24h notice). 1 credit returned!');
    }
    function notifyWaitlist(id) {
      const w = state.waitlist.find(x => x.id === id);
      if (w) w.status = 'Notified';
      render();
      showToast(`SMS offer sent to ${w.parent}!`);
    }
    function jumpToAthlete(id) { state.selectedAthleteId = id; state.coachTab = 'athletes'; render(); }
    function toggleDrill(athId, drillId) {
      const a = state.athletes.find(x => x.id === athId);
      const d = a?.drills.find(x => x.id === drillId);
      if (d) d.done = !d.done;
      render();
      showToast(d?.done ? 'Drill completed! Nice work!' : 'Drill unchecked.');
    }
    function markVideoReviewed(id) {
      const v = state.videos.find(x => x.id === id);
      if (v) v.status = 'Reviewed';
      render();
      showToast(`Reviewed & notified ${v.athleteName}’s parent!`);
    }
    function addVideoCue(e, id) {
      e.preventDefault();
      const v = state.videos.find(x => x.id === id);
      v.cues.push({ time: e.target.time.value, pct: 60, note: e.target.note.value });
      v.status = 'Reviewed';
      render();
      showToast('Mechanics cue added!');
    }
    function openThread(id) {
      state.activeThreadId = id;
      const t = state.threads.find(x => x.id === id);
      if (t) t.unread = 0;
      render();
    }
    function sendCoachReply(e, id) {
      e.preventDefault();
      const t = state.threads.find(x => x.id === id);
      t.messages.push({ from: 'coach', time: 'Just now', text: e.target.text.value });
      render();
      showToast(`Sent to ${t.parent}`);
    }
    function bookSlot(slotId, payMode) {
      const slot = state.openSlots.find(s => s.id === slotId);
      const ath = state.athletes.find(a => a.id === state.activeSiblingId);
      if (!slot || !ath) return;
      if (payMode === 'credit') {
        state.athletes.filter(a => a.familyId === 'fam-1').forEach(a => a.credits = Math.max(0, a.credits - 1));
      } else {
        state.payments.unshift({ id: 'pay-' + Date.now(), date: 'Today', family: 'Miller Family', item: `${slot.type}: ${slot.focus}`, amount: slot.price, method: 'Stripe • Apple Pay' });
      }
      state.sessions.unshift({
        id: 'ses-' + Date.now(), dayKey: slot.dayKey, day: slot.day, time: slot.time, duration: slot.duration,
        type: slot.type, focus: slot.focus, athletes: [ath.name], athleteId: ath.id, spotsMax: slot.spotsMax,
        status: 'Confirmed', payment: payMode === 'credit' ? '1 Credit' : `Paid ($${slot.price})`, price: slot.price
      });
      slot.spotsLeft -= 1;
      if (slot.spotsLeft <= 0) state.openSlots = state.openSlots.filter(s => s.id !== slotId);
      state.parentTab = 'home';
      render();
      showToast(`Booked ${slot.focus} for ${ath.name.split(' ')[0]}!`);
    }
    function buyPackage(credits, price) {
      state.athletes.filter(a => a.familyId === 'fam-1').forEach(a => { a.credits += credits; a.packTotal = Math.max(a.packTotal, a.credits); });
      state.payments.unshift({ id: 'pay-' + Date.now(), date: 'Today', family: 'Miller Family', item: `${credits}-Lesson Pack`, amount: price, method: 'Stripe • Apple Pay' });
      render();
      showToast(`Added ${credits} credits ($${price})!`);
    }
    function uploadParentVideo(e, athId) {
      e.preventDefault();
      const ath = state.athletes.find(a => a.id === athId);
      state.videos.unshift({ id: 'vid-' + Date.now(), athleteId: ath.id, athleteName: ath.name, title: e.target.title.value, uploadedAt: 'Just now • 0:12', status: 'Needs Review', cues: [] });
      render();
      showToast('Clip uploaded to Coach Gina’s Video Lab!');
    }
    function saveParentProfile(e, athId) {
      e.preventDefault();
      const ath = state.athletes.find(a => a.id === athId);
      ath.emergencyContact = e.target.emergency.value;
      ath.medicalNotes = e.target.medical.value;
      ath.waiverSigned = true; ath.waiverDate = 'Today';
      render();
      showToast('Profile & waiver saved!');
    }

    function openAddSessionModal() {
      openModal(`
        <div class="flex items-center justify-between"><h3 class="font-extrabold text-sm">New Session / Clinic</h3><button onclick="closeModal()" class="text-xs text-[var(--text-muted)] cursor-pointer">Close</button></div>
        <form onsubmit="submitAddSession(event)" class="space-y-3 text-xs">
          <select name="type" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface"><option>1-on-1 Private</option><option>Small Group</option><option>Camp / Clinic</option></select>
          <input name="focus" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" placeholder="e.g., Rise Ball & Spin Mechanics" required />
          <div class="grid grid-cols-2 gap-2">
            <input name="day" value="Today (Thu 26)" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" required />
            <input name="time" value="6:15 PM" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" required />
          </div>
          <input name="athlete" value="Chloe Miller" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" required />
          <button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold cursor-pointer">Add to Schedule</button>
        </form>
      `);
    }
    function submitAddSession(e) {
      e.preventDefault();
      state.sessions.unshift({ id: 'ses-' + Date.now(), dayKey: state.selectedDay, day: e.target.day.value, time: e.target.time.value, duration: '45 min', type: e.target.type.value, focus: e.target.focus.value, athletes: [e.target.athlete.value], athleteId: null, spotsMax: 1, status: 'Confirmed', payment: '1 Credit', price: 75 });
      closeModal(); render(); showToast('Session added!');
    }
    function openWeatherModal() {
      openModal(`
        <div class="flex items-center justify-between"><h3 class="font-extrabold text-sm">Facility / Weather Broadcast</h3><button onclick="closeModal()" class="text-xs text-[var(--text-muted)] cursor-pointer">Close</button></div>
        <form onsubmit="submitBroadcast(event)" class="space-y-3 text-xs">
          <select name="audience" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface"><option>Today’s Booked Families (5)</option><option>Winter Clinic Roster (14)</option><option>All Active Families (28)</option></select>
          <textarea name="text" rows="3" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" placeholder="e.g., Indoor cages are warm & ready for tonight’s lessons!" required></textarea>
          <button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold cursor-pointer">Send SMS + Email Blast</button>
        </form>
      `);
    }
    function submitBroadcast(e) {
      e.preventDefault();
      state.broadcasts.unshift({ date: 'Just now', audience: e.target.audience.value, channel: 'SMS + Email', text: e.target.text.value });
      closeModal(); render(); showToast('Broadcast sent!');
    }
    function openAddMetricModal(athId) {
      openModal(`
        <div class="flex items-center justify-between"><h3 class="font-extrabold text-sm">Log Performance Metric</h3><button onclick="closeModal()" class="text-xs text-[var(--text-muted)] cursor-pointer">Close</button></div>
        <form onsubmit="submitMetric(event, '${athId}')" class="space-y-3 text-xs">
          <input name="value" placeholder="e.g., 59.5" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" required />
          <button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold cursor-pointer">Save PR</button>
        </form>
      `);
    }
    function submitMetric(e, athId) {
      e.preventDefault();
      const a = state.athletes.find(x => x.id === athId);
      a.primaryMetricValue = e.target.value.value;
      a.veloHistory.push({ label: 'Now', val: parseFloat(e.target.value.value) || 60 });
      closeModal(); render(); showToast('New PR logged!');
    }
    function openAddNoteModal(athId) {
      openModal(`
        <div class="flex items-center justify-between"><h3 class="font-extrabold text-sm">Add Coach Note</h3><button onclick="closeModal()" class="text-xs text-[var(--text-muted)] cursor-pointer">Close</button></div>
        <form onsubmit="submitNote(event, '${athId}')" class="space-y-3 text-xs">
          <textarea name="text" rows="3" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" placeholder="Key mechanics takeaway..." required></textarea>
          <button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold cursor-pointer">Save Note</button>
        </form>
      `);
    }
    function submitNote(e, athId) {
      e.preventDefault();
      state.athletes.find(x => x.id === athId).notes.unshift({ date: 'Today', text: e.target.text.value });
      closeModal(); render(); showToast('Note saved & synced!');
    }
    function openAddDrillModal(athId) {
      openModal(`
        <div class="flex items-center justify-between"><h3 class="font-extrabold text-sm">Assign Homework Drill</h3><button onclick="closeModal()" class="text-xs text-[var(--text-muted)] cursor-pointer">Close</button></div>
        <form onsubmit="submitDrill(event, '${athId}')" class="space-y-3 text-xs">
          <input name="title" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" placeholder="e.g., K-Drill Wrist Snaps" required />
          <input name="reps" value="3 × 15 reps" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" required />
          <input name="focus" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" placeholder="Focus cue..." required />
          <button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold cursor-pointer">Assign Drill</button>
        </form>
      `);
    }
    function submitDrill(e, athId) {
      e.preventDefault();
      state.athletes.find(x => x.id === athId).drills.unshift({ id: 'd-' + Date.now(), title: e.target.title.value, reps: e.target.reps.value, focus: e.target.focus.value, done: false });
      closeModal(); render(); showToast('Drill assigned!');
    }
    function openLogPaymentModal() {
      openModal(`
        <div class="flex items-center justify-between"><h3 class="font-extrabold text-sm">Log Manual Payment</h3><button onclick="closeModal()" class="text-xs text-[var(--text-muted)] cursor-pointer">Close</button></div>
        <form onsubmit="submitManualPayment(event)" class="space-y-3 text-xs">
          <input name="family" value="Vance Family" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" required />
          <input name="item" value="10-Lesson Elite Pack" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" required />
          <div class="grid grid-cols-2 gap-2">
            <input name="amount" type="number" value="650" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface" required />
            <select name="method" class="w-full px-3.5 py-2.5 rounded-2xl elevated-surface"><option>Venmo (Logged)</option><option>Zelle (Logged)</option><option>Cash (Logged)</option></select>
          </div>
          <button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold cursor-pointer">Record Payment</button>
        </form>
      `);
    }
    function submitManualPayment(e) {
      e.preventDefault();
      state.payments.unshift({ id: 'pay-' + Date.now(), date: 'Today', family: e.target.family.value, item: e.target.item.value, amount: Number(e.target.amount.value), method: e.target.method.value });
      closeModal(); render(); showToast('Payment recorded!');
    }

    function render() {
      renderChrome();
      const root = document.getElementById('app-root');
      if (state.role === 'coach') {
        if (state.coachTab === 'today') root.innerHTML = renderCoachToday();
        else if (state.coachTab === 'athletes') root.innerHTML = renderCoachAthletes();
        else if (state.coachTab === 'video') root.innerHTML = renderCoachVideo();
        else if (state.coachTab === 'payments') root.innerHTML = renderCoachPayments();
        else if (state.coachTab === 'messaging') root.innerHTML = renderCoachMessaging();
      } else {
        if (state.parentTab === 'home') root.innerHTML = renderParentHome();
        else if (state.parentTab === 'book') root.innerHTML = renderParentBook();
        else if (state.parentTab === 'packages') root.innerHTML = renderParentPackages();
        else if (state.parentTab === 'video') root.innerHTML = renderParentVideo();
        else if (state.parentTab === 'waiver') root.innerHTML = renderParentWaiver();
      }
    }

    render();
  </script>
</body>
</html>
