    // =========================================================================
    // SUPABASE REAL-TIME CLOUD SYNC v2 (CONFLICT-FREE CRDT + ISOLATED ROW)
    // =========================================================================
    // Paste your Supabase Project URL & Publishable/Anon Key here (or configure via Cloud Sync button)
    const SUPABASE_BAKED_URL = 'https://tetrgebzdhwvgxpdzwkf.supabase.co';
    const SUPABASE_BAKED_KEY = 'sb_publishable_Ef_hInI-arV_WVDUCyUwGw_tG5CUYmq';
    const CLOUD_ROW_ID = 'main_v2'; // Isolated from legacy 'main' so stale/unrefreshed old tabs can NEVER overwrite data!
    const LEGACY_CLOUD_ROW_ID = 'main';
    const BACKUP_ROW_ID = 'backup_athletes';
    const LOCAL_STATE_KEY = 'gfuchs_elite_state_v2';
    const CLIENT_SESSION_ID = 'dev-' + Math.random().toString(36).slice(2, 10);
    const SYNC_COLLECTIONS = ['athletes', 'sessions', 'sessionRecaps', 'videos', 'payments', 'threads', 'waitlist', 'locations', 'eventTypes'];

    let _sbClient = null;
    let _sbPushTimer = null;
    let _sbHydrating = false;
    let _hasLocalCache = false;
    let _lastSyncedDataSig = null;
    let _lastCloudUpdatedAt = '';
    let _lastBackupAthleteCount = 0;
    window._sbConnected = false;

    function ensureDeletedIdsShape(obj) {
      const out = {};
      SYNC_COLLECTIONS.forEach(k => {
        const arr = Array.isArray(obj?.[k]) ? obj[k] : [];
        out[k] = Array.from(new Set(arr.filter(Boolean))).slice(-500);
      });
      return out;
    }

    function recordDeletedId(collection, id) {
      if (!id || !SYNC_COLLECTIONS.includes(collection)) return;
      state.deletedIds = ensureDeletedIdsShape(state.deletedIds);
      if (!state.deletedIds[collection].includes(id)) {
        state.deletedIds[collection].push(id);
        if (state.deletedIds[collection].length > 500) {
          state.deletedIds[collection] = state.deletedIds[collection].slice(-500);
        }
      }
    }

    function unionDeletedIds(localDel, cloudDel) {
      const out = {};
      SYNC_COLLECTIONS.forEach(k => {
        const set = new Set([
          ...(Array.isArray(localDel?.[k]) ? localDel[k] : []),
          ...(Array.isArray(cloudDel?.[k]) ? cloudDel[k] : [])
        ].filter(Boolean));
        out[k] = Array.from(set).slice(-500);
      });
      return out;
    }

    function getSupabaseCreds() {
      const url = (SUPABASE_BAKED_URL || localStorage.getItem('gfuchs_sb_url') || '').trim();
      const key = (SUPABASE_BAKED_KEY || localStorage.getItem('gfuchs_sb_key') || '').trim();
      return { url, key };
    }

    function serializeDataOnly() {
      state.deletedIds = ensureDeletedIdsShape(state.deletedIds);
      return {
        athletes: state.athletes,
        sessions: state.sessions,
        sessionRecaps: state.sessionRecaps.filter(r => !r.isDraft),
        videos: state.videos,
        payments: state.payments,
        threads: state.threads,
        waitlist: state.waitlist,
        deletedIds: state.deletedIds,
        cal: {
          bookedSlots: state.cal.bookedSlots,
          availability: state.cal.availability,
          locations: state.cal.locations,
          clover: state.cal.clover,
          calendarSync: state.cal.calendarSync,
          homeSectionOrder: getHomeSectionOrder(),
          eventTypes: state.cal.eventTypes
        }
      };
    }

    function getDataSignature() {
      try {
        return JSON.stringify(serializeDataOnly());
      } catch (_) {
        return String(Date.now());
      }
    }

    function sanitizeForPostgresJson(val) {
      if (typeof val === 'string') return sanitizeUnicodeText(val);
      if (val === null || val === undefined) return val;
      if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
      if (typeof val === 'boolean') return val;
      if (Array.isArray(val)) return val.map(sanitizeForPostgresJson);
      if (typeof val === 'object') {
        const out = {};
        for (const k of Object.keys(val)) {
          const v = val[k];
          if (typeof v === 'function' || v === undefined) continue;
          out[k] = sanitizeForPostgresJson(v);
        }
        return out;
      }
      return val;
    }

    function serializeSyncedState() {
      return sanitizeForPostgresJson({
        ...serializeDataOnly(),
        _syncVersion: 2,
        _clientId: CLIENT_SESSION_ID,
        _updatedAt: new Date().toISOString()
      });
    }

    function applySyncedState(data) {
      if (!data || typeof data !== 'object') return;
      _sbHydrating = true;
      state.deletedIds = ensureDeletedIdsShape(data.deletedIds);
      if (Array.isArray(data.athletes)) state.athletes = data.athletes;
      if (Array.isArray(data.sessions)) state.sessions = data.sessions;
      if (Array.isArray(data.sessionRecaps)) {
        const localDrafts = state.sessionRecaps.filter(r => r.isDraft);
        state.sessionRecaps = [...localDrafts, ...data.sessionRecaps];
      }
      if (Array.isArray(data.videos)) state.videos = data.videos;
      if (Array.isArray(data.payments)) state.payments = data.payments;
      if (Array.isArray(data.threads)) state.threads = data.threads;
      if (Array.isArray(data.waitlist)) state.waitlist = data.waitlist;
      if (data.cal) {
        if (Array.isArray(data.cal.bookedSlots)) state.cal.bookedSlots = data.cal.bookedSlots;
        if (data.cal.availability) state.cal.availability = data.cal.availability;
        if (Array.isArray(data.cal.locations)) state.cal.locations = data.cal.locations;
        if (data.cal.clover) state.cal.clover = { ...state.cal.clover, ...data.cal.clover };
        if (data.cal.calendarSync) state.cal.calendarSync = { ...state.cal.calendarSync, ...data.cal.calendarSync };
        if (Array.isArray(data.cal.homeSectionOrder) && data.cal.homeSectionOrder.length) state.cal.homeSectionOrder = data.cal.homeSectionOrder;
        if (Array.isArray(data.cal.eventTypes) && data.cal.eventTypes.length) state.cal.eventTypes = data.cal.eventTypes;
      }
      if (data._updatedAt) _lastCloudUpdatedAt = data._updatedAt;
      if (!state.selectedAthleteId && state.athletes.length) state.selectedAthleteId = state.athletes[0].id;
      if (!state.activeSiblingId && state.athletes.length) state.activeSiblingId = state.athletes[0].id;
      _lastSyncedDataSig = getDataSignature();
      _sbHydrating = false;
    }

    function saveLocalState() {
      try {
        localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(serializeSyncedState()));
        _hasLocalCache = true;
      } catch (err) {
        console.warn('Local state save warning:', err);
      }
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(LOCAL_STATE_KEY);
        if (raw) {
          applySyncedState(JSON.parse(raw));
          _hasLocalCache = true;
        }
      } catch (_) {}
    }

    function updateSyncIndicators(connected, labelText = null) {
      window._sbConnected = connected;
      const dot = document.getElementById('roster-sync-dot');
      const lbl = document.getElementById('roster-sync-label');
      if (dot) dot.className = `w-2 h-2 rounded-full ${connected ? 'bg-[#9ED11E]' : 'bg-amber-400'}`;
      if (lbl) lbl.textContent = labelText || (connected ? 'Synced' : 'Cloud Sync');
    }

    function mergeArraysById(localArr, cloudArr, deletedList, preferCloud = false) {
      const deletedSet = new Set(Array.isArray(deletedList) ? deletedList : []);
      const localMap = new Map();
      const cloudMap = new Map();
      const order = [];
      const seen = new Set();

      (Array.isArray(cloudArr) ? cloudArr : []).forEach(item => {
        if (!item || !item.id || deletedSet.has(item.id)) return;
        cloudMap.set(item.id, item);
        if (!seen.has(item.id)) { seen.add(item.id); order.push(item.id); }
      });
      (Array.isArray(localArr) ? localArr : []).forEach(item => {
        if (!item || !item.id || deletedSet.has(item.id)) return;
        localMap.set(item.id, item);
        if (!seen.has(item.id)) { seen.add(item.id); order.push(item.id); }
      });

      const merged = [];
      order.forEach(id => {
        const loc = localMap.get(id);
        const cld = cloudMap.get(id);
        if (loc && cld) {
          const locMod = Number(loc._modifiedAt || 0);
          const cldMod = Number(cld._modifiedAt || 0);
          if (locMod !== cldMod) {
            merged.push(cldMod > locMod ? cld : loc);
          } else {
            merged.push(preferCloud ? cld : loc);
          }
        } else {
          merged.push(loc || cld);
        }
      });
      return merged;
    }

    function mergeCloudIntoLocal(cloudData, preferCloud = false) {
      if (!cloudData || typeof cloudData !== 'object') return { changed: false, localHasUnpushed: false };
      const beforeSig = getDataSignature();
      const cloudAthleteCount = Array.isArray(cloudData.athletes) ? cloudData.athletes.length : 0;
      const cloudRecapCount = Array.isArray(cloudData.sessionRecaps) ? cloudData.sessionRecaps.length : 0;
      _sbHydrating = true;

      state.deletedIds = unionDeletedIds(state.deletedIds, cloudData.deletedIds);
      state.athletes = mergeArraysById(state.athletes, cloudData.athletes, state.deletedIds.athletes, preferCloud);
      state.sessions = mergeArraysById(state.sessions, cloudData.sessions, state.deletedIds.sessions, preferCloud);

      const localDrafts = state.sessionRecaps.filter(r => r.isDraft);
      const localNonDrafts = state.sessionRecaps.filter(r => !r.isDraft);
      const mergedRecaps = mergeArraysById(localNonDrafts, cloudData.sessionRecaps, state.deletedIds.sessionRecaps, preferCloud);
      state.sessionRecaps = [...localDrafts, ...mergedRecaps];

      state.videos = mergeArraysById(state.videos, cloudData.videos, state.deletedIds.videos, preferCloud);
      state.payments = mergeArraysById(state.payments, cloudData.payments, state.deletedIds.payments, preferCloud);
      state.threads = mergeArraysById(state.threads, cloudData.threads, state.deletedIds.threads, preferCloud);
      state.waitlist = mergeArraysById(state.waitlist, cloudData.waitlist, state.deletedIds.waitlist, preferCloud);

      if (cloudData.cal) {
        state.cal.bookedSlots = Array.from(new Set([...(cloudData.cal.bookedSlots || []), ...(state.cal.bookedSlots || [])]));
        if (Array.isArray(cloudData.cal.locations)) {
          state.cal.locations = mergeArraysById(state.cal.locations, cloudData.cal.locations, state.deletedIds.locations, preferCloud);
        }
        if (Array.isArray(cloudData.cal.eventTypes) && cloudData.cal.eventTypes.length) {
          state.cal.eventTypes = mergeArraysById(state.cal.eventTypes, cloudData.cal.eventTypes, state.deletedIds.eventTypes, preferCloud);
        }
        if (cloudData.cal.clover && preferCloud) {
          state.cal.clover = { ...state.cal.clover, ...cloudData.cal.clover };
        }
        if (cloudData.cal.calendarSync && preferCloud) {
          state.cal.calendarSync = { ...state.cal.calendarSync, ...cloudData.cal.calendarSync };
        }
        if (Array.isArray(cloudData.cal.homeSectionOrder) && cloudData.cal.homeSectionOrder.length && preferCloud) {
          state.cal.homeSectionOrder = cloudData.cal.homeSectionOrder;
        }
        if (cloudData.cal.availability) {
          if (preferCloud) {
            const mergedOverrides = {
              ...(state.cal.availability.dateOverrides || {}),
              ...(cloudData.cal.availability.dateOverrides || {})
            };
            state.cal.availability = { ...state.cal.availability, ...cloudData.cal.availability, dateOverrides: mergedOverrides };
          } else if (cloudData.cal.availability.dateOverrides) {
            state.cal.availability.dateOverrides = {
              ...cloudData.cal.availability.dateOverrides,
              ...(state.cal.availability.dateOverrides || {})
            };
          }
        }
      }
      if (cloudData._updatedAt && (! _lastCloudUpdatedAt || cloudData._updatedAt > _lastCloudUpdatedAt)) {
        _lastCloudUpdatedAt = cloudData._updatedAt;
      }
      if (!state.selectedAthleteId && state.athletes.length) state.selectedAthleteId = state.athletes[0].id;
      if (!state.activeSiblingId && state.athletes.length) state.activeSiblingId = state.athletes[0].id;
      _sbHydrating = false;

      const localHasUnpushed = state.athletes.length > cloudAthleteCount || mergedRecaps.length > cloudRecapCount;
      return { changed: getDataSignature() !== beforeSig, localHasUnpushed };
    }

    async function saveSafetyBackupIfLarger(payload) {
      if (!_sbClient || !Array.isArray(payload?.athletes) || payload.athletes.length < 2) return;
      if (payload.athletes.length < _lastBackupAthleteCount) return;
      try {
        const { data: existing } = await _sbClient.from('gfuchs_state').select('data').eq('id', BACKUP_ROW_ID).maybeSingle();
        const existingCount = Array.isArray(existing?.data?.athletes) ? existing.data.athletes.length : 0;
        if (payload.athletes.length >= existingCount) {
          await _sbClient
            .from('gfuchs_state')
            .upsert({ id: BACKUP_ROW_ID, data: payload, updated_at: payload._updatedAt }, { onConflict: 'id' });
          _lastBackupAthleteCount = payload.athletes.length;
        }
      } catch (_) {}
    }

    async function refreshFromSupabase(force = false) {
      if (!_sbClient || window._importingInProgress) return false;
      try {
        const { data, error } = await _sbClient.from('gfuchs_state').select('data').eq('id', CLOUD_ROW_ID).maybeSingle();
        if (error || !data?.data) return false;
        const incoming = data.data;
        if (!force && incoming._updatedAt && _lastCloudUpdatedAt && incoming._updatedAt <= _lastCloudUpdatedAt) return false;
        const res = mergeCloudIntoLocal(incoming, true);
        _lastSyncedDataSig = getDataSignature();
        saveLocalState();
        updateSyncIndicators(true, 'Synced');
        if (res.changed || force) render(false);
        if (res.localHasUnpushed) pushStateToSupabase(false);
        return true;
      } catch (_) {
        return false;
      }
    }

    async function pushStateToSupabase(immediate = false) {
      if (!_sbClient || _sbHydrating) return { ok: false, error: 'not-ready' };
      const curSig = getDataSignature();
      if (!immediate && curSig === _lastSyncedDataSig) return { ok: true, skipped: true };
      clearTimeout(_sbPushTimer);
      const run = async () => {
        try {
          const runSig = getDataSignature();
          if (!immediate && runSig === _lastSyncedDataSig) return { ok: true, skipped: true };
          updateSyncIndicators(true, 'Syncing…');

          // Fetch-before-write CRDT merge: NEVER drop another device's athletes/notes/videos!
          let pulledNewFromCloud = false;
          try {
            const { data: latestRow } = await _sbClient.from('gfuchs_state').select('data').eq('id', CLOUD_ROW_ID).maybeSingle();
            if (latestRow?.data && latestRow.data._clientId !== CLIENT_SESSION_ID) {
              const mergeRes = mergeCloudIntoLocal(latestRow.data, false);
              pulledNewFromCloud = mergeRes.changed;
            }
          } catch (_) {}

          const payload = serializeSyncedState();
          try { window._lastSyncSizeKb = Math.round(JSON.stringify(payload).length / 1024); } catch (_) {}
          const { error } = await _sbClient
            .from('gfuchs_state')
            .upsert({ id: CLOUD_ROW_ID, data: payload, updated_at: payload._updatedAt }, { onConflict: 'id' });
          if (error) {
            window._lastSyncError = error.message || 'Upsert rejected';
            console.warn('Supabase upsert error:', error.message);
            updateSyncIndicators(false, 'Sync Error');
            return { ok: false, error: error.message };
          } else {
            window._lastSyncError = '';
            _lastSyncedDataSig = getDataSignature();
            _lastCloudUpdatedAt = payload._updatedAt;
            saveLocalState();
            updateSyncIndicators(true, 'Synced');
            if (pulledNewFromCloud) render(false);
            publishLiveCalendarFeed(false);
            saveSafetyBackupIfLarger(payload);
            return { ok: true };
          }
        } catch (err) {
          window._lastSyncError = err?.message || 'Network error';
          console.warn('Supabase sync failed:', err);
          updateSyncIndicators(false, 'Offline');
          return { ok: false, error: err?.message || 'network' };
        }
      };
      if (immediate) return await run();
      _sbPushTimer = setTimeout(run, 450);
      return { ok: true, queued: true };
    }

    // Auto-refresh whenever user switches back to tab or unlocks phone (iOS Safari wakes up)
    if (typeof document !== 'undefined' && document.addEventListener) {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') refreshFromSupabase(false);
      });
    }
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('focus', () => refreshFromSupabase(false));
    }

    async function initSupabaseSync() {
      const { url, key } = getSupabaseCreds();
      if (!url || !key || !window.supabase?.createClient) {
        updateSyncIndicators(false, 'Cloud Sync');
        return;
      }
      try {
        _sbClient = window.supabase.createClient(url, key);
        window._sb = _sbClient;

        let { data, error } = await _sbClient.from('gfuchs_state').select('data').eq('id', CLOUD_ROW_ID).maybeSingle();
        if (error) {
          console.warn('Supabase fetch error:', error.message);
          updateSyncIndicators(false, 'Check SQL');
          return;
        }

        // One-time seamless migration from legacy 'main' row if 'main_v2' does not exist yet
        if (!data?.data) {
          const { data: legacy } = await _sbClient.from('gfuchs_state').select('data').eq('id', LEGACY_CLOUD_ROW_ID).maybeSingle();
          if (legacy?.data && Array.isArray(legacy.data.athletes)) {
            if (_hasLocalCache) {
              mergeCloudIntoLocal(legacy.data, true);
            } else {
              applySyncedState(legacy.data);
            }
            saveLocalState();
            render(false);
            await pushStateToSupabase(true);
          } else if (state.athletes.length || state.sessions.length || state.sessionRecaps.length) {
            await pushStateToSupabase(true);
          } else {
            updateSyncIndicators(true, 'Synced');
          }
        } else if (Array.isArray(data.data.athletes)) {
          if (_hasLocalCache) {
            const res = mergeCloudIntoLocal(data.data, true);
            _lastSyncedDataSig = getDataSignature();
            saveLocalState();
            updateSyncIndicators(true, 'Synced');
            render(false);
            if (res.localHasUnpushed) await pushStateToSupabase(true);
          } else {
            applySyncedState(data.data);
            saveLocalState();
            updateSyncIndicators(true, 'Synced');
            render(false);
          }
        } else {
          updateSyncIndicators(true, 'Synced');
        }

        // Subscribe to real-time updates on isolated 'main_v2' row (NEVER blindly overwrites local athletes!)
        _sbClient
          .channel('gfuchs-live-sync-v2')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'gfuchs_state', filter: `id=eq.${CLOUD_ROW_ID}` }, (payload) => {
            const incoming = payload.new?.data;
            if (!incoming || incoming._clientId === CLIENT_SESSION_ID || window._importingInProgress) return;
            if (incoming._updatedAt && _lastCloudUpdatedAt && incoming._updatedAt < _lastCloudUpdatedAt) return;
            const res = mergeCloudIntoLocal(incoming, true);
            _lastSyncedDataSig = getDataSignature();
            saveLocalState();
            if (res.changed) {
              render(false);
              showToast('Synced live update from another device!');
            }
            if (res.localHasUnpushed) pushStateToSupabase(false);
          })
          .subscribe();
      } catch (err) {
        console.warn('Supabase init failed:', err);
        updateSyncIndicators(false, 'Cloud Sync');
      }
    }

    // =========================================================================
    // COACH SCHEDULE PAGE (DAY / WEEK / MONTH / YEAR + PER-DAY AVAILABILITY)
    // =========================================================================
    function getEffectiveDayAvailability(iso) {
      if (!iso) return { isOverride: false, off: true, blocks: [] };
      const overrides = state.cal?.availability?.dateOverrides || {};
      if (Object.prototype.hasOwnProperty.call(overrides, iso)) {
        const ov = overrides[iso] || {};
        const blocks = Array.isArray(ov.blocks) ? ov.blocks : [];
        return { isOverride: true, off: !!ov.off || blocks.length === 0, blocks: ov.off ? [] : blocks };
      }
      const [y, m, d] = iso.split('-').map(Number);
      const dow = new Date(y, m - 1, d).getDay();
      const days = state.cal?.availability?.days || [];
      const blocks = days.includes(dow) ? (state.cal?.availability?.weeklyBlocks?.[dow] || []) : [];
      return { isOverride: false, off: blocks.length === 0, blocks };
    }

    function fmt24To12Short(hm) {
      if (!hm || !hm.includes(':')) return hm || '';
      const [h, m] = hm.split(':').map(Number);
      if (state.cal?.timeFormat === '24h') return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      const ap = h >= 12 ? 'p' : 'a';
      const h12 = h % 12 || 12;
      return m ? `${h12}:${String(m).padStart(2, '0')}${ap}` : `${h12}${ap}`;
    }

    function fmtAvailSummary(eff) {
      if (!eff || eff.off || !eff.blocks.length) return 'Day Off';
      return eff.blocks.map(b => `${fmt24To12Short(b.start)}–${fmt24To12Short(b.end)}`).join(', ');
    }

    function toIsoDate(y, m0, d) {
      return `${y}-${String(m0 + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function parseIsoLocal(iso) {
      const [y, m, d] = (iso || getTodayIsoEst()).split('-').map(Number);
      return new Date(y, m - 1, d, 12, 0, 0);
    }

    function getScheduleAnchorIso() {
      if (!state.schedule) state.schedule = { view: 'week', anchorDate: null };
      if (!state.schedule.anchorDate) state.schedule.anchorDate = getTodayIsoEst();
      return state.schedule.anchorDate;
    }

    function getSessionsForIso(iso) {
      const dt = parseIsoLocal(iso);
      const dayKey = dt.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' }).replace(',', '');
      const shortLabel = dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      return state.sessions.filter(s => {
        if (s.dateIso) return s.dateIso === iso;
        return s.dayKey === dayKey || s.day === shortLabel;
      });
    }

    function scheduleSetView(view) {
      if (!state.schedule) state.schedule = { view: 'week', anchorDate: getTodayIsoEst() };
      state.schedule.view = view;
      render(false);
    }

    function scheduleGoToday() {
      if (!state.schedule) state.schedule = { view: 'week', anchorDate: getTodayIsoEst() };
      state.schedule.anchorDate = getTodayIsoEst();
      render(false);
    }

    function scheduleSelectDate(iso, switchToView = null) {
      if (!state.schedule) state.schedule = { view: 'week', anchorDate: iso };
      state.schedule.anchorDate = iso;
      if (switchToView) state.schedule.view = switchToView;
      render(false);
    }

    function scheduleStep(dir) {
      const iso = getScheduleAnchorIso();
      const dt = parseIsoLocal(iso);
      const view = state.schedule.view || 'week';
      if (view === 'day') dt.setDate(dt.getDate() + dir);
      else if (view === 'week') dt.setDate(dt.getDate() + dir * 7);
      else if (view === 'month') dt.setMonth(dt.getMonth() + dir);
      else if (view === 'year') dt.setFullYear(dt.getFullYear() + dir);
      state.schedule.anchorDate = toIsoDate(dt.getFullYear(), dt.getMonth(), dt.getDate());
      render(false);
    }

    function saveDayAvailability() {

    // =========================================================================
    // CALENDAR SYNC ENGINE (APPLE CALENDAR / GOOGLE CALENDAR / OUTLOOK .ICS)
    // =========================================================================
    function parseSessionDateTimeRange(s) {
      const iso = s.dateIso || getTodayIsoEst();
      const [y, m, d] = iso.split('-').map(Number);

      // Parse time string like "4:00 PM" or "16:00"
      let hh = 16, mm = 0;
      const t = String(s.time || '4:00 PM').trim();
      const m12 = t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
      const m24 = t.match(/^(\d{1,2}):(\d{2})$/);
      if (m12) {
        hh = Number(m12[1]) % 12;
        if (m12[3].toUpperCase() === 'PM') hh += 12;
        mm = Number(m12[2]);
      } else if (m24) {
        hh = Number(m24[1]);
        mm = Number(m24[2]);
      }

      // Parse duration from durationMin or string like "45M", "60 MIN", "1H"
      let durMin = Number(s.durationMin) || 0;
      if (!durMin) {
        durMin = 45;
        const durStr = String(s.duration || '45M').toUpperCase();
        const dm = durStr.match(/(\d+)\s*M/);
        const dh = durStr.match(/(\d+)\s*H/);
        if (dm) durMin = Number(dm[1]);
        else if (dh) durMin = Number(dh[1]) * 60;
      }

      const startDt = new Date(y, m - 1, d, hh, mm, 0);
      const endDt = new Date(startDt.getTime() + durMin * 60000);
      const fmtLocal = (dt) =>
        `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}T${String(dt.getHours()).padStart(2, '0')}${String(dt.getMinutes()).padStart(2, '0')}00`;
      return { startLocal: fmtLocal(startDt), endLocal: fmtLocal(endDt), durMin };
    }

    function escapeIcsText(str) {
      return String(str || '')
        .replace(/\\/g, '\\\\')
        .replace(/\r?\n/g, '\\n')
        .replace(/;/g, '\\;')
        .replace(/,/g, '\\,');
    }

    function buildIcsCalendar(sessionsList, calName = 'Gina Fuchs Elite Fastpitch Schedule') {
      const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
      const defaultLoc = state.cal?.locations?.[0]?.name || 'Gina Fuchs Elite Facility';
      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Gina Fuchs Elite Fastpitch//Schedule Sync//EN',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        `X-WR-CALNAME:${escapeIcsText(calName)}`,
        'X-WR-TIMEZONE:America/New_York',
        'REFRESH-INTERVAL;VALUE=DURATION:PT15M',
        'X-PUBLISHED-TTL:PT15M'
      ];

      (sessionsList || []).forEach(s => {
        if (s.status === 'Canceled') return;
        const { startLocal, endLocal } = parseSessionDateTimeRange(s);
        const players = (s.athletes || []).join(', ');
        const lessonName = s.lessonTitle || s.focus || s.type || 'Fastpitch Lesson';
        const summary = players ? `${lessonName} — ${players}` : lessonName;
        const desc = [
          `Lesson: ${lessonName}`,
          s.focus && s.focus !== lessonName ? `Session Focus: ${s.focus}` : '',
          players ? `Athlete: ${players}` : 'Open Session',
          s.type ? `Format: ${s.type}` : '',
          s.payment ? `Payment: ${s.payment}` : ''
        ].filter(Boolean).join('\n');
        const loc = s.location || defaultLoc;
        lines.push(
          'BEGIN:VEVENT',
          `UID:${s.id || ('ses-' + Date.now())}@gfuchselite.app`,
          `DTSTAMP:${stamp}`,
          `DTSTART;TZID=America/New_York:${startLocal}`,
          `DTEND;TZID=America/New_York:${endLocal}`,
          `SUMMARY:${escapeIcsText(summary)}`,
          `LOCATION:${escapeIcsText(loc)}`,
          `DESCRIPTION:${escapeIcsText(desc)}`,
          'BEGIN:VALARM',
          'TRIGGER:-PT30M',
          'ACTION:DISPLAY',
          `DESCRIPTION:${escapeIcsText(summary)} in 30 minutes`,
          'END:VALARM',
          'END:VEVENT'
        );
      });

      lines.push('END:VCALENDAR');
      return lines.join('\r\n');
    }

    let _lastPublishedCalSig = null;

    function getLiveCalendarFeedUrl(asWebcal = false) {
      const custom = (state.cal?.calendarSync?.feedUrl || '').trim();
      const { url } = getSupabaseCreds();
      const base = custom || (url ? `${url.replace(/\/$/, '')}/storage/v1/object/public/gfuchs-media/calendar/schedule.ics` : '');
      if (!base) return '';
      if (asWebcal) return base.replace(/^https?:\/\//i, 'webcal://');
      return base;
    }

    async function publishLiveCalendarFeed(force = false) {
      try {
        const sb = _sbClient || window._sb;
        if (!sb || !sb.storage) return false;
        const active = state.sessions.filter(s => s.status !== 'Canceled');
        const sig = JSON.stringify(active.map(s => [s.id, s.dateIso, s.day, s.time, s.duration, s.focus, s.athletes, s.status, s.location]));
        if (!force && sig === _lastPublishedCalSig) return true;
        const ics = buildIcsCalendar(active);
        const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
        const { error } = await sb.storage.from('gfuchs-media').upload('calendar/schedule.ics', blob, {
          contentType: 'text/calendar; charset=utf-8',
          cacheControl: '60',
          upsert: true
        });
        if (!error) {
          _lastPublishedCalSig = sig;
          return true;
        }
        console.warn('Live calendar feed publish error:', error.message || error);
      } catch (err) {
        console.warn('Live calendar feed publish failed:', err);
      }
      return false;
    }

    function copyLiveCalendarFeedUrl() {
      const feedUrl = getLiveCalendarFeedUrl(false);
      if (!feedUrl) {
        showToast('Connect Supabase first to enable live calendar feed.');
        return;
      }
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(feedUrl).then(() => showToast('Live Calendar Feed URL copied! Paste into Google Calendar → From URL or Outlook.')).catch(() => showToast('Feed URL ready!'));
      } else {
        showToast('Feed URL copied!');
      }
    }

    function triggerIcsDownload(icsContent, filename = 'gina-fuchs-schedule.ics') {
      try {
        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        return true;
      } catch (_) {
        return false;
      }
    }

    function downloadAllLessonsIcs() {
      const active = state.sessions.filter(s => s.status !== 'Canceled');
      if (!active.length) {
        showToast('No scheduled lessons to export yet — add a session first!');
        return;
      }
      const ics = buildIcsCalendar(active);
      triggerIcsDownload(ics, `gina-fuchs-schedule-${getTodayIsoEst()}.ics`);
      showToast(`Exported ${active.length} lesson${active.length === 1 ? '' : 's'} (.ics) — open to sync with Apple / Google / Outlook Calendar!`);
    }

    function downloadSingleLessonIcs(sessionId) {
      const s = state.sessions.find(x => x.id === sessionId);
      if (!s) return;
      const ics = buildIcsCalendar([s]);
      const slug = (s.athletes?.[0] || 'lesson').toLowerCase().replace(/[^a-z0-9]+/g, '-');
      triggerIcsDownload(ics, `lesson-${slug}-${s.dateIso || getTodayIsoEst()}.ics`);
      showToast('Downloaded .ics — tap to add to Apple / Outlook Calendar!');
    }

    function getGoogleCalendarUrl(s) {
      const { startLocal, endLocal } = parseSessionDateTimeRange(s);
      const players = (s.athletes || []).join(', ');
      const title = players ? `${players} — ${s.focus || s.type || 'Fastpitch Lesson'}` : (s.focus || 'Fastpitch Lesson');
      const details = [
        `Session: ${s.focus || s.type || 'Fastpitch Lesson'}`,
        players ? `Athlete: ${players}` : '',
        s.payment ? `Payment: ${s.payment}` : ''
      ].filter(Boolean).join('\n');
      const loc = s.location || state.cal?.locations?.[0]?.name || 'Gina Fuchs Elite Facility';
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: title,
        dates: `${startLocal}/${endLocal}`,
        ctz: 'America/New_York',
        details,
        location: loc
      });
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    function saveCalendarSyncSettings(e) {
      e.preventDefault();
      if (!state.cal.calendarSync) state.cal.calendarSync = {};
      state.cal.calendarSync.autoPrompt = Boolean(e.target.autoPrompt?.checked);
      state.cal.calendarSync.feedUrl = (e.target.feedUrl?.value || '').trim();
      closeModal();
      render();
      publishLiveCalendarFeed(true);
      showToast('Calendar sync preferences saved!');
    }

    function openCalendarSyncModal(focusSessionId = null) {
      const activeSessions = state.sessions.filter(s => s.status !== 'Canceled');
      const focusSession = focusSessionId ? activeSessions.find(s => s.id === focusSessionId) : null;
      const cs = state.cal.calendarSync || { autoPrompt: false, feedUrl: '' };
      const httpsFeed = getLiveCalendarFeedUrl(false);
      const webcalFeed = getLiveCalendarFeedUrl(true);
      const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      // Ensure live feed is freshly published whenever Gina opens this modal
      publishLiveCalendarFeed(false);

      openModal(`
        <div class="flex items-start justify-between gap-2">
          <div>
            <div class="text-[11px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">Apple • Google • Outlook</div>
            <h3 class="font-extrabold text-base mt-0.5">${focusSession ? 'Add Lesson to Calendar' : 'Auto-Sync Schedule Calendar'}</h3>
          </div>
          <button type="button" onclick="closeModal()" aria-label="Close" class="w-10 h-10 rounded-full flex items-center justify-center surface-soft text-xs font-bold cursor-pointer">✕</button>
        </div>

        ${focusSession ? `
          <div class="p-3.5 rounded-2xl card-mist space-y-2.5 text-xs">
            <div>
              <div class="font-extrabold text-sm">${(focusSession.athletes || []).join(', ') || focusSession.focus}</div>
              <div class="text-[var(--text-muted)] font-semibold">${focusSession.day || focusSession.dateIso || ''} • ${focusSession.time} (${focusSession.duration}) EST</div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="downloadSingleLessonIcs('${focusSession.id}')" class="py-2.5 px-3 rounded-xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer">Apple / Outlook (.ics)</button>
              <a href="${getGoogleCalendarUrl(focusSession)}" target="_blank" rel="noopener noreferrer" class="py-2.5 px-3 rounded-xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold text-center">+ Google Calendar ↗</a>
            </div>
          </div>
        ` : ''}

        <!-- Automatic Live Calendar Subscription Feed -->
        ${httpsFeed ? `
          <div class="p-4 rounded-2xl card-mist space-y-2.5 text-xs">
            <div class="flex items-center justify-between gap-2">
              <span class="font-extrabold">Live Auto-Sync Calendar Feed</span>
              <span class="px-2 py-0.5 rounded-full bg-[#D5FF5F] text-[#010101] text-[10px] font-extrabold">AUTO-UPDATES ✓</span>
            </div>
            <p class="text-[11px] text-[var(--text-muted)] leading-relaxed">
              Subscribe once — every time you add, edit, or cancel a session, this live feed updates automatically in <strong>Apple Calendar</strong>, <strong>Google Calendar</strong>, and <strong>Outlook</strong>.
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <a href="${webcalFeed}" class="py-2.5 px-3 rounded-xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold text-center hover:opacity-90 transition">
                Subscribe in Apple Calendar
              </a>
              <button type="button" onclick="copyLiveCalendarFeedUrl()" class="py-2.5 px-3 rounded-xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer hover:brightness-95 transition">
                Copy Feed URL (Google / Outlook)
              </button>
            </div>
            <div class="flex items-center justify-between gap-2 pt-1 text-[10px] text-[var(--text-muted)]">
              <span class="truncate font-mono">${httpsFeed}</span>
              <button type="button" onclick="publishLiveCalendarFeed(true).then(ok => showToast(ok ? 'Live calendar feed updated!' : 'Could not publish feed.'))" class="px-2 py-1 rounded-lg card-white font-extrabold shrink-0 cursor-pointer">Sync Now</button>
            </div>
          </div>
        ` : ''}

        <!-- Manual 1-Click Snapshot Export -->
        <div class="p-3.5 rounded-2xl surface-soft flex items-center justify-between gap-3 text-xs">
          <div>
            <div class="font-extrabold">Manual Export (.ics)</div>
            <div class="text-[11px] text-[var(--text-muted)]">${activeSessions.length} scheduled session${activeSessions.length === 1 ? '' : 's'} • Pittsburgh EST</div>
          </div>
          <button type="button" onclick="downloadAllLessonsIcs()" class="px-3.5 py-2 rounded-xl card-white text-xs font-extrabold cursor-pointer hover:border-[#010101] shrink-0">
            Download .ics
          </button>
        </div>

        <!-- Upcoming Sessions Quick Add to Google / Apple -->
        ${!focusSession && activeSessions.length ? `
          <div class="space-y-2 text-xs">
            <div class="font-extrabold">Quick-Add Individual Sessions</div>
            <div class="max-h-36 overflow-y-auto space-y-1.5">
              ${activeSessions.slice(0, 8).map(s => `
                <div class="surface-soft rounded-2xl p-2.5 flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <div class="font-extrabold truncate">${s.lessonTitle || s.focus}${(s.athletes && s.athletes.length) ? ` — ${s.athletes.join(', ')}` : ''}</div>
                    <div class="text-[10px] text-[var(--text-muted)]">${s.day || s.dateIso || ''} • ${s.time} (${s.duration})</div>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <a href="${getGoogleCalendarUrl(s)}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded-xl bg-[#010101] text-[#D5FF5F] text-[10px] font-extrabold">Google ↗</a>
                    <button type="button" onclick="downloadSingleLessonIcs('${s.id}')" class="px-2.5 py-1.5 rounded-xl card-white text-[10px] font-extrabold cursor-pointer">.ics</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Auto-Prompt Preference -->
        <form onsubmit="saveCalendarSyncSettings(event)" class="space-y-2.5 pt-2 border-t border-[var(--border-subtle)] text-xs">
          <label class="flex items-center justify-between gap-3 p-2.5 rounded-2xl surface-soft cursor-pointer">
            <div>
              <div class="font-extrabold">Auto-Prompt After Adding Session</div>
              <div class="text-[10px] text-[var(--text-muted)]">Opens quick calendar add right after booking</div>
            </div>
            <input type="checkbox" name="autoPrompt" ${cs.autoPrompt ? 'checked' : ''} class="w-4 h-4 accent-[#010101]" />
          </label>
          <input type="hidden" name="feedUrl" value="${esc(cs.feedUrl)}" />
          <button type="submit" class="w-full py-2.5 rounded-2xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer">
            Save Sync Preferences
          </button>
        </form>
      `);
    }

    function renderCoachSchedule() {
      const anchorIso = getScheduleAnchorIso();
      const todayIso = getTodayIsoEst();
      const view = state.schedule.view || 'week';
      const anchorDt = parseIsoLocal(anchorIso);
      const y = anchorDt.getFullYear();
      const m0 = anchorDt.getMonth();

      let rangeLabel = '';
      if (view === 'day') {
        rangeLabel = anchorDt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      } else if (view === 'week') {
        const sun = new Date(anchorDt);
        sun.setDate(anchorDt.getDate() - anchorDt.getDay());
        const sat = new Date(sun);
        sat.setDate(sun.getDate() + 6);
        rangeLabel = `${sun.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${sat.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
      } else if (view === 'month') {
        rangeLabel = anchorDt.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      } else {
        rangeLabel = `${y} Schedule Overview`;
      }

      // Build view-specific body
      let bodyHtml = '';

      if (view === 'day') {
        const eff = getEffectiveDayAvailability(anchorIso);
        const daySessions = getSessionsForIso(anchorIso);
        bodyHtml = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- Availability Card -->
            <div class="lg:col-span-4 card-white rounded-[28px] p-5 space-y-4">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <div class="text-[11px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">${eff.isOverride ? 'Custom Hours' : 'Weekly Default'}</div>
                  <h2 class="text-base font-extrabold mt-0.5">Gina’s Availability</h2>
                </div>
                <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold ${eff.off ? 'bg-red-500/15 text-red-600 dark:text-red-400' : 'bg-[#D5FF5F] text-[#010101]'}">
                  ${eff.off ? 'Day Off' : 'Open'}
                </span>
              </div>

              ${!eff.off ? `
                <div class="space-y-2">
                  ${eff.blocks.map(b => `
                    <div class="surface-soft rounded-2xl p-3 flex items-center justify-between text-xs">
                      <span class="font-extrabold">${fmt24To12Short(b.start)} – ${fmt24To12Short(b.end)}</span>
                      <span class="text-[11px] text-[var(--text-muted)] font-semibold">EST</span>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <div class="surface-soft rounded-2xl p-4 text-xs text-[var(--text-muted)]">
                  Marked as <strong>Day Off</strong>. Athletes won’t see open booking slots on this date.
                </div>
              `}

              <button onclick="openDayAvailabilityModal('${anchorIso}')" class="w-full py-2.5 rounded-2xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer hover:opacity-90 transition">
                Set Availability for This Day
              </button>
            </div>

            <!-- Scheduled Sessions for This Day -->
            <div class="lg:col-span-8 space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="text-base font-extrabold">Scheduled Sessions (${daySessions.length})</h2>
                <button onclick="openAddSessionModal('${anchorIso}')" class="px-3.5 py-2 rounded-xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">+ Schedule Session</button>
              </div>
              ${daySessions.length ? daySessions.map(s => renderCoachSessionRow(s, false)).join('') : `
                <div class="card-white rounded-[24px] p-8 text-center space-y-2.5">
                  <div class="font-extrabold text-sm">No sessions scheduled on this day</div>
                  <p class="text-xs text-[var(--text-muted)]">Tap below to schedule a session for ${anchorDt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}.</p>
                  <button onclick="openAddSessionModal('${anchorIso}')" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">+ Schedule Session</button>
                </div>
              `}
            </div>
          </div>
        `;
      } else if (view === 'week') {
        const sun = new Date(anchorDt);
        sun.setDate(anchorDt.getDate() - anchorDt.getDay());
        const weekDays = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(sun.getTime() + i * 86400000);
          const iso = toIsoDate(d.getFullYear(), d.getMonth(), d.getDate());
          weekDays.push({
            iso,
            dow: d.toLocaleDateString('en-US', { weekday: 'short' }),
            num: d.getDate(),
            isToday: iso === todayIso,
            isSelected: iso === anchorIso,
            eff: getEffectiveDayAvailability(iso),
            sessions: getSessionsForIso(iso)
          });
        }
        bodyHtml = `
          <div class="grid grid-cols-1 md:grid-cols-7 gap-3">
            ${weekDays.map(d => `
              <div class="card-white rounded-[24px] p-3.5 flex flex-col justify-between gap-3 ${d.isToday ? 'ring-2 ring-[#010101] dark:ring-[#D5FF5F]' : ''}">
                <div class="space-y-2.5">
                  <div class="flex items-center justify-between gap-1">
                    <button onclick="scheduleSelectDate('${d.iso}', 'day')" class="text-left cursor-pointer group">
                      <div class="text-[10px] font-extrabold uppercase tracking-wider text-[var(--text-muted)]">${d.dow}${d.isToday ? ' • TODAY' : ''}</div>
                      <div class="text-xl font-extrabold leading-tight group-hover:underline">${d.num}</div>
                    </button>
                    <button onclick="openDayAvailabilityModal('${d.iso}')" title="Set availability for ${d.dow} ${d.num}" class="px-2 py-1 rounded-full text-[10px] font-extrabold cursor-pointer transition ${d.eff.off ? 'bg-red-500/15 text-red-600 dark:text-red-400' : d.eff.isOverride ? 'bg-amber-400/25 text-amber-900 dark:text-amber-200' : 'bg-[#D5FF5F]/60 text-[#010101]'}">
                      ${d.eff.off ? 'Off' : d.eff.isOverride ? 'Custom' : 'Open'}
                    </button>
                  </div>

                  <button onclick="openDayAvailabilityModal('${d.iso}')" class="w-full text-left px-2.5 py-1.5 rounded-xl surface-soft text-[10px] font-bold text-[var(--text-muted)] hover:text-[var(--text-main)] truncate cursor-pointer">
                    ${fmtAvailSummary(d.eff)}
                  </button>

                  <div class="space-y-1.5">
                    ${d.sessions.length ? d.sessions.map(s => `
                      <button onclick="scheduleSelectDate('${d.iso}', 'day')" class="w-full text-left p-2 rounded-xl bg-[#010101] text-white space-y-0.5 cursor-pointer hover:opacity-90 transition">
                        <div class="text-[10px] font-extrabold text-[#D5FF5F]">${s.time}</div>
                        <div class="text-[11px] font-extrabold truncate">${(s.athletes || []).join(', ') || s.focus}</div>
                        <div class="text-[10px] text-[#D6DFE2] truncate">${s.focus}</div>
                      </button>
                    `).join('') : `<div class="text-[11px] text-[var(--text-muted)] py-2 text-center opacity-70">No lessons</div>`}
                  </div>
                </div>

                <button onclick="openAddSessionModal('${d.iso}')" class="w-full py-1.5 rounded-xl surface-soft text-[11px] font-extrabold cursor-pointer hover:border-[#010101] transition">
                  + Session
                </button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (view === 'month') {
        const firstDow = new Date(y, m0, 1).getDay();
        const daysInMonth = new Date(y, m0 + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDow; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = toIsoDate(y, m0, d);
          cells.push({
            iso,
            d,
            isToday: iso === todayIso,
            isSelected: iso === anchorIso,
            eff: getEffectiveDayAvailability(iso),
            sessions: getSessionsForIso(iso)
          });
        }
        const selEff = getEffectiveDayAvailability(anchorIso);
        const selSessions = getSessionsForIso(anchorIso);

        bodyHtml = `
          <div class="card-white rounded-[28px] p-4 sm:p-5 space-y-3">
            <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-extrabold uppercase tracking-wider text-[var(--text-muted)]">
              ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="py-1">${d}</div>`).join('')}
            </div>
            <div class="grid grid-cols-7 gap-1.5">
              ${cells.map(c => {
                if (!c) return `<div class="min-h-[64px] sm:min-h-[82px]"></div>`;
                const bg = c.isSelected
                  ? 'bg-[#010101] text-[#D5FF5F] border-[#010101]'
                  : c.isToday
                    ? 'surface-soft border-[#010101] dark:border-[#D5FF5F]'
                    : 'surface-soft border-transparent hover:border-[var(--border-subtle)]';
                return `
                  <button onclick="scheduleSelectDate('${c.iso}')" class="min-h-[64px] sm:min-h-[82px] p-1.5 sm:p-2 rounded-2xl border text-left flex flex-col justify-between transition cursor-pointer ${bg}">
                    <div class="flex items-center justify-between w-full">
                      <span class="text-xs sm:text-sm font-extrabold">${c.d}</span>
                      <span title="${fmtAvailSummary(c.eff)}" class="w-2 h-2 rounded-full ${c.eff.off ? 'bg-red-400/60' : c.eff.isOverride ? 'bg-amber-400' : 'bg-[#9ED11E]'}"></span>
                    </div>
                    <div class="space-y-0.5 w-full overflow-hidden">
                      ${c.sessions.slice(0, 2).map(s => `
                        <div class="truncate text-[9px] sm:text-[10px] font-extrabold px-1.5 py-0.5 rounded-md ${c.isSelected ? 'bg-[#D5FF5F] text-[#010101]' : 'bg-[#010101] text-[#D5FF5F]'}">
                          ${s.time.replace(':00 ', '')} ${(s.athletes?.[0] || s.focus).split(' ')[0]}
                        </div>
                      `).join('')}
                      ${c.sessions.length > 2 ? `<div class="text-[9px] font-extrabold opacity-75">+${c.sessions.length - 2} more</div>` : ''}
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
            <div class="flex flex-wrap items-center gap-4 pt-1 text-[11px] font-bold text-[var(--text-muted)]">
              <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-[#9ED11E]"></span> Open</span>
              <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-400"></span> Custom Hours</span>
              <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red-400/60"></span> Day Off</span>
            </div>
          </div>

          <!-- Selected Day Inspector -->
          <div class="card-mist rounded-[28px] p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <div class="text-[11px] font-extrabold uppercase tracking-wider text-[#4E6075] dark:text-[#9AC0D6]">Selected Day</div>
                <h2 class="text-lg font-extrabold">${anchorDt.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' })}</h2>
                <div class="text-xs text-[var(--text-muted)] font-semibold">Availability: <strong>${fmtAvailSummary(selEff)}</strong> ${selEff.isOverride ? '(Custom)' : '(Weekly Default)'}</div>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button onclick="openDayAvailabilityModal('${anchorIso}')" class="px-3.5 py-2 rounded-xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer">Set Availability</button>
                <button onclick="openAddSessionModal('${anchorIso}')" class="px-3.5 py-2 rounded-xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer">+ Add Session</button>
              </div>
            </div>
            ${selSessions.length ? `<div class="space-y-2.5">${selSessions.map(s => renderCoachSessionRow(s, false)).join('')}</div>` : `
              <div class="card-white rounded-2xl p-4 text-xs text-[var(--text-muted)] text-center">No sessions scheduled on this date yet.</div>
            `}
          </div>
        `;
      } else {
        // YEAR VIEW (12-Month Overview)
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        bodyHtml = `
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            ${monthNames.map((mName, mi) => {
              const firstDow = new Date(y, mi, 1).getDay();
              const dim = new Date(y, mi + 1, 0).getDate();
              let monthSessionCount = 0;
              const miniCells = [];
              for (let i = 0; i < firstDow; i++) miniCells.push('');
              for (let d = 1; d <= dim; d++) {
                const iso = toIsoDate(y, mi, d);
                const cnt = getSessionsForIso(iso).length;
                monthSessionCount += cnt;
                const isTod = iso === todayIso;
                miniCells.push(`
                  <button onclick="event.stopPropagation(); scheduleSelectDate('${iso}', 'day');" class="h-6 w-6 mx-auto rounded-full text-[10px] font-bold flex items-center justify-center cursor-pointer transition ${isTod ? 'bg-[#010101] text-[#D5FF5F] font-extrabold' : cnt ? 'bg-[#D5FF5F] text-[#010101] font-extrabold' : 'hover:bg-[var(--bg-elevated)] text-[var(--text-muted)]'}">
                    ${d}
                  </button>
                `);
              }
              return `
                <div onclick="scheduleSelectDate('${toIsoDate(y, mi, 1)}', 'month')" class="card-white rounded-[24px] p-4 space-y-2.5 cursor-pointer hover:border-[#010101] transition">
                  <div class="flex items-center justify-between">
                    <span class="font-extrabold text-sm">${mName}</span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${monthSessionCount ? 'bg-[#D5FF5F] text-[#010101]' : 'surface-soft text-[var(--text-muted)]'}">
                      ${monthSessionCount} session${monthSessionCount === 1 ? '' : 's'}
                    </span>
                  </div>
                  <div class="grid grid-cols-7 gap-0.5 text-center text-[9px] font-bold text-[var(--text-muted)]">
                    ${['S','M','T','W','T','F','S'].map(x => `<div>${x}</div>`).join('')}
                  </div>
                  <div class="grid grid-cols-7 gap-0.5 text-center">
                    ${miniCells.join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      return `
        <!-- Schedule Top Header -->
        <div class="card-mist rounded-[28px] p-5 sm:p-6 space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl sm:text-3xl font-extrabold">${rangeLabel}</h1>
              <p class="text-[13px] font-medium text-[var(--text-muted)] mt-0.5">Pittsburgh · Eastern Time (EST)</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="openDayAvailabilityModal('${anchorIso}')" class="px-3.5 py-2.5 rounded-2xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer hover:opacity-90 transition">
                Set Availability
              </button>
              <button onclick="openAddSessionModal('${anchorIso}')" class="px-4 py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-xs font-extrabold cursor-pointer shadow-sm hover:brightness-95 transition">
                + Add Session
              </button>
            </div>
          </div>

          <!-- View Switcher (Day / Week / Month / Year) + Prev/Today/Next -->
          <div class="flex flex-wrap items-center justify-between gap-2.5">
            <div class="inline-flex items-center gap-1 p-1 rounded-2xl card-white">
              ${[
                { id: 'day', label: 'Day' },
                { id: 'week', label: 'Week' },
                { id: 'month', label: 'Month' },
                { id: 'year', label: 'Year' }
              ].map(v => `
                <button onclick="scheduleSetView('${v.id}')" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer ${view === v.id ? 'bg-[#010101] text-[#D5FF5F] shadow-sm' : 'text-[var(--text-muted)] hover:text-[var(--text-main)]'}">
                  ${v.label}
                </button>
              `).join('')}
            </div>

            <div class="inline-flex items-center gap-1.5">
              <button onclick="scheduleStep(-1)" aria-label="Previous" class="w-9 h-9 rounded-xl card-white text-sm font-extrabold cursor-pointer hover:border-[#010101]">‹</button>
              <button onclick="scheduleGoToday()" class="px-3.5 h-9 rounded-xl card-white text-xs font-extrabold cursor-pointer hover:border-[#010101]">Today</button>
              <button onclick="scheduleStep(1)" aria-label="Next" class="w-9 h-9 rounded-xl card-white text-sm font-extrabold cursor-pointer hover:border-[#010101]">›</button>
            </div>
          </div>
        </div>

        ${bodyHtml}
      `;
    }

    let _lastRenderedViewKey = '';
    function render(shouldSync = true) {
      renderChrome();
      const root = document.getElementById('app-root');
      const viewKey = state.role === 'coach'
        ? `coach:${state.coachTab}:${state.coachTab === 'athletes' ? state.rosterView + ':' + (state.selectedAthleteId || '') : ''}`
        : `parent:${state.parentTab}`;
      if (state.role === 'coach') {
        if (state.coachTab === 'today') root.innerHTML = renderCoachToday();
        else if (state.coachTab === 'schedule') root.innerHTML = renderCoachSchedule();
        else if (state.coachTab === 'sessions') root.innerHTML = renderCoachSessions();
        else if (state.coachTab === 'athletes') root.innerHTML = renderCoachAthletes();
        else if (state.coachTab === 'recap') root.innerHTML = renderCoachRecapPage();
        else if (state.coachTab === 'video') root.innerHTML = renderCoachVideo();
        else if (state.coachTab === 'payments') root.innerHTML = renderCoachPayments();
        else if (state.coachTab === 'messaging') root.innerHTML = renderCoachMessaging();
        else if (state.coachTab === 'settings') root.innerHTML = renderCoachSettings();
      } else {
        if (state.parentTab === 'home') root.innerHTML = renderParentHome();
        else if (state.parentTab === 'book') root.innerHTML = renderParentBook();
        else if (state.parentTab === 'packages') root.innerHTML = renderParentPackages();
        else if (state.parentTab === 'video') root.innerHTML = renderParentVideo();
        else if (state.parentTab === 'waiver') root.innerHTML = renderParentWaiver();
        else if (state.parentTab === 'profile') root.innerHTML = renderAthleteProfile();
      }
      if (viewKey !== _lastRenderedViewKey && root) {
        _lastRenderedViewKey = viewKey;
        root.classList.remove('view-enter');
        void root.offsetWidth;
        root.classList.add('view-enter');
      }
      if (shouldSync && !_sbHydrating) {
        saveLocalState();
        pushStateToSupabase();
      }
    }
    loadLocalState();
    render(false);
    initSupabaseSync();

    // =========================================================================
    // NATIVE-FEELING LIQUID GLASS PULL-TO-REFRESH
    // =========================================================================
    (function initPullToRefresh() {
      const indicator = document.getElementById('ptr-indicator');
      const pill = document.getElementById('ptr-pill');
      const icon = document.getElementById('ptr-icon');
      const text = document.getElementById('ptr-text');
      if (!indicator) return;

      let startY = 0;
      let pulling = false;
      let refreshing = false;
      let pullDist = 0;
      const THRESHOLD = 68;

      function resetPtr() {
        indicator.classList.remove('dragging');
        indicator.style.opacity = '0';
        indicator.style.transform = 'translate(-50%, -60px)';
        icon.classList.remove('ptr-spinning');
        icon.style.transform = 'rotate(0deg)';
        icon.textContent = '↓';
        pill.style.background = '';
        text.textContent = 'Pull to refresh';
        pulling = false;
        pullDist = 0;
      }

      window.addEventListener('touchstart', (e) => {
        if (refreshing || window.scrollY > 2) return;
        const modalOpen = !document.getElementById('modal-root').classList.contains('hidden');
        if (modalOpen) return;
        startY = e.touches[0].clientY;
        pulling = true;
        indicator.classList.add('dragging');
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!pulling || refreshing) return;
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0 || window.scrollY > 2) {
          pullDist = 0;
          indicator.style.opacity = '0';
          return;
        }
        // Smooth rubber-band damping
        pullDist = Math.min(115, dy * 0.52);
        const progress = Math.min(1, pullDist / THRESHOLD);
        indicator.style.opacity = String(Math.min(1, progress * 1.25));
        indicator.style.transform = `translate(-50%, ${Math.round(-20 + pullDist)}px)`;

        if (pullDist >= THRESHOLD) {
          icon.style.transform = 'rotate(180deg)';
          text.textContent = 'Release to refresh';
          pill.style.background = '#D5FF5F';
          pill.style.color = '#010101';
        } else {
          icon.style.transform = `rotate(${Math.round(progress * 150)}deg)`;
          text.textContent = 'Pull to refresh';
          pill.style.background = '';
          pill.style.color = '';
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        if (!pulling || refreshing) return;
        if (pullDist >= THRESHOLD) {
          refreshing = true;
          indicator.classList.remove('dragging');
          indicator.style.transform = 'translate(-50%, 64px)';
          indicator.style.opacity = '1';
          icon.textContent = '↻';
          icon.style.transform = '';
          icon.classList.add('ptr-spinning');
          pill.style.background = '';
          pill.style.color = '';
          text.textContent = 'Refreshing page...';

          setTimeout(() => {
            reloadLatestAppVersion();
          }, 250);
        } else {
          resetPtr();
        }
      }, { passive: true });
    })();

    // =========================================================================
    // NATIVE-FEELING MOBILE SWIPE GESTURES
    // 1. Swipe Session / Payment rows left or right for quick actions
    // 2. Swipe Schedule Day/Week/Month/Year left/right to step dates
    // 3. Swipe Mobile Drawer left to close
    // 4. Swipe Bottom-Sheet Modal down to dismiss
    // =========================================================================
    (function initMobileSwipeGestures() {
      const SWIPE_THRESHOLD = 72;
      const vibrateTap = () => { try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) {} };

      // 1. Swipe-Action Rows (Sessions & Payments)
      let rowCtx = null;
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        const row = e.target.closest?.('.swipe-row');
        if (!row) return;
        const card = row.querySelector('.swipe-card');
        if (!card) return;
        rowCtx = {
          row,
          card,
          railL: row.querySelector('.swipe-rail-left'),
          railR: row.querySelector('.swipe-rail-right'),
          x0: e.touches[0].clientX,
          y0: e.touches[0].clientY,
          dx: 0,
          locked: null
        };
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!rowCtx) return;
        const dx = e.touches[0].clientX - rowCtx.x0;
        const dy = e.touches[0].clientY - rowCtx.y0;
        if (!rowCtx.locked) {
          if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) {
            rowCtx = null;
            return;
          }
          if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.35) {
            rowCtx.locked = 'x';
            rowCtx.card.style.transition = 'none';
          } else {
            return;
          }
        }
        // Damped horizontal translation up to 112px
        const clamped = Math.max(-112, Math.min(112, dx * 0.78));
        rowCtx.dx = clamped;
        rowCtx.card.style.transform = `translateX(${Math.round(clamped)}px)`;
        if (rowCtx.railL) rowCtx.railL.style.opacity = clamped > 18 ? String(Math.min(1, clamped / SWIPE_THRESHOLD)) : '0';
        if (rowCtx.railR) rowCtx.railR.style.opacity = clamped < -18 ? String(Math.min(1, -clamped / SWIPE_THRESHOLD)) : '0';
      }, { passive: true });

      document.addEventListener('touchend', () => {
        if (!rowCtx) return;
        const { row, card, railL, railR, dx, locked } = rowCtx;
        rowCtx = null;
        if (locked !== 'x') return;
        card.style.transition = 'transform 0.25s cubic-bezier(0.22, 1, 0.36, 1)';
        card.style.transform = 'translateX(0px)';
        if (railL) railL.style.opacity = '0';
        if (railR) railR.style.opacity = '0';

        const type = row.dataset.swipeType;
        const id = row.dataset.swipeId;
        if (dx >= SWIPE_THRESHOLD) {
          vibrateTap();
          if (type === 'session') {
            const athId = row.dataset.athleteId;
            const canceled = row.dataset.canceled === '1';
            if (athId && !canceled) openSessionRecapModal(athId, id);
            else openManageSessionModal(id);
          } else if (type === 'payment') {
            const wasUnpaid = row.dataset.unpaid === '1';
            setPaymentPaidStatus(id, wasUnpaid);
          }
        } else if (dx <= -SWIPE_THRESHOLD) {
          vibrateTap();
          if (type === 'session') openManageSessionModal(id);
          else if (type === 'payment') deletePayment(id);
        }
      }, { passive: true });

      // 2. Swipe-Left to Close Mobile Drawer
      const drawer = document.getElementById('mobile-drawer');
      if (drawer) {
        let dCtx = null;
        drawer.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          const panel = drawer.firstElementChild;
          if (!panel) return;
          dCtx = { panel, x0: e.touches[0].clientX, y0: e.touches[0].clientY, dx: 0 };
        }, { passive: true });
        drawer.addEventListener('touchmove', (e) => {
          if (!dCtx) return;
          const dx = e.touches[0].clientX - dCtx.x0;
          const dy = e.touches[0].clientY - dCtx.y0;
          if (dx < -10 && Math.abs(dx) > Math.abs(dy)) {
            dCtx.dx = dx;
            dCtx.panel.style.transition = 'none';
            dCtx.panel.style.transform = `translateX(${Math.round(dx)}px)`;
          }
        }, { passive: true });
        drawer.addEventListener('touchend', () => {
          if (!dCtx) return;
          const { panel, dx } = dCtx;
          dCtx = null;
          panel.style.transition = 'transform 0.22s cubic-bezier(0.22, 1, 0.36, 1)';
          panel.style.transform = '';
          if (dx <= -60) {
            vibrateTap();
            closeMobileDrawer();
          }
        }, { passive: true });
      }

      // 3. Swipe-Down to Dismiss Bottom-Sheet Modals
      const modalRoot = document.getElementById('modal-root');
      if (modalRoot) {
        let mCtx = null;
        modalRoot.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          const sheet = modalRoot.firstElementChild;
          if (!sheet || sheet.scrollTop > 2) return;
          mCtx = { sheet, x0: e.touches[0].clientX, y0: e.touches[0].clientY, dy: 0 };
        }, { passive: true });
        modalRoot.addEventListener('touchmove', (e) => {
          if (!mCtx) return;
          const dx = e.touches[0].clientX - mCtx.x0;
          const dy = e.touches[0].clientY - mCtx.y0;
          if (dy > 10 && dy > Math.abs(dx) * 1.25 && mCtx.sheet.scrollTop <= 2) {
            mCtx.dy = dy;
            mCtx.sheet.style.transition = 'none';
            mCtx.sheet.style.transform = `translateY(${Math.round(dy * 0.72)}px)`;
          }
        }, { passive: true });
        modalRoot.addEventListener('touchend', () => {
          if (!mCtx) return;
          const { sheet, dy } = mCtx;
          mCtx = null;
          sheet.style.transition = 'transform 0.22s cubic-bezier(0.22, 1, 0.36, 1)';
          sheet.style.transform = '';
          if (dy >= 95) {
            vibrateTap();
            closeModal();
          }
        }, { passive: true });
      }

      // 4. Swipe Left / Right on Coach Schedule to step Day / Week / Month / Year
      let schedCtx = null;
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        if (state.role !== 'coach' || state.coachTab !== 'schedule') return;
        const modalOpen = !document.getElementById('modal-root')?.classList.contains('hidden');
        if (modalOpen) return;
        if (e.target.closest?.('.swipe-row, .overflow-x-auto, input, select, textarea')) return;
        schedCtx = { x0: e.touches[0].clientX, y0: e.touches[0].clientY };
      }, { passive: true });
      document.addEventListener('touchend', (e) => {
        if (!schedCtx || !e.changedTouches?.length) return;
        const dx = e.changedTouches[0].clientX - schedCtx.x0;
        const dy = e.changedTouches[0].clientY - schedCtx.y0;
        schedCtx = null;
        if (Math.abs(dx) >= 75 && Math.abs(dx) > Math.abs(dy) * 1.6) {
          vibrateTap();
          scheduleStep(dx < 0 ? 1 : -1);
        }
      }, { passive: true });
    })();
  </script>
</body>
