    }

    // =========================================================================
    // ACTIONS
    // =========================================================================
    function completeSession(id) { const s = state.sessions.find(x => x.id === id); if (s) s.status = 'Completed'; render(); showToast('Session checked in!'); }
    function cancelSessionParent(id) { const s = state.sessions.find(x => x.id === id); if (s) s.status = 'Canceled'; state.athletes.filter(a => a.familyId === 'fam-1').forEach(a => a.credits += 1); render(); showToast('Session canceled (>24h notice — no fee).'); }
    function notifyWaitlist(id) { state.waitlist.find(x => x.id === id).status = 'Notified'; render(); showToast('Waitlist SMS sent!'); }
    function jumpToAthlete(id) { state.selectedAthleteId = id; state.coachTab = 'athletes'; render(); }
    function toggleDrill(a, d) { const dr = state.athletes.find(x => x.id === a).drills.find(x => x.id === d); dr.done = !dr.done; render(); showToast(dr.done ? 'Drill completed!' : 'Drill unchecked.'); }
    function markVideoReviewed(id) { state.videos.find(x => x.id === id).status = 'Reviewed'; render(); showToast('Marked reviewed & notified parent!'); }
    function addVideoCue(e, id) { e.preventDefault(); state.videos.find(x => x.id === id).cues.push({ time: e.target.time.value, pct: 60, note: e.target.note.value }); render(); showToast('Cue added!'); }
    function openThread(id) { state.activeThreadId = id; state.threads.find(x => x.id === id).unread = 0; render(); }
    function sendCoachReply(e, id) { e.preventDefault(); state.threads.find(x => x.id === id).messages.push({ from: 'coach', time: 'Just now', text: e.target.text.value }); render(); }
    function bookSlot(slotId, payMode) {
      const slot = state.openSlots.find(s => s.id === slotId), ath = state.athletes.find(a => a.id === state.activeSiblingId);
      if (payMode === 'credit') state.athletes.filter(a => a.familyId === 'fam-1').forEach(a => a.credits = Math.max(0, a.credits - 1));
      else state.payments.unshift({ id: 'p' + Date.now(), date: 'Today', family: 'Miller Family', item: slot.focus, amount: slot.price, method: 'Clover • Apple Pay' });
      state.sessions.unshift({ id: 's' + Date.now(), dayKey: slot.dayKey, day: slot.day, time: slot.time, duration: slot.duration, type: slot.type, focus: slot.focus, athletes: [ath.name], athleteId: ath.id, spotsMax: slot.spotsMax, status: 'Confirmed', payment: payMode === 'credit' ? '1 Credit' : `Paid ($${slot.price})`, price: slot.price, img: slot.img });
      state.parentTab = 'home'; render(); showToast(`Booked ${slot.focus}!`);
    }
    function buyPackage(c, p, method = 'clover') {
      const isCash = method === 'cash';
      state.athletes.filter(a => a.familyId === 'fam-1').forEach(a => a.credits += c);
      state.payments.unshift({
        id: 'p' + Date.now(),
        date: 'Today',
        family: 'Miller Family',
        item: `${c}-Lesson Pack`,
        amount: p,
        method: isCash ? 'Cash (Due at Facility)' : 'Clover • Card / Apple Pay',
        status: isCash ? 'Pending Cash' : 'Paid'
      });
      render();
      showToast(isCash ? `Reserved ${c}-Pack ($${p} cash due at facility)!` : `Paid $${p} via Clover — added ${c} credits!`);
    }
    function markCashPaid(payId) {
      const p = state.payments.find(x => x.id === payId);
      if (!p) return;
      p.status = 'Paid';
      p.method = 'Cash (Collected ✓)';
      render();
      showToast(`Marked $${p.amount} cash collected from ${p.family}!`);
    }
    function uploadParentVideo(e, athId) { e.preventDefault(); const ath = state.athletes.find(a => a.id === athId); state.videos.unshift({ id: 'v' + Date.now(), athleteId: ath.id, athleteName: ath.name, title: e.target.title.value, uploadedAt: 'Just now', status: 'Needs Review', img: 'assets/images/fastpitch-fielding.jpg', cues: [] }); render(); showToast('Clip uploaded!'); }
    function saveParentProfile(e, athId) { e.preventDefault(); const ath = state.athletes.find(a => a.id === athId); ath.emergencyContact = e.target.emergency.value; ath.medicalNotes = e.target.medical.value; ath.waiverSigned = true; ath.waiverDate = 'Today'; render(); showToast('Profile & waiver saved!'); }
    function openAddSessionModal() { openModal(`<div class="flex justify-between"><h3 class="font-extrabold text-sm">New Session</h3><button onclick="closeModal()" class="text-xs">✕</button></div><form onsubmit="event.preventDefault(); closeModal(); showToast('Session added!');" class="space-y-3 text-xs"><input class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" placeholder="Session focus..." required /><button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold">Save to Schedule</button></form>`); }
    function openWeatherModal() { openModal(`<div class="flex justify-between"><h3 class="font-extrabold text-sm">SMS / Weather Broadcast</h3><button onclick="closeModal()" class="text-xs">✕</button></div><form onsubmit="event.preventDefault(); closeModal(); showToast('SMS Broadcast sent!');" class="space-y-3 text-xs"><textarea rows="3" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" placeholder="Message all booked families..." required></textarea><button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold">Send Broadcast</button></form>`); }
    function openAddMetricModal(id) { openModal(`<div class="flex justify-between"><h3 class="font-extrabold text-sm">Log Performance PR</h3><button onclick="closeModal()" class="text-xs">✕</button></div><form onsubmit="event.preventDefault(); state.athletes.find(x=>x.id==='${id}').primaryMetricValue=this.v.value; closeModal(); render(); showToast('PR saved!');" class="space-y-3 text-xs"><input name="v" placeholder="e.g., 59.5" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" required /><button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold">Save PR</button></form>`); }
    function openAddDrillModal(id) { openModal(`<div class="flex justify-between"><h3 class="font-extrabold text-sm">Assign Homework Drill</h3><button onclick="closeModal()" class="text-xs">✕</button></div><form onsubmit="event.preventDefault(); state.athletes.find(x=>x.id==='${id}').drills.unshift({id:'d'+Date.now(),title:this.t.value,reps:'25 reps',focus:'Mechanics',done:false,img:'assets/images/fastpitch-fielding.jpg'}); closeModal(); render(); showToast('Drill assigned!');" class="space-y-3 text-xs"><input name="t" placeholder="Drill title..." class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" required /><button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold">Assign Drill</button></form>`); }
    function openLogPaymentModal() {
      openModal(`
        <div class="flex justify-between items-center"><h3 class="font-extrabold text-sm">Log Cash / Clover / Manual Payment</h3><button onclick="closeModal()" class="text-xs font-bold cursor-pointer">✕</button></div>
        <form onsubmit="event.preventDefault(); state.payments.unshift({id:'p'+Date.now(),date:'Today',family:this.f.value,item:this.item.value,amount:Number(this.amt.value),method:this.m.value,status:'Paid'}); closeModal(); render(); showToast('Payment recorded!');" class="space-y-3 text-xs">
          <input name="f" value="Vance Family" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" placeholder="Family name" required />
          <input name="item" value="1-on-1 Hitting Lesson" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" placeholder="Item" required />
          <div class="grid grid-cols-2 gap-2">
            <input name="amt" type="number" value="350" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" required />
            <select name="m" class="w-full px-3 py-2.5 rounded-2xl surface-soft font-semibold">
              <option>Cash (Collected ✓)</option>
              <option>Clover • Terminal Tap</option>
              <option>Venmo (Logged)</option>
              <option>Zelle (Logged)</option>
            </select>
          </div>
          <button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold cursor-pointer">Record Payment</button>
        </form>
      `);
    }

    function render() {
      renderChrome();
      const root = document.getElementById('app-root');
      if (state.role === 'coach') {
        if (state.coachTab === 'today') root.innerHTML = renderCoachToday();
        else if (state.coachTab === 'athletes') root.innerHTML = renderCoachAthletes();
        else if (state.coachTab === 'video') root.innerHTML = renderCoachVideo();
        else if (state.coachTab === 'payments') root.innerHTML = renderCoachPayments();
        else if (state.coachTab === 'messaging') root.innerHTML = renderCoachMessaging();
      } else {
        if (state.parentTab === 'home') root.innerHTML = renderParentHome();
        else if (state.parentTab === 'book') root.innerHTML = renderParentBook();
        else if (state.parentTab === 'packages') root.innerHTML = renderParentPackages();
        else if (state.parentTab === 'video') root.innerHTML = renderParentVideo();
        else if (state.parentTab === 'waiver') root.innerHTML = renderParentWaiver();
        else if (state.parentTab === 'profile') root.innerHTML = renderAthleteProfile();
      }
    }
    render();

    // =========================================================================
    // NATIVE-FEELING LIQUID GLASS PULL-TO-REFRESH
    // =========================================================================
    (function initPullToRefresh() {
      const indicator = document.getElementById('ptr-indicator');
      const pill = document.getElementById('ptr-pill');
      const icon = document.getElementById('ptr-icon');
      const text = document.getElementById('ptr-text');
      if (!indicator) return;

      let startY = 0;
      let pulling = false;
      let refreshing = false;
      let pullDist = 0;
      const THRESHOLD = 68;

      function resetPtr() {
        indicator.classList.remove('dragging');
        indicator.style.opacity = '0';
        indicator.style.transform = 'translate(-50%, -60px)';
        icon.classList.remove('ptr-spinning');
        icon.style.transform = 'rotate(0deg)';
        icon.textContent = '↓';
        pill.style.background = '';
        text.textContent = 'Pull to refresh';
        pulling = false;
        pullDist = 0;
      }

      window.addEventListener('touchstart', (e) => {
        if (refreshing || window.scrollY > 2) return;
        const modalOpen = !document.getElementById('modal-root').classList.contains('hidden');
        if (modalOpen) return;
        startY = e.touches[0].clientY;
        pulling = true;
        indicator.classList.add('dragging');
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!pulling || refreshing) return;
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0 || window.scrollY > 2) {
          pullDist = 0;
          indicator.style.opacity = '0';
          return;
        }
        // Smooth rubber-band damping
        pullDist = Math.min(115, dy * 0.52);
        const progress = Math.min(1, pullDist / THRESHOLD);
        indicator.style.opacity = String(Math.min(1, progress * 1.25));
        indicator.style.transform = `translate(-50%, ${Math.round(-20 + pullDist)}px)`;

        if (pullDist >= THRESHOLD) {
          icon.style.transform = 'rotate(180deg)';
          text.textContent = 'Release to refresh';
          pill.style.background = '#D5FF5F';
          pill.style.color = '#010101';
        } else {
          icon.style.transform = `rotate(${Math.round(progress * 150)}deg)`;
          text.textContent = 'Pull to refresh';
          pill.style.background = '';
          pill.style.color = '';
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        if (!pulling || refreshing) return;
        if (pullDist >= THRESHOLD) {
          refreshing = true;
          indicator.classList.remove('dragging');
          indicator.style.transform = 'translate(-50%, 64px)';
          indicator.style.opacity = '1';
          icon.textContent = '↻';
          icon.style.transform = '';
          icon.classList.add('ptr-spinning');
          pill.style.background = '';
          pill.style.color = '';
          text.textContent = 'Syncing live data...';

          setTimeout(() => {
            render();
            refreshing = false;
            resetPtr();
            showToast('✓ Synced schedule, recaps & payments!');
          }, 650);
        } else {
          resetPtr();
        }
      }, { passive: true });
    })();
  </script>
