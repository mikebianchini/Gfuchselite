  <title>Gina Fuchs Elite Fastpitch — Training App</title>
  <meta name="description" content="Personal fastpitch training app for Gina Fuchs Elite Fastpitch: Peloton-inspired drill workouts, live booking, velocity tracking, video mechanics, packages & waivers." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      /* Exact Brand System */
      --volt: #D5FF5F;
      --obsidian: #010101;
      --mist: #D6DFE2;
      --white: #FFFFFF;
      --slate-blue: #4E6075;
      --sky-blue: #9AC0D6;
      --charcoal: #595959;
      --mid-gray: #9F9F9F;

      /* Apple Liquid Glass — Light Mode */
      --bg-page: #DDE6EA;
      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.42) 100%);
      --glass-mist: linear-gradient(135deg, rgba(214, 223, 226, 0.76) 0%, rgba(154, 192, 214, 0.34) 100%);
      --glass-soft: rgba(255, 255, 255, 0.48);
      --glass-dock: linear-gradient(180deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.56) 100%);
      --glass-border: rgba(255, 255, 255, 0.78);
      --glass-border-outer: rgba(78, 96, 117, 0.14);
      --glass-specular: inset 0 1.5px 1px rgba(255, 255, 255, 0.92), inset 0 -1px 1px rgba(78, 96, 117, 0.08);
      --glass-shadow: 0 14px 36px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(15, 23, 42, 0.04);
      --border-subtle: rgba(78, 96, 117, 0.16);
      --text-main: #010101;
      --text-muted: #595959;
      --text-soft: #7A8694;
      --bg-card: rgba(255, 255, 255, 0.72);
      --bg-elevated: rgba(255, 255, 255, 0.52);
    }

    html.dark {
      /* Apple Liquid Glass — Dark Mode */
      --bg-page: #07090C;
      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.04) 100%);
      --glass-mist: linear-gradient(135deg, rgba(78, 96, 117, 0.34) 0%, rgba(154, 192, 214, 0.12) 100%);
      --glass-soft: rgba(255, 255, 255, 0.07);
      --glass-dock: linear-gradient(180deg, rgba(28, 34, 42, 0.76) 0%, rgba(16, 20, 25, 0.64) 100%);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-border-outer: rgba(255, 255, 255, 0.10);
      --glass-specular: inset 0 1px 1px rgba(255, 255, 255, 0.28), inset 0 -1px 1px rgba(0, 0, 0, 0.35);
      --glass-shadow: 0 18px 44px rgba(0, 0, 0, 0.48), 0 2px 10px rgba(0, 0, 0, 0.32);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --text-main: #FFFFFF;
      --text-muted: #B4BCC4;
      --text-soft: #7E8791;
      --bg-card: rgba(20, 25, 31, 0.76);
      --bg-elevated: rgba(255, 255, 255, 0.08);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Ambient Luminous Mesh Behind Liquid Glass */
    .liquid-ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .liquid-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(80px);
      opacity: 0.62;
    }
    html.dark .liquid-orb { opacity: 0.32; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* True Multi-Layered Apple Liquid Glass Materials */
    .card-white {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(195%);
      -webkit-backdrop-filter: blur(28px) saturate(195%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), var(--glass-shadow);
    }

    .card-mist {
      background: var(--glass-mist);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), var(--glass-shadow);
    }

    .surface-soft {
      background: var(--glass-soft);
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }
    html.dark .surface-soft {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .glass-dock {
      background: var(--glass-dock);
      backdrop-filter: blur(36px) saturate(220%);
      -webkit-backdrop-filter: blur(36px) saturate(220%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), 0 16px 42px rgba(1, 1, 1, 0.16);
    }

    .glass-pill-hero {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .modal-backdrop {
      background: rgba(7, 10, 14, 0.45);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
    }
  </style>
</head>

    // =========================================================================
    // CAL.COM-STYLE BOOKING ENGINE (3-Column Calendar + Slots + Details + .ICS)
    // =========================================================================
    function calFormatTime(hhmm) {
      if (state.cal.timeFormat === '24h') return hhmm;
      const [hStr, m] = hhmm.split(':');
      const h = parseInt(hStr, 10);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${h12}:${m} ${ampm}`;
    }

    function calDateLabel(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function calGetSlotsForDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const dow = dt.getDay(); // 0=Sun..6=Sat
      if (!state.cal.availability.days.includes(dow)) return [];
      const evt = state.cal.eventTypes.find(e => e.id === state.cal.eventTypeId) || state.cal.eventTypes[0];
      if (evt.id === 'evt-clinic') {
        return dow === 6 ? ['09:00'] : [];
      }
      const base = dow === 6 ? state.cal.availability.saturdaySlots : state.cal.availability.weekdaySlots;
      return base.filter(t => !state.cal.bookedSlots.includes(`${iso}@${t}`));
    }

    function calChangeMonth(delta) {
      state.cal.month += delta;
      if (state.cal.month > 11) { state.cal.month = 0; state.cal.year += 1; }
      if (state.cal.month < 0) { state.cal.month = 11; state.cal.year -= 1; }
      render();
    }

    function calSelectEvent(id) {
      state.cal.eventTypeId = id;
      state.cal.step = 'calendar';
      state.cal.selectedTime = null;
      const evt = state.cal.eventTypes.find(e => e.id === id);
      const ath = state.athletes.find(a => a.id === state.activeSiblingId);
      state.cal.payMode = (evt?.allowCredit && ath?.credits > 0) ? 'credit' : 'card';
      if (id === 'evt-clinic') state.cal.selectedDate = '2026-11-28';
      render();
    }

    function calSelectDate(iso) {
      state.cal.selectedDate = iso;
      state.cal.selectedTime = null;
      render();
    }

    function calConfirmBooking(e) {
      e.preventDefault();
      const evt = state.cal.eventTypes.find(x => x.id === state.cal.eventTypeId);
      const ath = state.athletes.find(x => x.id === state.activeSiblingId);
      const focusNote = e.target.notes.value.trim();
      const payMode = state.cal.payMode;
      const iso = state.cal.selectedDate;
      const time24 = state.cal.selectedTime;
      const timeDisplay = calFormatTime(time24);
      const dayNice = calDateLabel(iso);

      // Conflict protection: mark slot booked so it cannot be double-booked
      state.cal.bookedSlots.push(`${iso}@${time24}`);

      if (payMode === 'credit' && evt.allowCredit && ath.credits > 0) {
        state.athletes.filter(a => a.familyId === 'fam-1').forEach(a => a.credits = Math.max(0, a.credits - 1));
      } else {
        state.payments.unshift({
          id: 'pay-' + Date.now(),
          date: 'Today',
          family: 'Miller Family',
          item: `${evt.title} (${dayNice})`,
          amount: evt.price,
          method: 'Stripe • Apple Pay'
        });
      }

      const dayParts = dayNice.split(', ');
      const shortDayKey = dayParts[0] + ' ' + iso.split('-')[2].replace(/^0/, '');
      state.sessions.unshift({
        id: 'ses-' + Date.now(),
        dayKey: shortDayKey,
        day: dayNice,
        time: timeDisplay,
        duration: evt.durationLabel.toUpperCase(),
        type: evt.type,
        focus: focusNote ? `${evt.title} — ${focusNote}` : evt.title,
        athletes: [ath.name],
        athleteId: ath.id,
        spotsMax: evt.type === '1-on-1 Private' ? 1 : 6,
        status: 'Confirmed',
        payment: payMode === 'credit' && evt.allowCredit ? '1 Credit' : `Stripe Paid ($${evt.price})`,
        price: evt.price,
        img: evt.img
      });

      state.cal.lastBooking = {
        evt,
        athName: ath.name,
        parentName: e.target.parentName.value,
        email: e.target.email.value,
        phone: e.target.phone.value,
        notes: focusNote,
        iso,
        dayNice,
        time24,
        timeDisplay,
        payLabel: payMode === 'credit' && evt.allowCredit ? '1 Package Credit' : `$${evt.price} (Stripe)`
      };
      state.cal.step = 'confirmed';
      render();
      showToast(`Confirmed ${evt.title} for ${dayNice} at ${timeDisplay}!`);
    }

    function downloadIcs() {
      const b = state.cal.lastBooking;
      if (!b) return;
      const dtStart = b.iso.replace(/-/g, '') + 'T' + b.time24.replace(':', '') + '00';
      const [h, m] = b.time24.split(':').map(Number);
      const endMins = h * 60 + m + b.evt.duration;
      const eh = String(Math.floor(endMins / 60)).padStart(2, '0');
      const em = String(endMins % 60).padStart(2, '0');
      const dtEnd = b.iso.replace(/-/g, '') + 'T' + eh + em + '00';
      const ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Gina Fuchs Elite Fastpitch//Booking//EN',
        'BEGIN:VEVENT',
        `DTSTART:${dtStart}`,
        `DTEND:${dtEnd}`,
        `SUMMARY:${b.evt.title} — ${b.athName} w/ Coach Gina`,
        `LOCATION:${b.evt.location}`,
        `DESCRIPTION:Athlete: ${b.athName}\\nNotes: ${b.notes || 'Fastpitch training session'}\\n24-hour cancellation policy applies.`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gina-fuchs-${b.evt.slug}-${b.iso}.ics`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Calendar invite (.ics) downloaded!');
    }

    function copyCalLink(slug = '') {
      const url = `https://mikebianchini.github.io/Gfuchselite/#book/${slug}`;
      if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
      showToast(`Copied booking link: ${url}`);
    }

      if (state.cal.step === 'confirmed' && state.cal.lastBooking) {

        return `

              <div class="flex justify-between gap-2"><span class="text-[var(--text-muted)] font-semibold">Athlete</span><span class="font-extrabold text-right">${b.athName}</span></div>

            <button onclick="setTab('home')" class="text-xs font-bold text-[#4E6075] dark:text-[#9AC0D6] hover:underline cursor-pointer">← Back to Training Hub</button>

      // Event Type Pill Strip (Cal.com Event Types)
      const eventStrip = `

            const active = t.id === evt.id;
            return `
              <button onclick="calSelectEvent('${t.id}')" class="text-left p-4 rounded-[24px] transition cursor-pointer ${active ? 'bg-[#010101] text-white shadow-xl' : 'card-white hover:-translate-y-0.5'}">
                <div class="flex items-center justify-between gap-2">
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${active ? 'bg-[#D5FF5F] text-[#010101]' : 'surface-soft'}">${t.durationLabel}</span>
                  <span class="text-xs font-extrabold tabular-nums">${t.allowCredit ? `$${t.price} / 1 cr` : `$${t.price}`}</span>
                </div>
                <div class="font-extrabold text-sm mt-2">${t.title}</div>
                <div class="text-[11px] mt-0.5 ${active ? 'text-[#D6DFE2]' : 'text-[var(--text-muted)]'}">${t.type}</div>
              </button>
            `;
          }).join('')}

      // STEP 2: DETAILS & PAYMENT FORM
      if (state.cal.step === 'details' && state.cal.selectedTime) {
        const canCredit = evt.allowCredit && ath.credits > 0;
        return `

              <div class="flex items-center gap-3">

                <div class="flex items-center gap-2"><span>📍</span><span>${evt.location}</span></div>

            <!-- Right Form -->
            <form onsubmit="calConfirmBooking(event)" class="lg:col-span-7 p-6 space-y-4 text-xs">
              <h2 class="text-lg font-extrabold tracking-tight">Confirm your booking</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-[var(--text-muted)] font-bold mb-1">Parent / Guardian Name *</label>
                  <input name="parentName" value="${ath.parentName}" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" required />

                <div>
                  <label class="block text-[var(--text-muted)] font-bold mb-1">Athlete</label>
                  <input value="${ath.name} (${ath.ageGroup})" readonly class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold opacity-80" />
                </div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-[var(--text-muted)] font-bold mb-1">Email for Calendar Invite *</label>
                  <input name="email" type="email" value="sarah.miller@example.com" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" required />
                </div>
                <div>
                  <label class="block text-[var(--text-muted)] font-bold mb-1">Mobile Phone (SMS Reminders) *</label>
                  <input name="phone" value="${ath.parentPhone}" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft font-semibold" required />
                </div>
              </div>
              <div>
                <label class="block text-[var(--text-muted)] font-bold mb-1">What should Coach Gina focus on? (Optional)</label>
                <textarea name="notes" rows="2" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" placeholder="e.g., Flip changeup grip, inside pitch mechanics, pre-tournament tune-up..."></textarea>
              </div>
              <div>
                <label class="block text-[var(--text-muted)] font-bold mb-1.5">Payment Method</label>
                <div class="grid grid-cols-2 gap-2.5">
                  ${canCredit ? `
                    <button type="button" onclick="state.cal.payMode='credit'; render();" class="p-3 rounded-2xl border text-left cursor-pointer transition ${state.cal.payMode === 'credit' ? 'bg-[#010101] text-[#D5FF5F] border-[#010101]' : 'surface-soft'}">
                      <div class="font-extrabold">Use 1 Credit</div>
                      <div class="text-[11px] opacity-80">${ath.credits} credits available</div>
                    </button>
                  ` : ''}
                  <button type="button" onclick="state.cal.payMode='card'; render();" class="p-3 rounded-2xl border text-left cursor-pointer transition ${state.cal.payMode === 'card' || !canCredit ? 'bg-[#010101] text-[#D5FF5F] border-[#010101]' : 'surface-soft'}">
                    <div class="font-extrabold">Pay $${evt.price}</div>
                    <div class="text-[11px] opacity-80">Stripe • Card / Apple Pay</div>
                  </button>
                </div>
              </div>
              <label class="flex items-center gap-2 cursor-pointer pt-1">
                <input type="checkbox" checked required class="w-4 h-4 accent-[#010101]" />
                <span class="text-[11px] text-[var(--text-muted)]">I agree to the 24-hour reschedule &amp; cancellation policy.</span>
              </label>
              <button type="submit" class="w-full py-3.5 rounded-2xl bg-[#D5FF5F] text-[#010101] text-sm font-extrabold cursor-pointer shadow-lg hover:brightness-95 transition">
                Confirm Booking →
              </button>
            </form>
          </div>
        `;
      }

      // STEP 1: CLASSIC CAL.COM 3-COLUMN SCHEDULER
      const year = state.cal.year;
      const month = state.cal.month;
      const monthName = new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const availableSlots = calGetSlotsForDate(state.cal.selectedDate);

      let calendarCells = '';
      for (let i = 0; i < firstDow; i++) calendarCells += `<div></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isPast = (year === 2026 && month === 10 && day < 26);
        const slots = isPast ? [] : calGetSlotsForDate(iso);
        const hasSlots = slots.length > 0;
        const isSelected = iso === state.cal.selectedDate;
        calendarCells += `
          <button ${!hasSlots ? 'disabled' : `onclick="calSelectDate('${iso}')"`} class="aspect-square rounded-2xl flex flex-col items-center justify-center text-xs font-extrabold transition ${
            isSelected
              ? 'bg-[#010101] text-[#D5FF5F] shadow-md cursor-pointer'
              : hasSlots
                ? 'surface-soft hover:bg-[#D5FF5F] hover:text-[#010101] cursor-pointer'
                : 'opacity-30 cursor-not-allowed'
          }">
            <span>${day}</span>
            ${hasSlots ? `<span class="w-1 h-1 rounded-full mt-0.5 ${isSelected ? 'bg-[#D5FF5F]' : 'bg-[#4E6075] dark:bg-[#9AC0D6]'}"></span>` : ''}
          </button>
        `;
      }

      return `

        ${eventStrip}

        <!-- Cal.com 3-Column Liquid Glass Booking Card -->
        <div class="card-white rounded-[32px] overflow-hidden grid grid-cols-1 lg:grid-cols-12">
          <!-- Col 1: Event Details & Timezone -->
          <div class="lg:col-span-4 card-mist p-5 sm:p-6 flex flex-col justify-between gap-5">
            <div class="space-y-4">
              <div class="flex items-center gap-3">

                <div class="flex items-center gap-2"><span>📍</span><span>${evt.location}</span></div>
                <div class="flex items-center gap-2"><span>💳</span><span>$${evt.price} ${evt.allowCredit ? 'or 1 Package Credit' : 'Flat Fee'}</span></div>
              </div>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-[var(--text-muted)] mb-1">Timezone</label>
              <select onchange="state.cal.timezone=this.value; render();" class="w-full px-3 py-2 rounded-xl surface-soft text-xs font-bold cursor-pointer">
                <option value="America/Los_Angeles" ${state.cal.timezone === 'America/Los_Angeles' ? 'selected' : ''}>🌎 America/Los Angeles (PST)</option>
                <option value="America/Denver" ${state.cal.timezone === 'America/Denver' ? 'selected' : ''}>🌎 America/Denver (MST)</option>
                <option value="America/Chicago" ${state.cal.timezone === 'America/Chicago' ? 'selected' : ''}>🌎 America/Chicago (CST)</option>
                <option value="America/New_York" ${state.cal.timezone === 'America/New_York' ? 'selected' : ''}>🌎 America/New York (EST)</option>
              </select>
            </div>
          </div>

          <!-- Col 2: Interactive Month Calendar -->
          <div class="lg:col-span-5 p-5 sm:p-6 border-b lg:border-b-0 lg:border-r border-[var(--border-subtle)] space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="font-extrabold text-sm">${monthName}</h2>

            <div class="grid grid-cols-7 gap-1.5">
              ${calendarCells}

          <!-- Col 3: Time Slots + 12h/24h Toggle -->
          <div class="lg:col-span-3 p-5 sm:p-6 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div class="font-extrabold text-sm">${calDateLabel(state.cal.selectedDate)}</div>

                <button onclick="state.cal.timeFormat='12h'; render();" class="px-2 py-0.5 rounded-full cursor-pointer ${state.cal.timeFormat === '12h' ? 'bg-[#010101] text-[#D5FF5F]' : 'text-[var(--text-muted)]'}">12h</button>
                <button onclick="state.cal.timeFormat='24h'; render();" class="px-2 py-0.5 rounded-full cursor-pointer ${state.cal.timeFormat === '24h' ? 'bg-[#010101] text-[#D5FF5F]' : 'text-[var(--text-muted)]'}">24h</button>

            </div>
          </div>
        </div>
      `;
    }

    function openAvailabilityModal() {
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      openModal(`
        <div class="flex items-center justify-between">
          <div>
            <h3 class="font-extrabold text-sm">Coach Gina’s Cal.com Availability</h3>
            <p class="text-[11px] text-[var(--text-muted)]">Changes update the Athlete Booking Calendar live</p>

          <button onclick="closeModal()" class="text-xs font-bold cursor-pointer">✕</button>
        </div>

    function renderCoachMessaging() {
      const thread = state.threads.find(t => t.id === state.activeThreadId) || state.threads[0];
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="space-y-3">
            ${state.threads.map(t => `<button onclick="openThread('${t.id}')" class="w-full text-left p-4 rounded-[24px] border cursor-pointer ${t.id === thread.id ? 'bg-[#010101] text-white border-[#010101]' : 'card-white'}"><div class="font-extrabold text-xs">${t.parent}</div><div class="text-xs opacity-70">${t.athletes}</div></button>`).join('')}
            <div class="card-mist rounded-[24px] p-4 space-y-2">
              <div class="text-xs font-extrabold">Waiver Status</div>
              ${state.athletes.map(a => `<div class="flex justify-between text-xs"><span>${a.name}</span><span class="font-extrabold">${a.waiverSigned ? 'Signed ✓' : 'Pending'}</span></div>`).join('')}
            </div>
          </div>
          <div class="lg:col-span-2 card-white rounded-[28px] p-5 space-y-4">
            <div class="space-y-2.5">${thread.messages.map(m => `<div class="flex ${m.from === 'coach' ? 'justify-end' : 'justify-start'}"><div class="max-w-md px-4 py-3 rounded-2xl text-xs ${m.from === 'coach' ? 'bg-[#D5FF5F] text-[#010101] font-bold' : 'surface-soft'}">${m.text}</div></div>`).join('')}</div>
            <form onsubmit="sendCoachReply(event,'${thread.id}')" class="flex gap-2"><input name="text" class="flex-1 px-4 py-2.5 rounded-2xl surface-soft text-xs" placeholder="Reply to ${thread.parent}..." required /><button type="submit" class="px-5 py-2.5 rounded-2xl bg-[#010101] text-[#D5FF5F] text-xs font-extrabold cursor-pointer">Send</button></form>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // ACTIONS
    // =========================================================================
    function completeSession(id) { const s = state.sessions.find(x => x.id === id); if (s) s.status = 'Completed'; render(); showToast('Session checked in!'); }
    function cancelSessionParent(id) { const s = state.sessions.find(x => x.id === id); if (s) s.status = 'Canceled'; state.athletes.filter(a => a.familyId === 'fam-1').forEach(a => a.credits += 1); render(); showToast('Canceled (>24h) — 1 credit returned!'); }
    function notifyWaitlist(id) { state.waitlist.find(x => x.id === id).status = 'Notified'; render(); showToast('Waitlist SMS sent!'); }
    function jumpToAthlete(id) { state.selectedAthleteId = id; state.coachTab = 'athletes'; render(); }
    function toggleDrill(a, d) { const dr = state.athletes.find(x => x.id === a).drills.find(x => x.id === d); dr.done = !dr.done; render(); showToast(dr.done ? 'Drill completed!' : 'Drill unchecked.'); }
    function markVideoReviewed(id) { state.videos.find(x => x.id === id).status = 'Reviewed'; render(); showToast('Marked reviewed & notified parent!'); }
    function addVideoCue(e, id) { e.preventDefault(); state.videos.find(x => x.id === id).cues.push({ time: e.target.time.value, pct: 60, note: e.target.note.value }); render(); showToast('Cue added!'); }
    function openThread(id) { state.activeThreadId = id; state.threads.find(x => x.id === id).unread = 0; render(); }
    function sendCoachReply(e, id) { e.preventDefault(); state.threads.find(x => x.id === id).messages.push({ from: 'coach', time: 'Just now', text: e.target.text.value }); render(); }
    function bookSlot(slotId, payMode) {
      const slot = state.openSlots.find(s => s.id === slotId), ath = state.athletes.find(a => a.id === state.activeSiblingId);
      if (payMode === 'credit') state.athletes.filter(a => a.familyId === 'fam-1').forEach(a => a.credits = Math.max(0, a.credits - 1));
      else state.payments.unshift({ id: 'p' + Date.now(), date: 'Today', family: 'Miller Family', item: slot.focus, amount: slot.price, method: 'Stripe • Apple Pay' });
      state.sessions.unshift({ id: 's' + Date.now(), dayKey: slot.dayKey, day: slot.day, time: slot.time, duration: slot.duration, type: slot.type, focus: slot.focus, athletes: [ath.name], athleteId: ath.id, spotsMax: slot.spotsMax, status: 'Confirmed', payment: payMode === 'credit' ? '1 Credit' : `Paid ($${slot.price})`, price: slot.price, img: slot.img });
      state.parentTab = 'home'; render(); showToast(`Booked ${slot.focus}!`);
    }
    function buyPackage(c, p) { state.athletes.filter(a => a.familyId === 'fam-1').forEach(a => a.credits += c); state.payments.unshift({ id: 'p' + Date.now(), date: 'Today', family: 'Miller Family', item: `${c}-Lesson Pack`, amount: p, method: 'Stripe • Apple Pay' }); render(); showToast(`Added ${c} credits!`); }
    function uploadParentVideo(e, athId) { e.preventDefault(); const ath = state.athletes.find(a => a.id === athId); state.videos.unshift({ id: 'v' + Date.now(), athleteId: ath.id, athleteName: ath.name, title: e.target.title.value, uploadedAt: 'Just now', status: 'Needs Review', img: 'assets/images/fastpitch-pitcher.jpg', cues: [] }); render(); showToast('Clip uploaded!'); }
    function saveParentProfile(e, athId) { e.preventDefault(); const ath = state.athletes.find(a => a.id === athId); ath.emergencyContact = e.target.emergency.value; ath.medicalNotes = e.target.medical.value; ath.waiverSigned = true; ath.waiverDate = 'Today'; render(); showToast('Profile & waiver saved!'); }
    function openAddSessionModal() { openModal(`<div class="flex justify-between"><h3 class="font-extrabold text-sm">New Session</h3><button onclick="closeModal()" class="text-xs">✕</button></div><form onsubmit="event.preventDefault(); closeModal(); showToast('Session added!');" class="space-y-3 text-xs"><input class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" placeholder="Session focus..." required /><button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold">Save to Schedule</button></form>`); }
    function openWeatherModal() { openModal(`<div class="flex justify-between"><h3 class="font-extrabold text-sm">SMS / Weather Broadcast</h3><button onclick="closeModal()" class="text-xs">✕</button></div><form onsubmit="event.preventDefault(); closeModal(); showToast('SMS Broadcast sent!');" class="space-y-3 text-xs"><textarea rows="3" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" placeholder="Message all booked families..." required></textarea><button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold">Send Broadcast</button></form>`); }
    function openAddMetricModal(id) { openModal(`<div class="flex justify-between"><h3 class="font-extrabold text-sm">Log Performance PR</h3><button onclick="closeModal()" class="text-xs">✕</button></div><form onsubmit="event.preventDefault(); state.athletes.find(x=>x.id==='${id}').primaryMetricValue=this.v.value; closeModal(); render(); showToast('PR saved!');" class="space-y-3 text-xs"><input name="v" placeholder="e.g., 59.5" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" required /><button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold">Save PR</button></form>`); }
    function openAddDrillModal(id) { openModal(`<div class="flex justify-between"><h3 class="font-extrabold text-sm">Assign Homework Drill</h3><button onclick="closeModal()" class="text-xs">✕</button></div><form onsubmit="event.preventDefault(); state.athletes.find(x=>x.id==='${id}').drills.unshift({id:'d'+Date.now(),title:this.t.value,reps:'25 reps',focus:'Mechanics',done:false,img:'assets/images/fastpitch-pitcher.jpg'}); closeModal(); render(); showToast('Drill assigned!');" class="space-y-3 text-xs"><input name="t" placeholder="Drill title..." class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" required /><button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold">Assign Drill</button></form>`); }
    function openLogPaymentModal() { openModal(`<div class="flex justify-between"><h3 class="font-extrabold text-sm">Log Manual Payment</h3><button onclick="closeModal()" class="text-xs">✕</button></div><form onsubmit="event.preventDefault(); state.payments.unshift({id:'p'+Date.now(),date:'Today',family:this.f.value,item:'10-Pack',amount:650,method:'Venmo (Logged)'}); closeModal(); render(); showToast('Payment logged!');" class="space-y-3 text-xs"><input name="f" value="Vance Family" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft" required /><button type="submit" class="w-full py-2.5 rounded-2xl bg-[#D5FF5F] text-[#010101] font-extrabold">Record Payment</button></form>`); }

    function render() {
      renderChrome();
      const root = document.getElementById('app-root');
      if (state.role === 'coach') {
        if (state.coachTab === 'today') root.innerHTML = renderCoachToday();
        else if (state.coachTab === 'athletes') root.innerHTML = renderCoachAthletes();
        else if (state.coachTab === 'video') root.innerHTML = renderCoachVideo();
        else if (state.coachTab === 'payments') root.innerHTML = renderCoachPayments();
        else if (state.coachTab === 'messaging') root.innerHTML = renderCoachMessaging();
      } else {
        if (state.parentTab === 'home') root.innerHTML = renderParentHome();
        else if (state.parentTab === 'book') root.innerHTML = renderParentBook();
        else if (state.parentTab === 'packages') root.innerHTML = renderParentPackages();
        else if (state.parentTab === 'video') root.innerHTML = renderParentVideo();
        else if (state.parentTab === 'waiver') root.innerHTML = renderParentWaiver();
      }
    }
    render();
  </script>
</body>
</html>
