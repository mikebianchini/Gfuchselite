  <script>
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
    }

    // =========================================================================
    // SHARED LIVE STATE (changes in Parent Portal reflect immediately in Coach View!)

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
    }

    function closeModal() {
      const m = document.getElementById('modal-root');
      m.classList.add('hidden');
      m.classList.remove('flex');
      m.innerHTML = '';
    }

    function openModal(html) {
      const m = document.getElementById('modal-root');
      m.innerHTML = `<div class="bg-[var(--card)] border border-[var(--border)] rounded-xl max-w-md w-full p-5 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">${html}</div>`;
      m.classList.remove('hidden');
      m.classList.add('flex');
      m.onclick = (e) => { if (e.target === m) closeModal(); };
    }

    function switchRole(role) {
      state.role = role;
      render();
      showToast(role === 'coach' ? 'Switched to Coach Gina Dashboard' : 'Switched to Parent / Athlete Portal (Sarah Miller)');
    }

    function setTab(tab) {
      if (state.role === 'coach') state.coachTab = tab;
      else state.parentTab = tab;
      render();
    }

    function renderChrome() {
      const coachBtn = document.getElementById('btn-role-coach');

    function bookSlot(slotId, payMode) {
      const slot = state.openSlots.find(s => s.id === slotId);
      const ath = state.athletes.find(a => a.id === state.activeSiblingId);
      if (!slot || !ath) return;

      if (payMode === 'credit') {
        state.athletes.filter(a => a.familyId === 'fam-1').forEach(a => a.credits = Math.max(0, a.credits - 1));
      } else {
        state.payments.unshift({
          id: 'pay-' + Date.now(),
          date: 'Today',
          family: 'Miller Family',
          item: `${slot.type}: ${slot.focus}`,
          amount: slot.price,
          method: 'Stripe (Card)',
          status: 'Paid'
        });
      }

      state.sessions.unshift({
        id: 'ses-' + Date.now(),
        day: slot.day,
        time: slot.time,
        type: slot.type,
        focus: slot.focus,
        athletes: [ath.name],
        athleteId: ath.id,
        spotsMax: slot.spotsMax,
        status: 'Confirmed',
        payment: payMode === 'credit' ? 'Package Credit (1)' : `Stripe Paid ($${slot.price})`,
        price: slot.price
      });

      slot.spotsLeft -= 1;
      if (slot.spotsLeft <= 0) {
        state.openSlots = state.openSlots.filter(s => s.id !== slotId);
      }

      state.parentTab = 'home';
      render();
      showToast(`Booked ${slot.focus} for ${ath.name.split(' ')[0]}! Switch to Coach View to see it live.`);
    }

      state.payments.unshift({

        family: 'Miller Family',
        item: `${credits}-Lesson Private Package`,
        amount: price,
        method: 'Stripe (Apple Pay)',

      showToast(`Purchased ${credits}-Pack ($${price})! Credits added immediately.`);
    }

            <label class="block text-[var(--muted-foreground)] mb-1">Value</label>
            <input name="value" placeholder="e.g., 59.5 mph" class="w-full px-3 py-2 rounded-lg bg-[var(--background)] border border-[var(--border)]" required />
          </div>
          <button type="submit" class="w-full py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold cursor-pointer">Save Metric</button>
        </form>
      `);
    }

    function submitMetric(e, athId) {
      e.preventDefault();
      const a = state.athletes.find(x => x.id === athId);
      a.metrics.push({ date: 'Today', label: e.target.label.value, value: e.target.value.value });
      closeModal();
      render();
      showToast('New metric logged!');
    }

    function openAddNoteModal(athId) {
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-sm">Add Session Note</h3>
          <button onclick="closeModal()" class="text-xs text-[var(--muted-foreground)] cursor-pointer">Close</button>
        </div>
        <form onsubmit="submitNote(event, '${athId}')" class="space-y-3 text-xs">
          <textarea name="text" rows="3" class="w-full px-3 py-2 rounded-lg bg-[var(--background)] border border-[var(--border)]" placeholder="Key takeaways from today's lesson..." required></textarea>
          <button type="submit" class="w-full py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold cursor-pointer">Save Note</button>
        </form>
      `);
    }

    function submitNote(e, athId) {
      e.preventDefault();
      const a = state.athletes.find(x => x.id === athId);
      a.notes.unshift({ date: 'Today', text: e.target.text.value });
      closeModal();
      render();
      showToast('Session note saved & synced to Parent Portal!');
    }

    function openAddDrillModal(athId) {
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-sm">Assign Homework Drill</h3>
          <button onclick="closeModal()" class="text-xs text-[var(--muted-foreground)] cursor-pointer">Close</button>
        </div>
        <form onsubmit="submitDrill(event, '${athId}')" class="space-y-3 text-xs">
          <input name="title" class="w-full px-3 py-2 rounded-lg bg-[var(--background)] border border-[var(--border)]" placeholder="e.g., K-Drill Wrist Snaps (3x15)" required />
          <input name="focus" class="w-full px-3 py-2 rounded-lg bg-[var(--background)] border border-[var(--border)]" placeholder="Focus cue (e.g., Loose fingers at release)" required />
          <button type="submit" class="w-full py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold cursor-pointer">Assign Drill</button>
        </form>
      `);
    }

    function submitDrill(e, athId) {
      e.preventDefault();
      const a = state.athletes.find(x => x.id === athId);
      a.drills.unshift({ id: 'd-' + Date.now(), title: e.target.title.value, focus: e.target.focus.value, done: false });
      closeModal();
      render();
      showToast('Drill assigned to athlete’s homework list!');
    }

    function openLogPaymentModal() {
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-sm">Log Manual Payment (Venmo / Zelle / Cash)</h3>
          <button onclick="closeModal()" class="text-xs text-[var(--muted-foreground)] cursor-pointer">Close</button>
        </div>
        <form onsubmit="submitManualPayment(event)" class="space-y-3 text-xs">
          <input name="family" value="Vance Family" class="w-full px-3 py-2 rounded-lg bg-[var(--background)] border border-[var(--border)]" placeholder="Family name" required />
          <input name="item" value="10-Lesson Elite Package" class="w-full px-3 py-2 rounded-lg bg-[var(--background)] border border-[var(--border)]" placeholder="Package or lesson" required />
          <div class="grid grid-cols-2 gap-2">
            <input name="amount" type="number" value="650" class="w-full px-3 py-2 rounded-lg bg-[var(--background)] border border-[var(--border)]" required />
            <select name="method" class="w-full px-3 py-2 rounded-lg bg-[var(--background)] border border-[var(--border)]">
              <option>Venmo (Logged)</option>
              <option>Zelle (Logged)</option>
              <option>Cash (Logged)</option>
            </select>
          </div>
          <button type="submit" class="w-full py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold cursor-pointer">Record Payment</button>
        </form>
      `);
    }

    function submitManualPayment(e) {
      e.preventDefault();
      state.payments.unshift({
        id: 'pay-' + Date.now(),
        date: 'Today',
        family: e.target.family.value,
        item: e.target.item.value,
        amount: Number(e.target.amount.value),
        method: e.target.method.value,
        status: 'Paid'
      });
      closeModal();
      render();
      showToast('Manual payment recorded!');
    }

    function render() {
      renderChrome();
      const root = document.getElementById('app-root');
      if (state.role === 'coach') {
        if (state.coachTab === 'schedule') root.innerHTML = renderCoachSchedule();
        else if (state.coachTab === 'athletes') root.innerHTML = renderCoachAthletes();
        else if (state.coachTab === 'video') root.innerHTML = renderCoachVideo();
        else if (state.coachTab === 'payments') root.innerHTML = renderCoachPayments();
        else if (state.coachTab === 'messaging') root.innerHTML = renderCoachMessaging();
        else if (state.coachTab === 'waivers') root.innerHTML = renderCoachWaivers();
      } else {
        if (state.parentTab === 'home') root.innerHTML = renderParentHome();
        else if (state.parentTab === 'book') root.innerHTML = renderParentBook();
        else if (state.parentTab === 'packages') root.innerHTML = renderParentPackages();
        else if (state.parentTab === 'video') root.innerHTML = renderParentVideo();
        else if (state.parentTab === 'waiver') root.innerHTML = renderParentWaiver();
      }
    }

    render();
  </script>
</body>
</html>
